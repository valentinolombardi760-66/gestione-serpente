plugins {
    id 'com.android.application'
}

android {
    namespace 'it.serpente.manager'
    compileSdk 34

    defaultConfig {
        applicationId 'it.serpente.manager'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmato con la chiave debug per poterlo installare direttamente sul telefono
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
