      </section>
      <h2>Peso</h2>${loss && loss.pct >= 6 ? `<p class="warn">Calo del ${Utils.fmtNum(loss.pct, '%')} in ${loss.days} giorni.</p>` : ''}${spark}
      ${table(['Data', 'Peso', 'Lunghezza'], w90.map(g => [Utils.toDMY(g.data), Utils.fmtNum(g.peso, 'g'), Utils.fmtNum(g.lunghezza, 'cm')]))}
      <h2>Alimentazione</h2><p>${feed.filter(f => f.esito === 'Mangiato').length} pasti consumati su ${feed.length} offerti · intervallo attuale ${Logic.targetInterval()} giorni</p>
      ${table(['Data', 'Preda', 'Peso preda', 'Rapporto', 'Esito'], feed.map(f => [Utils.toDMY(f.data), esc(f.preda) + ' · ' + esc(f.statoPreda), Utils.fmtNum(f.pesoPreda, 'g'), Utils.fmtNum(f.rapporto, '%'), esc(f.esito)]))}
      <h2>Mute</h2>${table(['Inizio', 'Fine', 'Esito', 'Occhialini', 'Umidità 7 gg prima'], in90(L.shed, 'dataInizio').map(s => [Utils.toDMY(s.dataInizio), Utils.toDMY(s.dataFine) || '—', esc(s.esito), esc(s.occhi || '—'), (h => h === null ? '—' : h + '%')(Logic.shedHumidity(s))]))}
      <h2>Clima (90 giorni)</h2><p>Zona calda ${envStats('tempCalda')} °C · zona fredda ${envStats('tempFredda')} °C · notte ${envStats('tempNotte')} °C · umidità ${envStats('umidita')} %</p>
      <h2>Feci e urati</h2><p>${in90(L.waste, 'data').length} evacuazioni registrate${wasteAb.length ? `, ${wasteAb.length} anomale` : ''}.</p>
      ${wasteAb.length ? table(['Data', 'Tipo', 'Aspetto', 'Note'], wasteAb.map(x => [Utils.toDMY(x.data), esc(x.tipo), esc(x.aspetto), esc(x.note)])) : ''}
      <h2>Sintomi</h2>${table(['Data', 'Area', 'Gravità', 'Stato', 'Descrizione'], in90(L.symptom, 'data').concat(L.symptom.filter(s => s.stato === 'Aperto' && s.data < from)).map(s => [Utils.toDMY(s.data), esc(s.area), esc(s.gravita), esc(s.stato), esc(s.note)]))}
      <h2>Trattamenti</h2>${table(['Farmaco', 'Dose', 'Ogni', 'Dal', 'Al', 'Dosi date'], L.med.filter(m => !m.dataFine || m.dataFine >= from).map(m => [esc(m.farmaco), esc(m.dose), Utils.plural(m.ogniGiorni, 'giorno', 'giorni'), Utils.toDMY(m.dataInizio), Utils.toDMY(m.dataFine) || '—', (m.dosi || []).length]))}
      <h2>Visite precedenti</h2>${table(['Data', 'Motivo', 'Veterinario', 'Indicazioni'], L.vet.slice(0, 6).map(v => [Utils.toDMY(v.data), esc(v.motivo), esc(v.veterinario), esc(v.esito)]))}
      <h2>Note per la visita</h2><div class="vs-notes"></div>
    </div>`;
  }
  const CSS = `.vs{font-family:Inter,Arial,sans-serif;color:#111;background:#fff;padding:28px;max-width:900px;margin:0 auto;font-size:12.5px;line-height:1.45}
.vs header{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:14px}.vs h1{font-size:24px;margin:0}.vs header p{margin:4px 0 0;color:#444}
.vs-meta{text-align:right;color:#444;font-size:11.5px}.vs h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
.vs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px}.vs-grid span{display:block;color:#666;font-size:11px}.vs-grid b{font-size:13px}
.vs table{width:100%;border-collapse:collapse;margin-top:4px}.vs th,.vs td{border:1px solid #ddd;padding:4px 6px;text-align:left;vertical-align:top}.vs th{background:#f3f4f6}
.vs .none{color:#777;font-style:italic}.vs .warn{color:#b91c1c;font-weight:600}.vs-notes{height:120px;border:1px dashed #aaa;border-radius:6px}
@page{margin:12mm}`;
  function open() {
    const sheet = html();
    const body = `<div class="vs-preview"><style>${CSS}</style>${sheet}</div>`;
    const modal = Overlay.open({ title: `${I('clipboard')} Scheda per il veterinario`, subtitle: 'Riepilogo degli ultimi 90 giorni', body, size: 'lg', footer: '<button class="btn" data-vs-dl>' + I('download') + ' Scarica file</button><button class="btn btn-primary" data-vs-print>' + I('printer') + ' Stampa o salva PDF</button>' });
    modal.querySelector('[data-vs-print]').addEventListener('click', () => print(sheet));
    modal.querySelector('[data-vs-dl]').addEventListener('click', () => download(sheet));
  }
  const doc = sheet => `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheda veterinaria · ${Utils.esc(Store.get().profile.nome || 'serpente')}</title><style>body{margin:0;background:#fff}${CSS}</style></head><body>${sheet}</body></html>`;
  function print(sheet) {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    f.contentDocument.open(); f.contentDocument.write(doc(sheet)); f.contentDocument.close();
    setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { download(sheet); } setTimeout(() => f.remove(), 2000); }, 300);
  }
  function download(sheet) {
    const name = `scheda-veterinario-${(Store.get().profile.nome || 'serpente').toLowerCase().replace(/[^a-z0-9]+/gi, '-')}-${Utils.todayISO()}.html`;
    if (window.AndroidBridge && window.AndroidBridge.saveFile) { Toast.show(window.AndroidBridge.saveFile(name, doc(sheet)) ? 'Scheda salvata in Download' : 'Salvataggio non riuscito', 'ok'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([doc(sheet)], { type: 'text/html' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    Toast.show('Scheda scaricata: aprila e stampala o inviala al veterinario', 'ok');
  }
  return { open, html };
})();

/* ==========================================================================
   Search — ricerca globale in tutti i registri
   ========================================================================== */
const Search = (() => {
  const MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  function index() {
    const out = [];
    for (const t of Schema.LOG_TYPES) {
      const def = Schema.LOGS[t];
      for (const e of Store.get().logs[t]) {
        const d = e[def.dateKey] || '', dd = Utils.parse(d);
        const vals = def.fields.map(f => e[f.name]).filter(v => v !== null && v !== '' && v !== undefined).map(String);
        const hay = [def.label, def.short, ...vals, Utils.fmtDate(d), Utils.toDMY(d), dd ? MONTHS[dd.getMonth()] + ' ' + dd.getFullYear() : '', t === 'med' ? (e.dosi || []).join(' ') : ''].join(' ').toLowerCase();
        out.push({ t, e, d, hay });
      }
    }
    return out;
  }
  const summary = (t, e) => {
    switch (t) {
      case 'env': return [e.tempCalda !== null ? 'calda ' + Utils.fmtNum(e.tempCalda, '°C') : '', e.tempFredda !== null ? 'fredda ' + Utils.fmtNum(e.tempFredda, '°C') : '', e.umidita !== null ? 'UR ' + Utils.fmtNum(e.umidita, '%') : ''].filter(Boolean).join(' · ');
      case 'feeding': return `${e.preda}${Utils.num(e.pesoPreda) !== null ? ' ' + Utils.fmtNum(e.pesoPreda, 'g') : ''} · ${e.esito}`;
      case 'growth': return [e.peso !== null ? Utils.fmtNum(e.peso, 'g') : '', e.lunghezza !== null ? Utils.fmtNum(e.lunghezza, 'cm') : ''].filter(Boolean).join(' · ');
      case 'shed': return `${e.esito}${e.occhi ? ' · ' + e.occhi.toLowerCase() : ''}`;
      case 'maintenance': return e.tipo;
      case 'handling': return `${Utils.fmtNum(e.durata, 'min')} · ${e.comportamento}`;
      case 'waste': return `${e.tipo} · ${e.aspetto}`;
      case 'symptom': return `${e.area} · ${e.gravita} · ${e.stato}`;
      case 'vet': return `${e.motivo}${e.veterinario ? ' · ' + e.veterinario : ''}`;
      case 'med': return `${e.farmaco}${e.dose ? ' · ' + e.dose : ''}`;
      case 'stock': return `${e.quantita} ${e.preda}`;
      case 'expense': return `${e.categoria}${e.descrizione ? ' · ' + e.descrizione : ''} · ${Utils.fmtNum(e.importo, '€', 2)}`;
      default: return '';
    }
  };
  function open() {
    const modal = Overlay.open({ title: `${I('search')} Cerca`, subtitle: 'In tutti i registri: prede, note, mesi, valori…', body: `<div class="search"><input class="input" type="search" id="gSearch" placeholder="Es. topo adulto, rifiutato, ottobre 2026" autocomplete="off"></div><div id="gResults" class="g-results"></div>` });
    const inp = modal.querySelector('#gSearch'), res = modal.querySelector('#gResults');
    const idx = index();
    const run = () => {
      const terms = inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      if (!terms.length) { res.innerHTML = `<p class="faint small" style="padding:10px 2px">${Utils.plural(idx.length, 'voce', 'voci')} in archivio. Scrivi per cercare.</p>`; return; }
      const hits = idx.filter(x => terms.every(t => x.hay.includes(t))).sort((a, b) => b.d.localeCompare(a.d));
      res.innerHTML = hits.length ? `<p class="faint small" style="padding:6px 2px">${Utils.plural(hits.length, 'risultato', 'risultati')}</p>` + hits.slice(0, 80).map(x => {
        const def = Schema.LOGS[x.t];
        return `<button class="g-hit" data-edit="${x.t}" data-id="${Utils.esc(x.e.id)}"><span class="tl-ico" style="color:${def.color}">${I(def.icon)}</span><span class="g-hit-main"><b>${def.label}</b><small>${Utils.esc(summary(x.t, x.e))}${x.e.note ? ' · ' + Utils.esc(x.e.note.slice(0, 60)) : ''}</small></span><span class="g-hit-date">${Utils.fmtDate(x.d)}</span></button>`;
      }).join('') : '<div class="empty"><b>Nessun risultato</b><p>Prova con un\'altra parola o un mese, per esempio "marzo".</p></div>';
    };
    inp.addEventListener('input', run);
    run();
    setTimeout(() => inp.focus(), 60);
  }
  return { open };
})();

/* ==========================================================================
   Notify — promemoria (notifiche del sistema quando consentite)
   ========================================================================== */
const Notify = (() => {
  const supported = () => 'Notification' in window;
  const granted = () => supported() && Notification.permission === 'granted';
  async function enable() {
    if (!supported()) { Toast.show('Questo browser non supporta le notifiche', 'warn'); return false; }
    let perm = Notification.permission;
    if (perm === 'default') perm = await Notification.requestPermission();
    if (perm !== 'granted') { Toast.show('Notifiche non consentite: puoi attivarle dalle impostazioni del browser', 'warn', { duration: 6000 }); return false; }
    Store.updateProfile({ notifiche: true });
    await registerPeriodic();
    check(true);
    Toast.show('Promemoria attivati', 'ok');
    return true;
  }
  function disable() { Store.updateProfile({ notifiche: false }); Toast.show('Promemoria disattivati', 'info'); }
  async function show(title, body, tag) {
    try {
      const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
      const opts = { body, tag, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', data: { url: './index.html#dashboard' } };
      if (reg && reg.showNotification) await reg.showNotification(title, opts); else new Notification(title, opts);
    } catch (e) { console.warn('Notifica non mostrata', e); }
  }
  /** Mostra una volta al giorno ogni promemoria in scadenza */
  function check(force = false) {
    if (!Store.get().profile.notifiche || !granted()) return;
    const t = Utils.todayISO();
    const meta = Store.meta();
    const sent = meta.notified && meta.notified.day === t ? meta.notified.keys : [];
    const items = Logic.todayTasks().pending.filter(x => x.level === 'warn' || x.level === 'bad' || x.id.startsWith('med-'));
    const fresh = items.filter(x => !sent.includes(x.id));
    if (!fresh.length && !force) return;
    if (fresh.length) {
      const name = Store.get().profile.nome || 'il tuo serpente';
      show(fresh.length === 1 ? fresh[0].title : `${fresh.length} cose da fare per ${name}`, fresh.map(x => x.title).join(' · '), 'snakecheck-today');
      Store.meta({ notified: { day: t, keys: [...sent, ...fresh.map(x => x.id)] } });
    }
    syncForSW();
  }
  /** Prossime scadenze salvate per il service worker (promemoria anche ad app chiusa, dove supportato) */
  async function syncForSW() {
    const feed = Logic.feedingState(), water = Logic.waterState();
    const items = [];
    if (feed.next && !feed.paused) items.push({ key: 'meal', date: feed.next, title: 'Oggi è giorno di pasto', body: `${Store.get().profile.nome || 'Il serpente'}: pasto previsto oggi` });
    if (water.last) items.push({ key: 'water', date: Utils.toISODate(Utils.addDays(Utils.parse(water.last.data), water.target)), title: 'Cambia l\'acqua', body: 'Promemoria del cambio acqua' });
    Store.get().logs.med.forEach(m => { const s = Logic.medState(m); if (s.active || s.next >= Utils.todayISO()) items.push({ key: 'med-' + m.id, date: s.next, title: `Dose: ${m.farmaco}`, body: m.dose || 'Dose prevista oggi' }); });
    try { await DB.put('kv', { id: 'reminders', on: !!Store.get().profile.notifiche, items }); } catch (e) { /* non disponibile */ }
  }
  async function registerPeriodic() {
    try {
      if (!('serviceWorker' in navigator)) return;
      const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000))]);
      if ('periodicSync' in reg) {
        const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
        if (st.state === 'granted') await reg.periodicSync.register('snakecheck-reminders', { minInterval: 6 * 3600 * 1000 });
      }
    } catch (e) { /* non supportato: i promemoria arrivano all'apertura dell'app */ }
  }
  function start() {
    syncForSW();
    check();
    setInterval(() => check(), 30 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  }
  return { enable, disable, check, start, supported, granted, syncForSW };
})();

/* ==========================================================================
   Theme — tema chiaro/scuro e colore d'accento
   ========================================================================== */
const Theme = (() => {
  const KEY = 'snakecheck.ui';
  const ACCENTS = [
    ['verde', 'Verde', '#3ddc97'], ['arancio', 'Arancio', '#fb923c'], ['corallo', 'Corallo', '#f87171'], ['rosa', 'Rosa', '#f472b6'],
    ['viola', 'Viola', '#a78bfa'], ['azzurro', 'Azzurro', '#38bdf8'], ['giallo', 'Giallo', '#facc15'], ['morph', 'Come il morph', null]
  ];
  const MODES = [['auto', 'Automatico'], ['dark', 'Scuro'], ['light', 'Chiaro']];
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  const get = () => { try { return { mode: 'dark', accent: 'verde', ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { return { mode: 'dark', accent: 'verde' }; } };
  const rgb = hex => { const n = parseInt(hex.replace('#', ''), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const lum = hex => { const [r, g, b] = rgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
  /** Colore d'accento del morph: le selle se abbastanza vivaci, altrimenti il fondo */
  function morphColor() {
    const m = Morph.resolve(Store.get().profile.morph);
    const l = lum(m.saddle);
    return l > .08 ? m.saddle : m.base;
  }
  const accentHex = a => a === 'morph' ? morphColor() : ((ACCENTS.find(x => x[0] === a) || ACCENTS[0])[2]);
  const resolvedMode = m => m === 'auto' ? (mq && mq.matches ? 'light' : 'dark') : m;

  function apply() {
    const ui = get(), root = document.documentElement;
    const mode = resolvedMode(ui.mode);
    root.dataset.theme = mode;
    let hex = accentHex(ui.accent);
    // In tema chiaro gli accenti molto chiari si scuriscono per restare leggibili
    if (mode === 'light' && lum(hex) > .55) { const [r, g, b] = rgb(hex); hex = '#' + [r, g, b].map(v => Math.round(v * .72).toString(16).padStart(2, '0')).join(''); }
    root.style.setProperty('--accent', hex);
    root.style.setProperty('--accent-ink', lum(hex) > .4 ? '#0b0d10' : '#ffffff');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#f4f5f7' : '#0b0d10');
    if (window.Chart && Chart.defaults) { Chart.defaults.color = mode === 'light' ? '#64748b' : '#6b7584'; Chart.defaults.borderColor = mode === 'light' ? 'rgba(15,23,42,0.08)' : 'rgba(255,255,255,0.06)'; }
  }
  function set(patch) {
    const ui = { ...get(), ...patch };
    try { localStorage.setItem(KEY, JSON.stringify(ui)); } catch (e) { /* solo per questa sessione */ }
    document.documentElement.classList.add('theming');
    apply();
    setTimeout(() => document.documentElement.classList.remove('theming'), 450);
    Router.render(true);
  }
  const isLight = () => document.documentElement.dataset.theme === 'light';
  function init() {
    apply();
    if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (get().mode === 'auto') { apply(); Router.render(true); } });
    // Il colore "come il morph" segue le modifiche del profilo
    Store.subscribe(() => { if (get().accent === 'morph') apply(); });
  }
  return { init, apply, set, get, isLight, ACCENTS, MODES, accentHex };
})();

/* ==========================================================================
   Sync — sincronizzazione tra dispositivi con Google Drive
   ========================================================================== */
const Sync = (() => {
  const CFG = 'snakecheck.sync';
  const FILE = 'snakecheck-sync.json';
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  let token = null, tokenExp = 0, tokenClient = null, busy = false, timer = null, lastError = '';
  const cfg = () => { try { return JSON.parse(localStorage.getItem(CFG) || '{}') || {}; } catch (e) { return {}; } };
  const saveCfg = patch => { const c = { ...cfg(), ...patch }; try { localStorage.setItem(CFG, JSON.stringify(c)); } catch (e) { /* */ } return c; };
  const enabled = () => !!cfg().on && !!cfg().clientId;
  const hasToken = () => !!token && Date.now() < tokenExp - 60000;
  const status = () => ({ ...cfg(), busy, hasToken: hasToken(), error: lastError });

  function loadGIS() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => rej(new Error('servizio Google non raggiungibile (sei offline?)'));
      document.head.appendChild(s);
    });
  }
  /** Chiede il permesso a Google (serve un tocco dell'utente: si apre una finestrella) */
  async function getToken(interactive) {
    if (hasToken()) return token;
    const c = cfg();
    if (!c.clientId) throw new Error('manca l\'ID client Google');
    await loadGIS();
    return new Promise((res, rej) => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: c.clientId, scope: SCOPE,
        callback: r => { if (r.error) { rej(new Error(r.error_description || r.error)); return; } token = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000; res(token); },
        error_callback: e => rej(new Error(e && e.type === 'popup_closed' ? 'finestra di Google chiusa' : 'accesso a Google non riuscito'))
      });
      tokenClient.requestAccessToken({ prompt: interactive && !c.email ? 'consent' : '', login_hint: c.email || undefined });
    });
  }
  async function api(path, opts = {}) {
    const r = await fetch(`https://www.googleapis.com/${path}`, { ...opts, headers: { Authorization: `Bearer ${token}`, ...(opts.headers || {}) } });
    if (r.status === 401) { token = null; throw new Error('accesso scaduto: tocca di nuovo Sincronizza'); }
    if (!r.ok) throw new Error(`Google Drive ha risposto ${r.status}`);
    return r;
  }
  async function findFile() {
    const q = encodeURIComponent(`name='${FILE}'`);
    const j = await (await api(`drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`)).json();
    return j.files && j.files[0] || null;
  }
  async function upload(id, body) {
    if (id) { await api(`upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }); return id; }
    const boundary = 'snk' + Date.now();
    const meta = JSON.stringify({ name: FILE, parents: ['appDataFolder'], mimeType: 'application/json' });
    const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
    const j = await (await api('upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body: multipart })).json();
    return j.id;
  }
  async function whoAmI() {
    try { const j = await (await api('drive/v3/about?fields=user(emailAddress)')).json(); return j.user && j.user.emailAddress || ''; } catch (e) { return ''; }
  }

  /** Scarica, unisce e ricarica. interactive=true quando parte da un tocco dell'utente */
  async function now({ interactive = false, quiet = false } = {}) {
    if (!enabled() || busy) return;
    if (!navigator.onLine) { if (!quiet) Toast.show('Sei offline: sincronizzo appena torna la connessione', 'info'); return; }
    if (!hasToken() && !interactive) { paint(); return; }
    busy = true; lastError = ''; paint();
    try {
      await getToken(interactive);
      if (!cfg().email) { const email = await whoAmI(); if (email) saveCfg({ email }); }
      const f = await findFile();
      let stats = { added: 0, changed: 0, removed: 0 };
      if (f) {
        const remote = await (await api(`drive/v3/files/${f.id}?alt=media`)).json();
        if (!cfg().lastAt) await Safety.snapshot('Prima sincronizzazione');
        stats = Store.syncMerge(remote);
      }
      const id = await upload(f && f.id, JSON.stringify({ ...Store.get(), app: 'SNAKEcheck', syncedAt: new Date().toISOString() }));
      saveCfg({ fileId: id, lastAt: new Date().toISOString() });
      const n = stats.added + stats.changed + stats.removed;
      if (!quiet || n) Toast.show(n ? `Sincronizzato: ${[stats.added && `${stats.added} nuove`, stats.changed && `${stats.changed} aggiornate`, stats.removed && `${stats.removed} eliminate`].filter(Boolean).join(', ')}` : 'Sincronizzato: tutto già allineato', 'ok');
    } catch (e) {
      lastError = e.message || String(e);
      if (!quiet) Toast.show(`Sincronizzazione non riuscita: ${lastError}`, 'bad', { duration: 7000 });
    } finally { busy = false; paint(); }
  }
  /** Dopo ogni modifica: invio automatico (se l'accesso è ancora valido) */
  function schedule() {
    if (busy) return;
    if (!enabled() || !hasToken()) { paint(); return; }
    clearTimeout(timer);
    timer = setTimeout(() => now({ quiet: true }), 4000);
  }
  function connect(clientId) {
    const id = (clientId || '').trim();
    if (!/^[\w-]+\.apps\.googleusercontent\.com$/.test(id)) { Toast.show('ID client non valido: deve finire con .apps.googleusercontent.com', 'warn', { duration: 6000 }); return; }
    saveCfg({ clientId: id, on: true });
    now({ interactive: true }).then(() => Router.render(true));
  }
  function disconnect() {
    try { if (token && window.google && google.accounts) google.accounts.oauth2.revoke(token, () => {}); } catch (e) { /* */ }
    token = null; saveCfg({ on: false, email: '', lastAt: '' });
    Toast.show('Sincronizzazione disattivata: i dati restano su questo dispositivo', 'info');
    Router.render(true);
  }
  /** Stato del pulsante nella barra in alto */
  function paint() {
    const b = document.getElementById('topSync');
    if (!b) return;
    b.classList.toggle('hidden', !enabled());
    b.classList.toggle('spin', busy);
    b.classList.toggle('need', enabled() && !hasToken() && !busy);
    b.classList.toggle('err', !!lastError && !busy);
    const c = cfg();
    b.title = busy ? 'Sincronizzo…' : lastError ? `Errore: ${lastError}` : !hasToken() ? 'Tocca per sincronizzare con Google Drive' : c.lastAt ? `Sincronizzato ${Utils.relTime(Utils.toLocalDT(new Date(c.lastAt)))}` : 'Sincronizza';
    b.setAttribute('aria-label', b.title);
  }
  function init() {
    Store.subscribe(() => schedule());
    window.addEventListener('online', () => now({ quiet: true }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) now({ quiet: true }); });
    paint();
  }
  return { init, now, connect, disconnect, status, enabled, paint, cfg };
})();

/* ==========================================================================
   StoryPrint — la storia del serpente da stampare
   ========================================================================== */
const StoryPrint = (() => {
  const toData = url => fetch(url).then(r => r.blob()).then(b => new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); }));
  async function open() {
    const p = Store.get().profile, ev = Logic.lifeEvents();
    let photos = [];
    try { photos = await Photos.list(); } catch (e) { photos = []; }
    const imgs = {};
    for (const ph of photos.slice(0, 60)) { try { imgs[ph.id] = await toData(Photos.url(ph)); } catch (e) { /* */ } }
    const months = {};
    ev.forEach(e => { (months[e.date.slice(0, 7)] ||= { ev: [], ph: [] }).ev.push(e); });
    photos.forEach(ph => { if (imgs[ph.id]) (months[ph.date.slice(0, 7)] ||= { ev: [], ph: [] }).ph.push(ph); });
    const MN = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
    const body = Object.keys(months).sort().map(k => `<section><h2>${MN[+k.slice(5) - 1]} ${k.slice(0, 4)}</h2>
      ${months[k].ev.map(e => `<div class="ev"><i style="background:${e.color}"></i><div><b>${Utils.esc(e.title)}</b>${e.text ? ` · ${Utils.esc(e.text)}` : ''}<small>${Utils.fmtDate(e.date)}</small></div></div>`).join('')}
      ${months[k].ph.length ? `<div class="ph">${months[k].ph.map(ph => `<figure><img src="${imgs[ph.id]}"><figcaption>${Utils.fmtDateShort(ph.date)}${ph.note ? ' · ' + Utils.esc(ph.note) : ''}</figcaption></figure>`).join('')}</div>` : ''}</section>`).join('');
    const doc = `<!doctype html><html lang="it"><head><meta charset="utf-8"><title>La storia di ${Utils.esc(p.nome || 'il mio serpente')}</title><style>
      body{font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#111;margin:32px;max-width:760px}
      h1{font-size:28px;margin:0}.sub{color:#555;margin:4px 0 24px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:#666;border-bottom:1px solid #ddd;padding-bottom:4px;margin:24px 0 10px}
      .ev{display:flex;gap:10px;margin:6px 0;break-inside:avoid}.ev i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.ev small{display:block;color:#777}
      .ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.ph figure{margin:0;break-inside:avoid}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.ph figcaption{font-size:11px;color:#666}
      section{break-inside:auto}@page{margin:16mm}</style></head><body>
      <h1>La storia di ${Utils.esc(p.nome || 'il mio serpente')}</h1>
      <p class="sub">${[p.morph, p.dataNascita ? `nato il ${Utils.fmtDate(p.dataNascita)}` : '', p.dataArrivo ? `con me dal ${Utils.fmtDate(p.dataArrivo)}` : ''].filter(Boolean).map(Utils.esc).join(' · ')}</p>
      ${body || '<p>Nessun evento registrato.</p>'}<p class="sub" style="margin-top:32px">Creato con SNAKEcheck il ${Utils.fmtDate(Utils.todayISO())}</p></body></html>`;
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    f.contentDocument.open(); f.contentDocument.write(doc); f.contentDocument.close();
    setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { Toast.show('Stampa non disponibile qui', 'warn'); } setTimeout(() => f.remove(), 3000); }, 400);

})();

/* ==========================================================================
   Views — rendering delle schermate
   ========================================================================== */
const Views = (() => {
  const S = () => Store.get();
  const $ = sel => document.querySelector(sel);
  const tabs = { alimentazione: 'feeding', cura: 'shed', salute: 'waste', gestione: 'scorte' };
  const count = (v, key, dec = 0) => `<span class="num" data-count="${v}" data-key="${key}" data-dec="${dec}">${Utils.fmtNum(v, '', dec)}</span>`;
  const ico = n => Icons.has(n) ? I(n) : n;
  let lastAlerts = [], lastTasks = [];
  const photoSel = new Set();

  /* ---------- Componenti condivisi ---------- */
  function gauges() {
    const now = Logic.envNow();
    if (!now.latest) return `<div class="empty"><div class="empty-ico">${I('thermo')}</div><b>Nessuna lettura</b><p>Registra temperature e umidità per vedere gli indicatori di soglia.</p><button class="btn btn-primary btn-sm" data-add="env">${I('plus')} Nuova lettura</button></div>`;
    const keys = Logic.ENV_KEYS.filter(k => !Logic.RANGES[k].optional || now[k]);
    return `<div class="gauges">${keys.map(k => {
      const cur = now[k];
      const r = Logic.range(k), v = cur ? cur.v : null, ev = Logic.evalParam(k, v);
      const span = Math.max(1, r.hi - r.lo);
      const dMin = Math.min(r.lo - span * .75, v ?? r.lo), dMax = Math.max(r.hi + span * .75, v ?? r.hi);
      const pos = x => Utils.clamp((x - dMin) / (dMax - dMin) * 100, 0, 100);
      const color = ev.status === 'ok' ? 'var(--ok)' : ev.status === 'warn' ? 'var(--warn)' : ev.status === 'bad' ? 'var(--bad)' : 'var(--faint)';
      return `<div class="gauge">
        <div class="gauge-head"><span class="gauge-name">${I(r.icon)} ${r.label}${r.brum ? ' <span class="badge b-info">inverno</span>' : ''}</span>
          <span class="gauge-val">${cur ? `<span class="badge b-${ev.status}">${ev.label}</span><b class="c-${ev.status}">${Utils.fmtNum(v, r.unit)}</b>` : '<span class="faint small">nessun dato</span>'}</span></div>
        <div class="gauge-track" role="meter" aria-label="${r.label}" aria-valuemin="${dMin}" aria-valuemax="${dMax}" aria-valuenow="${v ?? ''}">
          <div class="gauge-band" style="left:${pos(r.lo)}%;width:${pos(r.hi) - pos(r.lo)}%"></div>
          ${cur ? `<div class="gauge-marker" style="left:${pos(v)}%;color:${color}"></div>` : ''}
        </div>
        <div class="gauge-scale"><span>${Utils.fmtNum(dMin)}</span><span style="left:${pos(r.lo)}%">${Utils.fmtNum(r.lo)}</span><span style="left:${pos(r.hi)}%">${Utils.fmtNum(r.hi)}</span><span>${Utils.fmtNum(dMax)}${r.unit}</span></div>
        ${cur && cur.dt !== now.latest.datetime ? `<div class="faint small">lettura ${Utils.relTime(cur.dt)}</div>` : ''}
      </div>`;
    }).join('')}<p class="faint small">Ultima lettura: ${Utils.fmtDateTime(now.latest.datetime)} · ${Utils.relTime(now.latest.datetime)}</p></div>`;
  }

  function alertsHTML(list) {
    if (!list.some(a => a.level !== 'info')) list = [{ level: 'ok', icon: 'ok', title: 'Tutto nella norma', text: 'Parametri e routine rispettano i target impostati.' }, ...list];
    lastAlerts = list;
    return `<div class="alerts">${list.map((a, i) => `<div class="alert l-${a.level}">
        <span class="alert-ico">${ico(a.icon)}</span>
        <div><b>${Utils.esc(a.title)}</b><p>${Utils.esc(a.text)}</p></div>
        ${a.action ? `<button class="btn btn-sm" data-alert="${i}">${Utils.esc(a.action.label)}</button>` : '<span></span>'}
      </div>`).join('')}</div>`;
  }

  function timeline(limit = 12) {
    const items = [];
    const desc = {
      env: e => [[e.tempCalda !== null ? Utils.fmtNum(e.tempCalda, '°C') : '', e.tempFredda !== null ? Utils.fmtNum(e.tempFredda, '°C') : '', e.umidita !== null ? 'UR ' + Utils.fmtNum(e.umidita, '%') : ''].filter(Boolean).join(' / '), (() => { const bad = Logic.ENV_KEYS.some(k => Logic.evalParam(k, e[k]).status === 'bad'); return Records.badge(bad ? 'Fuori soglia' : 'Ottimale', bad ? 'bad' : 'ok'); })()],
      feeding: e => [`${e.preda}${Utils.num(e.pesoPreda) !== null ? ' · ' + Utils.fmtNum(e.pesoPreda, 'g') : ''} · ${e.statoPreda}`, Records.badge(e.esito, Records.STATUS.esito[e.esito] || 'neutral')],
      growth: e => [[e.peso !== null ? Utils.fmtNum(e.peso, 'g') : '', e.lunghezza !== null ? Utils.fmtNum(e.lunghezza, 'cm') : ''].filter(Boolean).join(' · '), ''],
      shed: e => [e.dataFine ? `Completata il ${Utils.fmtDate(e.dataFine)}` : e.esito === 'In corso' ? 'Fase opaca iniziata' : 'Conclusa', Records.badge(e.esito, Records.STATUS.muta[e.esito] || 'neutral')],
      maintenance: e => [e.tipo, ''],
      handling: e => [`${Utils.fmtNum(e.durata, 'min')}`, Records.badge(e.comportamento, Records.STATUS.comp[e.comportamento] || 'neutral')],
      waste: e => [e.tipo, Records.badge(e.aspetto, e.aspetto === 'Normale' ? 'ok' : 'warn')],
      symptom: e => [e.area, Records.badge(`${e.gravita} · ${e.stato}`, e.stato === 'Risolto' ? 'ok' : 'warn')],
      vet: e => [e.motivo, ''],
      med: e => [`${e.farmaco}${e.dose ? ' · ' + e.dose : ''}`, ''],
      stock: e => [`${e.quantita > 0 ? '+' : ''}${e.quantita} ${e.preda}${Utils.num(e.costo) !== null ? ' · ' + Utils.fmtNum(e.costo, '€', 2) : ''}`, ''],
      expense: e => [`${e.categoria}${e.descrizione ? ' · ' + e.descrizione : ''} · ${Utils.fmtNum(e.importo, '€', 2)}`, '']
    };
    Schema.LOG_TYPES.forEach(t => S().logs[t].slice(0, t === 'env' ? 3 : limit).forEach(e => items.push({ t, e, date: e[Schema.LOGS[t].dateKey] })));
    items.sort((a, b) => b.date.localeCompare(a.date));
    if (!items.length) return `<div class="empty"><div class="empty-ico">${I('notes')}</div><b>Nessuna attività</b><p>Le registrazioni compariranno qui in ordine cronologico.</p><button class="btn btn-primary btn-sm" data-open-add>${I('plus')} Registra</button></div>`;
    return `<div class="timeline">${items.slice(0, limit).map(({ t, e, date }) => {
      const def = Schema.LOGS[t]; const [d, b] = desc[t](e);
      return `<div class="tl-item" data-edit="${t}" data-id="${Utils.esc(e.id)}" role="button" tabindex="0">
        <span class="tl-ico" style="color:${def.color};box-shadow:inset 0 0 0 1px ${def.color}33">${I(def.icon)}</span>
        <div class="tl-body"><div class="tl-title">${def.label} ${b}</div><div class="tl-desc">${Utils.esc(d)}${e.note ? ` · <span class="faint">${Utils.esc(e.note)}</span>` : ''}</div></div>
        <div class="tl-time"><b>${Utils.cap(Utils.relTime(date))}</b><time datetime="${Utils.esc(date)}">${Utils.fmtDateTime(date)}</time></div>
      </div>`;
    }).join('')}</div>`;
  }

  function kpi({ label, status, value, sub, bar = null, key }) {
    return `<div class="card kpi s-${status} card-hover">
      <div class="kpi-top"><span class="kpi-label">${label}</span><span class="dot ${status}"></span></div>
      <div class="kpi-value" data-kpi="${key}">${value}</div>
      <div class="kpi-sub">${sub}</div>
      ${bar !== null ? `<div class="kpi-bar"><i style="width:${Utils.clamp(bar.pct, 0, 100)}%;background:var(--${bar.color})"></i></div>` : ''}
    </div>`;
  }

  /** Pulsanti "pasto in un tocco" (tieni premuto per i dettagli) */
  function mealButtons(cls = '') {
    const last = Logic.lastMealTemplate();
    if (!last) return `<button class="btn btn-primary ${cls}" data-add="feeding">${I('mouse')} Registra il primo pasto</button>`;
    return `<div class="meal-btns ${cls}"><button class="btn btn-primary" data-meal title="Tieni premuto per cambiare i dettagli">${I('zap')} Ha mangiato <span class="meal-sub">${Utils.esc(last.preda)}${Utils.num(last.pesoPreda) !== null ? ' ' + Utils.fmtNum(last.pesoPreda, 'g') : ''}</span></button><button class="btn" data-meal-refuse>Rifiutato</button></div>`;
  }

  /** Card "Oggi": prossima azione e cose da fare */
  function todayCard() {
    const h = Logic.headline(), { pending, done } = Logic.todayTasks();
    lastTasks = pending;
    const fedToday = S().logs.feeding.some(f => f.data === Utils.todayISO());
    const paused = Logic.feedingState().paused;
    return `<div class="card today-card" id="todayCard">
      <div class="today-head"><span class="today-ico">${I(h.icon)}</span><div class="today-txt"><span class="kpi-label">Prossima azione</span><h2>${Utils.esc(h.title)}</h2><p class="muted small">${Utils.esc(h.sub)}</p></div></div>
      ${!fedToday && !paused ? mealButtons('mt-sm') : ''}
      <div class="tasks">
        ${pending.map((t, i) => `<div class="task l-${t.level}"><span class="task-ico">${I(t.icon)}</span><div class="task-txt"><b>${Utils.esc(t.title)}</b><small>${Utils.esc(t.sub)}</small></div>${t.action ? `<button class="btn btn-sm" data-task="${i}">${Utils.esc(t.action.label)}</button>` : ''}</div>`).join('')}
        ${done.map(t => `<div class="task done"><span class="task-ico">${I('check')}</span><div class="task-txt"><b>${Utils.esc(t.title)}</b><small>${Utils.esc(t.sub)}</small></div></div>`).join('')}
        ${!pending.length ? `<p class="small c-ok" style="padding:4px 2px">${I('ok')} Per oggi è tutto fatto.</p>` : ''}
      </div>
    </div>`;
  }

  /* ---------- Dashboard ---------- */
  function dashboard() {
    const st = S(), p = st.profile;
    const feed = Logic.feedingState(), shed = Logic.shedState(), water = Logic.waterState();
    const al = Logic.alerts();
    const nBad = al.filter(a => a.level === 'bad').length, nWarn = al.filter(a => a.level === 'warn').length;
    const weight = Logic.currentWeight(), trend = Logic.weightTrend();
    const age = Utils.age(p.dataNascita);
    const sex = p.sesso === 'Maschio' ? '♂' : p.sesso === 'Femmina' ? '♀' : '';
    const look = Morph.resolve(p.morph);
    const statusPill = nBad + nWarn === 0
      ? `<span class="dot ok live"></span>Tutto nella norma`
      : `<span class="dot ${nBad ? 'bad' : 'warn'} live"></span>${nBad + nWarn} ${nBad + nWarn === 1 ? 'avviso attivo' : 'avvisi attivi'}`;

    const welcome = Store.isEmpty() ? `<div class="card welcome mt">
        <div><h2>${I('hand')} Benvenuto in SNAKEcheck</h2><p class="muted small" style="margin-top:4px">Configura il profilo del tuo serpente o esplora l'app con un set di dati dimostrativo.</p></div>
        <div class="row" style="flex-wrap:wrap"><button class="btn" data-nav="impostazioni">Configura profilo</button><button class="btn btn-primary" data-demo>Carica dati demo</button></div>
      </div>` : '';

    let kFeed;
    if (feed.lastEaten) {
      const sub = feed.paused ? `<b class="c-info">Sospeso: ${feed.paused}</b>` : feed.remaining > 0 ? `Prossimo tra <b>${Utils.plural(feed.remaining, 'giorno', 'giorni')}</b>` : feed.remaining === 0 ? '<b class="c-warn">Previsto oggi</b>' : `<b class="c-${feed.status}">In ritardo di ${Utils.plural(-feed.remaining, 'giorno', 'giorni')}</b>`;
      kFeed = kpi({ key: 'feed', label: `${I('mouse')} Ultimo pasto`, status: feed.status, value: `${count(feed.days, 'k-feed')}<small>${feed.days === 1 ? 'giorno fa' : 'giorni fa'}</small>`, sub: `${Utils.esc(feed.lastEaten.preda)} · ${Utils.fmtDateShort(feed.lastEaten.data)} · ${sub}`, bar: { pct: feed.days / feed.target * 100, color: feed.status === 'ok' ? 'ok' : feed.status === 'warn' ? 'warn' : feed.status === 'info' ? 'indigo' : 'bad' } });
    } else kFeed = kpi({ key: 'feed', label: `${I('mouse')} Ultimo pasto`, status: 'neutral', value: '—', sub: feed.lastAny ? 'Nessun pasto consumato' : 'Nessun pasto registrato' });
    let kShed;
    if (shed.last) {
      kShed = shed.inShed
        ? kpi({ key: 'shed', label: `${I('shed')} Muta`, status: shed.days > 14 ? 'warn' : 'info', value: `${count(shed.days, 'k-shed')}<small>giorni in muta</small>`, sub: `Fase opaca dal ${Utils.fmtDateShort(shed.last.dataInizio)} · <button class="btn btn-sm" style="height:24px;margin-top:4px" data-edit="shed" data-id="${Utils.esc(shed.last.id)}" data-preset-complete>Segna completata</button>` })
        : kpi({ key: 'shed', label: `${I('shed')} Ultima muta`, status: shed.last.esito === 'Completa' && shed.last.occhi !== 'Rimasti sugli occhi' ? 'ok' : 'warn', value: `${count(shed.days, 'k-shed')}<small>${shed.days === 1 ? 'giorno fa' : 'giorni fa'}</small>`, sub: `${Utils.esc(shed.last.esito)}${shed.last.dataFine ? ' · ' + Utils.fmtDateShort(shed.last.dataFine) : ''}` });
    } else kShed = kpi({ key: 'shed', label: `${I('shed')} Muta`, status: 'neutral', value: '—', sub: 'Nessuna muta registrata' });
    const kWater = water.last
      ? kpi({ key: 'water', label: `${I('drop')} Cambio acqua`, status: water.status, value: `${count(water.days, 'k-water')}<small>${water.days === 1 ? 'giorno fa' : 'giorni fa'}</small>`, sub: water.remaining > 0 ? `Prossimo tra <b>${Utils.plural(water.remaining, 'giorno', 'giorni')}</b>` : water.remaining === 0 ? '<b class="c-warn">Da fare oggi</b>' : `<b class="c-bad">In ritardo di ${Utils.plural(-water.remaining, 'giorno', 'giorni')}</b>`, bar: { pct: water.days / water.target * 100, color: water.status === 'ok' ? 'ok' : water.status === 'warn' ? 'warn' : 'bad' } })
      : kpi({ key: 'water', label: `${I('drop')} Cambio acqua`, status: 'neutral', value: '—', sub: 'Nessun cambio registrato' });
    const loss = Logic.weightLoss();
    const kWeight = weight !== null
      ? kpi({ key: 'weight', label: `${I('scale')} Peso`, status: loss && loss.pct >= 10 ? 'bad' : trend && trend.diff < 0 ? 'warn' : 'ok', value: `${count(weight, 'k-weight', 1)}<small>g</small>`, sub: trend ? `<b class="c-${trend.diff >= 0 ? 'ok' : 'warn'}">${trend.diff >= 0 ? '+' : ''}${Utils.fmtNum(trend.diff, 'g')}</b> in ${trend.days} giorni · ≈ ${Utils.fmtNum(trend.perMonth, 'g')}/mese` : 'Aggiungi altre misurazioni per il trend' })
      : kpi({ key: 'weight', label: `${I('scale')} Peso`, status: 'neutral', value: '—', sub: 'Nessuna misurazione' });

    const quick = [['feeding', 'mouse', 'Pasto'], ['env', 'thermo', 'Clima'], ['water', 'drop', 'Acqua'], ['growth', 'scale', 'Peso'], ['shed', 'shed', 'Muta'], ['waste', 'waste', 'Feci']];

    Terrarium.closePop();
    $('#view-dashboard').innerHTML = `
      <div class="hero">
        <button class="hero-avatar" data-snake aria-label="Apri la scheda del serpente" style="cursor:pointer;background:radial-gradient(circle at 30% 25%, ${look.base}, ${look.saddle} 70%, var(--elev))">${I('snake')}</button>
        <div class="hero-main">
          <div class="hero-name"><h2>${p.nome ? Utils.esc(p.nome) : 'Il tuo serpente'} <span class="faint" style="font-weight:500">${sex}</span></h2>
            ${p.morph ? `<span class="badge b-info">${Utils.esc(p.morph)}</span>` : `<button class="badge b-neutral" style="cursor:pointer" data-nav="impostazioni">+ Aggiungi morph</button>`}</div>
          <div class="hero-meta">
            <span>${I('cake')} <b>${age ? Utils.esc(age) : '—'}</b></span>
            <span>${I('scale')} <b>${weight !== null ? Utils.fmtNum(weight, 'g') : '—'}</b></span>
            <span>${I('ruler')} <b>${Logic.currentLength() !== null ? Utils.fmtNum(Logic.currentLength(), 'cm') : '—'}</b></span>
            <span class="hide-xs">${I('home')} <b>${Utils.esc(p.terrarioDimensioni || '—')}</b></span>
          </div>
        </div>
        <div class="hero-status"><button class="status-pill" data-scroll="alertsCard">${statusPill}</button></div>
      </div>
      ${welcome}
      <div class="grid g-main mt">
        <div class="card terra-card"><div class="card-head" style="margin-bottom:10px"><h2>Terrario</h2><span class="sub">${Utils.esc(look.label)}</span></div>${Terrarium.html()}</div>
        ${todayCard()}
      </div>
      <div class="quick mt">${quick.map(([t, i, l]) => `<button class="quick-btn" ${t === 'water' ? 'data-water' : `data-add="${t}"`}><span class="q-ico">${I(i)}</span><span>${l}</span></button>`).join('')}</div>
      <div class="grid g-4 mt">${kFeed}${kShed}${kWater}${kWeight}</div>
      <div class="grid g-2 mt">
        <div class="card" id="alertsCard"><div class="card-head"><h2>Avvisi</h2>${nBad ? `<span class="badge b-bad">${nBad} critici</span>` : nWarn ? `<span class="badge b-warn">${nWarn} avvisi</span>` : '<span class="badge b-ok">Nessun problema</span>'}</div>${alertsHTML(al)}</div>
        <div class="card"><div class="card-head"><h2>Clima del terrario</h2><button class="btn btn-sm" data-add="env">${I('plus')} Lettura</button></div>${gauges()}</div>
      </div>
      <div class="card mt"><div class="card-head"><h2>Attività recenti</h2><button class="btn btn-sm btn-ghost" data-search-open>${I('search')} Cerca</button></div>${timeline(8)}</div>`;
  }

  /* ---------- Clima ---------- */
  function clima() {
    const env = [...S().logs.env].reverse();
    const data = Charts.filterByRange('env', env, 'datetime');
    const p = S().profile, brum = Logic.brumState();
    const hot = Logic.range('tempCalda');
    const hasNight = data.some(e => e.tempNotte !== null);
    $('#view-clima').innerHTML = `
      ${brum.active ? `<div class="banner b-info-soft">${I('moon')} <span>Brumazione attiva: le soglie di temperatura sono quelle invernali (${Utils.fmtNum(p.brumTempMin)}–${Utils.fmtNum(p.brumTempMax)} °C).</span></div>` : ''}
      <div class="grid g-main">
        <div class="card"><div class="card-head"><h2>Andamento</h2>${Charts.rangeControl('env')}</div><div class="chart-box" id="chart-env"></div>
          <p class="faint small" style="margin-top:8px"><span class="band-sw"></span> Fascia verde: zona calda ottimale ${Utils.fmtNum(hot.lo)}–${Utils.fmtNum(hot.hi)} °C</p></div>
        <div class="card"><div class="card-head"><h2>Ultimi valori</h2><button class="btn btn-sm" data-add="env">${I('plus')} Lettura</button></div>${gauges()}</div>
      </div>
      <div class="card mt"><div class="card-head"><h2>Storico letture</h2><div class="row"><button class="btn btn-sm" data-csv>${I('table')} Importa CSV</button></div></div>
        <p class="faint small" style="margin:-6px 0 12px">Calda ${Utils.fmtNum(p.tempCaldaMin)}–${Utils.fmtNum(p.tempCaldaMax)}°C · Fredda ${Utils.fmtNum(p.tempFreddaMin)}–${Utils.fmtNum(p.tempFreddaMax)}°C · Notte ${Utils.fmtNum(p.tempNotteMin)}–${Utils.fmtNum(p.tempNotteMax)}°C · UR ${Utils.fmtNum(p.umiditaMin)}–${Utils.fmtNum(p.umiditaMax)}%</p>
        ${Records.block('env')}</div>`;
    Charts.line('env', $('#chart-env'), data.map(e => Utils.fmtAxis(e.datetime)), [
      { label: 'Zona calda', data: data.map(e => e.tempCalda), color: '#f87171', unit: '°C', fillAlpha: .14 },
      { label: 'Zona fredda', data: data.map(e => e.tempFredda), color: '#818cf8', unit: '°C', fillAlpha: .08 },
      ...(hasNight ? [{ label: 'Notte', data: data.map(e => e.tempNotte), color: '#a78bfa', unit: '°C', fill: false }] : []),
      { label: 'Umidità', data: data.map(e => e.umidita), color: '#22d3ee', axis: 'y1', unit: '%', fillAlpha: .06 }
    ], { yTitle: '°C', y1Title: '%', emptyMsg: 'Registra delle letture o allarga l\'intervallo.', addType: 'env', band: { min: hot.lo, max: hot.hi, axis: 'y', color: 'rgba(74,222,128,0.09)' } });
  }

  /* ---------- Alimentazione & crescita ---------- */
  function alimentazione() {
    const tab = tabs.alimentazione;
    const f = S().logs.feeding, p = S().profile;
    const feed = Logic.feedingState(), sug = Logic.suggestedInterval();
    const eaten = f.filter(x => x.esito === 'Mangiato');
    const ratios = eaten.map(x => Utils.num(x.rapporto)).filter(x => x !== null);
    const avgR = ratios.length ? Utils.round(ratios.slice(0, 6).reduce((a, b) => a + b, 0) / Math.min(6, ratios.length), 1) : null;
    const trend = Logic.weightTrend(), loss = Logic.weightLoss();
    let body;
    if (tab === 'feeding') {
      body = `<div class="card interval-card">
          <div><span class="kpi-label">${I('calendar')} Intervallo pasti</span>
            <h2>Ogni ${Utils.plural(feed.target, 'giorno', 'giorni')} ${p.intervalloAuto ? '<span class="badge b-ok">automatico</span>' : '<span class="badge b-neutral">manuale</span>'}</h2>
            <p class="muted small">${p.intervalloAuto ? `Consigliato per un serpente ${sug.stage} (${sug.basis}): ${sug.span} giorni. Si aggiorna da solo con le pesate.` : `Consigliato per la sua fase: ${sug.span} giorni (${sug.stage}, ${sug.basis}).`}${feed.paused ? ` <b class="c-info">Ora sospeso: ${feed.paused}.</b>` : ''}</p></div>
          <div class="interval-act">${mealButtons()}<button class="btn btn-ghost btn-sm" data-nav="impostazioni">Cambia</button></div>
        </div>
        <div class="stats mt">
          <div class="stat"><span>Ultimo pasto</span><b>${feed.lastEaten ? Utils.cap(Utils.relDays(feed.days)) : '—'}</b><small>${feed.lastEaten ? Utils.esc(feed.lastEaten.preda) : 'nessuno'}</small></div>
          <div class="stat"><span>Prossimo</span><b class="c-${feed.status}">${feed.paused ? 'Sospeso' : feed.remaining === null ? '—' : feed.remaining > 0 ? Utils.cap(Utils.weekday(feed.next)) : feed.remaining === 0 ? 'Oggi' : `${-feed.remaining} gg di ritardo`}</b><small>${feed.next ? Utils.fmtDate(feed.next) : ''}</small></div>
          <div class="stat"><span>Pasti consumati</span><b>${f.length ? `${Math.round(eaten.length / f.length * 100)}%` : '—'}</b><small>${eaten.length} su ${f.length} · rifiuti di fila ${Logic.refusals()}</small></div>
          <div class="stat"><span>Rapporto medio</span><b class="c-${Logic.ratioStatus(avgR)}">${avgR === null ? '—' : Utils.fmtNum(avgR, '%')}</b><small>ultimi pasti · ideale 10–15%</small></div>
        </div>
        <div class="card mt"><div class="card-head"><h2>Storico pasti</h2><button class="btn btn-sm" data-add="feeding">${I('plus')} Pasto</button></div>${Records.block('feeding')}</div>`;
    } else {
      const exp = Logic.expectedWeight(Utils.monthsSince(p.dataNascita));
      body = `<div class="stats">
          <div class="stat"><span>Peso attuale</span><b>${Utils.fmtNum(Logic.currentWeight(), 'g')}</b><small>${S().logs.growth[0] ? Utils.fmtDate(S().logs.growth[0].data) : 'dal profilo'}</small></div>
          <div class="stat"><span>Crescita</span><b class="c-${trend && trend.diff < 0 ? 'warn' : 'ok'}">${trend ? `${trend.perMonth >= 0 ? '+' : ''}${Utils.fmtNum(trend.perMonth, 'g')}/mese` : '—'}</b><small>${trend ? `${trend.diff >= 0 ? '+' : ''}${Utils.fmtNum(trend.diff, 'g')} in ${trend.days} giorni` : 'servono 2 misure'}</small></div>
          <div class="stat"><span>Calo nel mese</span><b class="c-${loss ? (loss.pct >= 10 ? 'bad' : loss.pct >= 6 ? 'warn' : 'ok') : 'ok'}">${loss ? '−' + Utils.fmtNum(loss.pct, '%') : 'nessuno'}</b><small>allarme oltre il 10%</small></div>
          <div class="stat"><span>Fascia per l'età</span><b>${exp ? `${exp.min}–${exp.max} g` : '—'}</b><small>${exp ? 'indicativa, varia molto' : 'serve la data di nascita'}</small></div>
        </div>
        <div class="card mt"><div class="card-head"><h2>Curva di crescita</h2>${Charts.rangeControl('growth')}</div><div class="chart-box" id="chart-growth"></div>
          ${p.dataNascita ? '<p class="faint small" style="margin-top:8px">Le linee tratteggiate sono la fascia di peso indicativa per l\'età: un riferimento, non una regola.</p>' : ''}</div>
        <div class="card mt"><div class="card-head"><h2>Storico misurazioni</h2><button class="btn btn-sm" data-add="growth">${I('plus')} Misurazione</button></div>${Records.block('growth')}</div>`;
    }
    $('#view-alimentazione').innerHTML = `<div class="segmented tabs-bar" role="tablist">
        <button class="seg-btn${tab === 'feeding' ? ' active' : ''}" data-tab="alimentazione" data-value="feeding">${I('mouse')} Pasti</button>
        <button class="seg-btn${tab === 'growth' ? ' active' : ''}" data-tab="alimentazione" data-value="growth">${I('scale')} Crescita</button>
      </div>${body}`;
    if (tab === 'growth') {
      const g = Charts.filterByRange('growth', [...S().logs.growth].reverse(), 'data');
      const refs = g.map(x => Logic.expectedWeight(Logic.monthsAt(x.data)));
      const hasRef = refs.some(Boolean);
      Charts.line('growth', $('#chart-growth'), g.map(x => Utils.fmtAxis(x.data)), [
        { label: 'Peso', data: g.map(x => x.peso), color: '#fbbf24', unit: 'g', fillAlpha: .25 },
        ...(hasRef ? [{ label: 'Atteso min', data: refs.map(r => r ? r.min : null), color: '#64748b', unit: 'g', dash: true, fill: false }, { label: 'Atteso max', data: refs.map(r => r ? r.max : null), color: '#64748b', unit: 'g', dash: true, fill: false }] : []),
        { label: 'Lunghezza', data: g.map(x => x.lunghezza), color: '#4ade80', axis: 'y1', unit: 'cm', fillAlpha: .08 }
      ], { yTitle: 'g', y1Title: 'cm', emptyMsg: 'Registra peso e lunghezza per la curva di crescita.', addType: 'growth' });
    } else Charts.destroy('growth');
  }

  /* ---------- Cura ---------- */
  function cura() {
    const tab = tabs.cura, st = S();
    let summary = '';
    if (tab === 'shed') {
      const sh = st.logs.shed, s = Logic.shedState();
      const done = sh.filter(x => x.dataFine).sort((a, b) => a.dataFine.localeCompare(b.dataFine));
      const gaps = []; for (let i = 1; i < done.length; i++) gaps.push(Utils.daysBetween(done[i - 1].dataFine, done[i].dataFine));
      const avgGap = gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : null;
      const durs = done.map(x => Utils.daysBetween(x.dataInizio, x.dataFine)).filter(d => d !== null && d >= 0);
      const avgDur = durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : null;
      const next = avgGap && done.length ? Utils.toISODate(Utils.addDays(Utils.parse(done[done.length - 1].dataFine), avgGap)) : null;
      const hum = q => { const v = sh.filter(x => x.esito !== 'In corso' && (q ? x.esito === 'Completa' && x.occhi !== 'Rimasti sugli occhi' : x.esito !== 'Completa' || x.occhi === 'Rimasti sugli occhi')).map(Logic.shedHumidity).filter(x => x !== null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
      const hOk = hum(true), hBad = hum(false);
      summary = `<div class="stats">
        <div class="stat"><span>Stato</span><b class="c-${s.inShed ? 'info' : 'ok'}">${s.last ? (s.inShed ? 'In muta' : 'Non in muta') : '—'}</b><small>${s.last ? (s.inShed ? `da ${Utils.plural(s.days, 'giorno', 'giorni')}` : `ultima ${Utils.relDays(s.days)}`) : 'nessuna muta'}</small></div>

      const gaps = []; for (let i = 1; i < poop.length && i < 10; i++) gaps.push(Utils.daysBetween(poop[i].data, poop[i - 1].data));
      summary = `<div class="stats">
        <div class="stat"><span>Ultime feci</span><b>${poop[0] ? Utils.cap(Utils.relDays(Utils.daysSince(poop[0].data))) : '—'}</b><small>${poop[0] ? Utils.esc(poop[0].aspetto) : 'nessuna registrata'}</small></div>
        <div class="stat"><span>Ultimi urati</span><b>${ur[0] ? Utils.cap(Utils.relDays(Utils.daysSince(ur[0].data))) : '—'}</b><small>${ur[0] ? Utils.esc(ur[0].aspetto) : ''}</small></div>
        <div class="stat"><span>Ogni quanto</span><b>${gaps.length ? `${Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length)} giorni` : '—'}</b><small>media delle ultime</small></div>
        <div class="stat"><span>Anomale (30 gg)</span><b class="c-${ab ? 'warn' : 'ok'}">${ab}</b><small>sangue, muco, molli, urati gialli…</small></div>

    } else if (tab === 'symptom') {
      const open = Logic.openSymptoms();
      summary = `<div class="stats">
        <div class="stat"><span>Aperti</span><b class="c-${open.length ? 'warn' : 'ok'}">${open.length}</b><small>${open[0] ? Utils.esc(open[0].area) : 'nessuno'}</small></div>

        <div class="stat"><span>Ultimo</span><b>${L.symptom[0] ? Utils.cap(Utils.relDays(Utils.daysSince(L.symptom[0].data))) : '—'}</b><small>${L.symptom[0] ? Utils.esc(L.symptom[0].area) : ''}</small></div>

      summary = `<div class="stats">

        <div class="stat"><span>Visite</span><b>${L.vet.length}</b><small>in totale</small></div>
      </div>`;
    } else if (tab === 'med') {
      const act = Logic.activeMeds();
      summary = act.length ? `<div class="med-cards">${act.map(m => { const s = Logic.medState(m); return `<div class="card med-card ${s.due ? 'due' : ''}">

          <p class="muted small">${m.dose ? Utils.esc(m.dose) + ' · ' : ''}ogni ${Utils.plural(s.every, 'giorno', 'giorni')} · ${(m.dosi || []).length} dosi date${m.dataFine ? ` · fino al ${Utils.fmtDateShort(m.dataFine)}` : ''}</p>
          <div class="row" style="margin-top:10px"><button class="btn btn-sm ${s.due ? 'btn-primary' : ''}" data-dose="${Utils.esc(m.id)}" ${s.doneToday ? 'disabled' : ''}>${I('check')} Dose data</button><button class="btn btn-sm btn-ghost" data-edit="med" data-id="${Utils.esc(m.id)}">${I('edit')} Modifica</button></div>

  async function fillPhotos() {
    const grid = document.getElementById('photoGrid');
    if (!grid) return;
    const list = await Photos.list();
    [...photoSel].forEach(id => { if (!list.some(p => p.id === id)) photoSel.delete(id); });
    if (!list.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-ico">${I('camera')}</div><b>Nessuna foto</b><p>Fotografa il serpente ogni mese o dopo la muta: poi potrai confrontare prima e dopo.</p><button class="btn btn-primary btn-sm" data-photo-add>${I('camera')} Aggiungi la prima foto</button></div>`; return; }
    grid.innerHTML = list.map(p => { const w = Logic.weightAt(p.date); return `<figure class="photo ${photoSel.has(p.id) ? 'sel' : ''}" data-photo="${p.id}">
        <img src="${Photos.url(p)}" alt="Foto del ${Utils.fmtDate(p.date)}" loading="lazy">
        <figcaption><b>${Utils.fmtDate(p.date)}</b><span>${Utils.esc(p.tag)}${w !== null ? ' · ' + Utils.fmtNum(w, 'g') : ''}</span>${p.note ? `<small>${Utils.esc(p.note)}</small>` : ''}</figcaption>

        <span class="photo-check">${I('check')}</span>

  function togglePhoto(id) {
    if (photoSel.has(id)) photoSel.delete(id);
    else { if (photoSel.size >= 2) photoSel.delete([...photoSel][0]); photoSel.add(id); }

    const b = document.querySelector('[data-compare]');
    if (b) { b.disabled = photoSel.size !== 2; b.innerHTML = `${I('compare')} Confronta (${photoSel.size}/2)`; }
  }

  function saveSettings(form) {
    const patch = {};
    for (const k of Object.keys(Schema.DEFAULT_PROFILE)) {
      if (k === 'sesso') { const c = form.querySelector('input[name="sesso"]:checked'); patch.sesso = c ? c.value : 'Non determinato'; continue; }
      const el = form.elements[k]; if (!el) continue;
      if (Schema.BOOL_PROFILE.includes(k)) { patch[k] = el.checked; continue; }
      if (Schema.DATE_PROFILE.includes(k)) {
        const v = el.value.trim(), iso = Utils.fromDMY(v);
        if (v && !iso) { Toast.show(`Data non valida: usa gg/mm/aaaa`, 'warn'); el.focus(); return; }
        patch[k] = iso; continue;
      }
      if (Schema.TIME_PROFILE.includes(k)) {
        const t = Utils.normTime(el.value);
        if (!t) { Toast.show('Orario della luce non valido: usa hh:mm', 'warn'); el.focus(); return; }
        patch[k] = t; continue;
      }
      patch[k] = Schema.NUMERIC_PROFILE.includes(k) ? Utils.num(el.value) : el.value.trim();
    }
    for (const [a, b, l] of [['tempCaldaMin', 'tempCaldaMax', 'zona calda'], ['tempFreddaMin', 'tempFreddaMax', 'zona fredda'], ['tempNotteMin', 'tempNotteMax', 'notte'], ['umiditaMin', 'umiditaMax', 'umidità'], ['brumTempMin', 'brumTempMax', 'brumazione']]) {
      if (patch[a] === null || patch[b] === null) { Toast.show(`Inserisci entrambi i limiti per ${l}`, 'warn'); return; }
      if (patch[a] >= patch[b]) { Toast.show(`Il minimo di ${l} deve essere inferiore al massimo`, 'warn'); return; }
    }
    if (patch.umiditaMin < 0 || patch.umiditaMax > 100) { Toast.show('L\'umidità deve essere tra 0 e 100%', 'warn'); return; }
    for (const k of ['intervalloPasti', 'intervalloAcqua', 'intervalloPulizia']) {
      if (patch[k] === null || patch[k] < 1) { Toast.show('Gli intervalli devono essere di almeno 1 giorno', 'warn'); return; }
      patch[k] = Math.round(patch[k]);
    }
    if (patch.scortaMin === null || patch.scortaMin < 0) patch.scortaMin = 4; else patch.scortaMin = Math.round(patch.scortaMin);
    const today = Utils.todayISO();
    if (patch.dataNascita > today || patch.dataArrivo > today) { Toast.show('Nascita e arrivo non possono essere nel futuro', 'warn'); return; }
    if (patch.dataNascita && patch.dataArrivo && patch.dataArrivo < patch.dataNascita) { Toast.show('La data di arrivo non può precedere la nascita', 'warn'); return; }
    if (patch.brumInizio && patch.brumFine && patch.brumFine < patch.brumInizio) { Toast.show('La fine della brumazione non può precedere l\'inizio', 'warn'); return; }
    if (!patch.brumInizio) patch.brumFine = '';
    if (patch.pesoAttuale !== null && patch.pesoAttuale < 0) patch.pesoAttuale = null;
    if (patch.lunghezzaAttuale !== null && patch.lunghezzaAttuale < 0) patch.lunghezzaAttuale = null;
    Store.updateProfile(patch);
    Toast.show('Impostazioni salvate', 'ok', { action: Actions.undoAction() });
  }
