  let state = emptyState();
  let rev = 0;
  const listeners = new Set();
  const history = [];   // stati precedenti per "Annulla"

  function applyAliases(obj, map) {
    const out = { ...obj };
    for (const [from, to] of Object.entries(map)) {
      if (out[to] === undefined && out[from] !== undefined) out[to] = out[from];
    }
    return out;
  }

  function matchOption(value, options) {
    if (typeof value !== 'string') return null;
    const v = value.trim().toLowerCase();
    if (!v) return null;
    return options.find(o => o.toLowerCase() === v) || options.find(o => o.toLowerCase().startsWith(v) && v.length >= 3) || null;
  }

  let lastReason = '';
  /** Normalizza una voce di registro. Ritorna null se mancano dati essenziali (motivo in lastReason). */
  function normalizeEntry(type, raw) {
    lastReason = '';
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) { lastReason = 'non è un oggetto'; return null; }
    const def = Schema.LOGS[type];
    const src = applyAliases(applyAliases(raw, Schema.ALIASES[type] || {}), Schema.ALIASES._common);
    const out = { id: (typeof src.id === 'string' || typeof src.id === 'number') && String(src.id).trim() ? String(src.id).slice(0, 48) : Utils.uid() };
    for (const f of def.fields) {
      let v = src[f.name];
      if (f.type === 'number') {
        v = Utils.num(v);
        if (v !== null && (v < f.min || v > f.max)) v = null;
      } else if (f.type === 'date') {
        if (typeof v === 'string' && !Utils.isValidDate(v)) v = Utils.fromDMY(v);
        v = typeof v === 'string' && Utils.isValidDate(v) ? v.slice(0, 10) : '';
      } else if (f.type === 'datetime-local') {
        if (typeof v === 'string' && Utils.isValidDate(v)) {
          v = Utils.hasTime(v.replace(' ', 'T')) ? v.replace(' ', 'T').slice(0, 16) : `${v.slice(0, 10)}T12:00`;
        } else v = '';
      } else if (f.type === 'select') {
        const m = matchOption(v, f.options);
        v = m || (f.required ? (f.options.includes('Altro') ? 'Altro' : f.options[0]) : '');
      } else if (f.type === 'text') {
        v = typeof v === 'string' ? v.trim().slice(0, 120) : (typeof v === 'number' ? String(v) : '');
      } else {
        v = typeof v === 'string' ? v.slice(0, 1000) : (typeof v === 'number' ? String(v) : '');
      }
      if (f.required && (v === null || v === '')) { lastReason = `manca "${f.label.toLowerCase()}"`; return null; }
      out[f.name] = v;
    }
    if (def.atLeastOne && def.atLeastOne.every(k => out[k] === null || out[k] === '')) { lastReason = 'nessun valore misurato'; return null; }
    if (typeof src._m === 'string' && /^\d{4}-\d\d-\d\dT/.test(src._m)) out._m = src._m.slice(0, 30);
    if (type === 'feeding') out.rapporto = Utils.num(src.rapporto);
    if (type === 'shed') {
      if (out.dataFine && out.dataFine < out.dataInizio) out.dataFine = '';
      if (out.esito === 'In corso') out.dataFine = '';
      // Muta conclusa ma senza data: si mantiene l'esito (data non nota)
    }
    if (type === 'med') {
      if (out.dataFine && out.dataFine < out.dataInizio) out.dataFine = '';
      out.dosi = Array.isArray(src.dosi) ? [...new Set(src.dosi.filter(d => typeof d === 'string' && Utils.isValidDate(d)).map(d => d.slice(0, 10)))].sort().reverse().slice(0, 400) : [];
    }
    return out;
  }

  function sortLog(type, arr) {
    const k = Schema.LOGS[type].dateKey;
    return arr.sort((a, b) => (b[k] || '').localeCompare(a[k] || ''));
  }

  /**
   * Migrazione + normalizzazione di qualsiasi oggetto stato (localStorage o import).
   * report (facoltativo) raccoglie conteggi e voci scartate: { total, kept, dropped: [{ type, index, reason }] }
   */
  function normalizeState(input, report = null) {
    const s = emptyState();
    if (!input || typeof input !== 'object' || Array.isArray(input)) return s;
    const raw = { ...input };

    let logs = raw.logs && typeof raw.logs === 'object' && !Array.isArray(raw.logs) ? { ...raw.logs } : {};
    for (const [alias, t] of Object.entries(Schema.LOG_ALIASES)) {
      if (!logs[t] && Array.isArray(logs[alias])) logs[t] = logs[alias];
      if (!logs[t] && Array.isArray(raw[alias])) logs[t] = raw[alias];
    }
    for (const t of Schema.LOG_TYPES) if (!logs[t] && Array.isArray(raw[t])) logs[t] = raw[t];

    const pRaw = applyAliases(raw.profile || raw.profilo || raw.snake || {}, Schema.ALIASES.profile);
    // Profili v2: senza "intervalloAuto" si mantiene l'intervallo scelto a mano
    if (raw.profile && !('intervalloAuto' in pRaw) && 'intervalloPasti' in pRaw) pRaw.intervalloAuto = false;
    for (const k of Object.keys(Schema.DEFAULT_PROFILE)) {
      if (!(k in pRaw)) continue;
      const v = pRaw[k];
      if (Schema.NUMERIC_PROFILE.includes(k)) {
        const n = Utils.num(v);
        s.profile[k] = n === null ? (Schema.NULLABLE_PROFILE.includes(k) ? null : Schema.DEFAULT_PROFILE[k]) : n;
      } else if (Schema.DATE_PROFILE.includes(k)) {
        s.profile[k] = typeof v === 'string' && Utils.isValidDate(v) ? v.slice(0, 10) : '';
      } else if (Schema.BOOL_PROFILE.includes(k)) {
        s.profile[k] = v === true || v === 'true' || v === 1;
      } else if (Schema.TIME_PROFILE.includes(k)) {
        s.profile[k] = Utils.normTime(v) || Schema.DEFAULT_PROFILE[k];
      } else if (k === 'sesso') {
        s.profile[k] = matchOption(v, Schema.OPTIONS.sesso) || (typeof v === 'string' && /^m/i.test(v) ? 'Maschio' : typeof v === 'string' && /^f/i.test(v) ? 'Femmina' : 'Non determinato');
      } else {
        s.profile[k] = typeof v === 'string' ? v.slice(0, 120) : (typeof v === 'number' ? String(v) : Schema.DEFAULT_PROFILE[k]);
      }
    }
    const p = s.profile;
    [['tempCaldaMin', 'tempCaldaMax'], ['tempFreddaMin', 'tempFreddaMax'], ['umiditaMin', 'umiditaMax'], ['tempNotteMin', 'tempNotteMax'], ['brumTempMin', 'brumTempMax']].forEach(([a, b]) => {
      if (!(p[a] < p[b])) { p[a] = Schema.DEFAULT_PROFILE[a]; p[b] = Schema.DEFAULT_PROFILE[b]; }
    });
    ['intervalloPasti', 'intervalloAcqua', 'intervalloPulizia'].forEach(k => { p[k] = Math.max(1, Math.round(p[k])); });
    if (p.brumFine && p.brumInizio && p.brumFine < p.brumInizio) p.brumFine = '';

    if (report) { report.total = 0; report.kept = 0; report.dropped = []; report.byType = {}; }
    for (const t of Schema.LOG_TYPES) {
      const arr = Array.isArray(logs[t]) ? logs[t] : [];
      const seen = new Set();
      const kept = [];
      arr.forEach((raw, i) => {
        const e = normalizeEntry(t, raw);
        if (!e) { if (report) report.dropped.push({ type: t, index: i + 1, reason: lastReason || 'dati non validi' }); return; }
        if (seen.has(e.id)) e.id = Utils.uid();
        seen.add(e.id);
        kept.push(e);
      });
      s.logs[t] = sortLog(t, kept);
      if (report) { report.total += arr.length; report.kept += kept.length; report.byType[t] = { total: arr.length, kept: kept.length }; }
    }
    s.updatedAt = typeof raw.updatedAt === 'string' ? raw.updatedAt : null;
    s.profileAt = typeof raw.profileAt === 'string' ? raw.profileAt : '';
    if (raw.deleted && typeof raw.deleted === 'object' && !Array.isArray(raw.deleted)) {
      const cut = new Date(Date.now() - 365 * 864e5).toISOString();
      for (const [id, at] of Object.entries(raw.deleted)) if (typeof at === 'string' && at > cut) s.deleted[String(id).slice(0, 48)] = at;
    }
    return s;
  }

  function syncProfileFromGrowth() {
    const w = state.logs.growth.find(g => g.peso !== null);
    const l = state.logs.growth.find(g => g.lunghezza !== null);
    if (w) state.profile.pesoAttuale = w.peso;
    if (l) state.profile.lunghezzaAttuale = l.lunghezza;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? normalizeState(JSON.parse(raw)) : emptyState();
    } catch (err) {
      console.warn('Dati salvati illeggibili: avvio con stato vuoto.', err);
      state = emptyState();
    }
    rev++;
    return state;
  }

  function persist() {
    state.version = SCHEMA_VERSION;
    state.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(state)); Safety.requestPersist(); return true; }
    catch (err) { console.warn('Salvataggio non riuscito', err); Toast.show('Impossibile salvare: spazio del browser esaurito o bloccato.', 'bad'); return false; }
  }
  const emit = () => { rev++; listeners.forEach(fn => fn(state)); };
  const commit = () => { persist(); emit(); };
  /** Salva lo stato corrente nella cronologia prima di una modifica */
  const remember = label => { history.push({ label, json: JSON.stringify(state) }); if (history.length > 20) history.shift(); };

  /** Chiave di contenuto per riconoscere doppioni (senza id) */
  const signature = (t, e) => JSON.stringify(Schema.LOGS[t].fields.map(f => e[f.name] ?? ''));

  // Altre schede dello stesso browser: si ricaricano i dati quando cambiano
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    load();
    emit();
    Toast.show('Dati aggiornati da un\'altra finestra dell\'app', 'info');
  });

  return {
    KEY, META_KEY, SCHEMA_VERSION,
    get: () => state,
    get rev() { return rev; },
    load,
    normalizeState,
    subscribe: fn => listeners.add(fn),
    isEmpty: () => Schema.LOG_TYPES.every(t => state.logs[t].length === 0) && !state.profile.nome,
    count: () => Schema.LOG_TYPES.reduce((a, t) => a + state.logs[t].length, 0),
    find: (type, id) => state.logs[type].find(e => e.id === id) || null,
    validateImport(raw) {
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('il file non contiene un oggetto JSON valido');
      const hasData = raw.profile || raw.profilo || raw.logs || Schema.LOG_TYPES.some(t => Array.isArray(raw[t])) || Object.keys(Schema.LOG_ALIASES).some(a => Array.isArray(raw[a]));
      if (!hasData) throw new Error('struttura non riconosciuta (mancano profilo e registri)');
      const report = {};
      const parsed = normalizeState(raw, report);
      return { parsed, report };
    },
    replace(next, label = 'Sostituzione dati') { remember(label); state = normalizeState(next); commit(); },
    /** Unisce i dati importati a quelli presenti, senza doppioni. Ritorna il numero di voci aggiunte. */
    merge(next) {
      remember('Unione dati');
      const inc = normalizeState(next);
      let added = 0;
      for (const t of Schema.LOG_TYPES) {
        const ids = new Set(state.logs[t].map(e => e.id));
        const sigs = new Set(state.logs[t].map(e => signature(t, e)));
        for (const e of inc.logs[t]) {
          const sig = signature(t, e);
          if (sigs.has(sig)) continue;
          sigs.add(sig);
          state.logs[t].push(ids.has(e.id) ? { ...e, id: Utils.uid() } : e);
          ids.add(e.id);
          added++;
        }
        sortLog(t, state.logs[t]);
      }
      // Il profilo attuale resta; si completano solo i campi vuoti
      for (const [k, v] of Object.entries(inc.profile)) {
        const cur = state.profile[k];
        if ((cur === '' || cur === null) && v !== '' && v !== null) state.profile[k] = v;
      }
      syncProfileFromGrowth();
      commit();
      return added;
    },
    reset() { remember('Svuota dati'); state = emptyState(); try { localStorage.removeItem(KEY); } catch (e) { console.warn(e); } emit(); },
    updateProfile(patch) { remember('Modifica profilo'); Object.assign(state.profile, patch); state.profileAt = nowISO(); commit(); },
    add(type, data) {
      const e = normalizeEntry(type, { ...data, id: Utils.uid(), _m: nowISO() });
      if (!e) return null;
      remember('Nuova voce');
      state.logs[type].push(e);
      sortLog(type, state.logs[type]);
      if (type === 'growth') syncProfileFromGrowth();
      commit();
      return e;
    },
    /** Aggiunge più voci in un solo salvataggio (es. import CSV) */
    addMany(type, list) {
      const ok = list.map(d => normalizeEntry(type, { ...d, id: Utils.uid(), _m: nowISO() })).filter(Boolean);
      if (!ok.length) return 0;
      remember('Import letture');
      state.logs[type].push(...ok);
      sortLog(type, state.logs[type]);
      commit();
      return ok.length;
    },
    update(type, id, data) {
      const i = state.logs[type].findIndex(e => e.id === id);
      if (i < 0) return null;
      const e = normalizeEntry(type, { ...state.logs[type][i], ...data, id, _m: nowISO() });
      if (!e) return null;
      remember('Modifica');
      state.logs[type][i] = e;
      sortLog(type, state.logs[type]);
      if (type === 'growth') syncProfileFromGrowth();
      commit();
      return e;
    },
    remove(type, id) {
      const e = state.logs[type].find(x => x.id === id);
      if (!e) return null;
      remember('Eliminazione');
      state.logs[type] = state.logs[type].filter(x => x.id !== id);
      state.deleted[id] = nowISO();
      if (type === 'growth') syncProfileFromGrowth();
      commit();
      return e;
    },
    restore(type, entry) {
      if (state.logs[type].some(x => x.id === entry.id)) return;
      delete state.deleted[entry.id];
      state.logs[type].push({ ...entry, _m: nowISO() });
      sortLog(type, state.logs[type]);
      if (type === 'growth') syncProfileFromGrowth();
      commit();
    },
    /** Torna allo stato precedente all'ultima modifica */
    undo() {
      const h = history.pop();
      if (!h) return null;
      state = normalizeState(JSON.parse(h.json));
      commit();
      return h.label;
    },
    canUndo: () => history.length > 0,
    /**
     * Unione per la sincronizzazione tra dispositivi: per ogni voce vince la modifica più recente,
     * le eliminazioni si propagano. Ritorna { added, changed, removed } rispetto ai dati locali.
     */
    syncMerge(remoteRaw) {
      const r = normalizeState(remoteRaw);
      const before = JSON.stringify(state);
      const del = { ...r.deleted };
      for (const [id, at] of Object.entries(state.deleted)) if (!del[id] || at > del[id]) del[id] = at;
      const stats = { added: 0, changed: 0, removed: 0 };
      for (const t of Schema.LOG_TYPES) {
        const map = new Map(state.logs[t].map(e => [e.id, e]));
        for (const e of r.logs[t]) {
          const cur = map.get(e.id);
          if (!cur) { map.set(e.id, e); stats.added++; }
          else if ((e._m || '') > (cur._m || '')) { map.set(e.id, e); stats.changed++; }
        }
        for (const [id, e] of map) if (del[id] && del[id] >= (e._m || '')) { map.delete(id); if (state.logs[t].some(x => x.id === id)) stats.removed++; else stats.added--; }
        state.logs[t] = sortLog(t, [...map.values()]);
      }
      state.deleted = del;
      if ((r.profileAt || '') > (state.profileAt || '')) { state.profile = r.profile; state.profileAt = r.profileAt; stats.changed++; }
      syncProfileFromGrowth();
      if (JSON.stringify(state) !== before) { remember('Sincronizzazione'); history[history.length - 1].json = before; commit(); }
      return stats;
    },
    exportJSON(extra = {}) { return JSON.stringify({ ...state, app: 'SNAKEcheck', exportedAt: new Date().toISOString(), ...extra }, null, 2); },
    /** Metadati locali (non fanno parte del backup): ultimo backup, notifiche inviate, traguardi */
    meta(patch) {
      let m = {};
      try { m = JSON.parse(localStorage.getItem(META_KEY) || '{}') || {}; } catch (e) { m = {}; }
      if (patch) { m = { ...m, ...patch }; try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) { console.warn(e); } }
      return m;
    }
  };
})();

/* ==========================================================================
   DB — IndexedDB per copie di sicurezza e foto (più spazio del localStorage)
   ========================================================================== */
const DB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!('indexedDB' in window)) { rej(new Error('IndexedDB non disponibile')); return; }
      const r = indexedDB.open('snakecheck', 1);
      r.onupgradeneeded = () => { const d = r.result; ['snapshots', 'photos', 'kv'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('database bloccato'));
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const req = fn(t.objectStore(store));
      let out;
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('operazione annullata'));
    });
  }
  return {
    all: s => tx(s, 'readonly', st => st.getAll()),
    get: (s, id) => tx(s, 'readonly', st => st.get(id)),
    put: (s, v) => tx(s, 'readwrite', st => st.put(v)),
    del: (s, id) => tx(s, 'readwrite', st => st.delete(id)),
    clear: s => tx(s, 'readwrite', st => st.clear())
  };
})();

/* ==========================================================================
   Safety — archiviazione persistente e copie di sicurezza automatiche
   ========================================================================== */
const Safety = (() => {
  const MAX = 6;
  const LS_FALLBACK = 'snakecheck.snapshots';
  let persistAsked = false;
  let persisted = null;

  /** Chiede al browser di non cancellare i dati dell'app quando serve spazio */
  async function requestPersist() {
    if (persistAsked || !navigator.storage || !navigator.storage.persist) return;
    persistAsked = true;
    try {
      persisted = await navigator.storage.persisted();
      if (!persisted) persisted = await navigator.storage.persist();
    } catch (e) { persisted = false; }
  }
  async function status() {
    const out = { supported: !!(navigator.storage && navigator.storage.persist), persisted: null, usage: null, quota: null };
    try {
      if (navigator.storage && navigator.storage.persisted) out.persisted = await navigator.storage.persisted();
      if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); out.usage = e.usage; out.quota = e.quota; }
    } catch (e) { /* non disponibile */ }
    return out;
  }

  const lsList = () => { try { return JSON.parse(localStorage.getItem(LS_FALLBACK) || '[]'); } catch (e) { return []; } };

  /** Salva una copia dello stato attuale. Non fa nulla se non ci sono dati. */
  async function snapshot(reason) {
    if (Store.isEmpty()) return null;
    const snap = { id: String(Date.now()), at: new Date().toISOString(), reason, count: Store.count(), name: Store.get().profile.nome || '', json: JSON.stringify(Store.get()) };
    try {
      await DB.put('snapshots', snap);
      const all = (await DB.all('snapshots')).sort((a, b) => b.id.localeCompare(a.id));
      for (const old of all.slice(MAX)) await DB.del('snapshots', old.id);
    } catch (e) {
      try { const l = [snap, ...lsList()].slice(0, 3); localStorage.setItem(LS_FALLBACK, JSON.stringify(l)); } catch (e2) { console.warn('Copia di sicurezza non salvata', e2); return null; }
    }
    return snap;
  }
  async function list() {
    let l = [];
    try { l = await DB.all('snapshots'); } catch (e) { l = lsList(); }
    return l.sort((a, b) => b.id.localeCompare(a.id));
  }
  async function get(id) {
    try { const s = await DB.get('snapshots', id); if (s) return s; } catch (e) { /* fallback */ }
    return lsList().find(s => s.id === id) || null;
  }
  /** Copia automatica settimanale all'avvio */
  async function weekly() {
    const l = await list();
    if (!l.length || Date.now() - +l[0].id > 7 * Utils.DAY) await snapshot('Copia automatica settimanale');
  }
  const backupAge = () => { const m = Store.meta(); return m.lastBackupAt ? Utils.daysSince(m.lastBackupAt.slice(0, 10)) : null; };
  const markBackup = () => Store.meta({ lastBackupAt: new Date().toISOString() });

  return { requestPersist, status, snapshot, list, get, weekly, backupAge, markBackup, isPersisted: () => persisted };
})();

/* ==========================================================================
   Logic — calcoli di dominio: stato pasti, muta, acqua, clima, alert
   ========================================================================== */
const Logic = (() => {
  const P = () => Store.get().profile;
  const L = () => Store.get().logs;
  const today = () => Utils.todayISO();

  const currentWeight = () => { const g = L().growth.find(x => x.peso !== null); return g ? g.peso : Utils.num(P().pesoAttuale); };
  const currentLength = () => { const g = L().growth.find(x => x.lunghezza !== null); return g ? g.lunghezza : Utils.num(P().lunghezzaAttuale); };
  const weightAt = date => {
    const prev = L().growth.find(g => g.peso !== null && g.data <= date);
    if (prev) return prev.peso;
    const first = [...L().growth].reverse().find(g => g.peso !== null);
    return first ? first.peso : Utils.num(P().pesoAttuale);
  };
  const ratio = (prey, snake) => {
    const a = Utils.num(prey), b = Utils.num(snake);
    return a !== null && b !== null && b > 0 ? Utils.round(a / b * 100, 1) : null;
  };
  const ratioStatus = r => r === null ? 'neutral' : r > 20 ? 'bad' : (r > 15 || r < 8) ? 'warn' : 'ok';
  const ratioLabel = r => r === null ? '' : r > 20 ? 'troppo grande' : r > 15 ? 'abbondante' : r < 8 ? 'piccola' : 'ideale';

  /* ---------- Brumazione ---------- */
  function brumState() {
    const p = P(), t = today();
    const start = p.brumInizio, end = p.brumFine;
    if (!start) return { active: false, upcoming: null, recent: null, start: '', end: '' };
    const active = t >= start && (!end || t <= end);
    const upcoming = !active && t < start ? Utils.daysBetween(t, start) : null;
    const recent = !active && end && t > end ? Utils.daysBetween(end, t) : null;
    return { active, upcoming, recent, start, end, days: active ? Utils.daysBetween(start, t) : null };
  }

  /* ---------- Soglie ambientali ---------- */
  const RANGES = {
    tempCalda: { label: 'Zona calda', unit: '°C', icon: 'flame', min: 'tempCaldaMin', max: 'tempCaldaMax' },
    tempFredda: { label: 'Zona fredda', unit: '°C', icon: 'snow', min: 'tempFreddaMin', max: 'tempFreddaMax' },
    umidita: { label: 'Umidità', unit: '%', icon: 'drop', min: 'umiditaMin', max: 'umiditaMax' },
    tempNotte: { label: 'Notte', unit: '°C', icon: 'moon', min: 'tempNotteMin', max: 'tempNotteMax', optional: true }
  };
  const ENV_KEYS = Object.keys(RANGES);
  const range = k => {
    const r = RANGES[k];
    if (k !== 'umidita' && brumState().active) return { ...r, lo: Utils.num(P().brumTempMin), hi: Utils.num(P().brumTempMax), brum: true };
    return { ...r, lo: Utils.num(P()[r.min]), hi: Utils.num(P()[r.max]) };
  };
  const evalParam = (k, value) => {
    const v = Utils.num(value);
    if (v === null) return { status: 'neutral', label: '—' };
    const { lo, hi } = range(k);
    if (lo !== null && v < lo) return { status: 'bad', label: 'Basso' };
    if (hi !== null && v > hi) return { status: 'bad', label: 'Alto' };
    const margin = k === 'umidita' ? 3 : 0.5;
    if ((lo !== null && v - lo < margin) || (hi !== null && hi - v < margin)) return { status: 'warn', label: 'Al limite' };
    return { status: 'ok', label: 'Ottimale' };
  };
  /** Ultimo valore registrato per ogni parametro (le letture da sensore possono averne solo uno) */
  function envNow() {
    const out = { latest: L().env[0] || null };
    for (const k of ENV_KEYS) {
      const e = L().env.find(x => x[k] !== null && x[k] !== undefined && x[k] !== '');
      out[k] = e ? { v: Utils.num(e[k]), dt: e.datetime } : null;
    }
    return out;
  }

  /* ---------- Muta ---------- */
  const shedState = () => {
    const last = L().shed[0];
    if (!last) return { inShed: false, last: null, days: null };
    const inShed = last.esito === 'In corso';
    return { inShed, last, days: inShed ? Utils.daysSince(last.dataInizio) : Utils.daysSince(last.dataFine || last.dataInizio) };
  };
  const inShedOn = date => L().shed.some(s => date >= s.dataInizio && date <= (s.dataFine || (s.esito === 'In corso' ? today() : s.dataInizio)));
  /** Umidità media nei 7 giorni prima della fine (o dell'inizio) di una muta */
  function shedHumidity(s) {
    const end = s.dataFine || s.dataInizio;
    const from = Utils.toISODate(Utils.addDays(Utils.parse(end), -7));
    const v = L().env.filter(e => e.umidita !== null && e.datetime.slice(0, 10) >= from && e.datetime.slice(0, 10) <= end).map(e => e.umidita);
    return v.length ? Utils.round(v.reduce((a, b) => a + b, 0) / v.length, 0) : null;
  }

  /* ---------- Pasti ---------- */
  /** Intervallo consigliato in base a peso (preferito) o età */
  function suggestedInterval() {
    const w = currentWeight(), m = Utils.monthsSince(P().dataNascita);
    const by = w !== null ? (w < 25 ? 0 : w < 80 ? 1 : w < 250 ? 2 : 3) : m !== null ? (m < 4 ? 0 : m < 12 ? 1 : m < 24 ? 2 : 3) : null;
    const T = [
      { days: 6, stage: 'piccolo', span: '5–7' },
      { days: 8, stage: 'giovane', span: '7–10' },
      { days: 11, stage: 'subadulto', span: '10–12' },
      { days: 13, stage: 'adulto', span: '12–14' }
    ];
    if (by === null) return { days: 7, stage: 'non noto', span: '7', basis: 'nessun dato' };
    return { ...T[by], basis: w !== null ? `peso ${Utils.fmtNum(w, 'g')}` : `età ${m} mesi` };
  }
  const targetInterval = () => P().intervalloAuto ? suggestedInterval().days : Math.max(1, Utils.num(P().intervalloPasti) || 7);

  const feedingState = () => {
    const target = targetInterval();
    const lastEaten = L().feeding.find(f => f.esito === 'Mangiato') || null;
    const lastAny = L().feeding[0] || null;
    const brum = brumState(), shed = shedState();
    const paused = brum.active ? 'brumazione' : shed.inShed ? 'muta' : null;
    if (!lastEaten) return { target, lastEaten, lastAny, days: null, remaining: null, status: 'neutral', paused, next: null };
    const days = Utils.daysSince(lastEaten.data);
    const remaining = target - days;
    const status = paused ? 'info' : remaining > 0 ? 'ok' : remaining === 0 ? 'warn' : (-remaining > 3 ? 'bad' : 'warn');
    const next = Utils.toISODate(Utils.addDays(Utils.parse(lastEaten.data), target));
    return { target, lastEaten, lastAny, days, remaining, status, paused, next };
  };
  /** Rifiuti consecutivi più recenti, esclusi quelli in muta o in brumazione */
  function refusals() {
    const b = P();
    let n = 0;
    for (const f of L().feeding) {
      if (f.esito === 'Mangiato') break;
      if (f.esito !== 'Rifiutato') continue;
      const inBrum = b.brumInizio && f.data >= b.brumInizio && (!b.brumFine || f.data <= b.brumFine);
      if (inShedOn(f.data) || inBrum) continue;
      n++;
    }
    return n;
  }
  /** Ultimo pasto consumato da ripetere con un tocco */
  const lastMealTemplate = () => L().feeding.find(f => f.esito === 'Mangiato') || L().feeding[0] || null;

  /* ---------- Acqua e pulizia ---------- */
  const dueState = (last, target) => {
    if (!last) return { target, last, days: null, remaining: null, status: 'neutral' };
    const days = Utils.daysSince(last.data), remaining = target - days;
    return { target, last, days, remaining, status: remaining > 0 ? 'ok' : remaining === 0 ? 'warn' : 'bad' };
  };
  const waterState = () => dueState(L().maintenance.find(m => m.tipo === 'Cambio acqua') || null, Math.max(1, Utils.num(P().intervalloAcqua) || 3));
  const cleanState = () => dueState(L().maintenance.find(m => m.tipo === 'Spot cleaning' || m.tipo === 'Pulizia profonda') || null, Math.max(1, Utils.num(P().intervalloPulizia) || 7));

  /* ---------- Peso ---------- */
  const weightTrend = () => {
    const ws = L().growth.filter(g => g.peso !== null);
    if (ws.length < 2) return null;
    const last = ws[0];
    const ref = ws.find(g => Utils.daysBetween(g.data, last.data) >= 25) || ws[ws.length - 1];
    const days = Utils.daysBetween(ref.data, last.data);
    if (!days) return null;
    return { diff: Utils.round(last.peso - ref.peso, 1), days, perMonth: Utils.round((last.peso - ref.peso) / days * 30, 1) };
  };
  /** Calo rispetto al massimo degli ultimi 30 giorni */
  function weightLoss() {
    const ws = L().growth.filter(g => g.peso !== null);
    if (ws.length < 2) return null;
    const last = ws[0];
    const prev = ws.slice(1).filter(g => { const d = Utils.daysBetween(g.data, last.data); return d !== null && d > 0 && d <= 30; });
    if (!prev.length) return null;
    const max = prev.reduce((a, g) => g.peso > a.peso ? g : a, prev[0]);
    const pct = (max.peso - last.peso) / max.peso * 100;
    return pct > 0 ? { pct: Utils.round(pct, 1), from: max, to: last, days: Utils.daysBetween(max.data, last.data) } : null;
  }
  /** Fascia di peso indicativa per età (mesi), da letteratura amatoriale: solo orientativa */
  const REF = [[0, 5, 9], [3, 10, 25], [6, 18, 50], [9, 35, 90], [12, 60, 150], [18, 110, 260], [24, 180, 400], [36, 300, 650], [48, 350, 900]];
  function expectedWeight(months) {
    if (months === null || months < 0) return null;
    for (let i = 1; i < REF.length; i++) {
      if (months <= REF[i][0]) { const a = REF[i - 1], b = REF[i], t = (months - a[0]) / (b[0] - a[0]); return { min: Utils.round(a[1] + (b[1] - a[1]) * t, 0), max: Utils.round(a[2] + (b[2] - a[2]) * t, 0) }; }
    }
    return { min: REF[REF.length - 1][1], max: REF[REF.length - 1][2] };
  }
  function monthsAt(date) {
    const b = Utils.parse(P().dataNascita), d = Utils.parse(date);
    if (!b || !d || d < b) return null;
    return (d - b) / Utils.DAY / 30.44;
  }

  /* ---------- Salute ---------- */
  function medState(e) {
    const t = today();
    const active = t >= e.dataInizio && (!e.dataFine || t <= e.dataFine);
    const ended = e.dataFine && t > e.dataFine;
    const lastDose = (e.dosi && e.dosi[0]) || null;
    const every = Math.max(1, Utils.num(e.ogniGiorni) || 1);
    const next = lastDose ? Utils.toISODate(Utils.addDays(Utils.parse(lastDose), every)) : e.dataInizio;
    const dueIn = Utils.daysBetween(t, next);
    const doneToday = lastDose === t;
    return { active, ended, lastDose, next, dueIn, doneToday, every, due: active && !doneToday && dueIn <= 0 };
  }
  const activeMeds = () => L().med.filter(e => medState(e).active);
  const openSymptoms = () => L().symptom.filter(s => s.stato === 'Aperto');

  /* ---------- Alert (memorizzati per revisione dei dati e giorno) ---------- */
  let cache = { key: '', list: [] };
  function alerts() {
    const key = `${Store.rev}|${today()}`;
    if (cache.key === key) return cache.list;
    const list = computeAlerts();
    cache = { key, list };
    return list;
  }

  function computeAlerts() {
    const out = [];
    const now = envNow(), shed = shedState(), feed = feedingState(), water = waterState(), clean = cleanState(), brum = brumState();
    const p = P();

    // Brumazione
    if (brum.active) out.push({ level: 'info', icon: 'moon', title: `Brumazione in corso${brum.days !== null ? ` da ${Utils.plural(brum.days, 'giorno', 'giorni')}` : ''}`, text: `Pasti sospesi, soglie invernali ${Utils.fmtNum(p.brumTempMin)}–${Utils.fmtNum(p.brumTempMax)} °C.${brum.end ? ` Fine prevista ${Utils.fmtDate(brum.end)}.` : ''} Lascia sempre l'acqua fresca.`, action: { label: 'Impostazioni', kind: 'nav', to: 'impostazioni' } });
    else if (brum.upcoming !== null && brum.upcoming <= 14) out.push({ level: 'info', icon: 'moon', title: `Brumazione tra ${Utils.plural(brum.upcoming, 'giorno', 'giorni')}`, text: 'Smetti di alimentare 10–14 giorni prima, così l\'intestino si svuota. Poi abbassa le temperature gradualmente.' });
    else if (brum.recent !== null && brum.recent <= 21) out.push({ level: 'info', icon: 'sun', title: 'Ripresa dopo la brumazione', text: 'Riporta le temperature normali per 7–10 giorni prima del primo pasto, poi offri prede più piccole del solito.' });

    // Ambiente
    if (now.latest) {
      for (const k of ENV_KEYS) {
        const cur = now[k];
        if (!cur) continue;
        if (Utils.daysSince(cur.dt) > 3) continue;
        const ev = evalParam(k, cur.v), r = range(k);
        if (ev.status === 'bad') {
          out.push({ level: 'bad', icon: r.icon, title: `${r.label} ${ev.label === 'Alto' ? 'troppo alta' : 'troppo bassa'}: ${Utils.fmtNum(cur.v, r.unit)}`, text: `Range ${r.brum ? 'invernale' : 'ottimale'} ${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit} · lettura ${Utils.relTime(cur.dt)}`, action: { label: 'Nuova lettura', kind: 'form', type: 'env' } });
        }
      }
      const age = Utils.daysSince(now.latest.datetime);
      if (age !== null && age >= 3) out.push({ level: 'warn', icon: 'gauge', title: `Nessuna lettura da ${age} giorni`, text: 'Controlla termometro e igrometro.', action: { label: 'Registra', kind: 'form', type: 'env' } });
    } else {
      out.push({ level: 'info', icon: 'gauge', title: 'Nessuna lettura ambientale', text: 'Registra temperatura e umidità per attivare il monitoraggio.', action: { label: 'Registra', kind: 'form', type: 'env' } });
    }

    // Pasti
    if (!brum.active) {
      if (feed.lastEaten) {
        if (feed.remaining < 0) {
          const late = -feed.remaining;
          if (shed.inShed) out.push({ level: 'info', icon: 'shed', title: `Pasto rimandato: è in muta`, text: 'In fase opaca il rifiuto è normale: riprova a muta completata.', action: { label: 'Registra pasto', kind: 'form', type: 'feeding' } });
          else out.push({ level: late > 3 ? 'bad' : 'warn', icon: 'mouse', title: `Pasto in ritardo di ${Utils.plural(late, 'giorno', 'giorni')}`, text: `Ultimo pasto ${Utils.relDays(feed.days)} · ogni ${feed.target} giorni${p.intervalloAuto ? ' (consigliato per ' + suggestedInterval().stage + ')' : ''}`, action: { label: 'Ha mangiato', kind: 'meal' } });
        } else if (feed.remaining === 0) {
          out.push({ level: 'warn', icon: 'mouse', title: 'Pasto previsto oggi', text: shed.inShed ? 'È in muta: possibile rifiuto, valuta di posticipare.' : `Ogni ${feed.target} giorni`, action: { label: 'Ha mangiato', kind: 'meal' } });
        }
      } else if (L().feeding.length) {
        out.push({ level: 'warn', icon: 'mouse', title: 'Nessun pasto consumato nel registro', text: 'Tutti i pasti risultano rifiutati o rigurgitati.', action: { label: 'Registra pasto', kind: 'form', type: 'feeding' } });
      } else {
        out.push({ level: 'info', icon: 'mouse', title: 'Nessun pasto registrato', text: 'Registra il primo pasto per il conto alla rovescia.', action: { label: 'Registra', kind: 'form', type: 'feeding' } });
      }
      const ref = refusals();
      if (ref >= 3) out.push({ level: 'bad', icon: 'ban', title: `${ref} rifiuti di fila fuori dalla muta`, text: 'Controlla temperature, nascondigli e fonti di stress. Se continua, senti un veterinario per rettili.', action: { label: 'Vedi pasti', kind: 'nav', to: 'alimentazione' } });
      else if (ref === 2) out.push({ level: 'info', icon: 'ban', title: '2 rifiuti di fila', text: 'Può capitare. Al terzo rifiuto fuori dalla muta conviene approfondire.' });
    }
    const reg = L().feeding.find(f => f.esito === 'Rigurgitato');
    if (reg && Utils.daysSince(reg.data) <= 14) out.push({ level: 'bad', icon: 'alert', title: `Rigurgito ${Utils.relDays(Utils.daysSince(reg.data))}`, text: 'Attendi 10–14 giorni, poi offri una preda più piccola. Evita l\'handling.' });

    // Peso
    const loss = weightLoss();
    if (loss && !brum.active) {
      if (loss.pct >= 10) out.push({ level: 'bad', icon: 'scale', title: `Calo di peso del ${Utils.fmtNum(loss.pct, '%')}`, text: `Da ${Utils.fmtNum(loss.from.peso, 'g')} a ${Utils.fmtNum(loss.to.peso, 'g')} in ${Utils.plural(loss.days, 'giorno', 'giorni')}. Un calo oltre il 10% in un mese merita una visita veterinaria.`, action: { label: 'Vedi crescita', kind: 'nav', to: 'alimentazione', tab: 'growth' } });
      else if (loss.pct >= 6) out.push({ level: 'warn', icon: 'scale', title: `Peso in calo del ${Utils.fmtNum(loss.pct, '%')}`, text: `In ${Utils.plural(loss.days, 'giorno', 'giorni')}. Tieni d'occhio le prossime pesate.` });
    }

    // Muta
    if (shed.inShed && shed.days !== null && shed.days > 14) {
      out.push({ level: 'warn', icon: 'shed', title: `Muta in corso da ${shed.days} giorni`, text: 'Di solito dura 7–14 giorni. Controlla l\'umidità e offri una camera umida.', action: { label: 'Segna completata', kind: 'edit', type: 'shed', id: shed.last.id, presets: { esito: 'Completa', dataFine: today() } } });
    }
    if (shed.last && !shed.inShed && shed.days !== null && shed.days <= 14) {
      if (shed.last.occhi === 'Rimasti sugli occhi') out.push({ level: 'bad', icon: 'eye', title: 'Occhialini rimasti dopo la muta', text: 'Non toglierli a forza: alza l\'umidità e offri una camera umida. Se restano dopo la prossima muta, senti il veterinario.' });
      else if (shed.last.esito === 'Incompleta / a pezzi') {
        const h = shedHumidity(shed.last);
        out.push({ level: 'warn', icon: 'shed', title: 'Ultima muta incompleta', text: `Controlla che non restino residui su occhi e punta della coda.${h !== null && h < (Utils.num(p.umiditaMin) || 40) + 10 ? ` Umidità media nella settimana prima: ${h}%, prova a portarla verso il 60% in pre-muta.` : ''}` });
      }
    }

    // Salute
    for (const s of openSymptoms().slice(0, 3)) out.push({ level: s.gravita === 'Lieve' ? 'warn' : 'bad', icon: 'symptom', title: `Sintomo aperto: ${s.area.toLowerCase()}`, text: `${s.gravita} · dal ${Utils.fmtDate(s.data)}${s.note ? ' · ' + s.note.slice(0, 80) : ''}`, action: { label: 'Aggiorna', kind: 'edit', type: 'symptom', id: s.id } });
    for (const m of L().med) {
      const st = medState(m);
      if (st.due) out.push({ level: st.dueIn < 0 ? 'bad' : 'warn', icon: 'pill', title: `${st.dueIn < 0 ? 'Dose in ritardo' : 'Dose da dare oggi'}: ${m.farmaco}`, text: `${m.dose ? m.dose + ' · ' : ''}una dose ogni ${Utils.plural(st.every, 'giorno', 'giorni')}${st.lastDose ? ` · ultima ${Utils.relDays(Utils.daysSince(st.lastDose))}` : ''}`, action: { label: 'Dose data', kind: 'dose', id: m.id } });
    }
    const w = L().waste.find(x => x.aspetto !== 'Normale' && Utils.daysSince(x.data) <= 7);
    if (w) out.push({ level: /sangue/i.test(w.aspetto) ? 'bad' : 'warn', icon: 'waste', title: `Evacuazione anomala: ${w.aspetto.toLowerCase()}`, text: `${Utils.cap(Utils.relDays(Utils.daysSince(w.data)))}. Se si ripete o compaiono altri sintomi, senti il veterinario.` });
    const lastPoop = L().waste.find(x => x.tipo !== 'Solo urati');
    if (lastPoop && feed.lastEaten && feed.lastEaten.data > lastPoop.data && Utils.daysSince(lastPoop.data) > 21 && !brum.active) out.push({ level: 'info', icon: 'waste', title: `Nessuna feci registrata da ${Utils.daysSince(lastPoop.data)} giorni`, text: 'Dopo il pasto di solito evacua entro 1–2 settimane. Verifica temperature e idratazione.' });
    const vetNext = L().vet.filter(v => v.controllo).map(v => v.controllo).sort().find(d => d >= Utils.toISODate(Utils.addDays(new Date(), -30)));
    if (vetNext) {
      const d = Utils.daysBetween(today(), vetNext);
      if (d !== null && d <= 7) out.push({ level: d < 0 ? 'warn' : 'info', icon: 'vet', title: d < 0 ? `Controllo veterinario scaduto da ${Utils.plural(-d, 'giorno', 'giorni')}` : d === 0 ? 'Controllo veterinario oggi' : `Controllo veterinario tra ${Utils.plural(d, 'giorno', 'giorni')}`, text: Utils.fmtDate(vetNext), action: { label: 'Registra visita', kind: 'form', type: 'vet' } });
    }

    // Acqua e pulizia
    if (water.last) {
      if (water.remaining < 0) out.push({ level: 'bad', icon: 'drop', title: `Cambio acqua in ritardo di ${Utils.plural(-water.remaining, 'giorno', 'giorni')}`, text: `Ultimo cambio ${Utils.relDays(water.days)} · ogni ${water.target} giorni`, action: { label: 'Fatto oggi', kind: 'water' } });
      else if (water.remaining === 0) out.push({ level: 'warn', icon: 'drop', title: 'Cambio acqua previsto oggi', text: `Ogni ${water.target} giorni`, action: { label: 'Fatto oggi', kind: 'water' } });
    } else {
      out.push({ level: 'info', icon: 'drop', title: 'Nessun cambio acqua registrato', text: 'Registralo per attivare il promemoria.', action: { label: 'Fatto oggi', kind: 'water' } });
    }
    if (clean.last && clean.remaining < 0) out.push({ level: 'warn', icon: 'sparkles', title: `Pulizia in ritardo di ${Utils.plural(-clean.remaining, 'giorno', 'giorni')}`, text: `Rimozione feci e pulizia localizzata ogni ${clean.target} giorni`, action: { label: 'Fatta oggi', kind: 'clean' } });

    const lastH = L().handling[0];
    if (lastH && feed.lastEaten) {
      const d = Utils.daysBetween(feed.lastEaten.data, lastH.data);
      if (d !== null && d >= 0 && d < 2 && Utils.daysSince(lastH.data) <= 2) out.push({ level: 'warn', icon: 'hand', title: 'Handling entro 48 ore dal pasto', text: 'Lascia digerire almeno 48 ore per evitare rigurgiti.' });
    }

    // Scorte del congelatore
    if (L().stock.length) {
      const st = stockState();
      if (st.cur && st.cur.left <= st.min) out.push({ level: st.cur.left === 0 ? 'bad' : 'warn', icon: 'box', title: st.cur.left === 0 ? `Finiti i ${st.cur.preda.toLowerCase()} nel congelatore` : `Restano ${Utils.plural(st.cur.left, st.cur.preda.toLowerCase(), st.cur.preda.toLowerCase())}`, text: st.cur.left ? `Bastano per circa ${Utils.plural(st.cur.days, 'giorno', 'giorni')}: è ora di riordinare.` : 'Registra un nuovo acquisto quando li compri.', action: { label: 'Scorte', kind: 'nav', to: 'gestione', tab: 'scorte' } });
      if (st.sizeUp) out.push({ level: 'info', icon: 'zap', title: `È quasi ora dei ${st.sizeUp.toLowerCase()}`, text: `Con ${Utils.fmtNum(currentWeight(), 'g')} la preda ideale è un ${st.sizeUp.toLowerCase()}: tienilo presente al prossimo acquisto.`, action: { label: 'Scorte', kind: 'nav', to: 'gestione', tab: 'scorte' } });
    }

    // Backup
    if (Store.count() >= 5) {
      const age = Safety.backupAge();
      if (age === null || age >= 30) out.push({ level: 'info', icon: 'shield', title: age === null ? 'Non hai ancora esportato un backup' : `Ultimo backup ${age} giorni fa`, text: 'I dati vivono solo in questo browser: salva una copia sul telefono o sul PC.', action: { label: 'Esporta ora', kind: 'export' } });
    }

    const order = { bad: 0, warn: 1, info: 2 };
    return out.sort((a, b) => order[a.level] - order[b.level]);
  }

  /* ---------- Scorte del congelatore ---------- */
  const PREY_W = { Pinky: 2, Fuzzy: 4.5, Hopper: 8, 'Topo adulto': 20 };
  /** Taglia di preda consigliata: circa il 10–15% del peso del serpente */
  function preyForWeight(w) {
    if (w === null || w === undefined) return null;
    const target = w * .12;
    return Object.entries(PREY_W).sort((a, b) => Math.abs(Math.log(a[1] / target)) - Math.abs(Math.log(b[1] / target)))[0][0];
  }
  function stockState() {
    const out = [];
    const target = targetInterval();
    for (const p of Schema.OPTIONS.preda) {
      const buys = L().stock.filter(s => s.preda === p);
      if (!buys.length) continue;
      const start = buys.reduce((m, s) => s.data < m ? s.data : m, buys[0].data);
      const bought = buys.reduce((a, s) => a + (Utils.num(s.quantita) || 0), 0);
      const used = L().feeding.filter(f => f.preda === p && f.data >= start && f.statoPreda !== 'Vivo').length;
      const left = Math.max(0, bought - used);
      const lastBuy = buys.reduce((m, s) => s.data > m.data ? s : m, buys[0]);
      out.push({ preda: p, bought, used, left, lastBuy, days: left * target });
    }
    const current = (lastMealTemplate() || {}).preda || null;
    const suggested = preyForWeight(currentWeight());
    const order = Schema.OPTIONS.preda;
    const sizeUp = current && suggested && order.indexOf(suggested) > order.indexOf(current) ? suggested : null;
    return { items: out, current, suggested, sizeUp, min: Utils.num(P().scortaMin) ?? 4, cur: out.find(x => x.preda === current) || null };
  }

  /* ---------- Spese ---------- */
  function expenseSummary() {
    const items = [];
    L().expense.forEach(e => items.push({ data: e.data, cat: e.categoria, eur: Utils.num(e.importo) || 0, what: e.descrizione || e.categoria, src: 'expense', id: e.id }));
    L().stock.forEach(s => { const c = Utils.num(s.costo); if (c) items.push({ data: s.data, cat: 'Prede', eur: c, what: `${s.quantita} × ${s.preda}`, src: 'stock', id: s.id }); });
    L().vet.forEach(v => { const c = Utils.num(v.costo); if (c) items.push({ data: v.data, cat: 'Veterinario e farmaci', eur: c, what: v.motivo, src: 'vet', id: v.id }); });
    const t = today(), ym = t.slice(0, 7), y = t.slice(0, 4);
    const sum = arr => Math.round(arr.reduce((a, x) => a + x.eur, 0) * 100) / 100;
    const byCat = {};
    items.filter(x => x.data.startsWith(y)).forEach(x => { byCat[x.cat] = (byCat[x.cat] || 0) + x.eur; });
    const months = [];
    for (let i = 11; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const k = Utils.toISODate(d).slice(0, 7); months.push({ k, eur: sum(items.filter(x => x.data.startsWith(k))) }); }
    const first = items.reduce((m, x) => !m || x.data < m ? x.data : m, '');
    const spanM = first ? Math.max(1, (monthsBetween(first, t) || 0) + 1) : 1;
    return { items: items.sort((a, b) => b.data.localeCompare(a.data)), total: sum(items), month: sum(items.filter(x => x.data.startsWith(ym))), year: sum(items.filter(x => x.data.startsWith(y))), byCat, months, perMonth: Math.round(sum(items) / spanM * 100) / 100 };
  }
  const monthsBetween = (a, b) => { const x = Utils.parse(a), z = Utils.parse(b); return x && z ? (z.getFullYear() - x.getFullYear()) * 12 + z.getMonth() - x.getMonth() : null; };

  /* ---------- Storia della vita del serpente ---------- */
  function lifeEvents() {
    const l = L(), p = P(), ev = [];
    const push = (date, icon, color, title, text = '', kind = '') => { if (date && Utils.isValidDate(date)) ev.push({ date: date.slice(0, 10), icon, color, title, text, kind }); };
    push(p.dataNascita, 'cake', '#f472b6', `${p.nome || 'Il serpente'} nasce`, p.morph ? `Morph ${p.morph}` : '', 'big');
    push(p.dataArrivo, 'home', '#3ddc97', 'Arriva a casa', p.terrarioDimensioni ? `Terrario ${p.terrarioDimensioni}` : '', 'big');
    const eaten = [...l.feeding].filter(f => f.esito === 'Mangiato').sort((a, b) => a.data.localeCompare(b.data));
    if (eaten[0]) push(eaten[0].data, 'mouse', '#fbbf24', 'Primo pasto registrato', `${eaten[0].preda}${Utils.num(eaten[0].pesoPreda) !== null ? ' da ' + Utils.fmtNum(eaten[0].pesoPreda, 'g') : ''}`);
    const seen = new Set(eaten[0] ? [eaten[0].preda] : []);
    eaten.forEach(f => { if (!seen.has(f.preda)) { seen.add(f.preda); push(f.data, 'zap', '#fbbf24', `Passa ai ${f.preda.toLowerCase()}`, `${Utils.fmtNum(f.pesoPreda, 'g')} di preda`, 'big'); } });
    const MIL = [10, 25, 50, 100, 150, 200, 300, 400, 500, 750, 1000];
    const gr = [...l.growth].filter(g => g.peso !== null).sort((a, b) => a.data.localeCompare(b.data));
    let prevW = gr[0] ? gr[0].peso : null;
    gr.slice(1).forEach(g => { const m = MIL.filter(x => prevW < x && g.peso >= x).pop(); if (m) push(g.data, 'scale', '#818cf8', `Supera i ${m} grammi`, `Pesata: ${Utils.fmtNum(g.peso, 'g')}`, 'big'); prevW = Math.max(prevW, g.peso); });
    const sh = [...l.shed].filter(s => s.esito !== 'In corso').sort((a, b) => (a.dataFine || a.dataInizio).localeCompare(b.dataFine || b.dataInizio));
    sh.forEach((s, i) => push(s.dataFine || s.dataInizio, 'shed', '#4ade80', `${i + 1}ª muta`, `${s.esito}${s.occhi ? ' · occhialini ' + s.occhi.toLowerCase() : ''}`));
    l.vet.forEach(v => push(v.data, 'vet', '#60a5fa', 'Visita veterinaria', v.motivo));
    l.symptom.filter(x => x.gravita !== 'Lieve').forEach(x => push(x.data, 'symptom', '#fb7185', `Problema: ${x.area.toLowerCase()}`, `${x.gravita} · ${x.stato}`));
    if (p.brumInizio) push(p.brumInizio, 'moon', '#a5b4fc', 'Inizia la brumazione', p.brumFine ? `fino al ${Utils.fmtDate(p.brumFine)}` : '');
    return ev.filter(e => e.date <= today()).sort((a, b) => a.date.localeCompare(b.date));
  }

  /* ---------- Cose da fare oggi ---------- */
  function todayTasks() {
    const t = today(), tasks = [];
    const feed = feedingState(), water = waterState(), clean = cleanState(), now = envNow();
    const fedToday = L().feeding.find(f => f.data === t);
    if (fedToday) tasks.push({ id: 'meal', icon: 'mouse', title: fedToday.esito === 'Mangiato' ? 'Pasto dato' : `Pasto: ${fedToday.esito.toLowerCase()}`, sub: `${fedToday.preda}${Utils.num(fedToday.pesoPreda) !== null ? ' · ' + Utils.fmtNum(fedToday.pesoPreda, 'g') : ''}`, done: true });
    else if (!feed.paused && feed.remaining !== null && feed.remaining <= 0) tasks.push({ id: 'meal', icon: 'mouse', title: feed.remaining === 0 ? 'Pasto previsto oggi' : `Pasto in ritardo di ${Utils.plural(-feed.remaining, 'giorno', 'giorni')}`, sub: lastMealTemplate() ? `Come l'ultima volta: ${lastMealTemplate().preda}${Utils.num(lastMealTemplate().pesoPreda) !== null ? ' ' + Utils.fmtNum(lastMealTemplate().pesoPreda, 'g') : ''}` : 'Registra preda ed esito', level: feed.remaining < -3 ? 'bad' : 'warn', action: { kind: 'meal', label: 'Ha mangiato' } });
    for (const m of L().med) {
      const st = medState(m);
      if (st.doneToday) tasks.push({ id: 'med-' + m.id, icon: 'pill', title: `Dose data: ${m.farmaco}`, sub: m.dose || '', done: true });
      else if (st.due) tasks.push({ id: 'med-' + m.id, icon: 'pill', title: `Dose: ${m.farmaco}`, sub: m.dose || `ogni ${Utils.plural(st.every, 'giorno', 'giorni')}`, level: st.dueIn < 0 ? 'bad' : 'warn', action: { kind: 'dose', id: m.id, label: 'Data' } });
    }
    if (water.days === 0) tasks.push({ id: 'water', icon: 'drop', title: 'Acqua cambiata', sub: 'oggi', done: true });
    else if (water.remaining === null || water.remaining <= 0) tasks.push({ id: 'water', icon: 'drop', title: 'Cambia l\'acqua', sub: water.last ? `ultimo cambio ${Utils.relDays(water.days)}` : 'nessun cambio registrato', level: water.remaining !== null && water.remaining < 0 ? 'bad' : 'warn', action: { kind: 'water', label: 'Fatto' } });
    const readToday = L().env.find(e => e.datetime.slice(0, 10) === t);
    if (readToday) tasks.push({ id: 'env', icon: 'thermo', title: 'Clima controllato', sub: [now.tempCalda && Utils.fmtNum(now.tempCalda.v, '°'), now.tempFredda && Utils.fmtNum(now.tempFredda.v, '°'), now.umidita && Utils.fmtNum(now.umidita.v, '%')].filter(Boolean).join(' · '), done: true });
    else tasks.push({ id: 'env', icon: 'thermo', title: 'Controlla temperature e umidità', sub: now.latest ? `ultima lettura ${Utils.relTime(now.latest.datetime)}` : 'nessuna lettura', level: 'info', action: { kind: 'form', type: 'env', label: 'Registra' } });
    if (clean.days === 0) tasks.push({ id: 'clean', icon: 'sparkles', title: 'Pulizia fatta', sub: 'oggi', done: true });
    else if (clean.remaining === null || clean.remaining <= 0) tasks.push({ id: 'clean', icon: 'sparkles', title: 'Rimuovi feci e sporco', sub: clean.last ? `ultima pulizia ${Utils.relDays(clean.days)}` : 'controlla il substrato', level: 'info', action: { kind: 'clean', label: 'Fatto' } });

    const pending = tasks.filter(x => !x.done).sort((a, b) => ({ bad: 0, warn: 1, info: 2 }[a.level] - { bad: 0, warn: 1, info: 2 }[b.level]));
    return { pending, done: tasks.filter(x => x.done) };
  }

  /** Frase principale della Home */
  function headline() {
    const feed = feedingState(), brum = brumState();
    if (brum.active) return { icon: 'moon', title: 'In brumazione', sub: brum.end ? `fino al ${Utils.fmtDate(brum.end)}` : 'pasti sospesi' };
    if (!feed.lastEaten) return { icon: 'mouse', title: 'Registra il primo pasto', sub: 'per il conto alla rovescia' };

    if (r === 0) return { icon: 'mouse', title: 'Pasto previsto oggi', sub: `ogni ${feed.target} giorni` };
    return { icon: 'mouse', title: `Pasto in ritardo di ${Utils.plural(-r, 'giorno', 'giorni')}`, sub: `previsto ${Utils.fmtDate(feed.next)}` };
  }

  /* ---------- Traguardi ---------- */
  function achievements() {
    const l = L(), p = P(), w = currentWeight();
    const eaten = l.feeding.filter(f => f.esito === 'Mangiato').length;
    const sheds = l.shed.filter(s => s.esito !== 'In corso').length;
    const since = p.dataArrivo ? Utils.daysSince(p.dataArrivo) : null;
    const A = [
      ['first-meal', 'mouse', 'Primo pasto', 'Il primo pasto registrato', eaten >= 1],
      ['meals-25', 'mouse', '25 pasti', 'Venticinque pasti consumati', eaten >= 25],
      ['meals-100', 'mouse', '100 pasti', 'Cento pasti consumati', eaten >= 100],
      ['first-shed', 'shed', 'Prima muta', 'La prima muta registrata', sheds >= 1],
      ['sheds-10', 'shed', '10 mute', 'Dieci mute registrate', sheds >= 10],
      ['perfect-3', 'sparkles', 'Tris perfetto', 'Tre mute complete di fila', l.shed.filter(s => s.esito !== 'In corso').slice(0, 3).length === 3 && l.shed.filter(s => s.esito !== 'In corso').slice(0, 3).every(s => s.esito === 'Completa')],
      ['w-100', 'scale', '100 grammi', 'Ha superato i 100 g', w !== null && w >= 100],
      ['w-250', 'scale', '250 grammi', 'Ha superato i 250 g', w !== null && w >= 250],
      ['w-500', 'scale', '500 grammi', 'Ha superato i 500 g', w !== null && w >= 500],
      ['year-1', 'cake', 'Un anno insieme', 'Un anno dall\'arrivo', since !== null && since >= 365],
      ['year-3', 'cake', 'Tre anni insieme', 'Tre anni dall\'arrivo', since !== null && since >= 1095],
      ['env-100', 'thermo', '100 letture', 'Cento letture del clima', l.env.length >= 100],
      ['backup', 'shield', 'Al sicuro', 'Primo backup esportato', !!Store.meta().lastBackupAt]
    ];
    return A.map(([id, icon, title, desc, done]) => ({ id, icon, title, desc, done }));
  }

  return { preyForWeight, stockState, expenseSummary, lifeEvents, currentWeight, currentLength, weightAt, ratio, ratioStatus, ratioLabel, RANGES, ENV_KEYS, range, evalParam, envNow, shedState, inShedOn, shedHumidity, feedingState, suggestedInterval, targetInterval, refusals, lastMealTemplate, waterState, cleanState, weightTrend, weightLoss, expectedWeight, monthsAt, brumState, medState, activeMeds, openSymptoms, alerts, todayTasks, headline, achievements };
})();

/* ==========================================================================
   Toast — notifiche con barra di durata, chiusura e azione (es. Annulla)
   ========================================================================== */
const Toast = (() => {
  const ICONS = { ok: '✓', warn: '!', bad: '✕', info: 'i' };
  function show(msg, type = 'ok', { duration = 3800, action = null } = {}) {
    const host = document.getElementById('toasts');
    if (!host) return;
    while (host.children.length >= 4) host.firstElementChild.remove();
    const el = document.createElement('div');
    el.className = `toast t-${type}`;
    el.setAttribute('role', 'status');
    el.innerHTML = `<span class="badge b-${type === 'info' ? 'info' : type}" style="width:22px;padding:0;justify-content:center">${ICONS[type] || ''}</span>
      <span class="t-msg">${Utils.esc(msg)}</span>
      ${action ? `<button class="t-action">${Utils.esc(action.label)}</button>` : ''}
      <button class="t-close" aria-label="Chiudi notifica">✕</button>
      <span class="t-progress" style="animation-duration:${duration}ms"></span>`;
    host.appendChild(el);
    let timer = null, remaining = duration, started = Date.now();
    const close = () => { clearTimeout(timer); if (el.classList.contains('leaving')) return; el.classList.add('leaving'); setTimeout(() => el.remove(), 250); };
    const start = () => { started = Date.now(); timer = setTimeout(close, remaining); };
    el.addEventListener('mouseenter', () => { clearTimeout(timer); remaining -= Date.now() - started; el.classList.add('paused'); });
    el.addEventListener('mouseleave', () => { el.classList.remove('paused'); start(); });
    el.querySelector('.t-close').addEventListener('click', close);
    if (action) el.querySelector('.t-action').addEventListener('click', () => { action.run(); close(); });
    start();
  }
  return { show };
})();

/* ==========================================================================
   Overlay — modali / bottom sheet e conferme
   ========================================================================== */
const Overlay = (() => {
  let current = null, lastFocus = null;

  function open({ title, subtitle = '', body, footer = '', size = '', onClose = null }) {
    close(true);
    lastFocus = document.activeElement;
    const host = document.getElementById('overlayHost');
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="grabber"></div>
        <div class="modal-head"><div><h2 id="modalTitle">${title}</h2>${subtitle ? `<p>${subtitle}</p>` : ''}</div>
          <button class="btn btn-ghost btn-icon btn-sm" data-close aria-label="Chiudi">${I('x')}</button></div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
      </div>`;
    host.appendChild(wrap);
    current = { el: wrap, onClose };
    enableDrag(wrap.querySelector('.modal'));
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
    wrap.querySelector('[data-close]').addEventListener('click', () => close());
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => {
      const f = wrap.querySelector('.modal-body input:not([type=radio]):not([type=hidden]), .modal-body textarea, .modal-body button, .modal-foot .btn-primary');
      if (f && window.matchMedia('(min-width: 641px)').matches) f.focus({ preventScroll: true });
    });
    return wrap.querySelector('.modal');
  }

  function close(immediate = false) {
    if (!current) return;
    const { el, onClose } = current;
    current = null;
    document.body.style.overflow = '';
    if (immediate) el.remove();
    else { el.classList.add('closing'); setTimeout(() => el.remove(), 220); }
    if (onClose) onClose();
    if (!immediate && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }

  /** Su telefono il pannello si chiude trascinandolo verso il basso dalla maniglia o dal titolo */
  function enableDrag(modal) {
    let y0 = null, dy = 0, pid = null;
    const start = e => {
      if (!window.matchMedia('(max-width: 640px)').matches || e.target.closest('button, input, a')) return;
      y0 = e.clientY; dy = 0; pid = e.pointerId;
      modal.style.transition = 'none';
      try { modal.setPointerCapture(pid); } catch (err) { /* ignorato */ }
    };
    const move = e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); modal.style.transform = `translateY(${dy}px)`; };
    const end = () => {
      if (y0 === null) return;
      y0 = null;
      try { modal.releasePointerCapture(pid); } catch (err) { /* ignorato */ }
      modal.style.transition = '';
      if (dy > 110) close(); else modal.style.transform = '';
    };
    modal.querySelectorAll('.grabber, .modal-head').forEach(el => el.addEventListener('pointerdown', start));
    modal.addEventListener('pointermove', move);
    modal.addEventListener('pointerup', end);
    modal.addEventListener('pointercancel', end);
  }

  /** Conferma asincrona; con requireText va digitata una parola */
  function confirm({ title, message, confirmLabel = 'Conferma', danger = false, requireText = null }) {
    return new Promise(resolve => {
      let done = false;
      const finish = v => { if (!done) { done = true; resolve(v); } };
      const modal = open({
        title: Utils.esc(title), size: 'sm',
        body: `<p class="muted">${message}</p>${requireText ? `<div class="field" style="margin-top:14px"><label class="field-label" for="confirmText">Digita ${Utils.esc(requireText)} per confermare</label><input class="input" id="confirmText" autocomplete="off" autocapitalize="characters"></div>` : ''}`,
        footer: `<button class="btn btn-ghost" data-no>Annulla</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes ${requireText ? 'disabled' : ''}>${Utils.esc(confirmLabel)}</button>`,
        onClose: () => finish(false)
      });
      const yes = modal.querySelector('[data-yes]');
      if (requireText) {
        const inp = modal.querySelector('#confirmText');
        inp.addEventListener('input', () => { yes.disabled = inp.value.trim().toUpperCase() !== requireText; });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !yes.disabled) yes.click(); });
      }
      modal.querySelector('[data-no]').addEventListener('click', () => { finish(false); close(); });
      yes.addEventListener('click', () => { finish(true); close(); });
    });
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) close(); });
  return { open, close, confirm, isOpen: () => !!current };
})();

/* ==========================================================================
   Forms — generazione form dai metadati, scorciatoie, validazione, feedback live
   ========================================================================== */
const Forms = (() => {
  const defaultValue = f => {
    if (f.type === 'date') return f.required ? Utils.todayISO() : '';
    if (f.type === 'datetime-local') return Utils.nowLocal();
    if (f.type === 'select') return f.required ? f.options[0] : '';
    return '';
  };

  /** Campo data in formato gg/mm/aaaa con calendario nativo di supporto */
  function dateControl(f, id, iso, withTime) {
    const d = iso ? iso.slice(0, 10) : '';
    const tm = withTime && iso && Utils.hasTime(iso) ? iso.slice(11, 16) : '';
    return `<div class="input-wrap date-wrap">
        <input class="input" id="${id}" name="${f.name}" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="gg/mm/aaaa" value="${Utils.toDMY(d)}" data-date ${f.required ? 'required' : ''}>

        <input type="date" class="date-native" tabindex="-1" aria-hidden="true" data-native-for="${f.name}" ${f.future ? '' : `max="${Utils.todayISO()}"`}>

        <button type="button" class="btn btn-sm date-btn" data-now="${f.name}" data-kind="${f.type}">${withTime ? 'Adesso' : 'Oggi'}</button>
        ${!f.required ? `<button type="button" class="btn btn-sm btn-ghost btn-icon date-btn" data-date-clear="${f.name}" aria-label="Svuota data">${I('x')}</button>` : ''}
      </div>`;
  }

  function fieldHTML(type, f, value, uidp) {
    const id = `${uidp}-${f.name}`;
    const label = `<span>${Utils.esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</span>`;
    const v = value === null || value === undefined ? '' : value;
    let control = '', extra = '';
    if (f.type === 'select') {
      control = `<div class="chips" role="radiogroup" aria-label="${Utils.esc(f.label)}">${f.options.map((o, i) => `
        <label class="chip"><input type="radio" name="${f.name}" value="${Utils.esc(o)}" ${o === v ? 'checked' : ''} ${i === 0 && f.required ? 'required' : ''} ${f.required ? '' : 'data-toggle'}>${Utils.esc(o)}</label>`).join('')}</div>${f.required ? '' : '<span class="field-hint">Facoltativo: tocca di nuovo per togliere la scelta</span>'}`;
      return `<div class="field${f.full ? ' full' : ''}" data-field="${f.name}"><div class="field-label">${label}</div>${control}</div>`;
    }
    if (f.type === 'textarea') {
      control = `<textarea class="input" id="${id}" name="${f.name}" rows="2" maxlength="1000" placeholder="${Utils.esc(f.placeholder || '')}">${Utils.esc(v)}</textarea>`;
    } else if (f.type === 'text') {
      control = `<input class="input" id="${id}" name="${f.name}" type="text" maxlength="120" value="${Utils.esc(v)}" placeholder="${Utils.esc(f.placeholder || '')}" ${f.required ? 'required' : ''}>`;
    } else if (f.type === 'date' || f.type === 'datetime-local') {
      control = dateControl(f, id, v, f.type === 'datetime-local');
    } else {
      control = `<div class="input-wrap"><input class="input${f.unit ? ' has-unit' : ''}" id="${id}" name="${f.name}" type="number" inputmode="decimal" value="${Utils.esc(v)}" step="${f.step}" min="${f.min}" max="${f.max}" ${f.required ? 'required' : ''} placeholder="${Schema.LOGS[type].atLeastOne ? '—' : '0'}">${f.unit ? `<span class="unit">${f.unit}</span>` : ''}</div>`;
    }
    if (f.gauge) extra = `<span class="field-hint" data-gauge-hint="${f.gauge}"></span>`;
    else if (f.hint) extra = `<span class="field-hint" data-hint="${f.hint}"></span>`;
    const badge = f.gauge ? `<span data-gauge-badge="${f.gauge}"></span>` : '';
    return `<div class="field${f.full ? ' full' : ''}" data-field="${f.name}"><label class="field-label" for="${id}">${label}${badge}</label>${control}${extra}</div>`;
  }

  /** Valore ISO di un campo data del form (gg/mm/aaaa -> aaaa-mm-gg) */
  const dateVal = (form, name) => form.elements[name] ? Utils.fromDMY(form.elements[name].value) : '';

  /** Apre il modale di creazione/modifica per un registro */
  function open(type, { id = null, presets = {} } = {}) {
    const def = Schema.LOGS[type];
    const entry = id ? Store.find(type, id) : null;
    if (id && !entry) { Toast.show('Voce non trovata', 'warn'); return; }
    const values = {};
    def.fields.forEach(f => { values[f.name] = entry ? entry[f.name] : defaultValue(f); });
    // Nuovo pasto: proposto uguale all'ultimo
    if (!entry && type === 'feeding') {
      const last = Logic.lastMealTemplate();
      if (last) Object.assign(values, { preda: last.preda, pesoPreda: last.pesoPreda, statoPreda: last.statoPreda });
    }
    Object.assign(values, presets);
    const uidp = 'fm' + Math.random().toString(36).slice(2, 7);
    const body = `<form id="logForm" data-type="${type}" ${id ? `data-id="${Utils.esc(id)}"` : ''} novalidate>
        ${def.atLeastOne ? `<p class="faint small" style="margin-bottom:10px">Compila solo i valori che hai misurato.</p>` : ''}
        <div class="form-grid">${def.fields.map(f => fieldHTML(type, f, values[f.name], uidp)).join('')}</div>
      </form>`;
    const footer = `${id ? `<button class="btn btn-danger" data-form-delete style="margin-right:auto">Elimina</button>` : ''}
      <button class="btn btn-ghost" data-close-form>Annulla</button>
      <button class="btn btn-primary" data-submit-form>${id ? 'Salva modifiche' : `Registra ${def.label.toLowerCase()}`}</button>`;
    const modal = Overlay.open({ title: `${I(def.icon)} ${id ? 'Modifica' : (def.g === 'm' ? 'Nuovo' : 'Nuova')} ${def.label.toLowerCase()}`, subtitle: def.desc, body, footer });
    const form = modal.querySelector('#logForm');
    modal.querySelector('[data-close-form]').addEventListener('click', () => Overlay.close());
    modal.querySelector('[data-submit-form]').addEventListener('click', () => submit(form));
    form.addEventListener('submit', e => { e.preventDefault(); submit(form); });
    form.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(form); });
    const del = modal.querySelector('[data-form-delete]');
    if (del) del.addEventListener('click', () => { Overlay.close(); Actions.remove(type, id); });
    bindDates(form, () => live(form));
    // Scelte facoltative: secondo tocco toglie la selezione
    form.addEventListener('pointerdown', e => { const r = e.target.closest('.chip') && e.target.closest('.chip').querySelector('input[data-toggle]'); if (r) r.dataset.was = r.checked ? '1' : ''; });
    form.addEventListener('click', e => {
      const r = e.target.closest('.chip') && e.target.closest('.chip').querySelector('input[data-toggle]');

    });
    form.addEventListener('input', e => { const f = e.target.closest('.field'); if (f) f.classList.remove('invalid'); live(form, e.target); });

  /** Comportamento dei campi data: maschera gg/mm/aaaa, calendario, Oggi/Adesso, svuota */
  function bindDates(root, onChange = () => {}) {
    root.addEventListener('input', e => {
      const t = e.target;
      if (t.matches('[data-date]') && e.inputType && !e.inputType.startsWith('delete')) {
        const d = t.value.replace(/\D/g, '').slice(0, 8);
        t.value = d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;

      if (t.matches('[data-time]') && e.inputType && !e.inputType.startsWith('delete')) {
        const d = t.value.replace(/\D/g, '').slice(0, 4);

      }
    });
    root.addEventListener('blur', e => {
      if (e.target.matches('[data-time]')) { const n = Utils.normTime(e.target.value); if (n) e.target.value = n; }
    }, true);
    root.addEventListener('change', e => {
      const n = e.target.closest('[data-native-for]');
      if (n && n.value) { root.querySelector(`[name="${n.dataset.nativeFor}"]`).value = Utils.toDMY(n.value); onChange(root.querySelector(`[name="${n.dataset.nativeFor}"]`)); }
    });
    root.addEventListener('click', e => {
      const pick = e.target.closest('[data-pick]');
      if (pick) {
        const native = root.querySelector(`[data-native-for="${pick.dataset.pick}"]`);
        native.value = Utils.fromDMY(root.querySelector(`[name="${pick.dataset.pick}"]`).value) || Utils.todayISO();
        try { if (native.showPicker) native.showPicker(); else native.click(); } catch (err) { native.click(); }
      }
      const now = e.target.closest('[data-now]');
      if (now) {
        root.querySelector(`[name="${now.dataset.now}"]`).value = Utils.toDMY(Utils.todayISO());
        const tm = root.querySelector(`[name="${now.dataset.now}__time"]`);
        if (tm) tm.value = Utils.nowLocal().slice(11, 16);
        onChange(root.querySelector(`[name="${now.dataset.now}"]`));
      }
      const clr = e.target.closest('[data-date-clear]');
      if (clr) { root.querySelector(`[name="${clr.dataset.dateClear}"]`).value = ''; onChange(root.querySelector(`[name="${clr.dataset.dateClear}"]`)); }

  /** Feedback in tempo reale: badge soglie, rapporto preda, variazione peso, logica muta */
  function live(form, target = null) {
    const type = form.dataset.type;
    if (type === 'env') {
      Logic.ENV_KEYS.forEach(k => {
        const r = Logic.range(k);
        const hint = form.querySelector(`[data-gauge-hint="${k}"]`);
        const badge = form.querySelector(`[data-gauge-badge="${k}"]`);
        if (hint) hint.textContent = `${r.brum ? 'Invernale' : 'Ottimale'} ${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit}`;
        const ev = Logic.evalParam(k, form.elements[k].value);
        if (badge) badge.innerHTML = ev.status === 'neutral' ? '' : `<span class="badge b-${ev.status}">${ev.label}</span>`;
