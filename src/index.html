    if (!VIEWS.some(v => v.id === id)) id = 'dashboard';
    const changed = id !== current || !booted;
    const back = VIEWS.findIndex(v => v.id === id) < VIEWS.findIndex(v => v.id === current);
    current = id;
    document.querySelectorAll('.view').forEach(v => {
      const on = v.id === `view-${id}`;
      if (on && changed) { v.classList.remove('active', 'go-fwd', 'go-back'); void v.offsetWidth; v.classList.add(back ? 'go-back' : 'go-fwd'); }
      v.classList.toggle('active', on);
    });
    document.querySelectorAll('[data-nav]').forEach(b => { const on = b.dataset.nav === id; b.classList.toggle('active', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
    if (location.hash !== `#${id}`) history[replace ? 'replaceState' : 'pushState'](null, '', `#${id}`);
    render(true);
    if (changed) { window.scrollTo({ top: 0 }); Motion.stagger(document.getElementById(`view-${id}`)); }
    booted = true;
    requestAnimationFrame(() => Motion.navIndicators());
  }

  const signature = () => [current, Store.rev, JSON.stringify(Views.tabs), JSON.stringify(Charts.ranges), Utils.todayISO(), Photos.rev].join('|');

  /** Ridisegna la vista corrente; salta il lavoro se nulla è cambiato */
  function render(force = false) {
    const sig = signature();
    if (!force && sig === lastSig) return;
    lastSig = sig;
    const v = VIEWS.find(x => x.id === current);
    document.getElementById('viewTitle').innerHTML = `<span class="desktop-only">${v.label}</span><span class="mobile-only">${v.mobile || v.label}</span>`;
    document.getElementById('viewSubtitle').textContent = Utils.cap(v.sub());
    const top = document.getElementById('topAction');
    const addType = typeof v.add === 'function' ? v.add() : v.add;
    if (addType && Schema.LOGS[addType]) { top.removeAttribute('data-open-add'); top.dataset.add = addType; top.innerHTML = `${I('plus')} <span class="desktop-only">${Schema.LOGS[addType].label}</span>`; }
    else if (current === 'salute') { top.removeAttribute('data-open-add'); delete top.dataset.add; top.setAttribute('data-photo-add', ''); top.innerHTML = `${I('plus')} <span class="desktop-only">Foto</span>`; }
    else { delete top.dataset.add; top.removeAttribute('data-photo-add'); top.setAttribute('data-open-add', ''); top.innerHTML = `${I('plus')} <span class="desktop-only">Registra</span>`; }
    if (current !== 'salute') top.removeAttribute('data-photo-add');
    const sy = window.scrollY;
    try {
      Views[current]();
      Anim.countUp(document.getElementById(`view-${current}`));
      Motion.segments(document.getElementById(`view-${current}`));
    } catch (err) {
      console.error('Errore di visualizzazione', err);
      document.getElementById(`view-${current}`).innerHTML = `<div class="empty"><div class="empty-ico">${I('alert')}</div><b>Qualcosa è andato storto</b><p>Questa schermata non può essere mostrata. I tuoi dati sono al sicuro: prova a ricaricare la pagina.</p><button class="btn btn-sm" onclick="location.reload()">Ricarica</button></div>`;
    }
    if (!force && Math.abs(window.scrollY - sy) > 2) window.scrollTo({ top: sy });
    const al = Logic.alerts().filter(a => a.level !== 'info');
    const c = document.getElementById('navAlertCount');
    if (c) { c.textContent = al.length; c.className = `count${al.length ? '' : ' hidden'} ${al.some(a => a.level === 'bad') ? 'b-bad' : 'b-warn'}`; }
    const p = Store.get().profile;
    document.getElementById('sideSnake').innerHTML = p.nome ? `${I('snake')} ${Utils.esc(p.nome)}${Utils.age(p.dataNascita) ? ' · ' + Utils.age(p.dataNascita) : ''}` : 'Nessun profilo configurato';
  }

  return { buildNav, go, render, VIEWS, get current() { return current; } };
})();

/* ==========================================================================
   Demo — dati realistici di un giovane serpente del grano
   ========================================================================== */
const Demo = (() => {
  const rng = seed => () => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };
  function build() {
    const r = rng(42);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const D = n => Utils.toISODate(Utils.addDays(today, -n));
    const r1 = v => Math.round(v * 10) / 10;
    const id = Utils.uid;
    const pts = [[180, 9.5, 31], [150, 14, 35], [120, 20.5, 39], [90, 27, 43], [60, 35.5, 47], [30, 46, 51], [3, 57.5, 55]];
    const growth = pts.map(([d, w, l], i) => ({ id: id(), data: D(d), peso: w, lunghezza: l, note: i === 0 ? 'Peso all\'arrivo' : i === pts.length - 1 ? 'Ottimo stato di forma' : '' }));
    const weightOn = d => {
      for (let i = pts.length - 1; i >= 0; i--) if (pts[i][0] >= d) { const a = pts[i], b = pts[i + 1]; if (!b) return a[1]; return a[1] + (b[1] - a[1]) * (a[0] - d) / (a[0] - b[0]); }
      return pts[pts.length - 1][1];
    };
    const shedDefs = [[140, 131, 'Completa', 'Muta in un unico pezzo'], [88, 80, 'Incompleta / a pezzi', 'Residui sulla coda, risolto con camera umida'], [33, 24, 'Completa', 'Perfetta, occhi tornati limpidi']];
    const shed = shedDefs.map(([a, b, e, n]) => ({ id: id(), dataInizio: D(a), dataFine: D(b), esito: e, note: n }));
    const inShed = d => shedDefs.some(([a, b]) => d <= a && d >= b);
    const feeding = [];
    for (let d = 173; d >= 5; d -= 7) {
      const w = weightOn(d);
      const preda = w < 15 ? 'Pinky' : w < 35 ? 'Fuzzy' : 'Hopper';
      const peso = r1((preda === 'Pinky' ? 1.2 : preda === 'Fuzzy' ? 2.4 : 5.2) + r() * (preda === 'Hopper' ? 1 : .5));
      let esito = 'Mangiato', note = '';
      if (inShed(d)) { esito = 'Rifiutato'; note = 'In fase opaca, rifiuto normale'; }
      else if (r() < .08) { esito = 'Rifiutato'; note = 'Poco interessato, riprovo tra qualche giorno'; }
      else if (r() < .3) note = 'Ha colpito subito';
      feeding.push({ id: id(), data: D(d), preda, pesoPreda: peso, statoPreda: 'Decongelato', esito, note, rapporto: Logic.ratio(peso, w) });
    }
    const env = [];
    for (let d = 40; d >= 0; d--) {
      for (const [h, m] of [[9, 0], [20, 30]]) {
        if (d === 0 && h === 20) continue;
        const dt = Utils.addDays(today, -d); dt.setHours(h, m);
        let um = Math.round(46 + r() * 10 + (d >= 24 && d <= 33 ? 6 : 0)), note = '';
        if (d === 6 && h === 20) { um = 67; note = 'Dopo nebulizzazione abbondante'; }
        env.push({ id: id(), datetime: Utils.toLocalDT(dt), tempCalda: r1(29 + r() * 2.4 + (h === 20 ? .4 : 0)), tempFredda: r1(23 + r() * 2), umidita: um, note });
      }
    }
    const maintenance = [];
    for (let d = 44; d >= 2; d -= 3) maintenance.push({ id: id(), data: D(d), tipo: 'Cambio acqua', note: '' });
    for (let d = 40; d >= 1; d -= 6) maintenance.push({ id: id(), data: D(d), tipo: 'Spot cleaning', note: 'Rimosse feci' });
    maintenance.push({ id: id(), data: D(62), tipo: 'Pulizia profonda', note: 'Terrario disinfettato con clorexidina' });
    maintenance.push({ id: id(), data: D(62), tipo: 'Cambio substrato', note: 'Nuovo aspen' });
    maintenance.push({ id: id(), data: D(15), tipo: 'Controllo riscaldamento/luci', note: 'Termostato verificato con sonda' });
    const handling = [];
    const beh = Schema.OPTIONS.comportamento;
    for (let d = 60; d >= 3; d -= 4) {
      if (feeding.some(f => { const fd = Utils.daysSince(f.data) - d; return fd >= 0 && fd < 2; })) continue;
      const old = d > 40;
      handling.push({ id: id(), data: D(d), durata: Math.round(old ? 3 + r() * 4 : 8 + r() * 8), comportamento: old ? beh[r() < .5 ? 1 : 2] : beh[r() < .8 ? 0 : 1], note: old ? 'Ancora in ambientamento' : '' });
    }
    // Notti un po' più fresche su metà delle letture serali
    env.forEach(e => { if (e.datetime.endsWith('20:30') && r() < .6) e.tempNotte = r1(21 + r() * 2.2); });
    shed.forEach((s, i) => { s.occhi = i === 1 ? 'Rimasti sugli occhi' : 'Staccati con la muta'; if (i === 1) s.note += ' · occhialino sinistro tolto con cotton fioc umido'; });
    const waste = [];
    for (let d = 170; d >= 4; d -= 8) waste.push({ id: id(), data: D(d), tipo: 'Feci e urati', aspetto: r() < .9 ? 'Normale' : 'Molli / liquide', note: '' });
    const symptom = [{ id: id(), data: D(86), area: 'Pelle / squame', gravita: 'Lieve', stato: 'Risolto', note: 'Residui di muta sulla coda, risolto con camera umida' }];
    const vet = [{ id: id(), data: D(170), motivo: 'Visita di controllo dopo l\'acquisto', veterinario: 'Ambulatorio esotici', costo: 45, esito: 'Buono stato generale, esame feci negativo', controllo: '', note: '' }];
    const med = [{ id: id(), farmaco: 'Pomata cicatrizzante', dose: 'Strato sottile sulla coda', ogniGiorni: 1, dataInizio: D(87), dataFine: D(81), note: 'Dopo la muta incompleta', dosi: [87, 86, 85, 84, 83, 82, 81].map(D) }];
    const stock = [
      { id: id(), data: D(178), preda: 'Pinky', quantita: 10, costo: 9, fornitore: 'Negozio di rettili', note: '' },
      { id: id(), data: D(120), preda: 'Fuzzy', quantita: 12, costo: 14.4, fornitore: 'Negozio di rettili', note: '' },
      { id: id(), data: D(60), preda: 'Hopper', quantita: 10, costo: 15, fornitore: 'Shop online', note: '' },
      { id: id(), data: D(20), preda: 'Hopper', quantita: 3, costo: 4.5, fornitore: 'Negozio di rettili', note: '' }
    ];
    const expense = [
      { id: id(), data: D(182), categoria: 'Attrezzatura', importo: 89, descrizione: 'Terrario 60x40x40', note: '' },
      { id: id(), data: D(182), categoria: 'Riscaldamento e luci', importo: 42.5, descrizione: 'Tappetino e termostato', note: '' },
      { id: id(), data: D(181), categoria: 'Substrato e arredo', importo: 24.9, descrizione: 'Aspen, tane e ramo', note: '' },
      { id: id(), data: D(62), categoria: 'Substrato e arredo', importo: 12.5, descrizione: 'Sacco di aspen 20 L', note: '' },
      { id: id(), data: D(15), categoria: 'Attrezzatura', importo: 18, descrizione: 'Termo-igrometro digitale', note: '' }
    ];
    return {
      version: 3,
      profile: { nome: 'Pepe', sesso: 'Maschio', morph: 'Amel (Amelanistic)', dataNascita: D(235), dataArrivo: D(181), pesoAttuale: 57.5, lunghezzaAttuale: 55, terrarioDimensioni: '60x40x40 cm', substrato: 'Truciolato di pioppo (aspen)', sorgenteCalore: 'Tappetino riscaldante con termostato', intervalloPasti: 7, intervalloAcqua: 3, tempCaldaMin: 28, tempCaldaMax: 32, tempFreddaMin: 22, tempFreddaMax: 26, umiditaMin: 40, umiditaMax: 60, intervalloAuto: true, intervalloPulizia: 7, tempNotteMin: 20, tempNotteMax: 24, luceOn: '08:00', luceOff: '20:00', brumInizio: '', brumFine: '', brumTempMin: 10, brumTempMax: 16 },
      logs: { env, feeding, growth, shed, maintenance, handling, waste, symptom, vet, med, stock, expense }
    };
  }
  return { build };
})();

/* ==========================================================================
   PWA — service worker e installazione
   ========================================================================== */
const PWA = (() => {
  let deferred = null;
  function init() {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker non registrato', err)));
    }
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; const row = document.getElementById('installRow'); if (row) row.classList.remove('hidden'); });
    window.addEventListener('appinstalled', () => { deferred = null; Toast.show('SNAKEcheck installata sulla schermata Home', 'ok'); });
  }
  async function install() {
    if (!deferred) { Toast.show('Usa il menu del browser → "Installa app"', 'info'); return; }
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    const row = document.getElementById('installRow'); if (row) row.classList.add('hidden');
  }
  return { init, install, canInstall: () => !!deferred };
})();

/* ==========================================================================
   App — eventi globali e avvio
   ========================================================================== */
const App = (() => {
  let pressTimer = null, longPressed = false;

  function bind() {
    // Pressione lunga su "Ha mangiato": apre il modulo con i dettagli
    document.addEventListener('pointerdown', e => {
      const m = e.target.closest && e.target.closest('[data-meal]');
      if (!m) return;
      longPressed = false;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => { longPressed = true; if (navigator.vibrate) navigator.vibrate(15); Overlay.close(true); Forms.open('feeding'); }, 550);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => clearTimeout(pressTimer), true));
    document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('[data-meal]')) e.preventDefault(); });

    document.addEventListener('click', e => {
      const t = e.target;
      if (!t.closest) return;
      const nav = t.closest('[data-nav]'); if (nav) { Overlay.close(true); Router.go(nav.dataset.nav); return; }
      const hs = t.closest('[data-hotspot]'); if (hs) { e.stopPropagation(); Terrarium.openPop(hs.dataset.hotspot); return; }
      if (t.closest('[data-snake]')) { Terrarium.closePop(); Inspector.open(); return; }
      if (t.closest('[data-pop-close]')) { Terrarium.closePop(); return; }
      if (Terrarium.isOpen() && !t.closest('#terraPop')) Terrarium.closePop();
      const meal = t.closest('[data-meal]');
      if (meal) { if (longPressed) { longPressed = false; return; } Motion.burst(meal); Overlay.close(true); Actions.quickMeal('Mangiato'); return; }
      if (t.closest('[data-meal-refuse]')) { Overlay.close(true); Actions.quickMeal('Rifiutato'); return; }
      if (t.closest('[data-open-add]')) { Actions.openAddSheet(); return; }
      if (t.closest('[data-photo-add]')) { Overlay.close(true); Photos.openAdd(); return; }
      const add = t.closest('[data-add]');
      if (add) {
        const presets = add.dataset.presetTipo ? { tipo: add.dataset.presetTipo } : add.dataset.presetPreda ? { preda: add.dataset.presetPreda } : {};
        Overlay.close(true);
        Forms.open(add.dataset.add, { presets });
        return;
      }
      const edit = t.closest('[data-edit]');
      if (edit) { Overlay.close(true); Forms.open(edit.dataset.edit, { id: edit.dataset.id, presets: edit.hasAttribute('data-preset-complete') ? { esito: 'Completa', dataFine: Utils.todayISO() } : {} }); return; }
      const del = t.closest('[data-del]'); if (del) { Actions.remove(del.dataset.del, del.dataset.id); return; }
      if (t.closest('[data-water]')) { Motion.burst(t.closest('[data-water]')); Actions.quickWater(); return; }
      if (t.closest('[data-clean]')) { Motion.burst(t.closest('[data-clean]')); Actions.quickClean(); return; }
      const dose = t.closest('[data-dose]'); if (dose) { Motion.burst(dose); Actions.giveDose(dose.dataset.dose); return; }
      const al = t.closest('[data-alert]'); if (al) { Actions.runAlertAction((Views.getAlert(+al.dataset.alert) || {}).action); return; }
      const task = t.closest('[data-task]'); if (task) { Motion.burst(task); Actions.runAlertAction((Views.getTask(+task.dataset.task) || {}).action); return; }
      const tab = t.closest('[data-tab]'); if (tab) { Views.tabs[tab.dataset.tab] = tab.dataset.value; Router.render(); return; }
      const rg = t.closest('[data-chart-range]'); if (rg) { Charts.ranges[rg.dataset.chartRange] = +rg.dataset.value; Router.render(); return; }
      const sc = t.closest('[data-scroll]'); if (sc) { const el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({ behavior: Utils.reducedMotion() ? 'auto' : 'smooth', block: 'start' }); return; }
      if (t.closest('[data-search-open]')) { Search.open(); return; }
      if (t.closest('[data-vetsheet]')) { VetSheet.open(); return; }
      if (t.closest('[data-csv]')) { document.getElementById('csvFile').click(); return; }
      const pdel = t.closest('[data-photo-del]'); if (pdel) { deletePhoto(pdel.dataset.photoDel); return; }
      if (t.closest('[data-compare]')) { const [a, b] = [...Views.photoSel]; if (a && b) Photos.compare(a, b); return; }
      const ph = t.closest('[data-photo]'); if (ph) { Views.togglePhoto(ph.dataset.photo); return; }
      if (t.closest('[data-export]')) { Actions.exportBackup(); return; }
      if (t.closest('[data-share]')) { Actions.shareBackup(); return; }
      if (t.closest('[data-import]')) { document.getElementById('importFile').click(); return; }
      const snap = t.closest('[data-snap]'); if (snap) { Actions.restoreSnapshot(snap.dataset.snap); return; }
      if (t.closest('[data-notify-on]')) { Notify.enable(); return; }
      if (t.closest('[data-notify-off]')) { Notify.disable(); return; }
      const ts = t.closest('[data-theme-set]'); if (ts) { Theme.set({ mode: ts.dataset.themeSet }); return; }
      const ac = t.closest('[data-accent]'); if (ac) { Theme.set({ accent: ac.dataset.accent }); return; }
      if (t.closest('[data-sync-on]')) { Sync.connect((document.getElementById('syncClient') || {}).value); return; }
      if (t.closest('[data-sync-now]')) { Sync.now({ interactive: true }); return; }
      if (t.closest('[data-sync-off]')) { Sync.disconnect(); return; }
      if (t.closest('[data-story-print]')) { StoryPrint.open(); return; }
      if (t.closest('[data-menu]')) { openMenu(); return; }
      if (t.closest('[data-demo]')) { Actions.loadDemo(); return; }
      if (t.closest('[data-clear]')) { Actions.clearAll(); return; }
      if (t.closest('#btnInstall')) { PWA.install(); return; }
      if (t.closest('[data-settings-reset]')) { Router.render(true); Toast.show('Modifiche annullate', 'info'); }
    });
    document.addEventListener('input', e => { if (e.target.id === 's-morph') document.getElementById('morphPreview').innerHTML = Views.morphPreviewHTML(e.target.value); });
    document.addEventListener('keydown', e => {
      const el = e.target.closest && e.target.closest('[data-snake], .tl-item[data-edit], [data-photo]');
      if ((e.key === 'Enter' || e.key === ' ') && el && !/^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
      if (e.key === 'Escape' && Terrarium.isOpen()) Terrarium.closePop();
    });
    document.addEventListener('submit', e => { if (e.target.id === 'settingsForm') { e.preventDefault(); Views.saveSettings(e.target); } });
    document.getElementById('importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; Actions.importBackup(f); });
    document.getElementById('csvFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) CSVImport.open(f); });

    // Scorciatoie da tastiera (desktop)
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey || Overlay.isOpen()) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); Actions.openAddSheet(); }
      if (e.key === '/') { e.preventDefault(); Search.open(); }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= Router.VIEWS.length) Router.go(Router.VIEWS[n - 1].id);
    });

    window.addEventListener('popstate', () => Router.go(location.hash.slice(1), { replace: true }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Router.render(); });
    Store.subscribe(() => Router.render());
  }

  /** Menu "Altro" del telefono: sezioni che non stanno nella barra in basso */
  function openMenu() {
    const item = (nav, icon, title, sub) => `<button class="menu-item" data-nav="${nav}"><span class="t-ico">${I(icon)}</span><span><b>${title}</b><small>${sub}</small></span>${I('chevron')}</button>`;
    Overlay.open({ title: 'Altro', body: `<div class="menu-list">
      ${item('gestione', 'wallet', 'Spese e scorte', 'Congelatore, acquisti e costi')}
      ${item('storia', 'book', 'Storia', 'I momenti importanti, da stampare')}
      ${item('impostazioni', 'gear', 'Impostazioni', 'Profilo, aspetto, backup e sincronizzazione')}
      <button class="menu-item" data-search-open><span class="t-ico">${I('search')}</span><span><b>Cerca</b><small>In tutti i registri</small></span>${I('chevron')}</button></div>` });
  }

  async function deletePhoto(id) {
    try {
      const rec = await Photos.remove(id);
      Views.photoSel.delete(id);
      Router.render(true);
      Toast.show('Foto eliminata', 'info', { action: rec ? { label: 'Annulla', run: async () => { await Photos.put(rec); Router.render(true); } } : null });
    } catch (err) { Toast.show(`Foto non eliminata: ${err.message}`, 'bad'); }
  }

  /** Collegamenti rapidi dall'icona dell'app (manifest shortcuts) */
  function shortcut() {
    const params = new URLSearchParams(location.search);
    const a = params.get('azione');
    if (!a) return;
    history.replaceState(null, '', location.pathname + location.hash);
    setTimeout(() => {
      if (a === 'pasto') Forms.open('feeding');
      else if (a === 'clima') Forms.open('env');
      else if (a === 'acqua') Actions.quickWater();
      else if (a === 'cerca') Search.open();
    }, 150);
  }

  function init() {
    Store.load();
    Icons.observe();
    document.querySelector('.brand-mark').innerHTML = I('snake');
    document.getElementById('topSearch').innerHTML = I('search');
    document.getElementById('topGear').innerHTML = I('menu');
    document.getElementById('topSync').innerHTML = I('sync');
    Theme.init();
    Router.buildNav();
    Motion.init();
    bind();
    PWA.init();
    Router.go(location.hash.slice(1) || 'dashboard', { replace: true });
    Safety.requestPersist();
    Safety.weekly();
    Notify.start();
    Sync.init();
    Terrarium.tick();
    shortcut();
  }
  return { init };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
