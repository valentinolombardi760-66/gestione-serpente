    }
    if (type === 'feeding') {
      const hint = form.querySelector('[data-hint="ratio"]');
      const w = Logic.weightAt(dateVal(form, 'data') || Utils.todayISO());
      const r = Logic.ratio(form.elements.pesoPreda.value, w);
      if (hint) {
        if (w === null) hint.textContent = 'Registra il peso del serpente per calcolare il rapporto.';
        else if (r === null) hint.textContent = `Peso serpente di riferimento: ${Utils.fmtNum(w, 'g')}`;
        else hint.innerHTML = `Rapporto <b class="c-${Logic.ratioStatus(r)}">${Utils.fmtNum(r, '%')}</b> su ${Utils.fmtNum(w, 'g')} · ${Logic.ratioLabel(r)}`;
      }
    }
    if (type === 'growth') {
      const hint = form.querySelector('[data-hint="growth"]');
      const prev = Store.get().logs.growth.find(g => g.peso !== null && g.id !== form.dataset.id && g.data <= (dateVal(form, 'data') || Utils.todayISO()));
      const w = Utils.num(form.elements.peso.value);
      if (hint) {
        if (!prev) hint.textContent = 'Prima misurazione di peso';
        else if (w === null) hint.textContent = `Precedente: ${Utils.fmtNum(prev.peso, 'g')} (${Utils.fmtDateShort(prev.data)})`;
        else { const d = Utils.round(w - prev.peso, 1); const pct = prev.peso ? Utils.round(d / prev.peso * 100, 1) : 0; hint.innerHTML = `<b class="c-${d >= 0 ? 'ok' : pct <= -10 ? 'bad' : 'warn'}">${d >= 0 ? '+' : ''}${Utils.fmtNum(d, 'g')}</b> (${d >= 0 ? '+' : ''}${Utils.fmtNum(pct, '%')}) rispetto al ${Utils.fmtDateShort(prev.data)}`; }
      }
    }
    if (type === 'shed' && target && target.name === 'esito') {
      const fine = form.elements.dataFine;
      if (target.value === 'In corso') fine.value = '';
      else if (!fine.value) fine.value = Utils.toDMY(Utils.todayISO());
    }
    if (type === 'shed' && target && target.name === 'dataFine') {
      const esitoIn = form.querySelector('input[name="esito"]:checked');
      if (target.value && esitoIn && esitoIn.value === 'In corso') { const c = form.querySelector('input[name="esito"][value="Completa"]'); if (c) c.checked = true; }
      if (!target.value) { const c = form.querySelector('input[name="esito"][value="In corso"]'); if (c) c.checked = true; }
    }
  }

  /** Legge e valida il form */
  function read(form) {
    const def = Schema.LOGS[form.dataset.type];
    const data = {};
    let error = null;
    const today = Utils.todayISO();
    for (const f of def.fields) {
      const wrap = form.querySelector(`[data-field="${f.name}"]`);
      wrap.classList.remove('invalid');
      let v;
      if (f.type === 'select') { const c = form.querySelector(`input[name="${f.name}"]:checked`); v = c ? c.value : ''; }
      else v = String(form.elements[f.name].value || '').trim();
      if (f.type === 'number' && v !== '') {
        const n = Utils.num(v);
        if (n === null) { wrap.classList.add('invalid'); error = error || `${f.label}: numero non valido`; continue; }
        if (n < f.min || n > f.max) { wrap.classList.add('invalid'); error = error || `${f.label}: valore tra ${f.min} e ${f.max} ${f.unit || ''}`; continue; }
        v = n;
      } else if (f.type === 'number') v = null;
      if (f.type === 'date' || f.type === 'datetime-local') {
        if (v) {
          const iso = Utils.fromDMY(v);
          if (!iso) { wrap.classList.add('invalid'); error = error || `${f.label}: scrivi la data come gg/mm/aaaa`; continue; }
          if (!f.future && iso > today) { wrap.classList.add('invalid'); error = error || `${f.label}: la data è nel futuro`; continue; }
          v = iso;
          if (f.type === 'datetime-local') {
            const raw = String(form.elements[`${f.name}__time`].value || '').trim();
            const tm = raw ? Utils.normTime(raw) : '12:00';
            if (!tm) { wrap.classList.add('invalid'); error = error || 'Ora non valida: usa hh:mm'; continue; }
            v = `${iso}T${tm}`;
            if (v > Utils.nowLocal() && iso === today) { /* ora futura di oggi: accettata */ }
          }
        }
      }
      if (f.required && (v === '' || v === null)) { wrap.classList.add('invalid'); error = error || `Compila "${f.label}"`; continue; }
      data[f.name] = v;
    }
    if (!error && def.atLeastOne && def.atLeastOne.every(k => data[k] === null || data[k] === '' || data[k] === undefined)) error = 'Inserisci almeno un valore misurato';
    return { data, error };
  }

  function submit(form) {
    const type = form.dataset.type, id = form.dataset.id || null;
    const { data, error } = read(form);
    if (error) { Toast.show(error, 'warn'); const bad = form.querySelector('.invalid input, .invalid textarea'); if (bad) bad.focus(); return; }
    if (type === 'shed') {
      if (data.dataFine && data.dataFine < data.dataInizio) { Toast.show('La fine muta non può precedere l\'inizio', 'warn'); return; }
      if (data.esito !== 'In corso' && !data.dataFine) { Toast.show('Indica la data di completamento o scegli "In corso"', 'warn'); return; }
      if (data.esito === 'In corso') data.dataFine = '';
    }
    if (type === 'med' && data.dataFine && data.dataFine < data.dataInizio) { Toast.show('La fine non può precedere l\'inizio', 'warn'); return; }
    if (type === 'env' && data.tempFredda !== null && data.tempCalda !== null && data.tempFredda > data.tempCalda) Toast.show('Nota: la zona fredda risulta più calda della zona calda', 'info');
    if (type === 'feeding') data.rapporto = Logic.ratio(data.pesoPreda, Logic.weightAt(data.data));

    const saved = id ? Store.update(type, id, data) : Store.add(type, data);
    if (!saved) { Toast.show('Dati non validi: voce non salvata', 'bad'); return; }
    Overlay.close();
    const def = Schema.LOGS[type];
    const suf = def.g === 'm' ? 'o' : 'a';
    Toast.show(`${def.label} ${id ? 'aggiornat' : 'registrat'}${suf}`, 'ok', { action: Actions.undoAction() });
  }

  return { open, bindDates };
})();

/* ==========================================================================
   Charts — Chart.js con gradienti e fallback SVG
   ========================================================================== */
const Charts = (() => {
  const instances = {};
  const ranges = { env: 30, growth: 0 };
  const available = () => typeof window.Chart !== 'undefined' && !window.__chartLoadFailed;
  let themed = false;

  function theme() {
    if (themed || !available()) return;
    Chart.defaults.color = Theme.isLight() ? '#64748b' : '#6b7584';
    Chart.defaults.borderColor = Theme.isLight() ? 'rgba(15,23,42,0.08)' : 'rgba(255,255,255,0.06)';
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.font.size = 11;
    themed = true;
  }
  const destroy = key => { if (instances[key]) { try { instances[key].destroy(); } catch (e) { console.warn(e); } delete instances[key]; } };
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };

  const emptyHTML = (msg, type) => `<div class="empty" style="height:100%"><div class="empty-ico">${I('chart')}</div><b>Nessun dato nel periodo</b><p>${msg}</p>${type ? `<button class="btn btn-sm" data-add="${type}">＋ Registra</button>` : ''}</div>`;

  /** series: [{ label, data, color, axis: 'y'|'y1', unit, fill }] */
  function line(key, box, labels, series, { yTitle = '', y1Title = '', emptyMsg = '', addType = null, band = null } = {}) {
    destroy(key);
    if (!box) return;
    const has = labels.length > 0 && series.some(s => s.data.some(v => v !== null));
    if (!has) { box.innerHTML = emptyHTML(emptyMsg, addType); return; }
    if (!available()) { svgFallback(box, labels, series); return; }
    theme();
    box.innerHTML = '<canvas aria-label="Grafico" role="img"></canvas>';
    const usesY1 = series.some(s => s.axis === 'y1');
    const bandPlugin = band ? {
      id: 'band',
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        const y = scales[band.axis || 'y'];
        if (!y || !chartArea) return;
        const top = y.getPixelForValue(band.max), bottom = y.getPixelForValue(band.min);
        ctx.save();
        ctx.fillStyle = band.color || 'rgba(74,222,128,0.07)';
        ctx.fillRect(chartArea.left, Math.max(top, chartArea.top), chartArea.right - chartArea.left, Math.min(bottom, chartArea.bottom) - Math.max(top, chartArea.top));
        ctx.restore();
      }
    } : null;
    try {
      instances[key] = new Chart(box.querySelector('canvas'), {
        type: 'line',
        data: {
          labels,
          datasets: series.map(s => ({
            label: s.label, data: s.data, yAxisID: s.axis || 'y',
            borderColor: s.color, borderWidth: s.dash ? 1.5 : 2, tension: .35, spanGaps: true, borderDash: s.dash ? [5, 5] : [],
            pointRadius: s.dash || labels.length > 30 ? 0 : 2.5, pointHoverRadius: s.dash ? 0 : 5, pointBackgroundColor: s.color, pointBorderWidth: 0,
            fill: s.fill === false ? false : 'origin',
            backgroundColor: ctx => {
              const { chart } = ctx; const { chartArea } = chart;
              if (!chartArea) return 'transparent';
              const g = chart.ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
              g.addColorStop(0, hexA(s.color, s.fillAlpha ?? .22)); g.addColorStop(1, hexA(s.color, 0));
              return g;
            }
          }))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: Utils.reducedMotion() ? 0 : 900, easing: 'easeOutQuart' },
          animations: Utils.reducedMotion() ? {} : { y: { from: c => (c.type === 'data' && c.mode === 'default' && c.chart.chartArea ? c.chart.chartArea.bottom : undefined), delay: c => (c.type === 'data' && c.mode === 'default' ? c.dataIndex * 6 + c.datasetIndex * 90 : 0) } },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', align: 'end', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 6, boxHeight: 6, padding: 14, color: '#9aa4b2' } },
            tooltip: {
              backgroundColor: 'rgba(23,26,33,0.96)', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
              titleColor: '#f1f5f9', bodyColor: '#cbd5e1', padding: 12, cornerRadius: 10, boxPadding: 4, usePointStyle: true,
              callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y === null ? '—' : Utils.fmtNum(c.parsed.y, series[c.datasetIndex].unit)}` }
            }
          },
          scales: {
            x: { grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } },
            y: { position: 'left', grid: { color: Theme.isLight() ? 'rgba(15,23,42,0.07)' : 'rgba(255,255,255,0.05)' }, border: { display: false }, title: { display: !!yTitle, text: yTitle }, ticks: { maxTicksLimit: 6 } },
            ...(usesY1 ? { y1: { position: 'right', grid: { drawOnChartArea: false }, border: { display: false }, title: { display: !!y1Title, text: y1Title }, ticks: { maxTicksLimit: 6 } } } : {})
          }
        },
        plugins: bandPlugin ? [bandPlugin] : []
      });
    } catch (err) {
      console.warn('Chart.js non disponibile, uso il grafico SVG', err);
      svgFallback(box, labels, series);
    }
  }

  /** Grafico SVG di riserva (scala condivisa per asse) */
  function svgFallback(box, labels, series) {
    const W = 640, H = 220, P = 14, n = labels.length;
    const x = i => n === 1 ? W / 2 : P + i * (W - 2 * P) / (n - 1);
    const axes = {};
    series.forEach(s => {
      const vals = s.data.filter(v => v !== null);
      if (!vals.length) return;
      const k = s.axis || 'y';
      const r = axes[k] || (axes[k] = [Infinity, -Infinity]);
      r[0] = Math.min(r[0], ...vals); r[1] = Math.max(r[1], ...vals);
    });
    const paths = series.map((s, si) => {
      if (!s.data.some(v => v !== null)) return '';
      let [lo, hi] = axes[s.axis || 'y'];
      if (lo === hi) { lo -= 1; hi += 1; }
      const pad = (hi - lo) * .1; lo -= pad; hi += pad;
      const y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
      const pts = s.data.map((v, i) => v === null ? null : [x(i), y(v)]).filter(Boolean);
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      const area = `${d} L${pts[pts.length - 1][0].toFixed(1)},${H - P} L${pts[0][0].toFixed(1)},${H - P} Z`;
      return `<defs><linearGradient id="sg${si}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".25"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#sg${si})"/><path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }).join('');
    const grid = [0, 1, 2, 3].map(i => { const yy = P + i * (H - 2 * P) / 3; return `<line x1="${P}" x2="${W - P}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.06)"/>`; }).join('');
    const legend = series.map(s => {
      const vals = s.data.filter(v => v !== null);
      return `<span><i style="background:${s.color}"></i>${Utils.esc(s.label)} ${vals.length ? `${Utils.fmtNum(Math.min(...vals))}–${Utils.fmtNum(Math.max(...vals), s.unit)}` : '—'}</span>`;
    }).join('');
    box.innerHTML = `<div class="chart-note">Grafico semplificato: Chart.js non è raggiungibile (offline).</div>
      <svg class="svg-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:calc(100% - 56px)" role="img" aria-label="Grafico">${grid}${paths}</svg>
      <div class="svg-legend"><span class="faint">${Utils.esc(labels[0])} → ${Utils.esc(labels[n - 1])}</span>${legend}</div>`;
  }

  const rangeControl = key => `<div class="segmented" role="tablist" aria-label="Intervallo">${[['7', '7G'], ['30', '30G'], ['0', 'Tutto']].map(([v, l]) => `<button class="seg-btn${String(ranges[key]) === v ? ' active' : ''}" data-chart-range="${key}" data-value="${v}">${l}</button>`).join('')}</div>`;
  const filterByRange = (key, arr, dateKey) => {
    const d = ranges[key];
    return d ? arr.filter(e => { const n = Utils.daysSince(e[dateKey]); return n !== null && n < d; }) : arr;
  };

  return { line, destroy, available, ranges, rangeControl, filterByRange };
})();

    const all = Store.get().logs[type];
    if (!all.length) {
      return `<div class="empty"><div class="empty-ico" style="color:${def.color}">${I(def.icon)}</div><b>Ancora nessuna voce</b><p>Il registro "${def.label.toLowerCase()}" è vuoto. Aggiungi la prima registrazione per vedere statistiche e storico.</p><button class="btn btn-primary btn-sm" data-add="${type}">＋ Registra ${def.label.toLowerCase()}</button></div>`;
    }
    const q = st.q.trim().toLowerCase();
    const list = all.filter(e => {
      if (st.f && cfg.filter && e[cfg.filter.field] !== st.f) return false;
      if (!q) return true;
      return Object.entries(e).some(([k, v]) => k !== 'id' && v !== null && v !== '' && String(v).toLowerCase().includes(q))
        || Utils.fmtDate(e[def.dateKey]).toLowerCase().includes(q);
    });
    if (!list.length) {
      return `<div class="empty"><div class="empty-ico">${I('search')}</div><b>Nessun risultato</b><p>Nessuna voce corrisponde a ricerca e filtri attivi.</p><button class="btn btn-sm" data-reset-filters="${type}">Azzera filtri</button></div>`;
    }
    const limit = st.limit || 100;
    const shown = list.slice(0, limit);
    return `<div class="rtable-wrap"><div class="rtable-scroll"><table class="rtable">
        <thead><tr>${cfg.cols.map(c => `<th>${c[0]}</th>`).join('')}<th><span class="sr-only">Azioni</span></th></tr></thead>
        <tbody>${shown.map(e => `<tr>${cfg.cols.map((c, i) => {
          const html = c[1](e);
          const cls = [i === 0 ? 'cell-primary' : '', c[2] || '', c[2] === 'cell-notes' && !e.note ? 'is-empty' : ''].filter(Boolean).join(' ');
          return `<td data-label="${c[0]}"${cls ? ` class="${cls}"` : ''}>${html || (c[2] === 'cell-notes' ? '<span class="faint">—</span>' : '')}</td>`;
        }).join('')}
          <td class="cell-actions"><button class="btn btn-ghost btn-sm btn-icon" data-edit="${type}" data-id="${Utils.esc(e.id)}" aria-label="Modifica" title="Modifica">${I('edit')}</button><button class="btn btn-ghost btn-sm btn-icon" data-del="${type}" data-id="${Utils.esc(e.id)}" aria-label="Elimina" title="Elimina">${I('trash')}</button></td></tr>`).join('')}</tbody>
      </table></div></div>
      ${list.length > limit ? `<button class="btn btn-sm btn-block" style="margin-top:10px" data-more="${type}">Mostra altre ${Math.min(100, list.length - limit)} di ${list.length - limit}</button>` : ''}
      <div class="list-foot"><span>${list.length === all.length ? Utils.plural(all.length, 'voce', 'voci') : `${list.length} di ${all.length} voci`}</span><span class="desktop-only">Doppio clic su una riga per modificarla</span></div>`;
  }

  function refresh(type) { const host = document.querySelector(`[data-rows="${type}"]`); if (host) host.innerHTML = rows(type); }

  document.addEventListener('input', e => {
    const s = e.target.closest('[data-search]');
    if (s) { const u = (ui[s.dataset.search] || (ui[s.dataset.search] = { q: '', f: '' })); u.q = s.value; u.limit = 100; refresh(s.dataset.search); }
  });
  document.addEventListener('click', e => {
    const f = e.target.closest('[data-filter]');
    if (f) {
      const t = f.dataset.filter; ui[t].f = f.dataset.value;
      f.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === f));
      refresh(t);
    }
    const more = e.target.closest('[data-more]');
    if (more) { const t = more.dataset.more; ui[t].limit = (ui[t].limit || 100) + 100; refresh(t); return; }
    const r = e.target.closest('[data-reset-filters]');
    if (r) { const t = r.dataset.resetFilters; ui[t] = { q: '', f: '' }; Router.render(); }
  });
  document.addEventListener('dblclick', e => {
    const tr = e.target.closest('.rtable tbody tr');
    const b = tr && tr.querySelector('[data-edit]');
    if (b) Forms.open(b.dataset.edit, { id: b.dataset.id });
  });

  return { block, refresh, badge, STATUS };
})();

/* ==========================================================================
   Actions — azioni condivise (elimina con annulla, cambio acqua rapido, backup)
   ========================================================================== */
const Actions = (() => {
  const undoAction = () => ({ label: 'Annulla', run: () => { const l = Store.undo(); Toast.show(l ? 'Modifica annullata' : 'Niente da annullare', 'info'); } });

  function remove(type, id) {
    const removed = Store.remove(type, id);
    if (!removed) return;
    Toast.show(`${Schema.LOGS[type].label} eliminat${Schema.LOGS[type].g === 'm' ? 'o' : 'a'}`, 'info', { duration: 6000, action: undoAction() });
  }
  function quickWater() {
    const e = Store.add('maintenance', { data: Utils.todayISO(), tipo: 'Cambio acqua', note: '' });
    if (e) Toast.show('Cambio acqua registrato per oggi', 'ok', { action: undoAction() });
  }
  function quickClean() {
    const e = Store.add('maintenance', { data: Utils.todayISO(), tipo: 'Spot cleaning', note: '' });
    if (e) Toast.show('Pulizia registrata per oggi', 'ok', { action: undoAction() });
  }
  /** Pasto in un tocco: stessa preda dell'ultima volta, data di oggi */
  function quickMeal(esito = 'Mangiato') {
    const last = Logic.lastMealTemplate();
    if (!last) { Forms.open('feeding'); return; }
    const data = { data: Utils.todayISO(), preda: last.preda, pesoPreda: last.pesoPreda, statoPreda: last.statoPreda, esito, note: '' };
    data.rapporto = Logic.ratio(data.pesoPreda, Logic.weightAt(data.data));
    const e = Store.add('feeding', data);
    if (e) Toast.show(`${esito === 'Mangiato' ? 'Pasto registrato' : 'Rifiuto registrato'}: ${last.preda}${Utils.num(last.pesoPreda) !== null ? ' ' + Utils.fmtNum(last.pesoPreda, 'g') : ''}`, 'ok', { duration: 6000, action: undoAction() });
  }
  function giveDose(id) {
    const m = Store.find('med', id);
    if (!m) return;
    const t = Utils.todayISO();
    if ((m.dosi || []).includes(t)) { Toast.show('Dose di oggi già registrata', 'info'); return; }
    Store.update('med', id, { dosi: [t, ...(m.dosi || [])] });
    Toast.show(`Dose registrata: ${m.farmaco}`, 'ok', { action: undoAction() });
  }
  function runAlertAction(a) {
    if (!a) return;
    if (a.kind === 'form') Forms.open(a.type, { presets: a.presets || {} });
    else if (a.kind === 'edit') Forms.open(a.type, { id: a.id, presets: a.presets || {} });
    else if (a.kind === 'water') quickWater();
    else if (a.kind === 'clean') quickClean();
    else if (a.kind === 'meal') quickMeal();
    else if (a.kind === 'dose') giveDose(a.id);
    else if (a.kind === 'export') exportBackup();
    else if (a.kind === 'nav') { if (a.tab) Views.tabs[a.to] = a.tab; Router.go(a.to); }
  }

  /** Foglio "Registra" con tutti i tipi, divisi per area */
  function openAddSheet() {
    const tile = t => { const d = Schema.LOGS[t]; return `<button class="add-tile" data-add="${t}"><span class="t-ico" style="color:${d.color}">${I(d.icon)}</span><b>${d.label}</b><small>${d.desc}</small></button>`; };
    const last = Logic.lastMealTemplate();
    const body = `${last ? `<button class="quick-meal" data-meal><span class="t-ico">${I('zap')}</span><span><b>Ha mangiato come l'ultima volta</b><small>${Utils.esc(last.preda)}${Utils.num(last.pesoPreda) !== null ? ' · ' + Utils.fmtNum(last.pesoPreda, 'g') : ''} · oggi</small></span></button>` : ''}
      <div class="add-group">Routine</div><div class="add-grid">${['feeding', 'env', 'growth', 'shed', 'maintenance', 'handling'].map(tile).join('')}</div>
      <div class="add-group">Salute</div><div class="add-grid">${['waste', 'symptom', 'vet', 'med'].map(tile).join('')}<button class="add-tile" data-photo-add><span class="t-ico" style="color:#f472b6">${I('camera')}</span><b>Foto</b><small>Diario fotografico</small></button></div>
      <div class="add-group">Casa</div><div class="add-grid">${['stock', 'expense'].map(tile).join('')}</div>
      <p class="faint small desktop-only" style="margin-top:14px">Suggerimento: premi <kbd>N</kbd> per aprire questo pannello e <kbd>/</kbd> per cercare.</p>`;
    Overlay.open({ title: 'Cosa vuoi registrare?', body });
  }

  /* ---------- Backup ---------- */
  const fileBase = () => `snakecheck-${(Store.get().profile.nome || 'serpente').toLowerCase().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'serpente'}-${Utils.todayISO()}`;

  async function buildBackup(withPhotos) {
    let photos;
    if (withPhotos) { try { photos = await Photos.exportAll(); } catch (e) { photos = undefined; } }
    return Store.exportJSON(photos && photos.length ? { photos } : {});
  }

  /** Salva il file: cartella scelta (PC), Download (Android app), oppure download del browser */
  async function saveFile(name, text) {
    if (window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') return window.AndroidBridge.saveFile(name, text) ? 'android' : 'error';
    if (window.showSaveFilePicker && window.isSecureContext) {
      try {
        const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Backup SNAKEcheck', accept: { 'application/json': ['.json'] } }] });
        const w = await h.createWritable(); await w.write(text); await w.close();
        return 'picker';
      } catch (e) { if (e && e.name === 'AbortError') return 'abort'; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    return 'download';
  }
  async function exportBackup({ withPhotos = true } = {}) {
    try {
      const json = await buildBackup(withPhotos);
      const res = await saveFile(`${fileBase()}.json`, json);
      if (res === 'abort') return;
      if (res === 'error') { Toast.show('Esportazione non riuscita', 'bad'); return; }
      Safety.markBackup();
      Router.render();
      Toast.show(res === 'android' ? 'Backup salvato nella cartella Download' : res === 'picker' ? 'Backup salvato nella cartella scelta' : 'Backup scaricato', 'ok');
    } catch (err) { console.warn(err); Toast.show('Esportazione non riuscita', 'bad'); }
  }
  const canShare = () => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } };
  /** Condivide il backup (telefono): Drive, email, WhatsApp, File… */
  async function shareBackup() {
    try {
      const json = await buildBackup(true);
      const file = new File([json], `${fileBase()}.json`, { type: 'application/json' });
      await navigator.share({ files: [file], title: 'Backup SNAKEcheck' });
      Safety.markBackup(); Router.render();
      Toast.show('Backup condiviso', 'ok');
    } catch (e) { if (e && e.name !== 'AbortError') Toast.show('Condivisione non riuscita', 'bad'); }
  }

  async function importBackup(file) {
    if (!file) return;
    if (file.size > 60 * 1024 * 1024) { Toast.show('File troppo grande (max 60 MB)', 'bad'); return; }
    try {
      let raw;
      try { raw = JSON.parse(await file.text()); } catch (e) { throw new Error('il file non è un JSON valido'); }
      const { parsed, report } = Store.validateImport(raw);
      const photos = Array.isArray(raw.photos) ? raw.photos.filter(p => p && typeof p.dataUrl === 'string' && /^data:image\//.test(p.dataUrl)) : [];
      const empty = Store.isEmpty();
      const types = Schema.LOG_TYPES.filter(t => report.byType[t].total);
      const dropped = report.dropped.length;
      const body = `<p class="muted">Profilo <b>${Utils.esc(parsed.profile.nome || 'senza nome')}</b> · ${Utils.plural(report.kept, 'voce valida', 'voci valide')}${photos.length ? ` · ${Utils.plural(photos.length, 'foto', 'foto')}` : ''}</p>
        <div class="imp-list">${types.map(t => `<div><span>${I(Schema.LOGS[t].icon)} ${Schema.LOGS[t].label}</span><b>${report.byType[t].kept}${report.byType[t].kept < report.byType[t].total ? ` <span class="c-warn">di ${report.byType[t].total}</span>` : ''}</b></div>`).join('') || '<p class="faint small">Nessuna voce nei registri.</p>'}</div>
        ${dropped ? `<details class="imp-drop"><summary class="c-warn">${Utils.plural(dropped, 'voce scartata', 'voci scartate')}: vedi i motivi</summary><ul>${report.dropped.slice(0, 40).map(d => `<li>${Schema.LOGS[d.type].label} n. ${d.index}: ${Utils.esc(d.reason)}</li>`).join('')}${dropped > 40 ? `<li>…e altre ${dropped - 40}</li>` : ''}</ul></details>` : '<p class="small c-ok" style="margin-top:8px">Nessuna voce scartata.</p>'}
        ${empty ? '' : `<div class="field" style="margin-top:14px"><span class="field-label">Come importare</span><div class="chips">
          <label class="chip"><input type="radio" name="impMode" value="merge" checked>Unisci ai dati attuali</label>
          <label class="chip"><input type="radio" name="impMode" value="replace">Sostituisci tutto</label></div>
          <span class="field-hint">Unisci aggiunge solo le voci nuove e salta i doppioni. In ogni caso salvo prima una copia di sicurezza dei dati attuali.</span></div>`}`;
      const modal = Overlay.open({ title: `${I('upload')} Importa backup`, subtitle: Utils.esc(file.name), body, footer: '<button class="btn btn-ghost" data-close-imp>Annulla</button><button class="btn btn-primary" data-do-imp>Importa</button>', size: 'sm' });
      modal.querySelector('[data-close-imp]').addEventListener('click', () => Overlay.close());
      modal.querySelector('[data-do-imp]').addEventListener('click', async () => {
        const mode = empty ? 'replace' : (modal.querySelector('input[name="impMode"]:checked') || {}).value;
        Overlay.close();
        await Safety.snapshot('Prima dell\'importazione');
        let msg;
        if (mode === 'merge') { const n = Store.merge(parsed); msg = `Unione completata: ${Utils.plural(n, 'voce nuova', 'voci nuove')}`; }
        else { Store.replace(parsed, 'Importazione'); msg = `Backup importato: ${Utils.plural(report.kept, 'voce', 'voci')}`; }
        let np = 0;
        for (const p of photos) { try { if (await Photos.importOne(p)) np++; } catch (e) { /* foto saltata */ } }
        Toast.show(`${msg}${np ? ` e ${Utils.plural(np, 'foto', 'foto')}` : ''}${dropped ? ` · ${dropped} scartate` : ''}`, dropped ? 'warn' : 'ok', { duration: 7000, action: undoAction() });
      });
    } catch (err) { Toast.show(`Importazione fallita: ${err.message}`, 'bad', { duration: 6000 }); }
  }

  async function loadDemo() {
    if (!Store.isEmpty()) {
      const ok = await Overlay.confirm({ title: 'Carica dati demo', message: 'I dati attuali verranno <b>sostituiti</b> con il set dimostrativo. Prima salvo una copia di sicurezza che puoi ripristinare da Impostazioni.', confirmLabel: 'Carica demo', danger: true });
      if (!ok) return;
      await Safety.snapshot('Prima dei dati demo');
    }
    Store.replace(Demo.build(), 'Dati demo');
    Toast.show('Dati demo caricati', 'ok', { action: undoAction() });
    Router.go('dashboard');
  }
  async function clearAll() {
    const a = await Overlay.confirm({ title: 'Svuota tutti i dati', message: 'Stai per eliminare <b>profilo e tutti i registri</b> salvati in questo browser. Prima salvo una copia di sicurezza che puoi ripristinare da Impostazioni.', confirmLabel: 'Continua', danger: true });
    if (!a) return;
    const b = await Overlay.confirm({ title: 'Conferma definitiva', message: 'Ultimo passaggio: i dati spariscono da questa schermata.', confirmLabel: 'Elimina tutto', danger: true, requireText: 'ELIMINA' });
    if (!b) return;
    await Safety.snapshot('Prima di svuotare i dati');
    Store.reset();
    Toast.show('Tutti i dati sono stati eliminati', 'ok', { duration: 8000, action: undoAction() });
  }
  async function restoreSnapshot(id) {
    const s = await Safety.get(id);
    if (!s) { Toast.show('Copia non trovata', 'bad'); return; }
    const ok = await Overlay.confirm({ title: 'Ripristina copia', message: `Ripristino la copia del <b>${Utils.fmtDateTime(Utils.toLocalDT(new Date(s.at)))}</b> (${Utils.esc(s.reason)}, ${Utils.plural(s.count, 'voce', 'voci')}). Prima salvo una copia dei dati attuali.`, confirmLabel: 'Ripristina' });
    if (!ok) return;
    await Safety.snapshot('Prima del ripristino');
    Store.replace(JSON.parse(s.json), 'Ripristino');
    Toast.show('Copia ripristinata', 'ok', { action: undoAction() });
  }

  return { remove, quickWater, quickClean, quickMeal, giveDose, runAlertAction, openAddSheet, exportBackup, shareBackup, canShare, importBackup, loadDemo, clearAll, restoreSnapshot, undoAction, saveFile };
})();

/* ==========================================================================
   Anim — count-up dei numeri KPI
   ========================================================================== */
const Anim = (() => {
  const prev = new Map();
  function countUp(root) {
    root.querySelectorAll('[data-count]').forEach(el => {
      const to = Utils.num(el.dataset.count);
      if (to === null) return;
      const key = el.dataset.key || '';
      const dec = +el.dataset.dec || 0;
      const from = prev.has(key) ? prev.get(key) : 0;
      prev.set(key, to);
      const fmt = v => Utils.fmtNum(Utils.round(v, dec), '', dec);
      if (from === to || Utils.reducedMotion()) { el.textContent = fmt(to); return; }
      const t0 = performance.now(), dur = 900;
      const ease = t => 1 - Math.pow(2, -10 * t);
      const step = now => {
        const t = Math.min(1, (now - t0) / dur);
        el.textContent = fmt(from + (to - from) * (t === 1 ? 1 : ease(t)));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
  return { countUp };
})();

/* ==========================================================================
   Motion — animazioni dell'interfaccia (entrate, indicatori, coriandoli)
   ========================================================================== */
const Motion = (() => {
  const reduced = () => Utils.reducedMotion();
  const BLOCKS = ':scope > *, .grid > *, .quick > *, .stats > *, .g-main > *, .med-cards > *, .ach-row > *, .settings-list > *';
  let timer = null;

  /** Entrata a cascata degli elementi della schermata */
  function stagger(view) {
    if (!view || reduced()) return;
    let i = 0;
    view.querySelectorAll(BLOCKS).forEach(el => {
      if (el.closest('.modal') || el.matches('style, script')) return;
      el.setAttribute('data-a', '');
      el.style.setProperty('--i', Math.min(i++, 14));
    });
    view.querySelectorAll('.tl-item').forEach((el, j) => el.style.setProperty('--j', Math.min(j, 10)));
    view.classList.remove('stagger'); void view.offsetWidth; view.classList.add('stagger');
    clearTimeout(timer);
    timer = setTimeout(() => view.classList.remove('stagger'), 1600);
  }

  /** Indicatore che scorre sotto la voce attiva (barra laterale e barra del telefono) */
  function navIndicators() {
    const side = document.getElementById('sideNav');
    if (side) {
      let ind = side.querySelector('.nav-ind');
      if (!ind) { ind = document.createElement('span'); ind.className = 'nav-ind'; side.prepend(ind); }
      const a = side.querySelector('.nav-item.active');
      if (a) { ind.style.height = `${a.offsetHeight}px`; ind.style.transform = `translateY(${a.offsetTop}px)`; ind.style.opacity = 1; } else ind.style.opacity = 0;
    }
    const bn = document.getElementById('bottomNav');
    if (bn && getComputedStyle(bn).display !== 'none') {
      let ind = bn.querySelector('.bn-ind');
      if (!ind) { ind = document.createElement('span'); ind.className = 'bn-ind'; bn.prepend(ind); }
      const a = bn.querySelector('.bn-item.active');
      if (a) { const w = Math.min(a.offsetWidth - 8, 64); ind.style.width = `${w}px`; ind.style.transform = `translateX(${a.offsetLeft + (a.offsetWidth - w) / 2}px)`; ind.style.opacity = 1; } else ind.style.opacity = 0;
    }
  }

  /** Indicatore delle schede: parte dalla posizione precedente e scorre su quella nuova */
  const segPos = new Map();
  function segments(root = document) {
    root.querySelectorAll('.segmented').forEach(seg => {
      const a = seg.querySelector('.seg-btn.active');
      if (!a) return;
      const first = seg.querySelector('.seg-btn');
      const key = (first && (first.dataset.tab || first.dataset.chartRange || first.dataset.filter)) || seg.id || '';
      let ind = seg.querySelector(':scope > .seg-ind');
      if (!ind) { ind = document.createElement('span'); ind.className = 'seg-ind'; seg.prepend(ind); }
      seg.classList.add('has-ind');
      const to = { x: a.offsetLeft, w: a.offsetWidth };
      const from = key ? segPos.get(key) : null;
      if (from && !reduced() && (from.x !== to.x || from.w !== to.w)) {
        ind.style.transition = 'none';
        ind.style.width = `${from.w}px`; ind.style.transform = `translateX(${from.x}px)`;
        void ind.offsetWidth;
        ind.style.transition = '';
      }
      ind.style.width = `${to.w}px`; ind.style.transform = `translateX(${to.x}px)`;
      if (key) segPos.set(key, to);
    });
  }

  /** Piccola esplosione di coriandoli dal pulsante premuto */
  function burst(el) {
    if (!el || reduced()) return;
    const r = el.getBoundingClientRect();
    const b = document.createElement('div');
    b.className = 'burst';
    b.style.left = `${r.left + r.width / 2}px`; b.style.top = `${r.top + r.height / 2}px`;
    const colors = ['#3ddc97', '#8b9cff', '#f5b84b', '#f47174', '#5eead4', '#fde68a'];
    for (let i = 0; i < 18; i++) {
      const a = (Math.PI * 2 * i) / 18 + Math.random() * .4, d = 40 + Math.random() * 60;
      const p = document.createElement('i');
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--x', `${Math.cos(a) * d}px`); p.style.setProperty('--y', `${Math.sin(a) * d - 20}px`); p.style.setProperty('--r', `${Math.random() * 360}deg`);
      p.style.animationDelay = `${Math.random() * 60}ms`;
      b.appendChild(p);
    }
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1000);
    el.classList.remove('pulse-ok'); void el.offsetWidth; el.classList.add('pulse-ok');
  }

  function init() {
    // Isteresi: la barra compatta accorcia la pagina, quindi su pagine poco più alte dello schermo
    // lo scroll rimbalzerebbe avanti e indietro. Si compatta solo se resta abbastanza margine.
    const onScroll = () => {
      const y = window.scrollY, on = document.body.classList.contains('scrolled');
      const room = document.documentElement.scrollHeight - window.innerHeight;
      if (!on && y > 48 && room > 120) document.body.classList.add('scrolled');
      else if (on && y < 6) document.body.classList.remove('scrolled');
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    let rt = null;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { navIndicators(); segments(); }, 120); });
  }
  return { stagger, navIndicators, segments, burst, init };
})();

/* ==========================================================================
   Morph — dizionario e resolver dei morph del serpente del grano
   Riconosce i morph principali, le combinazioni e le parole chiave libere.
   ========================================================================== */
const Morph = (() => {
  const COLORS = {
    classic: { name: 'Classic / Normale', base: '#e07a2e', saddle: '#b8231c', border: '#16110e', eye: '#2b1d14', desc: 'Fondo arancio e selle rosso mattone bordate di nero: il fenotipo selvatico.' },
    amel: { name: 'Amelanistic (Amel)', base: '#f5a35f', saddle: '#e2412e', border: '#fff3e6', eye: '#d6424f', desc: 'Senza melanina: arancio e rosso brillanti, bordi bianchi e occhi rossi.' },
    anery: { name: 'Anerythristic (Anery)', base: '#a7aaad', saddle: '#3f4449', border: '#121416', eye: '#1b1d20', desc: 'Senza pigmenti rossi: grigi e neri, spesso con toni gialli sul collo.' },
    snow: { name: 'Snow', base: '#f5eee8', saddle: '#f3cfc1', border: '#ffffff', eye: '#d9545f', desc: 'Amel + Anery: bianco con selle rosa e giallo pallido, occhi rossi.' },
    ghost: { name: 'Ghost', base: '#c9b9be', saddle: '#8f7f86', border: '#6c5e65', eye: '#3a2f34', desc: 'Hypo + Anery: grigi lavanda e pastello a basso contrasto.' },
    charcoal: { name: 'Charcoal', base: '#7c7f84', saddle: '#45484d', border: '#2c2e31', eye: '#1a1b1d', desc: 'Grigio antracite uniforme, contrasto ridotto e niente gialli.' },
    blizzard: { name: 'Blizzard', base: '#f8f6f2', saddle: '#eee8e1', border: '#f8f6f2', eye: '#d9535f', pattern: 'none', desc: 'Amel + Charcoal: quasi completamente bianco, pattern appena accennato.' },
    okeetee: { name: 'Okeetee', base: '#f2862a', saddle: '#c2241a', border: '#000000', eye: '#2b1d14', borderW: 3.4, desc: 'Arancio intenso, selle rosse e bordi neri spessi e netti.' },
    reverseOkeetee: { name: 'Reverse Okeetee', base: '#f8a96a', saddle: '#e0372a', border: '#ffffff', eye: '#d6424f', borderW: 3.4, desc: 'Amel di linea Okeetee: selle rosse con spessi bordi bianchi.' },
    butter: { name: 'Butter', base: '#f6e29a', saddle: '#f2c14e', border: '#fffaea', eye: '#d6424f', desc: 'Amel + Caramel: giallo burro con selle dorate e occhi rossi.' },
    caramel: { name: 'Caramel', base: '#dcb26a', saddle: '#a8702a', border: '#5c3d17', eye: '#2b1d14', desc: 'Toni caramello e ambra al posto del rosso.' },
    palmetto: { name: 'Palmetto', base: '#fbf8f3', saddle: '#e6553d', border: '#2a1f1a', eye: '#2b1d14', pattern: 'speckle', speckles: ['#e6553d', '#f29a3a', '#2a1f1a', '#c23a2a'], desc: 'Bianco con macchioline colorate sparse: un pattern rarissimo.' },
    lavender: { name: 'Lavender', base: '#d8c3cf', saddle: '#9c7189', border: '#7d5b6d', eye: '#7a2f3f', desc: 'Toni lilla e malva, occhi rubino scuro.' },
    hypo: { name: 'Hypomelanistic (Hypo)', base: '#f0a067', saddle: '#d14a33', border: '#7a4a35', eye: '#4a2a1d', desc: 'Melanina ridotta: colori caldi con bordi marroni morbidi.' },
    bloodred: { name: 'Bloodred', base: '#c8331f', saddle: '#9e1c12', border: '#7d1a10', eye: '#2b1d14', desc: 'Rosso intenso e uniforme, pattern che sfuma con l\'età.' }
  };
  const PATTERNS = {
    saddles: { name: '', desc: '' },
    motley: { name: 'Motley', desc: 'Selle allungate e collegate tra loro.' },
    striped: { name: 'Striped', desc: 'Strisce dorsali continue al posto delle selle.' },
    speckle: { name: '', desc: '' },
    none: { name: '', desc: '' }
  };
  // Regole: prima le combinazioni e i nomi più specifici
  const RULES = [
    [s => /reverse\s*-?\s*okeetee|r\.?\s*okeetee/.test(s), 'reverseOkeetee'],
    [s => /blizzard/.test(s) || (/\bamel|albin/.test(s) && /charcoal/.test(s)), 'blizzard'],
    [s => /palmetto/.test(s), 'palmetto'],
    [s => /snow|neve/.test(s) || (/\bamel|albin/.test(s) && /anery|anerit/.test(s)), 'snow'],
    [s => /ghost|fantasma/.test(s) || (/hypo/.test(s) && /anery|anerit/.test(s)), 'ghost'],
    [s => /butter|burro/.test(s) || (/\bamel|albin/.test(s) && /caramel/.test(s)), 'butter'],
    [s => /charcoal|carbone/.test(s), 'charcoal'],
    [s => /caramel/.test(s), 'caramel'],
    [s => /lavender|lavanda/.test(s), 'lavender'],
    [s => /okeetee/.test(s), 'okeetee'],
    [s => /blood\s*red|bloodred|sangue/.test(s), 'bloodred'],
    [s => /\bamel|albin/.test(s), 'amel'],
    [s => /anery|anerit|anerythr/.test(s), 'anery'],
    [s => /hypo/.test(s), 'hypo'],
    [s => /classic|normal|wild|selvatic|carolina/.test(s), 'classic']
  ];

  /** Ritorna l'aspetto visivo per una stringa morph libera */
  function resolve(input) {
    const raw = typeof input === 'string' ? input.trim() : '';
    const s = raw.toLowerCase();
    const rule = RULES.find(([test]) => test(s));
    const key = rule ? rule[1] : 'classic';
    const c = COLORS[key];
    let pattern = c.pattern || 'saddles';
    if (pattern === 'saddles') {
      if (/motley/.test(s)) pattern = 'motley';
      else if (/strip|striat|strisc/.test(s)) pattern = 'striped';
    }
    const p = PATTERNS[pattern];
    const custom = !!raw && !rule;
    return {
      ...c, key, pattern, custom,
      label: raw ? (custom ? raw : [c.name, p.name].filter(Boolean).join(' · ')) : 'Classic / Normale',
      desc: custom ? `Morph personalizzato: mostrato con i colori del fenotipo classico.` : [c.desc, p.desc].filter(Boolean).join(' ')
    };
  }
  const names = () => [...Object.values(COLORS).map(c => c.name.split(' (')[0].split(' / ')[0]), 'Motley', 'Striped', 'Snow Motley', 'Amel Striped', 'Anery Motley'];
  return { resolve, names, COLORS };
})();

/* ==========================================================================
   Snake — disegno vettoriale del serpente (corpo affusolato, selle, testa)
   ========================================================================== */
const Snake = (() => {
  /** Campiona una curva Catmull-Rom e la ridistribuisce in N punti equidistanti */
  function sample(pts, N) {
    const dense = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      for (let k = 0; k < 24; k++) {
        const t = k / 24, t2 = t * t, t3 = t2 * t;
        dense.push([
          .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
        ]);
      }
    }
    dense.push(pts[pts.length - 1]);
    const cum = [0];
    for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]));
    const total = cum[cum.length - 1];
    const out = [];
    let j = 0;
    for (let n = 0; n < N; n++) {
      const d = total * n / (N - 1);
      while (j < cum.length - 2 && cum[j + 1] < d) j++;
      const seg = cum[j + 1] - cum[j] || 1, t = (d - cum[j]) / seg;
      out.push({ x: dense[j][0] + (dense[j + 1][0] - dense[j][0]) * t, y: dense[j][1] + (dense[j + 1][1] - dense[j][1]) * t, s: n / (N - 1) });
    }
    out.forEach((p, i) => {
      const a = out[Math.max(i - 1, 0)], b = out[Math.min(i + 1, N - 1)];
      p.a = Math.atan2(b.y - a.y, b.x - a.x);
    });
    return { P: out, total };
  }
  /** Larghezza del corpo: coda affusolata, collo leggermente più stretto */
  const width = (s, B) => {
    let w = B * Math.min(1, .1 + .9 * Math.pow(Math.min(1, s / .42), .75));
    if (s > .94) w *= .86;
    return w;
  };
  const f = n => n.toFixed(1);
  const deg = a => a * 180 / Math.PI;
  /** Generatore pseudo-casuale riproducibile */
  const rng = seed => () => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };

  /**
   * Restituisce il markup SVG di un serpente.
   * look: risultato di Morph.resolve; pts: punti guida coda→testa; opts: { B, uid, animated }
   */
  function svg(look, pts, { B = 22, uid = 'sn', animated = true } = {}) {
    const { P, total } = sample(pts, 160);
    const L = [], R = [];
    P.forEach(p => {
      const w = width(p.s, B) / 2, nx = -Math.sin(p.a), ny = Math.cos(p.a);
      L.push(`${f(p.x + nx * w)},${f(p.y + ny * w)}`);
      R.push(`${f(p.x - nx * w)},${f(p.y - ny * w)}`);
    });
    const outline = `M${L.join(' L')} L${R.reverse().join(' L')} Z`;
    const at = s => P[Math.min(P.length - 1, Math.max(0, Math.round(s * (P.length - 1))))];
    const bw = look.borderW || 2.2;
    let pattern = '';

    if (look.pattern === 'saddles' || look.pattern === 'motley') {
      const motley = look.pattern === 'motley';
      const step = B * (motley ? 1.05 : 1.2);
      for (let d = total * .1; d < total * .93; d += step) {
        const p = at(d / total), w = width(p.s, B);
        const rx = motley ? B * .62 : B * .3, ry = w * (motley ? .3 : .44);
        const tr = `rotate(${f(deg(p.a))} ${f(p.x)} ${f(p.y)})`;
        pattern += `<ellipse cx="${f(p.x)}" cy="${f(p.y)}" rx="${f(rx + bw)}" ry="${f(ry + bw)}" fill="${look.border}" transform="${tr}"/>`
          + `<ellipse cx="${f(p.x)}" cy="${f(p.y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${look.saddle}" transform="${tr}"/>`;
        if (!motley) {
          const q = at((d + step / 2) / total), wq = width(q.s, B);
          if (q.s < .93) [-1, 1].forEach(side => {
            const ox = q.x - Math.sin(q.a) * wq * .36 * side, oy = q.y + Math.cos(q.a) * wq * .36 * side;
            pattern += `<ellipse cx="${f(ox)}" cy="${f(oy)}" rx="${f(B * .17)}" ry="${f(wq * .1)}" fill="${look.saddle}" stroke="${look.border}" stroke-width="${f(bw * .5)}" opacity=".85" transform="rotate(${f(deg(q.a))} ${f(ox)} ${f(oy)})"/>`;
          });
        }
      }
    } else if (look.pattern === 'striped') {
      const line = off => P.filter(p => p.s > .06 && p.s < .95).map(p => { const w = width(p.s, B) * off; return `${f(p.x - Math.sin(p.a) * w)},${f(p.y + Math.cos(p.a) * w)}`; }).join(' ');
      pattern = `<polyline points="${line(0)}" fill="none" stroke="${look.border}" stroke-width="${f(B * .34)}" stroke-linecap="round" stroke-linejoin="round"/>`
        + `<polyline points="${line(0)}" fill="none" stroke="${look.saddle}" stroke-width="${f(B * .22)}" stroke-linecap="round" stroke-linejoin="round"/>`
        + `<polyline points="${line(.36)}" fill="none" stroke="${look.saddle}" stroke-width="${f(B * .07)}" stroke-linecap="round" opacity=".8"/>`
        + `<polyline points="${line(-.36)}" fill="none" stroke="${look.saddle}" stroke-width="${f(B * .07)}" stroke-linecap="round" opacity=".8"/>`;
    } else if (look.pattern === 'speckle') {
      const r = rng(7);
      P.forEach((p, i) => {
        if (i % 2 || p.s < .05 || p.s > .95) return;
        const w = width(p.s, B), off = (r() - .5) * w * .8;
        const x = p.x - Math.sin(p.a) * off, y = p.y + Math.cos(p.a) * off;
        pattern += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(.8 + r() * B * .07)}" fill="${look.speckles[Math.floor(r() * look.speckles.length)]}"/>`;
      });
    }

    // Lucentezza dorsale per dare volume
    const sheen = P.filter(p => p.s > .08 && p.s < .93).map(p => { const w = width(p.s, B) * .24; return `${f(p.x - Math.sin(p.a) * -w)},${f(p.y + Math.cos(p.a) * -w)}`; }).join(' ');

    // Testa orientata lungo l'ultima tangente
    const h = P[P.length - 1], W = B * .9;
    const head = `<g class="snake-head" transform="translate(${f(h.x)} ${f(h.y)}) rotate(${f(deg(h.a))})">
        <path class="${animated ? 'tongue' : ''}" d="M${f(W * 1.42)},0 L${f(W * 1.95)},0 M${f(W * 1.95)},0 L${f(W * 2.15)},-${f(W * .14)} M${f(W * 1.95)},0 L${f(W * 2.15)},${f(W * .14)}" stroke="#e2364a" stroke-width="1.5" stroke-linecap="round" fill="none" ${animated ? '' : 'style="display:none"'}/>
        <path d="M${f(-W * .25)},${f(-W * .5)} C${f(W * .45)},${f(-W * .64)} ${f(W * 1.15)},${f(-W * .52)} ${f(W * 1.45)},${f(-W * .12)} C${f(W * 1.52)},0 ${f(W * 1.52)},0 ${f(W * 1.45)},${f(W * .12)} C${f(W * 1.15)},${f(W * .52)} ${f(W * .45)},${f(W * .64)} ${f(-W * .25)},${f(W * .5)} Z" fill="${look.base}"/>
        ${look.pattern === 'none' || look.pattern === 'speckle' ? '' : `<path d="M${f(W * .05)},${f(-W * .3)} L${f(W * .85)},0 L${f(W * .05)},${f(W * .3)} L${f(W * .3)},0 Z" fill="${look.saddle}" stroke="${look.border}" stroke-width="${f(bw * .6)}" stroke-linejoin="round"/>`}
        <circle cx="${f(W * .98)}" cy="${f(-W * .27)}" r="${f(W * .13)}" fill="${look.eye}" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>
        <circle cx="${f(W * 1.01)}" cy="${f(-W * .3)}" r="${f(W * .04)}" fill="#fff" opacity=".85"/>
        <circle cx="${f(W * .98)}" cy="${f(W * .27)}" r="${f(W * .13)}" fill="${look.eye}" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>
        <circle cx="${f(W * 1.33)}" cy="${f(-W * .07)}" r="${f(W * .03)}" fill="rgba(0,0,0,.5)"/><circle cx="${f(W * 1.33)}" cy="${f(W * .07)}" r="${f(W * .03)}" fill="rgba(0,0,0,.5)"/>
      </g>`;

    return `<g class="snake-body${animated ? ' anim' : ''}">
        <path d="${outline}" transform="translate(0 ${f(B * .28)})" fill="rgba(0,0,0,.35)" filter="url(#${uid}-blur)"/>
        <defs><clipPath id="${uid}-clip"><path d="${outline}"/></clipPath><filter id="${uid}-blur" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="${f(B * .22)}"/></filter></defs>
        <path d="${outline}" fill="${look.base}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
        <g clip-path="url(#${uid}-clip)">${pattern}
          <polyline points="${sheen}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="${f(B * .16)}" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        ${head}
      </g>`;
  }

  /** Anteprima compatta (impostazioni, scheda) */
  const preview = (look, uid = 'pv') => `<svg viewBox="0 0 300 70" class="snake-preview" role="img" aria-label="Anteprima ${Utils.esc(look.label)}">
      ${svg(look, [[12, 42], [58, 30], [110, 46], [162, 28], [214, 44], [250, 34]], { B: 16, uid, animated: false })}</svg>`;

  return { svg, preview };
})();

/* ==========================================================================
   Terrarium — terrario interattivo con hotspot ambientali e serpente
   ========================================================================== */
const Terrarium = (() => {
  const VB = { w: 800, h: 440 };
  const HOT = {
    tempFredda: { x: 118, y: 150, icon: 'snow' },
    tempCalda: { x: 682, y: 170, icon: 'flame' },
    umidita: { x: 262, y: 322, icon: 'drop' }
  };
  /** Fase del giorno secondo l'orario delle luci impostato */
  function phase() {
    const p = Store.get().profile;
    const toMin = t => { const n = Utils.normTime(t); return n ? +n.slice(0, 2) * 60 + +n.slice(3) : null; };
    const on = toMin(p.luceOn), off = toMin(p.luceOff);
    if (on === null || off === null || on === off) return 'day';
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    const isOn = on < off ? (m >= on && m < off) : (m >= on || m < off);
    if (!isOn) return 'night';
    if (Math.abs(m - on) < 45) return 'dawn';
    if (Math.abs(off - m) < 45) return 'dusk';
    return 'day';
  }
  const PHASE_LABEL = { day: 'Luce accesa', dawn: 'Alba', dusk: 'Tramonto', night: 'Notte · luce spenta' };
  function tick() {
    const w = document.getElementById('terraWrap');
    if (w) { const ph = phase(); if (w.dataset.phase !== ph) { w.dataset.phase = ph; const l = document.getElementById('terraPhase'); if (l) l.innerHTML = phaseBadge(ph); } }
  }
  const phaseBadge = ph => `${I(ph === 'night' ? 'moon' : 'sun')} ${PHASE_LABEL[ph]}`;
  setInterval(tick, 60000);
  const SNAKE_PTS = [[318, 396], [370, 380], [424, 398], [484, 376], [540, 396], [594, 374], [638, 386], [676, 366]];
  let openKey = null;
  const colorOf = s => s === 'ok' ? '#4ade80' : s === 'warn' ? '#fbbf24' : s === 'bad' ? '#f87171' : '#64748b';

  /** Markup completo del terrario */
  function html() {
    const st = Store.get(), now = Logic.envNow();
    const look = Morph.resolve(st.profile.morph);
    const brum = Logic.brumState().active;
    const ph = phase();
    const btns = [];
    const spots = Object.entries(HOT).map(([k, pos]) => {
      const cur = now[k];
      const r = Logic.range(k), ev = Logic.evalParam(k, cur ? cur.v : null), c = colorOf(ev.status);
      const val = cur ? Utils.fmtNum(cur.v, k === 'umidita' ? '%' : '°') : '—';
      const chipW = 14 + val.length * 8.5;
      const left = k === 'tempCalda';
      btns.push(`<button type="button" class="hs-btn${left ? ' hs-left' : ''}" data-hotspot="${k}" aria-label="${r.label}: ${val}, ${ev.label}" style="left:${pos.x / VB.w * 100}%;top:${pos.y / VB.h * 100}%;--chip:${(chipW + 40) / VB.w * 100}%"></button>`);
      return `<g class="hotspot" data-hs="${k}" transform="translate(${pos.x} ${pos.y})" pointer-events="none">
          <circle class="hs-ring" r="20" fill="none" stroke="${c}" stroke-width="2"/>
          <circle class="hs-core" r="12" fill="${c}" fill-opacity=".22" stroke="${c}" stroke-width="2"/>
          <circle r="4" fill="${c}"/>
          <g transform="translate(${left ? -(chipW + 28) : 28} -13)">
            <rect width="${chipW}" height="26" rx="13" fill="rgba(9,10,13,.78)" stroke="${c}" stroke-opacity=".5"/>
            <text x="${chipW / 2}" y="17.5" text-anchor="middle" class="hs-text">${val}</text>
          </g>
        </g>`;
    }).join('');
    const heat = brum ? .12 : now.tempCalda ? Utils.clamp((now.tempCalda.v - 24) / 12, .15, 1) : .45;

    return `<div class="terra-wrap" id="terraWrap" data-phase="${ph}" data-brum="${brum ? 1 : 0}">
      <svg class="terra" viewBox="0 0 ${VB.w} ${VB.h}" role="group" aria-label="Terrario interattivo">
        <defs>
          <linearGradient id="tWall" x1="0" x2="1"><stop offset="0" stop-color="#0d1a24"/><stop offset=".5" stop-color="#121417"/><stop offset="1" stop-color="#26150e"/></linearGradient>
          <radialGradient id="tHeat" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(690 40) scale(330 300)"><stop offset="0" stop-color="#fb923c" stop-opacity="${f2(.55 * heat)}"/><stop offset=".45" stop-color="#f97316" stop-opacity="${f2(.18 * heat)}"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
          <radialGradient id="tCool" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 130) scale(260 240)"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
          <linearGradient id="tSub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5636"/><stop offset="1" stop-color="#3b2716"/></linearGradient>
          <pattern id="tGrain" width="14" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#a07850" opacity=".55"/><circle cx="10" cy="7" r=".9" fill="#2a1a0e" opacity=".6"/><rect x="6" y="1" width="3" height="1" fill="#c49a6c" opacity=".35" transform="rotate(25 7 1)"/></pattern>
          <linearGradient id="tWater" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#67e8f9" stop-opacity=".9"/><stop offset="1" stop-color="#0e7490" stop-opacity=".9"/></linearGradient>
          <linearGradient id="tGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="tBranch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b6440"/><stop offset="1" stop-color="#4e3520"/></linearGradient>
          <clipPath id="tClip"><rect x="10" y="10" width="780" height="420" rx="18"/></clipPath>
        </defs>
        <g clip-path="url(#tClip)">
          <rect x="10" y="10" width="780" height="420" fill="url(#tWall)"/>
          <rect x="10" y="10" width="780" height="420" fill="url(#tCool)"/>
          <rect x="10" y="10" width="780" height="420" fill="url(#tHeat)" class="heat-glow"/>

  /** Popover dettagliato per un hotspot */
  function openPop(key) {
    const wrap = document.getElementById('terraWrap'), pop = document.getElementById('terraPop');
    if (!wrap || !pop) return;
    if (openKey === key && !pop.classList.contains('hidden')) { closePop(); return; }
    openKey = key;
    const now = Logic.envNow(), cur = now[key], env = cur ? { datetime: cur.dt } : null;
    const r = Logic.range(key), v = cur ? cur.v : null, ev = Logic.evalParam(key, v);
    const night = now.tempNotte, nightEv = night ? Logic.evalParam('tempNotte', night.v) : null;
    const water = Logic.waterState();
    const span = Math.max(1, r.hi - r.lo), dMin = Math.min(r.lo - span * .75, v ?? r.lo), dMax = Math.max(r.hi + span * .75, v ?? r.hi);
    const pos = x => Utils.clamp((x - dMin) / (dMax - dMin) * 100, 0, 100);
    pop.innerHTML = `

        <div class="gauge-track" style="height:8px"><div class="gauge-band" style="left:${pos(r.lo)}%;width:${pos(r.hi) - pos(r.lo)}%"></div><div class="gauge-marker" style="left:${v === null ? 50 : pos(v)}%;color:${colorOf(ev.status)};width:14px;height:14px"></div></div>
        <p class="faint small" style="margin-top:10px">${r.brum ? 'Invernale' : 'Ottimale'} <b class="muted">${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit}</b> · lettura ${Utils.relTime(env.datetime)}<br>${Utils.fmtDateTime(env.datetime)}</p>
        ${key === 'tempFredda' && night ? `<p class="faint small" style="margin-top:6px">${I('moon')} Minima notturna <b class="c-${nightEv.status}">${Utils.fmtNum(night.v, '°C')}</b> · ${Utils.relTime(night.dt)}</p>` : ''}`
        : `<p class="muted small">Nessuna lettura registrata. Range ottimale ${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit}.</p>`}
      ${key === 'umidita' ? `<p class="faint small" style="margin-top:6px">💧 Acqua cambiata ${water.last ? `<b class="c-${water.status}">${Utils.relDays(water.days)}</b>` : '<b>mai</b>'} · ogni ${water.target} giorni</p>` : ''}
      <div class="row" style="margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" data-add="env">${I('plus')} Nuova lettura</button>
        ${key === 'umidita' ? `<button class="btn btn-sm" data-water>${I('check')} Acqua cambiata</button>` : ''}
      </div>`;
    pop.classList.remove('hidden');
    // Posizionamento accanto all'hotspot, entro i bordi del contenitore
    const W = wrap.clientWidth, H = wrap.clientHeight;
    if (W < 520) {
      // Su schermi stretti il pannello compare sotto il terrario, senza coprirlo
      Object.assign(pop.style, { position: 'relative', left: 'auto', top: 'auto', right: 'auto', bottom: 'auto', width: 'auto', marginTop: '10px' });
    } else {
      Object.assign(pop.style, { position: '', right: 'auto', bottom: 'auto', width: '', marginTop: '' });
      const hx = HOT[key].x / VB.w * W, hy = HOT[key].y / VB.h * H;
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = hx - pw / 2, top = hy + 30;
      if (top + ph > H - 6) top = hy - ph - 30;
      pop.style.left = `${Utils.clamp(left, 8, W - pw - 8)}px`;
      pop.style.top = `${Utils.clamp(top, 8, Math.max(8, H - ph - 8))}px`;
    }
    document.querySelectorAll('[data-hs]').forEach(h => h.classList.toggle('active', h.dataset.hs === key));
  }
  function closePop() {
    openKey = null;
    const pop = document.getElementById('terraPop');
    if (pop) pop.classList.add('hidden');
    document.querySelectorAll('[data-hs]').forEach(h => h.classList.remove('active'));
  }
  return { html, openPop, closePop, phase, tick, isOpen: () => openKey !== null };
})();

/* ==========================================================================
   Photos — diario fotografico (foto compresse e salvate in IndexedDB)
   ========================================================================== */
const Photos = (() => {
  const TAGS = ['Crescita', 'Muta', 'Sintomo', 'Terrario', 'Altro'];
  const urls = new Map();
  let rev = 0, cache = null;

  function loadImg(file) {
    return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('immagine non leggibile')); }; im.src = u; });
  }
  /** Riduce la foto a max 1280 px in JPEG: poche centinaia di KB */
  async function compress(file, max = 1280, q = 0.82) {
    let src;
    try { src = window.createImageBitmap ? await createImageBitmap(file) : await loadImg(file); } catch (e) { src = await loadImg(file); }
    const s = Math.min(1, max / Math.max(src.width, src.height));
    const c = document.createElement('canvas');
    c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (!blob) throw new Error('compressione non riuscita');
    return { blob, w: c.width, h: c.height };
  }
  async function add(file, { date, tag, note }) {
    const { blob, w, h } = await compress(file);
    const rec = { id: Utils.uid(), date: date || Utils.todayISO(), tag: TAGS.includes(tag) ? tag : 'Altro', note: (note || '').slice(0, 300), blob, w, h };
    await DB.put('photos', rec);
    rev++; cache = null;
    return rec;
  }
  async function list() {
    if (cache) return cache;
    try { cache = (await DB.all('photos')).sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)); } catch (e) { cache = []; }
    return cache;
  }
  function url(rec) {
    if (!urls.has(rec.id)) urls.set(rec.id, URL.createObjectURL(rec.blob));
    return urls.get(rec.id);
  }
  async function remove(id) {
    const rec = await DB.get('photos', id);
    await DB.del('photos', id);
    if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); }
    rev++; cache = null;
    return rec;
  }
  async function put(rec) { await DB.put('photos', rec); rev++; cache = null; }
  const toDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
  async function exportAll() {
    const l = await list();
    const out = [];
    for (const p of l) out.push({ id: p.id, date: p.date, tag: p.tag, note: p.note, w: p.w, h: p.h, dataUrl: await toDataURL(p.blob) });
    return out;
  }
  async function importOne(p) {
    if (await DB.get('photos', String(p.id || '')).catch(() => null)) return false;
    const blob = await (await fetch(p.dataUrl)).blob();
    await DB.put('photos', { id: String(p.id || Utils.uid()).slice(0, 48), date: Utils.isValidDate(p.date) ? p.date.slice(0, 10) : Utils.todayISO(), tag: TAGS.includes(p.tag) ? p.tag : 'Altro', note: typeof p.note === 'string' ? p.note.slice(0, 300) : '', blob, w: p.w || 0, h: p.h || 0 });
    rev++; cache = null;
    return true;
  }

  /** Modale per aggiungere una foto */
  function openAdd(presetTag = 'Crescita') {
    const body = `<form id="photoForm" novalidate>
        <div class="photo-drop" id="photoDrop">${I('camera')}<b>Scegli o scatta una foto</b><small>Viene ridotta e salvata solo su questo dispositivo</small></div>
        <input type="file" accept="image/*" id="photoFile" class="hidden">
        <div class="form-grid" style="margin-top:14px">
          <div class="field full" data-field="pdate"><label class="field-label" for="pdate">Data</label>
            <div class="input-wrap date-wrap"><input class="input" id="pdate" name="pdate" type="text" inputmode="numeric" maxlength="10" placeholder="gg/mm/aaaa" value="${Utils.toDMY(Utils.todayISO())}" data-date>
            <input type="date" class="date-native" tabindex="-1" aria-hidden="true" data-native-for="pdate" max="${Utils.todayISO()}">
            <button type="button" class="btn btn-sm btn-icon date-btn" data-pick="pdate" aria-label="Apri calendario">${I('calendar')}</button><button type="button" class="btn btn-sm date-btn" data-now="pdate">Oggi</button></div></div>
          <div class="field full"><span class="field-label">Categoria</span><div class="chips">${TAGS.map(t => `<label class="chip"><input type="radio" name="ptag" value="${t}" ${t === presetTag ? 'checked' : ''}>${t}</label>`).join('')}</div></div>
          <div class="field full"><label class="field-label" for="pnote">Nota</label><input class="input" id="pnote" name="pnote" maxlength="300" placeholder="Es. dopo la muta"></div>
        </div></form>`;
    const modal = Overlay.open({ title: `${I('camera')} Nuova foto`, body, footer: '<button class="btn btn-ghost" data-pclose>Annulla</button><button class="btn btn-primary" data-psave disabled>Salva foto</button>' });
    const form = modal.querySelector('#photoForm'), input = modal.querySelector('#photoFile'), drop = modal.querySelector('#photoDrop'), save = modal.querySelector('[data-psave]');
    Forms.bindDates(form);
    let file = null;
    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      file = input.files && input.files[0];
      if (!file) return;
      const u = URL.createObjectURL(file);
      drop.innerHTML = `<img src="${u}" alt="Anteprima">`;
      save.disabled = false;
    });
    modal.querySelector('[data-pclose]').addEventListener('click', () => Overlay.close());
    save.addEventListener('click', async () => {
      const date = Utils.fromDMY(form.elements.pdate.value);
      if (!date || date > Utils.todayISO()) { Toast.show('Data non valida: usa gg/mm/aaaa', 'warn'); return; }
      save.disabled = true; save.textContent = 'Salvo…';
      try {
        await add(file, { date, tag: (form.querySelector('input[name="ptag"]:checked') || {}).value, note: form.elements.pnote.value.trim() });
        Overlay.close();
        Toast.show('Foto salvata nel diario', 'ok');
        Views.tabs.salute = 'foto';
        if (Router.current === 'salute') Router.render(true); else Router.go('salute');
      } catch (e) { save.disabled = false; save.textContent = 'Salva foto'; Toast.show(`Foto non salvata: ${e.message}`, 'bad'); }
    });
    setTimeout(() => input.click(), 50);
  }

  /** Confronto prima/dopo con cursore */
  async function compare(idA, idB) {
    const l = await list();
    let a = l.find(p => p.id === idA), b = l.find(p => p.id === idB);
    if (!a || !b) return;
    if (a.date > b.date) [a, b] = [b, a];
    const wa = Logic.weightAt(a.date), wb = Logic.weightAt(b.date);
    const gap = Utils.daysBetween(a.date, b.date);
    const body = `<div class="cmp" id="cmp"><img src="${url(a)}" alt="Prima"><div class="cmp-top" id="cmpTop"><img src="${url(b)}" alt="Dopo"></div><div class="cmp-line" id="cmpLine"></div>
        <span class="cmp-tag l">${Utils.fmtDate(a.date)}${wa !== null ? ' · ' + Utils.fmtNum(wa, 'g') : ''}</span><span class="cmp-tag r">${Utils.fmtDate(b.date)}${wb !== null ? ' · ' + Utils.fmtNum(wb, 'g') : ''}</span></div>
      <input type="range" min="0" max="100" value="50" class="cmp-range" id="cmpRange" aria-label="Sposta il confronto">
      <p class="muted small" style="margin-top:8px">${Utils.plural(gap, 'giorno', 'giorni')} tra le due foto${wa !== null && wb !== null ? ` · ${wb - wa >= 0 ? '+' : ''}${Utils.fmtNum(Utils.round(wb - wa, 1), 'g')}` : ''}</p>`;
    const modal = Overlay.open({ title: `${I('compare')} Prima e dopo`, body, size: 'lg' });
    const r = modal.querySelector('#cmpRange'), top = modal.querySelector('#cmpTop'), line = modal.querySelector('#cmpLine');
    const upd = () => { top.style.clipPath = `inset(0 0 0 ${r.value}%)`; line.style.left = `${r.value}%`; };
    r.addEventListener('input', upd); upd();
  }
  return { TAGS, add, list, url, remove, put, exportAll, importOne, openAdd, compare, get rev() { return rev; } };
})();

/* ==========================================================================
   CSVImport — letture da termoigrometri e sensori (file CSV esportati)
   ========================================================================== */
const CSVImport = (() => {
  const TARGETS = [['', 'Ignora'], ['tempCalda', 'Zona calda'], ['tempFredda', 'Zona fredda'], ['umidita', 'Umidità'], ['tempNotte', 'Notte']];

  function splitLine(line, sep) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (c === sep && !q) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(s => s.trim());
  }
  function parse(text) {
    const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) throw new Error('il file non contiene righe di dati');
    const first = lines[0];
    const sep = [';', '\t', ','].map(s => [s, first.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
    const head = splitLine(first, sep);
    const rows = lines.slice(1).map(l => splitLine(l, sep)).filter(r => r.length >= 2);
    return { head, rows, sep };
  }
  /** Interpreta date e ore nei formati più comuni; dmy decide tra 20/11 e 11/20 */
  function parseDT(s, dmy) {
    if (!s) return null;
    s = s.trim();
    if (/^\d{10}(\d{3})?$/.test(s)) { const d = new Date(+s * (s.length === 10 ? 1000 : 1)); return isNaN(d) ? null : d; }
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[T ]?(\d{1,2})?:?(\d{2})?/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 12), +(m[5] || 0));
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})[ ,T]*(\d{1,2})?:?(\d{2})?(?::\d{2})?\s*(AM|PM)?/i);
    if (m) {
      let y = +m[3]; if (y < 100) y += 2000;
      const dd = dmy ? +m[1] : +m[2], mm = dmy ? +m[2] : +m[1];
      let h = +(m[4] || 12); if (m[6]) { if (/pm/i.test(m[6]) && h < 12) h += 12; if (/am/i.test(m[6]) && h === 12) h = 0; }
      const d = new Date(y, mm - 1, dd, h, +(m[5] || 0));
      return isNaN(d) || d.getMonth() !== mm - 1 ? null : d;
    }
    return null;
  }
  function analyze(p) {
    const lower = p.head.map(h => h.toLowerCase());
    let dateCol = lower.findIndex(h => /time|date|data|ora|timestamp|giorno/.test(h));
    if (dateCol < 0) dateCol = 0;
    const timeCol = lower.findIndex((h, i) => i !== dateCol && /^(ora|time|hour)$/.test(h));
    const sample = p.rows.slice(0, 200).map(r => r[dateCol] || '');
    const firsts = sample.map(s => (s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]/) || []).slice(1).map(Number)).filter(x => x.length);
    const dmy = !firsts.some(([a, b]) => b > 12 && a <= 12);
    const cols = p.head.map((h, i) => {
      if (i === dateCol || i === timeCol) return null;
      const nums = p.rows.slice(0, 50).map(r => Utils.num(r[i])).filter(v => v !== null);
      if (nums.length < 1) return null;
      const lh = lower[i];
      const f = /°f|\(f\)|fahrenheit|_f\b|\bf\b/.test(lh);
      let target = '';
      if (/hum|umid|rh|%/.test(lh)) target = 'umidita';
      else if (/temp|°c|°f|celsius|fahrenheit/.test(lh)) target = /fredd|cold|cool/.test(lh) ? 'tempFredda' : /nott|night/.test(lh) ? 'tempNotte' : 'tempCalda';
      return { i, name: h || `Colonna ${i + 1}`, target, f, sample: nums[0] };
    }).filter(Boolean);
    // Se ci sono due temperature senza nome chiaro, la seconda va alla zona fredda
    const temps = cols.filter(c => c.target === 'tempCalda');
    if (temps.length > 1) temps.slice(1).forEach(c => { c.target = 'tempFredda'; });
    return { dateCol, timeCol, dmy, cols };
  }
  /** Raggruppa per intervallo (ore) e fa la media */
  function build(p, a, mapping, hours) {
    const buckets = new Map();
    let bad = 0;
    for (const r of p.rows) {
      const d = parseDT(a.timeCol >= 0 ? `${r[a.dateCol]} ${r[a.timeCol]}` : r[a.dateCol], a.dmy);
      if (!d) { bad++; continue; }
      const k = hours ? Math.floor(d.getTime() / (hours * 3600000)) : d.getTime();
      const b = buckets.get(k) || { d, sums: {}, n: {} };
      for (const c of a.cols) {
        const t = mapping[c.i]; if (!t) continue;
        let v = Utils.num(r[c.i]); if (v === null) continue;
        if (c.f && t !== 'umidita') v = (v - 32) * 5 / 9;
        b.sums[t] = (b.sums[t] || 0) + v; b.n[t] = (b.n[t] || 0) + 1;
      }
      buckets.set(k, b);
    }
    const existing = new Set(Store.get().logs.env.map(e => e.datetime));
    const out = [];
    for (const b of buckets.values()) {
      const e = { datetime: Utils.toLocalDT(b.d), note: 'Importata da CSV' };
      let any = false;
      for (const t of ['tempCalda', 'tempFredda', 'umidita', 'tempNotte']) { e[t] = b.n[t] ? Utils.round(b.sums[t] / b.n[t], t === 'umidita' ? 0 : 1) : null; if (e[t] !== null) any = true; }
      if (any && !existing.has(e.datetime)) out.push(e);
    }
    return { entries: out.sort((x, y) => x.datetime.localeCompare(y.datetime)), bad };
  }

  async function open(file) {
    if (!file) return;
    let p, a;
    try { p = parse(await file.text()); a = analyze(p); } catch (e) { Toast.show(`CSV non leggibile: ${e.message}`, 'bad'); return; }
    if (!a.cols.length) { Toast.show('Nel file non ho trovato colonne con numeri', 'bad'); return; }
    const body = `<p class="muted small">${Utils.plural(p.rows.length, 'riga', 'righe')} · colonna data: <b>${Utils.esc(p.head[a.dateCol] || '1')}</b> · formato ${a.dmy ? 'giorno/mese' : 'mese/giorno'}</p>
      <div class="csv-map">${a.cols.map(c => `<div class="setting-row"><div><b>${Utils.esc(c.name)}</b><p>Esempio: ${Utils.fmtNum(c.sample)}${c.f ? ' °F (convertito in °C)' : ''}</p></div>
        <select class="input csv-sel" data-col="${c.i}" style="width:auto">${TARGETS.map(([v, l]) => `<option value="${v}" ${v === c.target ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`).join('')}</div>
      <div class="field" style="margin-top:12px"><span class="field-label">Una lettura ogni</span><div class="chips">${[[1, '1 ora'], [3, '3 ore'], [6, '6 ore'], [0, 'tutte']].map(([v, l]) => `<label class="chip"><input type="radio" name="csvH" value="${v}" ${v === 3 ? 'checked' : ''}>${l}</label>`).join('')}</div>
      <span class="field-hint">I sensori registrano spesso ogni minuto: raggruppo e faccio la media.</span></div>
      <p class="small" id="csvPrev" style="margin-top:10px"></p>`;
    const modal = Overlay.open({ title: `${I('table')} Importa letture da CSV`, subtitle: Utils.esc(file.name), body, footer: '<button class="btn btn-ghost" data-cclose>Annulla</button><button class="btn btn-primary" data-cgo>Importa</button>' });
    const prev = modal.querySelector('#csvPrev');
    const current = () => {
      const mapping = {}; modal.querySelectorAll('.csv-sel').forEach(s => { mapping[+s.dataset.col] = s.value; });
      const h = +(modal.querySelector('input[name="csvH"]:checked') || {}).value || 0;
      return build(p, a, mapping, h);
    };
    const refresh = () => {
      const { entries, bad } = current();
      prev.innerHTML = entries.length ? `Pronte <b>${Utils.plural(entries.length, 'lettura', 'letture')}</b> dal ${Utils.fmtDateTime(entries[0].datetime)} al ${Utils.fmtDateTime(entries[entries.length - 1].datetime)}${bad ? ` · <span class="c-warn">${bad} righe con data non leggibile</span>` : ''}` : '<span class="c-warn">Nessuna lettura nuova da importare con queste scelte.</span>';
    };
    modal.addEventListener('change', refresh); refresh();
    modal.querySelector('[data-cclose]').addEventListener('click', () => Overlay.close());
    modal.querySelector('[data-cgo]').addEventListener('click', async () => {
      const { entries } = current();
      if (!entries.length) { Toast.show('Niente da importare', 'warn'); return; }
      if (entries.length > 5000) { Toast.show('Troppe letture: scegli un intervallo più ampio', 'warn'); return; }
      Overlay.close();
      await Safety.snapshot('Prima dell\'import CSV');
      const n = Store.addMany('env', entries);
      Toast.show(`Importate ${Utils.plural(n, 'lettura', 'letture')}`, 'ok', { action: Actions.undoAction() });
    });
  }
  return { open, parseDT, parse, analyze, build };
})();

        <div class="vs-meta"><b>Scheda per il veterinario</b><br>Ultimi 90 giorni · creata il ${Utils.toDMY(Utils.todayISO())}<br>SNAKEcheck</div></header>

        <div><span>Terrario</span><b>${esc(p.terrarioDimensioni || '—')}</b></div>
