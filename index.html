  }
  function show(msg, type = 'ok', { duration = null, action = null } = {}) {
    const host = document.getElementById('toasts');
    if (!host) return;
    // Con "Annulla" serve più tempo per decidere
    if (duration === null) duration = action ? 6000 : 3800;
    const el = document.createElement('div');
    el.className = `toast t-${type} enter`;
    el.setAttribute('role', type === 'bad' ? 'alert' : 'status');
    el.innerHTML = `<span class="badge b-${type === 'info' ? 'info' : type}" style="width:22px;padding:0;justify-content:center">${ICONS[type] || ''}</span>
      <span class="t-msg">${Utils.esc(msg)}</span>
      ${action ? `<button class="t-action">${Utils.esc(action.label)}</button>` : ''}
      <button class="t-close" aria-label="Chiudi notifica">✕</button>
      <span class="t-progress" style="animation-duration:${duration}ms"></span>`;
    flip(host, () => {
      const live = [...host.children].filter(c => !c.classList.contains('leaving'));
      if (live.length >= 4) live[0].remove();
      host.appendChild(el);
    });
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
    let timer = null, remaining = duration, started = Date.now();
    const close = (dx = 0) => {
      clearTimeout(timer);
      if (el.classList.contains('leaving')) return;
      el.classList.add('leaving');
      if (dx) el.style.transform = `translateX(${dx > 0 ? 110 : -110}%)`;
      setTimeout(() => flip(host, () => el.remove()), 190);
    };
    const start = () => { started = Date.now(); clearTimeout(timer); timer = setTimeout(close, remaining); };
    const pause = () => { clearTimeout(timer); remaining -= Date.now() - started; el.classList.add('paused'); };
    el.addEventListener('mouseenter', pause);
    el.addEventListener('mouseleave', () => { el.classList.remove('paused'); start(); });
    el.querySelector('.t-close').addEventListener('click', () => close());
    if (action) el.querySelector('.t-action').addEventListener('click', () => { action.run(); close(); });
    // Scorrere di lato per chiudere (telefono e trackpad)
    let x0 = null, dx = 0, v = 0, lx = 0, lt = 0;
    el.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      x0 = e.clientX; dx = 0; v = 0; lx = e.clientX; lt = performance.now();
      el.classList.add('dragging'); pause();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* */ }
    });
    el.addEventListener('pointermove', e => {
      if (x0 === null) return;
      const t = performance.now(); if (t > lt) v = (e.clientX - lx) / (t - lt);
      lx = e.clientX; lt = t; dx = e.clientX - x0;
      el.style.transform = `translateX(${dx}px)`; el.style.opacity = String(Math.max(.2, 1 - Math.abs(dx) / 240));
    });
    const end = () => {
      if (x0 === null) return;
      x0 = null; el.classList.remove('dragging'); el.style.opacity = '';
      if (Math.abs(dx) > 80 || Math.abs(v) > .6) close(dx || v);
      else { el.style.transform = ''; el.classList.remove('paused'); start(); }
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    start();
  }
  return { show };
})();

/* ==========================================================================
   Overlay — modali / bottom sheet e conferme
   ========================================================================== */
const Overlay = (() => {
  let current = null, lastFocus = null, swappedAt = 0;
  const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]):not([type=hidden]):not([tabindex="-1"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function open({ title, subtitle = '', body, footer = '', size = '', onClose = null, guard = null }) {
    close(true);
    lastFocus = document.activeElement;
    const host = document.getElementById('overlayHost');
    host.querySelectorAll('.overlay.closing').forEach(o => o.remove());   // niente doppioni durante l'uscita
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="grabber"></div>
        <div class="modal-head"><div><h2 id="modalTitle">${title}</h2>${subtitle ? `<p>${subtitle}</p>` : ''}</div>
          <button class="btn btn-ghost btn-icon btn-sm" data-close aria-label="Chiudi">${I('x')}</button></div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
      </div>`;
    host.appendChild(wrap);
    // Un pannello che ne sostituisce un altro (es. "Registra" → modulo) cambia sul posto, senza risalire
    if (performance.now() - swappedAt < 80) wrap.classList.add('open', 'swap');
    else { void wrap.offsetWidth; wrap.classList.add('open'); }
    current = { el: wrap, onClose, guard };
    // Il Tab resta dentro il pannello
    wrap.addEventListener('keydown', e => {
      if (e.key !== 'Tab') return;
      const f = [...wrap.querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || !wrap.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    enableDrag(wrap.querySelector('.modal'));
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) request(); });
    wrap.querySelector('[data-close]').addEventListener('click', () => request());
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => {
      const f = wrap.querySelector('.modal-body input:not([type=radio]):not([type=hidden]), .modal-body textarea, .modal-body button, .modal-foot .btn-primary');
      // Solo se l'utente non ha già scelto un campo: il focus non gli viene "rubato"
      if (f && !wrap.contains(document.activeElement) && window.matchMedia('(min-width: 641px)').matches) f.focus({ preventScroll: true });
    });
    return wrap.querySelector('.modal');
  }

  /**
   * Chiusura chiesta dall'utente (sfondo, X, Esc, trascinamento, Annulla).
   * Se il pannello ha modifiche non salvate chiede prima se scartarle.
   */
  function request() {
    if (!current) return false;
    const c = current;
    if (c.guard && !c.asking && c.guard()) {
      c.asking = true;
      const modal = c.el.querySelector('.modal');
      const bar = document.createElement('div');
      bar.className = 'discard-bar';
      bar.setAttribute('role', 'alertdialog');
      bar.innerHTML = `<span>Hai inserito dei dati. Vuoi scartarli?</span><div class="row"><button class="btn btn-sm btn-ghost" data-keep-edit>Continua</button><button class="btn btn-sm btn-danger" data-discard>Scarta</button></div>`;
      modal.appendChild(bar);
      const stay = () => { c.asking = false; bar.remove(); };
      bar.querySelector('[data-keep-edit]').addEventListener('click', stay);
      bar.querySelector('[data-discard]').addEventListener('click', () => close());
      bar.querySelector('[data-keep-edit]').focus({ preventScroll: true });
      return false;
    }
    close();
    return true;
  }

  function close(immediate = false) {
    if (!current) return;
    const { el, onClose } = current;
    current = null;
    document.body.style.overflow = '';
    if (immediate) { el.remove(); swappedAt = performance.now(); }
    else {
      // Si toglie "open": la transizione torna indietro dal punto in cui si trova
      el.classList.add('closing'); el.classList.remove('open', 'swap');
      el.style.pointerEvents = 'none';
      const m = el.querySelector('.modal'); if (m) m.style.transform = '';
      setTimeout(() => el.remove(), 260);
    }
    if (onClose) onClose();
    if (!immediate && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }

  /** Su telefono il pannello si chiude trascinandolo verso il basso dalla maniglia o dal titolo */
  function enableDrag(modal) {
    let y0 = null, dy = 0, pid = null, lastY = 0, lastT = 0, vel = 0;
    const start = e => {
      if (!window.matchMedia('(max-width: 640px)').matches || e.target.closest('button, input, a')) return;
      y0 = e.clientY; dy = 0; pid = e.pointerId; lastY = e.clientY; lastT = performance.now(); vel = 0;
      modal.style.transition = 'none';
      try { modal.setPointerCapture(pid); } catch (err) { /* ignorato */ }
    };
    const move = e => {
      if (y0 === null) return;
      const t = performance.now();
      if (t > lastT) vel = vel * .3 + ((e.clientY - lastY) / (t - lastT)) * .7;   // px/ms, smussata
      lastY = e.clientY; lastT = t;
      dy = Math.max(0, e.clientY - y0);
      modal.style.transform = `translateY(${dy}px)`;
    };
    const end = () => {
      if (y0 === null) return;
      y0 = null;
      try { modal.releasePointerCapture(pid); } catch (err) { /* ignorato */ }
      modal.style.transition = '';
      // Si chiude con uno spostamento ampio o con un gesto veloce verso il basso
      if ((dy > 110 || (vel > .5 && dy > 24)) && request()) return;
      modal.style.transform = '';
    };
    modal.querySelectorAll('.grabber, .modal-head').forEach(el => el.addEventListener('pointerdown', start));
    modal.addEventListener('pointermove', move);
    modal.addEventListener('pointerup', end);
    modal.addEventListener('pointercancel', end);
  }

  /** Conferma asincrona; con requireText va digitata una parola */
  function confirm({ title, message, confirmLabel = 'Conferma', danger = false, requireText = null }) {
    return new Promise(resolve => {
      let done = false;
      const finish = v => { if (!done) { done = true; resolve(v); } };
      const modal = open({
        title: Utils.esc(title), size: 'sm',
        body: `<p class="muted">${message}</p>${requireText ? `<div class="field" style="margin-top:14px"><label class="field-label" for="confirmText">Digita ${Utils.esc(requireText)} per confermare</label><input class="input" id="confirmText" autocomplete="off" autocapitalize="characters"></div>` : ''}`,
        footer: `<button class="btn btn-ghost" data-no>Annulla</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes ${requireText ? 'disabled' : ''}>${Utils.esc(confirmLabel)}</button>`,
        onClose: () => finish(false)
      });
      const yes = modal.querySelector('[data-yes]');
      if (requireText) {
        const inp = modal.querySelector('#confirmText');
        inp.addEventListener('input', () => { yes.disabled = inp.value.trim().toUpperCase() !== requireText; });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !yes.disabled) yes.click(); });
      }
      modal.querySelector('[data-no]').addEventListener('click', () => { finish(false); close(); });
      yes.addEventListener('click', () => { finish(true); close(); });
    });
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !current) return;
    if (current.asking) { const k = current.el.querySelector('[data-keep-edit]'); if (k) k.click(); return; }
    request();
  });
  return { open, close, request, confirm, isOpen: () => !!current };
})();

/* ==========================================================================
   Forms — generazione form dai metadati, scorciatoie, validazione, feedback live
   ========================================================================== */
const Forms = (() => {
  const defaultValue = f => {
    if (f.type === 'date') return f.required ? Utils.todayISO() : '';
    if (f.type === 'datetime-local') return Utils.nowLocal();
    if (f.type === 'select') return f.required ? f.options[0] : '';
    return '';
  };

  /** Campo data in formato gg/mm/aaaa con calendario nativo di supporto */
  function dateControl(f, id, iso, withTime) {
    const d = iso ? iso.slice(0, 10) : '';
    const tm = withTime && iso && Utils.hasTime(iso) ? iso.slice(11, 16) : '';
    return `<div class="input-wrap date-wrap">
        <input class="input" id="${id}" name="${f.name}" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="gg/mm/aaaa" value="${Utils.toDMY(d)}" data-date ${f.required ? 'required' : ''}>
        ${withTime ? `<input class="input time-input" name="${f.name}__time" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="hh:mm" value="${tm}" aria-label="Ora" data-time>` : ''}
        <input type="date" class="date-native" tabindex="-1" aria-hidden="true" data-native-for="${f.name}" ${f.future ? '' : `max="${Utils.todayISO()}"`}>
        <button type="button" class="btn btn-sm btn-icon date-btn" data-pick="${f.name}" aria-label="Apri calendario">${I('calendar')}</button>
        <button type="button" class="btn btn-sm date-btn" data-now="${f.name}" data-kind="${f.type}">${withTime ? 'Adesso' : 'Oggi'}</button>
        ${!f.required ? `<button type="button" class="btn btn-sm btn-ghost btn-icon date-btn" data-date-clear="${f.name}" aria-label="Svuota data">${I('x')}</button>` : ''}
      </div>`;
  }

  function fieldHTML(type, f, value, uidp) {
    const id = `${uidp}-${f.name}`;
    const label = `<span>${Utils.esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</span>`;
    const v = value === null || value === undefined ? '' : value;
    let control = '', extra = '';
    if (f.type === 'select') {
      control = `<div class="chips" role="radiogroup" aria-label="${Utils.esc(f.label)}">${f.options.map((o, i) => `
        <label class="chip"><input type="radio" name="${f.name}" value="${Utils.esc(o)}" ${o === v ? 'checked' : ''} ${i === 0 && f.required ? 'required' : ''} ${f.required ? '' : 'data-toggle'}>${Utils.esc(o)}</label>`).join('')}</div>${f.required ? '' : '<span class="field-hint">Facoltativo: tocca di nuovo per togliere la scelta</span>'}`;
      return `<div class="field${f.full ? ' full' : ''}" data-field="${f.name}"><div class="field-label">${label}</div>${control}</div>`;
    }
    if (f.type === 'textarea') {
      control = `<textarea class="input" id="${id}" name="${f.name}" rows="2" maxlength="1000" placeholder="${Utils.esc(f.placeholder || '')}">${Utils.esc(v)}</textarea>`;
    } else if (f.type === 'text') {
      control = `<input class="input" id="${id}" name="${f.name}" type="text" maxlength="120" value="${Utils.esc(v)}" placeholder="${Utils.esc(f.placeholder || '')}" ${f.required ? 'required' : ''}>`;
    } else if (f.type === 'date' || f.type === 'datetime-local') {
      control = dateControl(f, id, v, f.type === 'datetime-local');
    } else {
      control = `<div class="input-wrap"><input class="input${f.unit ? ' has-unit' : ''}" id="${id}" name="${f.name}" type="number" inputmode="decimal" value="${Utils.esc(v)}" step="${f.step}" min="${f.min}" max="${f.max}" ${f.required ? 'required' : ''} placeholder="${Schema.LOGS[type].atLeastOne ? '—' : '0'}">${f.unit ? `<span class="unit">${f.unit}</span>` : ''}</div>`;
    }
    if (f.gauge) extra = `<span class="field-hint" data-gauge-hint="${f.gauge}"></span>`;
    else if (f.hint) extra = `<span class="field-hint" data-hint="${f.hint}"></span>`;
    const badge = f.gauge ? `<span data-gauge-badge="${f.gauge}"></span>` : '';
    return `<div class="field${f.full ? ' full' : ''}" data-field="${f.name}"><label class="field-label" for="${id}">${label}${badge}</label>${control}${extra}</div>`;
  }

  /** Valore ISO di un campo data del form (gg/mm/aaaa -> aaaa-mm-gg) */
  const dateVal = (form, name) => form.elements[name] ? Utils.fromDMY(form.elements[name].value) : '';

  /** Apre il modale di creazione/modifica per un registro */
  function open(type, { id = null, presets = {} } = {}) {
    const def = Schema.LOGS[type];
    const entry = id ? Store.find(type, id) : null;
    if (id && !entry) { Toast.show('Voce non trovata', 'warn'); return; }
    const values = {};
    def.fields.forEach(f => { values[f.name] = entry ? entry[f.name] : defaultValue(f); });
    // Nuovo pasto: proposto uguale all'ultimo
    if (!entry && type === 'feeding') {
      const last = Logic.lastMealTemplate();
      if (last) Object.assign(values, { preda: last.preda, pesoPreda: last.pesoPreda, statoPreda: last.statoPreda });
    }
    Object.assign(values, presets);
    const uidp = 'fm' + Math.random().toString(36).slice(2, 7);
    const body = `<form id="logForm" data-type="${type}" ${id ? `data-id="${Utils.esc(id)}"` : ''} novalidate>
        ${def.atLeastOne ? `<p class="faint small" style="margin-bottom:10px">Compila solo i valori che hai misurato.</p>` : ''}
        <div class="form-grid">${def.fields.map(f => fieldHTML(type, f, values[f.name], uidp)).join('')}</div>
      </form>`;
    const footer = `${id ? `<button class="btn btn-danger" data-form-delete style="margin-right:auto">Elimina</button>` : ''}
      <button class="btn btn-ghost" data-close-form>Annulla</button>
      <button class="btn btn-primary" data-submit-form>${id ? 'Salva modifiche' : `Registra ${def.label.toLowerCase()}`}</button>`;
    let initial = null;
    const modal = Overlay.open({ title: `${I(def.icon)} ${id ? 'Modifica' : (def.g === 'm' ? 'Nuovo' : 'Nuova')} ${def.label.toLowerCase()}`, subtitle: def.desc, body, footer,
      guard: () => initial !== null && snapshot(form) !== initial });
    const form = modal.querySelector('#logForm');
    initial = snapshot(form);
    modal.querySelector('[data-close-form]').addEventListener('click', () => Overlay.request());
    modal.querySelector('[data-submit-form]').addEventListener('click', () => submit(form));
    form.addEventListener('submit', e => { e.preventDefault(); submit(form); });
    form.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(form); });
    const del = modal.querySelector('[data-form-delete]');
    if (del) del.addEventListener('click', () => { Overlay.close(); Actions.remove(type, id); });
    bindDates(form, () => live(form));
    // Scelte facoltative: secondo tocco toglie la selezione
    form.addEventListener('pointerdown', e => { const r = e.target.closest('.chip') && e.target.closest('.chip').querySelector('input[data-toggle]'); if (r) r.dataset.was = r.checked ? '1' : ''; });
    form.addEventListener('click', e => {
      const r = e.target.closest('.chip') && e.target.closest('.chip').querySelector('input[data-toggle]');
      if (r && r.dataset.was === '1' && e.target === r) { r.checked = false; r.dataset.was = ''; }
    });
    form.addEventListener('input', e => { const f = e.target.closest('.field'); if (f) f.classList.remove('invalid'); live(form, e.target); });
    form.addEventListener('change', e => live(form, e.target));
    live(form);
  }

  /** Contenuto del form come testo, per capire se è stato modificato */
  const snapshot = form => JSON.stringify([...new FormData(form).entries()]);

  /** Comportamento dei campi data: maschera gg/mm/aaaa, calendario, Oggi/Adesso, svuota */
  const boundDates = new WeakSet();
  function bindDates(root, onChange = () => {}) {
    if (!root || boundDates.has(root)) return;   // la vista si aggiorna senza ricreare il form
    boundDates.add(root);
    root.addEventListener('input', e => {
      const t = e.target;
      if (t.matches('[data-date]') && e.inputType && !e.inputType.startsWith('delete')) {
        const d = t.value.replace(/\D/g, '').slice(0, 8);
        t.value = d.length > 4 ? `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;
      }
      if (t.matches('[data-time]') && e.inputType && !e.inputType.startsWith('delete')) {
        const d = t.value.replace(/\D/g, '').slice(0, 4);
        t.value = d.length > 2 ? `${d.slice(0, 2)}:${d.slice(2)}` : d;
      }
    });
    root.addEventListener('blur', e => {
      if (e.target.matches('[data-time]')) { const n = Utils.normTime(e.target.value); if (n) e.target.value = n; }
    }, true);
    root.addEventListener('change', e => {
      const n = e.target.closest('[data-native-for]');
      if (n && n.value) { root.querySelector(`[name="${n.dataset.nativeFor}"]`).value = Utils.toDMY(n.value); onChange(root.querySelector(`[name="${n.dataset.nativeFor}"]`)); }
    });
    root.addEventListener('click', e => {
      const pick = e.target.closest('[data-pick]');
      if (pick) {
        const native = root.querySelector(`[data-native-for="${pick.dataset.pick}"]`);
        native.value = Utils.fromDMY(root.querySelector(`[name="${pick.dataset.pick}"]`).value) || Utils.todayISO();
        try { if (native.showPicker) native.showPicker(); else native.click(); } catch (err) { native.click(); }
      }
      const now = e.target.closest('[data-now]');
      if (now) {
        root.querySelector(`[name="${now.dataset.now}"]`).value = Utils.toDMY(Utils.todayISO());
        const tm = root.querySelector(`[name="${now.dataset.now}__time"]`);
        if (tm) tm.value = Utils.nowLocal().slice(11, 16);
        onChange(root.querySelector(`[name="${now.dataset.now}"]`));
      }
      const clr = e.target.closest('[data-date-clear]');
      if (clr) { root.querySelector(`[name="${clr.dataset.dateClear}"]`).value = ''; onChange(root.querySelector(`[name="${clr.dataset.dateClear}"]`)); }
    });
  }

  /** Feedback in tempo reale: badge soglie, rapporto preda, variazione peso, logica muta */
  function live(form, target = null) {
    const type = form.dataset.type;
    if (type === 'env') {
      Logic.ENV_KEYS.forEach(k => {
        const r = Logic.range(k);
        const hint = form.querySelector(`[data-gauge-hint="${k}"]`);
        const badge = form.querySelector(`[data-gauge-badge="${k}"]`);
        if (hint) hint.textContent = `${r.brum ? 'Invernale' : 'Ottimale'} ${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit}`;
        const ev = Logic.evalParam(k, form.elements[k].value);
        if (badge) badge.innerHTML = ev.status === 'neutral' ? '' : `<span class="badge b-${ev.status}">${ev.label}</span>`;
      });
    }
    if (type === 'feeding') {
      const hint = form.querySelector('[data-hint="ratio"]');
      const w = Logic.weightAt(dateVal(form, 'data') || Utils.todayISO());
      const r = Logic.ratio(form.elements.pesoPreda.value, w);
      if (hint) {
        if (w === null) hint.textContent = 'Registra il peso del serpente per calcolare il rapporto.';
        else if (r === null) hint.textContent = `Peso serpente di riferimento: ${Utils.fmtNum(w, 'g')}`;
        else hint.innerHTML = `Rapporto <b class="c-${Logic.ratioStatus(r)}">${Utils.fmtNum(r, '%')}</b> su ${Utils.fmtNum(w, 'g')} · ${Logic.ratioLabel(r)}`;
      }
    }
    if (type === 'growth') {
      const hint = form.querySelector('[data-hint="growth"]');
      const prev = Store.get().logs.growth.find(g => g.peso !== null && g.id !== form.dataset.id && g.data <= (dateVal(form, 'data') || Utils.todayISO()));
      const w = Utils.num(form.elements.peso.value);
      if (hint) {
        if (!prev) hint.textContent = 'Prima misurazione di peso';
        else if (w === null) hint.textContent = `Precedente: ${Utils.fmtNum(prev.peso, 'g')} (${Utils.fmtDateShort(prev.data)})`;
        else { const d = Utils.round(w - prev.peso, 1); const pct = prev.peso ? Utils.round(d / prev.peso * 100, 1) : 0; hint.innerHTML = `<b class="c-${d >= 0 ? 'ok' : pct <= -10 ? 'bad' : 'warn'}">${d >= 0 ? '+' : ''}${Utils.fmtNum(d, 'g')}</b> (${d >= 0 ? '+' : ''}${Utils.fmtNum(pct, '%')}) rispetto al ${Utils.fmtDateShort(prev.data)}`; }
      }
    }
    if (type === 'shed' && target && target.name === 'esito') {
      const fine = form.elements.dataFine;
      if (target.value === 'In corso') fine.value = '';
      else if (!fine.value) fine.value = Utils.toDMY(Utils.todayISO());
    }
    if (type === 'shed' && target && target.name === 'dataFine') {
      const esitoIn = form.querySelector('input[name="esito"]:checked');
      if (target.value && esitoIn && esitoIn.value === 'In corso') { const c = form.querySelector('input[name="esito"][value="Completa"]'); if (c) c.checked = true; }
      if (!target.value) { const c = form.querySelector('input[name="esito"][value="In corso"]'); if (c) c.checked = true; }
    }
  }

  /** Legge e valida il form */
  function read(form) {
    const def = Schema.LOGS[form.dataset.type];
    const data = {};
    let error = null;
    const today = Utils.todayISO();
    for (const f of def.fields) {
      const wrap = form.querySelector(`[data-field="${f.name}"]`);
      wrap.classList.remove('invalid');
      let v;
      if (f.type === 'select') { const c = form.querySelector(`input[name="${f.name}"]:checked`); v = c ? c.value : ''; }
      else v = String(form.elements[f.name].value || '').trim();
      if (f.type === 'number' && v !== '') {
        const n = Utils.num(v);
        if (n === null) { wrap.classList.add('invalid'); error = error || `${f.label}: numero non valido`; continue; }
        if (n < f.min || n > f.max) { wrap.classList.add('invalid'); error = error || `${f.label}: valore tra ${f.min} e ${f.max} ${f.unit || ''}`; continue; }
        v = n;
      } else if (f.type === 'number') v = null;
      if (f.type === 'date' || f.type === 'datetime-local') {
        if (v) {
          const iso = Utils.fromDMY(v);
          if (!iso) { wrap.classList.add('invalid'); error = error || `${f.label}: scrivi la data come gg/mm/aaaa`; continue; }
          if (!f.future && iso > today) { wrap.classList.add('invalid'); error = error || `${f.label}: la data è nel futuro`; continue; }
          v = iso;
          if (f.type === 'datetime-local') {
            const raw = String(form.elements[`${f.name}__time`].value || '').trim();
            const tm = raw ? Utils.normTime(raw) : '12:00';
            if (!tm) { wrap.classList.add('invalid'); error = error || 'Ora non valida: usa hh:mm'; continue; }
            v = `${iso}T${tm}`;
            if (v > Utils.nowLocal() && iso === today) { /* ora futura di oggi: accettata */ }
          }
        }
      }
      if (f.required && (v === '' || v === null)) { wrap.classList.add('invalid'); error = error || `Compila "${f.label}"`; continue; }
      data[f.name] = v;
    }
    if (!error && def.atLeastOne && def.atLeastOne.every(k => data[k] === null || data[k] === '' || data[k] === undefined)) error = 'Inserisci almeno un valore misurato';
    return { data, error };
  }

  function submit(form) {
    const type = form.dataset.type, id = form.dataset.id || null;
    const { data, error } = read(form);
    if (error) { Toast.show(error, 'warn'); const bad = form.querySelector('.invalid input, .invalid textarea'); if (bad) bad.focus(); return; }
    if (type === 'shed') {
      if (data.dataFine && data.dataFine < data.dataInizio) { Toast.show('La fine muta non può precedere l\'inizio', 'warn'); return; }
      if (data.esito !== 'In corso' && !data.dataFine) { Toast.show('Indica la data di completamento o scegli "In corso"', 'warn'); return; }
      if (data.esito === 'In corso') data.dataFine = '';
    }
    if (type === 'med' && data.dataFine && data.dataFine < data.dataInizio) { Toast.show('La fine non può precedere l\'inizio', 'warn'); return; }
    if (type === 'env' && data.tempFredda !== null && data.tempCalda !== null && data.tempFredda > data.tempCalda) Toast.show('Nota: la zona fredda risulta più calda della zona calda', 'info');
    if (type === 'feeding') data.rapporto = Logic.ratio(data.pesoPreda, Logic.weightAt(data.data));

    const saved = id ? Store.update(type, id, data) : Store.add(type, data);
    if (!saved) { Toast.show('Dati non validi: voce non salvata', 'bad'); return; }
    Overlay.close();
    const def = Schema.LOGS[type];
    const suf = def.g === 'm' ? 'o' : 'a';
    Toast.show(`${def.label} ${id ? 'aggiornat' : 'registrat'}${suf}`, 'ok', { action: Actions.undoAction() });
  }

  return { open, bindDates };
})();

/* ==========================================================================
   Charts — Chart.js con gradienti e fallback SVG
   ========================================================================== */
const Charts = (() => {
  const instances = {};
  const ranges = { env: 30, growth: 0 };
  const available = () => typeof window.Chart !== 'undefined' && !window.__chartLoadFailed;
  let themed = false;

  // I colori di assi e testi li imposta Theme.apply; qui solo carattere e dimensione
  function theme() {
    if (themed || !available()) return;
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.font.size = 11;
    themed = true;
  }
  /** Colori presi dai token del tema attivo, così grafici e tema restano coerenti */
  const tok = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const palette = () => ({ text: tok('--text'), muted: tok('--muted'), border: tok('--border-strong'), bg: tok('--elev-2'), grid: tok('--border') });

  /** Con molti punti (es. letture orarie da CSV) si fa la media per gruppi: massimo MAX_POINTS punti */
  const MAX_POINTS = 240;
  function decimate(labels, series) {
    const n = labels.length;
    if (n <= MAX_POINTS) return { labels, series };
    const size = Math.ceil(n / MAX_POINTS);
    const outL = [];
    const outS = series.map(s => ({ ...s, data: [] }));
    for (let i = 0; i < n; i += size) {
      outL.push(labels[i]);
      series.forEach((s, k) => {
        let sum = 0, c = 0;
        for (let j = i; j < Math.min(n, i + size); j++) { const v = s.data[j]; if (v !== null && v !== undefined) { sum += v; c++; } }
        outS[k].data.push(c ? Math.round(sum / c * 10) / 10 : null);
      });
    }
    return { labels: outL, series: outS };
  }
  const destroy = key => { if (instances[key]) { try { instances[key].destroy(); } catch (e) { console.warn(e); } delete instances[key]; } };
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };

  const emptyHTML = (msg, type) => `<div class="empty" style="height:100%"><div class="empty-ico">${I('chart')}</div><b>Nessun dato nel periodo</b><p>${msg}</p>${type ? `<button class="btn btn-sm" data-add="${type}">＋ Registra</button>` : ''}</div>`;

  /** series: [{ label, data, color, axis: 'y'|'y1', unit, fill }] */
  /** Imposta i dataset (anche per l'aggiornamento sul posto) */
  const dataset = (s, n) => ({
    label: s.label, data: s.data, unit: s.unit, yAxisID: s.axis || 'y',
    borderColor: s.color, borderWidth: s.dash ? 1.5 : 2, tension: .35, spanGaps: true, borderDash: s.dash ? [5, 5] : [],
    pointRadius: s.dash || n > 30 ? 0 : 2.5, pointHoverRadius: s.dash ? 0 : 5, pointBackgroundColor: s.color, pointBorderWidth: 0,
    fill: s.fill === false ? false : 'origin',
    backgroundColor: ctx => {
      const { chart } = ctx; const { chartArea } = chart;
      if (!chartArea) return 'transparent';
      const g = chart.ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
      g.addColorStop(0, hexA(s.color, s.fillAlpha ?? .22)); g.addColorStop(1, hexA(s.color, 0));
      return g;
    }
  });

  function line(key, box, labels, series, { yTitle = '', y1Title = '', emptyMsg = '', addType = null, band = null } = {}) {
    if (!box) { destroy(key); return; }
    const has = labels.length > 0 && series.some(s => s.data.some(v => v !== null));
    if (!has) { destroy(key); box.innerHTML = emptyHTML(emptyMsg, addType); return; }
    ({ labels, series } = decimate(labels, series));
    if (!available()) { destroy(key); svgFallback(box, labels, series); return; }
    theme();
    const look = `${Theme.isLight()}|${tok('--accent')}|${series.map(s => s.label + s.axis).join(',')}`;
    const cur = instances[key];
    // Stesso grafico ancora a schermo: si aggiornano i dati e le linee scorrono ai nuovi valori
    if (cur && cur.$look === look && box.contains(cur.canvas)) {
      const sig = JSON.stringify([labels, series.map(s => s.data), band]);
      if (sig === cur.$sig) return;   // dati uguali (es. si è registrata l'acqua): niente da ridisegnare
      cur.$sig = sig;
      cur.data.labels = labels;
      series.forEach((s, i) => { cur.data.datasets[i] = Object.assign(cur.data.datasets[i] || {}, dataset(s, labels.length)); });
      cur.$band = band;
      cur.options.animation.duration = 400;   // le linee scorrono ai nuovi valori, senza ripartire dal basso
      cur.update(Utils.reducedMotion() ? 'none' : undefined);
      return;
    }
    destroy(key);
    const pal = palette();
    box.innerHTML = '<canvas aria-label="Grafico" role="img"></canvas>';
    const usesY1 = series.some(s => s.axis === 'y1');
    const band0 = band;
    const bandPlugin = band ? {
      id: 'band',
      beforeDatasetsDraw(chart) {
        const band = chart.$band === undefined ? band0 : chart.$band;
        if (!band) return;
        const { ctx, chartArea, scales } = chart;
        const y = scales[band.axis || 'y'];
        if (!y || !chartArea) return;
        const top = y.getPixelForValue(band.max), bottom = y.getPixelForValue(band.min);
        ctx.save();
        ctx.fillStyle = band.color || 'rgba(74,222,128,0.07)';
        ctx.fillRect(chartArea.left, Math.max(top, chartArea.top), chartArea.right - chartArea.left, Math.min(bottom, chartArea.bottom) - Math.max(top, chartArea.top));
        ctx.restore();
      }
    } : null;
    try {
      instances[key] = new Chart(box.querySelector('canvas'), {
        type: 'line',
        data: {
          labels,
          datasets: series.map(s => dataset(s, labels.length))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          animation: { duration: Utils.reducedMotion() ? 0 : 900, easing: 'easeOutQuart' },
          animations: Utils.reducedMotion() ? {} : { y: { from: c => (c.type === 'data' && c.mode === 'default' && !c.chart.$ready && c.chart.chartArea ? c.chart.chartArea.bottom : undefined), delay: c => (c.type === 'data' && c.mode === 'default' && !c.chart.$ready ? c.dataIndex * 6 + c.datasetIndex * 90 : 0) } },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', align: 'end', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 6, boxHeight: 6, padding: 14, color: pal.muted } },
            tooltip: {
              backgroundColor: pal.bg, borderColor: pal.border, borderWidth: 1,
              titleColor: pal.text, bodyColor: pal.text, padding: 12, cornerRadius: 10, boxPadding: 4, usePointStyle: true,
              callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y === null ? '—' : Utils.fmtNum(c.parsed.y, c.dataset.unit)}` }
            }
          },
          scales: {
            x: { grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } },
            y: { position: 'left', grid: { color: pal.grid }, border: { display: false }, title: { display: !!yTitle, text: yTitle }, ticks: { maxTicksLimit: 6 } },
            ...(usesY1 ? { y1: { position: 'right', grid: { drawOnChartArea: false }, border: { display: false }, title: { display: !!y1Title, text: y1Title }, ticks: { maxTicksLimit: 6 } } } : {})
          }
        },
        plugins: bandPlugin ? [bandPlugin] : []
      });
      Object.assign(instances[key], { $look: look, $band: band, $ready: true, $sig: JSON.stringify([labels, series.map(s => s.data), band]) });
    } catch (err) {
      console.warn('Chart.js non disponibile, uso il grafico SVG', err);
      svgFallback(box, labels, series);
    }
  }

  /** Grafico SVG di riserva (scala condivisa per asse) */
  function svgFallback(box, labels, series) {
    const W = 640, H = 220, P = 14, n = labels.length;
    const x = i => n === 1 ? W / 2 : P + i * (W - 2 * P) / (n - 1);
    const axes = {};
    series.forEach(s => {
      const vals = s.data.filter(v => v !== null);
      if (!vals.length) return;
      const k = s.axis || 'y';
      const r = axes[k] || (axes[k] = [Infinity, -Infinity]);
      r[0] = Math.min(r[0], ...vals); r[1] = Math.max(r[1], ...vals);
    });
    const paths = series.map((s, si) => {
      if (!s.data.some(v => v !== null)) return '';
      let [lo, hi] = axes[s.axis || 'y'];
      if (lo === hi) { lo -= 1; hi += 1; }
      const pad = (hi - lo) * .1; lo -= pad; hi += pad;
      const y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
      const pts = s.data.map((v, i) => v === null ? null : [x(i), y(v)]).filter(Boolean);
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      const area = `${d} L${pts[pts.length - 1][0].toFixed(1)},${H - P} L${pts[0][0].toFixed(1)},${H - P} Z`;
      return `<defs><linearGradient id="sg${si}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".25"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#sg${si})"/><path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }).join('');
    const grid = [0, 1, 2, 3].map(i => { const yy = P + i * (H - 2 * P) / 3; return `<line x1="${P}" x2="${W - P}" y1="${yy}" y2="${yy}" style="stroke:var(--border)"/>`; }).join('');
    const legend = series.map(s => {
      const vals = s.data.filter(v => v !== null);
      return `<span><i style="background:${s.color}"></i>${Utils.esc(s.label)} ${vals.length ? `${Utils.fmtNum(Math.min(...vals))}–${Utils.fmtNum(Math.max(...vals), s.unit)}` : '—'}</span>`;
    }).join('');
    box.innerHTML = `<div class="chart-note">Grafico semplificato: Chart.js non è raggiungibile (offline).</div>
      <svg class="svg-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:calc(100% - 56px)" role="img" aria-label="Grafico">${grid}${paths}</svg>
      <div class="svg-legend"><span class="faint">${Utils.esc(labels[0])} → ${Utils.esc(labels[n - 1])}</span>${legend}</div>`;
  }

  const rangeControl = key => `<div class="segmented" role="tablist" aria-label="Intervallo">${[['7', '7G'], ['30', '30G'], ['0', 'Tutto']].map(([v, l]) => `<button class="seg-btn${String(ranges[key]) === v ? ' active' : ''}" data-chart-range="${key}" data-value="${v}">${l}</button>`).join('')}</div>`;
  const filterByRange = (key, arr, dateKey) => {
    const d = ranges[key];
    return d ? arr.filter(e => { const n = Utils.daysSince(e[dateKey]); return n !== null && n < d; }) : arr;
  };

  return { line, destroy, available, ranges, rangeControl, filterByRange };
})();

      ['Note', e => Utils.esc([e.fornitore, e.note].filter(Boolean).join(' · ')), 'cell-notes']] },
    expense: { filter: { field: 'categoria', options: Schema.OPTIONS.categoriaSpesa }, cols: [
      ['Data', e => `${Utils.fmtDate(e.data)}<span class="sub">${Utils.relDays(Utils.daysSince(e.data))}</span>`],
      ['Categoria', e => `${Utils.esc(e.categoria)}${e.descrizione ? `<span class="sub">${Utils.esc(e.descrizione)}</span>` : ''}`],
      ['Importo', e => Utils.fmtNum(e.importo, '€', 2), 'nowrap'],
      ['Note', e => Utils.esc(e.note), 'cell-notes']] }
  };

  /** HTML del contenitore: toolbar (ricerca + filtri) e righe */
  function block(type) {
    const st = ui[type] || (ui[type] = { q: '', f: '' });
    const cfg = COLS[type];
    return `<div class="toolbar">
        <div class="search"><input class="input" type="search" placeholder="Cerca nelle note e nei valori…" value="${Utils.esc(st.q)}" data-search="${type}" aria-label="Cerca"></div>
        ${cfg.filter ? `<div class="chips">${['', ...cfg.filter.options].map(o => `<button class="chip chip-sm${st.f === o ? ' on' : ''}" data-filter="${type}" data-value="${Utils.esc(o)}">${o ? Utils.esc(o) : 'Tutti'}</button>`).join('')}</div>` : ''}
      </div>
      <div data-rows="${type}">${rows(type)}</div>`;
  }

  function rows(type) {
    const st = ui[type] || (ui[type] = { q: '', f: '' });
    const cfg = COLS[type], def = Schema.LOGS[type];
    const all = Store.get().logs[type];
    if (!all.length) {
      return `<div class="empty"><div class="empty-ico" style="color:${def.color}">${I(def.icon)}</div><b>Ancora nessuna voce</b><p>Il registro "${def.label.toLowerCase()}" è vuoto. Aggiungi la prima registrazione per vedere statistiche e storico.</p><button class="btn btn-primary btn-sm" data-add="${type}">＋ Registra ${def.label.toLowerCase()}</button></div>`;
    }
    const q = st.q.trim().toLowerCase();
    const list = all.filter(e => {
      if (st.f && cfg.filter && e[cfg.filter.field] !== st.f) return false;
      if (!q) return true;
      return Object.entries(e).some(([k, v]) => k !== 'id' && k[0] !== '_' && v !== null && v !== '' && String(v).toLowerCase().includes(q))
        || Utils.fmtDate(e[def.dateKey]).toLowerCase().includes(q);
    });
    if (!list.length) {
      return `<div class="empty"><div class="empty-ico">${I('search')}</div><b>Nessun risultato</b><p>Nessuna voce corrisponde a ricerca e filtri attivi.</p><button class="btn btn-sm" data-reset-filters="${type}">Azzera filtri</button></div>`;
    }
    const limit = st.limit || 100;
    const shown = list.slice(0, limit);
    return `<div class="rtable-wrap"><div class="rtable-scroll"><table class="rtable">
        <thead><tr>${cfg.cols.map(c => `<th>${c[0]}</th>`).join('')}<th><span class="sr-only">Azioni</span></th></tr></thead>
        <tbody>${shown.map(e => `<tr data-key="${Utils.esc(e.id)}"${Store.isRecent(e.id) ? ' class="is-new"' : ''}>${cfg.cols.map((c, i) => {
          const html = c[1](e);
          const cls = [i === 0 ? 'cell-primary' : '', c[2] || '', c[2] === 'cell-notes' && !e.note ? 'is-empty' : ''].filter(Boolean).join(' ');
          return `<td data-label="${c[0]}"${cls ? ` class="${cls}"` : ''}>${html || (c[2] === 'cell-notes' ? '<span class="faint">—</span>' : '')}</td>`;
        }).join('')}
          <td class="cell-actions"><button class="btn btn-ghost btn-sm btn-icon" data-edit="${type}" data-id="${Utils.esc(e.id)}" aria-label="Modifica" title="Modifica">${I('edit')}</button><button class="btn btn-ghost btn-sm btn-icon" data-del="${type}" data-id="${Utils.esc(e.id)}" aria-label="Elimina" title="Elimina">${I('trash')}</button></td></tr>`).join('')}</tbody>
      </table></div></div>
      ${list.length > limit ? `<button class="btn btn-sm btn-block" style="margin-top:10px" data-more="${type}">Mostra altre ${Math.min(100, list.length - limit)} di ${list.length - limit}</button>` : ''}
      <div class="list-foot"><span>${list.length === all.length ? Utils.plural(all.length, 'voce', 'voci') : `${list.length} di ${all.length} voci`}</span><span class="desktop-only">Doppio clic su una riga per modificarla</span></div>`;
  }

  /** Ricerca e filtri: le righe che restano scorrono al nuovo posto, quelle nuove sfumano (FLIP) */
  function refresh(type) {
    const host = document.querySelector(`[data-rows="${type}"]`);
    if (!host) return;
    const trs = () => [...host.querySelectorAll('tbody tr[data-key]')];
    const before = new Map(trs().slice(0, 60).map(r => [r.dataset.key, r.getBoundingClientRect().top]));
    Dom.morph(host, rows(type));
    if (Utils.reducedMotion()) return;
    trs().slice(0, 60).forEach(r => {
      const b = before.get(r.dataset.key);
      if (b === undefined) { r.classList.remove('row-in'); void r.offsetWidth; r.classList.add('row-in'); return; }
      const d = b - r.getBoundingClientRect().top;
      if (Math.abs(d) > 1) r.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 240, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
    });
  }

  // Ricerca: lo stato si aggiorna subito, la tabella dopo una breve pausa nella digitazione
  const timers = {};
  document.addEventListener('input', e => {
    const s = e.target.closest('[data-search]');
    if (!s) return;
    const t = s.dataset.search;
    const u = (ui[t] || (ui[t] = { q: '', f: '' })); u.q = s.value; u.limit = 100;
    clearTimeout(timers[t]);
    timers[t] = setTimeout(() => refresh(t), s.value ? 120 : 0);
  });
  document.addEventListener('click', e => {
    const f = e.target.closest('[data-filter]');
    if (f) {
      const t = f.dataset.filter; ui[t].f = f.dataset.value;
      f.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === f));
      refresh(t);
    }
    const more = e.target.closest('[data-more]');
    if (more) { const t = more.dataset.more; ui[t].limit = (ui[t].limit || 100) + 100; refresh(t); return; }
    const r = e.target.closest('[data-reset-filters]');
    if (r) {
      const t = r.dataset.resetFilters;
      ui[t] = { q: '', f: '' };
      clearTimeout(timers[t]);
      document.querySelectorAll(`[data-search="${t}"]`).forEach(i => { i.value = ''; });
      document.querySelectorAll(`[data-filter="${t}"]`).forEach(c => c.classList.toggle('on', c.dataset.value === ''));
      refresh(t);
    }
  });
  document.addEventListener('dblclick', e => {
    const tr = e.target.closest('.rtable tbody tr');
    const b = tr && tr.querySelector('[data-edit]');
    if (b) Forms.open(b.dataset.edit, { id: b.dataset.id });
  });

  return { block, refresh, badge, STATUS };
})();

/* ==========================================================================
   Actions — azioni condivise (elimina con annulla, cambio acqua rapido, backup)
   ========================================================================== */
const Actions = (() => {
  /** Pulsante "Annulla" legato all'azione appena fatta (non all'ultima in assoluto) */
  const undoAction = (token = Store.lastToken) => ({ label: 'Annulla', run: () => {
    const r = Store.undo(token);
    if (r.ok) Toast.show('Modifica annullata', 'info');
    else Toast.show(r.reason === 'later' ? 'Non si può annullare: nel frattempo ci sono state altre modifiche' : 'Questa azione è già stata annullata', 'warn');
  } });
  /** Evita le voci doppie da doppio tocco: se c'è già una voce uguale oggi, chiede conferma con un tocco */
  let lastQuick = { key: '', at: 0 };
  function guardQuick(key, already, message, run) {
    const now = Date.now();
    if (lastQuick.key === key && now - lastQuick.at < 1500) return false;   // doppio tocco
    lastQuick = { key, at: now };
    if (already) { Toast.show(message, 'info', { duration: 6000, action: { label: 'Registra comunque', run } }); return false; }
    return true;
  }
  const todayMaint = tipi => Store.get().logs.maintenance.some(m => m.data === Utils.todayISO() && tipi.includes(m.tipo));

  function remove(type, id) {
    const removed = Store.remove(type, id);
    if (!removed) return;
    Toast.show(`${Schema.LOGS[type].label} eliminat${Schema.LOGS[type].g === 'm' ? 'o' : 'a'}`, 'info', { duration: 6000, action: undoAction() });
  }
  function quickWater(force = false) {
    if (!force && !guardQuick('water', todayMaint(['Cambio acqua']), 'Il cambio dell\'acqua di oggi è già registrato', () => quickWater(true))) return;
    const e = Store.add('maintenance', { data: Utils.todayISO(), tipo: 'Cambio acqua', note: '' });
    if (e) Toast.show('Cambio acqua registrato per oggi', 'ok', { action: undoAction() });
  }
  function quickClean(force = false) {
    if (!force && !guardQuick('clean', todayMaint(['Spot cleaning', 'Pulizia profonda']), 'La pulizia di oggi è già registrata', () => quickClean(true))) return;
    const e = Store.add('maintenance', { data: Utils.todayISO(), tipo: 'Spot cleaning', note: '' });
    if (e) Toast.show('Pulizia registrata per oggi', 'ok', { action: undoAction() });
  }
  /** Pasto in un tocco: stessa preda dell'ultima volta, data di oggi */
  function quickMeal(esito = 'Mangiato', force = false) {
    const last = Logic.lastMealTemplate();
    if (!last) { Forms.open('feeding'); return; }
    const already = Store.get().logs.feeding.some(f => f.data === Utils.todayISO() && f.esito === esito);
    if (!force && !guardQuick('meal-' + esito, already, esito === 'Mangiato' ? 'Il pasto di oggi è già registrato' : 'Il rifiuto di oggi è già registrato', () => quickMeal(esito, true))) return;
    const data = { data: Utils.todayISO(), preda: last.preda, pesoPreda: last.pesoPreda, statoPreda: last.statoPreda, esito, note: '' };
    data.rapporto = Logic.ratio(data.pesoPreda, Logic.weightAt(data.data));
    const e = Store.add('feeding', data);
    if (e) Toast.show(`${esito === 'Mangiato' ? 'Pasto registrato' : 'Rifiuto registrato'}: ${last.preda}${Utils.num(last.pesoPreda) !== null ? ' ' + Utils.fmtNum(last.pesoPreda, 'g') : ''}`, 'ok', { duration: 6000, action: undoAction() });
  }
  function giveDose(id) {
    const m = Store.find('med', id);
    if (!m) return;
    const t = Utils.todayISO();
    if ((m.dosi || []).includes(t)) { Toast.show('Dose di oggi già registrata', 'info'); return; }
    Store.update('med', id, { dosi: [t, ...(m.dosi || [])] });
    Toast.show(`Dose registrata: ${m.farmaco}`, 'ok', { action: undoAction() });
  }
  function runAlertAction(a) {
    if (!a) return;
    if (a.kind === 'form') Forms.open(a.type, { presets: a.presets || {} });
    else if (a.kind === 'edit') Forms.open(a.type, { id: a.id, presets: a.presets || {} });
    else if (a.kind === 'water') quickWater();
    else if (a.kind === 'clean') quickClean();
    else if (a.kind === 'meal') quickMeal();
    else if (a.kind === 'dose') giveDose(a.id);
    else if (a.kind === 'export') exportBackup();
    else if (a.kind === 'nav') { if (a.tab) Views.tabs[a.to] = a.tab; Router.go(a.to); }
  }

  /** Foglio "Registra" con tutti i tipi, divisi per area */
  function openAddSheet() {
    const tile = t => { const d = Schema.LOGS[t]; return `<button class="add-tile" data-add="${t}"><span class="t-ico" style="color:${d.color}">${I(d.icon)}</span><b>${d.label}</b><small>${d.desc}</small></button>`; };
    const last = Logic.lastMealTemplate();
    const body = `${last ? `<button class="quick-meal" data-meal><span class="t-ico">${I('zap')}</span><span><b>Ha mangiato come l'ultima volta</b><small>${Utils.esc(last.preda)}${Utils.num(last.pesoPreda) !== null ? ' · ' + Utils.fmtNum(last.pesoPreda, 'g') : ''} · oggi</small></span></button>` : ''}
      <div class="add-group">Più voci insieme</div><div class="add-grid add-grid-2"><button class="add-tile" data-round><span class="t-ico" style="color:var(--accent)">${I('route')}</span><b>Giro di controllo</b><small>Clima, acqua, pulizia e peso</small></button><button class="add-tile" data-cmd><span class="t-ico" style="color:#a78bfa">${I('command')}</span><b>Scrivi</b><small>Es. "hopper 6 g ieri"</small></button></div>
      <div class="add-group">Routine</div><div class="add-grid">${['feeding', 'env', 'growth', 'shed', 'maintenance', 'handling'].map(tile).join('')}</div>
      <div class="add-group">Salute</div><div class="add-grid">${['waste', 'symptom', 'vet', 'med'].map(tile).join('')}<button class="add-tile" data-photo-add><span class="t-ico" style="color:#f472b6">${I('camera')}</span><b>Foto</b><small>Diario fotografico</small></button></div>
      <div class="add-group">Casa</div><div class="add-grid">${['stock', 'expense'].map(tile).join('')}</div>
      <p class="faint small desktop-only" style="margin-top:14px">Suggerimento: <kbd>N</kbd> apre questo pannello, <kbd>/</kbd> cerca, <kbd>Ctrl</kbd>+<kbd>K</kbd> apre il comando rapido.</p>`;
    Overlay.open({ title: 'Cosa vuoi registrare?', body });
  }

  /* ---------- Backup ---------- */
  const fileBase = () => `snakecheck-${(Store.get().profile.nome || 'serpente').toLowerCase().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'serpente'}-${Utils.todayISO()}`;

  async function buildBackup(withPhotos) {
    let photos;
    if (withPhotos) { try { photos = await Photos.exportAll(); } catch (e) { photos = undefined; } }
    return Store.exportJSON(photos && photos.length ? { photos } : {});
  }

  /** Salva il file: cartella scelta (PC), Download (Android app), oppure download del browser */
  async function saveFile(name, text) {
    if (window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') return window.AndroidBridge.saveFile(name, text) ? 'android' : 'error';
    if (window.showSaveFilePicker && window.isSecureContext) {
      try {
        const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Backup SNAKEcheck', accept: { 'application/json': ['.json'] } }] });
        const w = await h.createWritable(); await w.write(text); await w.close();
        return 'picker';
      } catch (e) { if (e && e.name === 'AbortError') return 'abort'; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    return 'download';
  }
  async function exportBackup({ withPhotos = true } = {}) {
    try {
      const json = await buildBackup(withPhotos);
      const res = await saveFile(`${fileBase()}.json`, json);
      if (res === 'abort') return;
      if (res === 'error') { Toast.show('Esportazione non riuscita', 'bad'); return; }
      Safety.markBackup();
      Router.render();
      Toast.show(res === 'android' ? 'Backup salvato nella cartella Download' : res === 'picker' ? 'Backup salvato nella cartella scelta' : 'Backup scaricato', 'ok');
    } catch (err) { console.warn(err); Toast.show('Esportazione non riuscita', 'bad'); }
  }
  const canShare = () => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } };
  /** Condivide il backup (telefono): Drive, email, WhatsApp, File… */
  async function shareBackup() {
    try {
      const json = await buildBackup(true);
      const file = new File([json], `${fileBase()}.json`, { type: 'application/json' });
      await navigator.share({ files: [file], title: 'Backup SNAKEcheck' });
      Safety.markBackup(); Router.render();
      Toast.show('Backup condiviso', 'ok');
    } catch (e) { if (e && e.name !== 'AbortError') Toast.show('Condivisione non riuscita', 'bad'); }
  }

  async function importBackup(file) {
    if (!file) return;
    if (file.size > 60 * 1024 * 1024) { Toast.show('File troppo grande (max 60 MB)', 'bad'); return; }
    try {
      let raw;
      try { raw = JSON.parse(await file.text()); } catch (e) { throw new Error('il file non è un JSON valido'); }
      const { parsed, report } = Store.validateImport(raw);
      const photos = Array.isArray(raw.photos) ? raw.photos.filter(p => p && typeof p.dataUrl === 'string' && /^data:image\//.test(p.dataUrl)) : [];
      const empty = Store.isEmpty();
      const types = Schema.LOG_TYPES.filter(t => report.byType[t].total);
      const dropped = report.dropped.length;
      const body = `<p class="muted">Profilo <b>${Utils.esc(parsed.profile.nome || 'senza nome')}</b> · ${Utils.plural(report.kept, 'voce valida', 'voci valide')}${photos.length ? ` · ${Utils.plural(photos.length, 'foto', 'foto')}` : ''}</p>
        <div class="imp-list">${types.map(t => `<div><span>${I(Schema.LOGS[t].icon)} ${Schema.LOGS[t].label}</span><b>${report.byType[t].kept}${report.byType[t].kept < report.byType[t].total ? ` <span class="c-warn">di ${report.byType[t].total}</span>` : ''}</b></div>`).join('') || '<p class="faint small">Nessuna voce nei registri.</p>'}</div>
        ${dropped ? `<details class="imp-drop"><summary class="c-warn">${Utils.plural(dropped, 'voce scartata', 'voci scartate')}: vedi i motivi</summary><ul>${report.dropped.slice(0, 40).map(d => `<li>${Schema.LOGS[d.type].label} n. ${d.index}: ${Utils.esc(d.reason)}</li>`).join('')}${dropped > 40 ? `<li>…e altre ${dropped - 40}</li>` : ''}</ul></details>` : '<p class="small c-ok" style="margin-top:8px">Nessuna voce scartata.</p>'}
        ${empty ? '' : `<div class="field" style="margin-top:14px"><span class="field-label">Come importare</span><div class="chips">
          <label class="chip"><input type="radio" name="impMode" value="merge" checked>Unisci ai dati attuali</label>
          <label class="chip"><input type="radio" name="impMode" value="replace">Sostituisci tutto</label></div>
          <span class="field-hint">Unisci aggiunge solo le voci nuove e salta i doppioni. In ogni caso salvo prima una copia di sicurezza dei dati attuali.</span></div>`}`;
      const modal = Overlay.open({ title: `${I('upload')} Importa backup`, subtitle: Utils.esc(file.name), body, footer: '<button class="btn btn-ghost" data-close-imp>Annulla</button><button class="btn btn-primary" data-do-imp>Importa</button>', size: 'sm' });
      modal.querySelector('[data-close-imp]').addEventListener('click', () => Overlay.close());
      modal.querySelector('[data-do-imp]').addEventListener('click', async () => {
        const mode = empty ? 'replace' : (modal.querySelector('input[name="impMode"]:checked') || {}).value;
        Overlay.close();
        await Safety.snapshot('Prima dell\'importazione');
        let msg;
        if (mode === 'merge') { const n = Store.merge(parsed); msg = `Unione completata: ${Utils.plural(n, 'voce nuova', 'voci nuove')}`; }
        else { Store.replace(parsed, 'Importazione'); msg = `Backup importato: ${Utils.plural(report.kept, 'voce', 'voci')}`; }
        const tok = Store.lastToken;
        let np = 0;
        for (const p of photos) { try { if (await Photos.importOne(p)) np++; } catch (e) { /* foto saltata */ } }
        Toast.show(`${msg}${np ? ` e ${Utils.plural(np, 'foto', 'foto')}` : ''}${dropped ? ` · ${dropped} scartate` : ''}`, dropped ? 'warn' : 'ok', { duration: 7000, action: undoAction(tok) });
      });
    } catch (err) { Toast.show(`Importazione fallita: ${err.message}`, 'bad', { duration: 6000 }); }
  }

  async function loadDemo() {
    if (!Store.isEmpty()) {
      const ok = await Overlay.confirm({ title: 'Carica dati demo', message: 'I dati attuali verranno <b>sostituiti</b> con il set dimostrativo. Prima salvo una copia di sicurezza che puoi ripristinare da Impostazioni.', confirmLabel: 'Carica demo', danger: true });
      if (!ok) return;
      await Safety.snapshot('Prima dei dati demo');
    }
    Store.replace(Demo.build(), 'Dati demo');
    Toast.show('Dati demo caricati', 'ok', { action: undoAction() });
    Router.go('dashboard');
  }
  async function clearAll() {
    const a = await Overlay.confirm({ title: 'Svuota tutti i dati', message: 'Stai per eliminare <b>profilo e tutti i registri</b> salvati in questo browser. Prima salvo una copia di sicurezza che puoi ripristinare da Impostazioni.', confirmLabel: 'Continua', danger: true });
    if (!a) return;
    const b = await Overlay.confirm({ title: 'Conferma definitiva', message: `Ultimo passaggio: i dati spariscono da questa schermata.${Sync.enabled() ? ' La sincronizzazione è attiva: verranno eliminati anche dalla copia su Google Drive e dagli altri dispositivi collegati.' : ''}`, confirmLabel: 'Elimina tutto', danger: true, requireText: 'ELIMINA' });
    if (!b) return;
    await Safety.snapshot('Prima di svuotare i dati');
    Store.reset();
    Toast.show('Tutti i dati sono stati eliminati', 'ok', { duration: 8000, action: undoAction() });
  }
  async function restoreSnapshot(id) {
    const s = await Safety.get(id);
    if (!s) { Toast.show('Copia non trovata', 'bad'); return; }
    const ok = await Overlay.confirm({ title: 'Ripristina copia', message: `Ripristino la copia del <b>${Utils.fmtDateTime(Utils.toLocalDT(new Date(s.at)))}</b> (${Utils.esc(s.reason)}, ${Utils.plural(s.count, 'voce', 'voci')}). Prima salvo una copia dei dati attuali.`, confirmLabel: 'Ripristina' });
    if (!ok) return;
    await Safety.snapshot('Prima del ripristino');
    Store.replace(JSON.parse(s.json), 'Ripristino');
    Toast.show('Copia ripristinata', 'ok', { action: undoAction() });
  }

  /** Libera spazio: copia completa in IndexedDB, poi letture vecchie ridotte a una ogni 6 ore */
  async function compactEnv() {
    const old = Store.get().logs.env.filter(e => Utils.daysSince(e.datetime) > 90).length;
    if (!old) { Toast.show('Non ci sono letture più vecchie di 90 giorni da compattare. Esporta un backup ed elimina le foto che non servono.', 'warn', { duration: 9000 }); return; }
    const ok = await Overlay.confirm({ title: 'Libera spazio', message: `Le letture del clima più vecchie di 90 giorni (${old}) vengono ridotte a una ogni 6 ore. Prima salvo una copia completa che puoi ripristinare da Impostazioni.`, confirmLabel: 'Compatta' });
    if (!ok) return;
    const snap = await Safety.snapshot('Prima della compattazione');
    if (!snap) { Toast.show('Copia di sicurezza non riuscita: esporta un backup prima di compattare.', 'bad', { action: { label: 'Esporta', run: exportBackup } }); return; }
    const n = Store.compactEnv(90);
    Toast.show(n ? `Tolte ${Utils.plural(n, 'lettura', 'letture')} vecchie` : 'Nessuna lettura da togliere', n ? 'ok' : 'info', { duration: 6000, action: n ? undoAction() : null });
  }

  /** Sposta il prossimo pasto a un altro giorno (vale solo fino al pasto successivo) */
  function moveMeal(date) {

/* ==========================================================================
   Anim — count-up dei numeri KPI
   ========================================================================== */
const Anim = (() => {
  const prev = new Map();
  const shown = new Map();   // valore mostrato in questo istante, per ripartire da lì se cambia a metà
  const runs = new Map();
  function countUp(root) {
    root.querySelectorAll('[data-count]').forEach(el => {
      const to = Utils.num(el.dataset.count);
      if (to === null) return;
      const key = el.dataset.key || '';
      const dec = +el.dataset.dec || 0;
      if (prev.get(key) === to && runs.get(key) === undefined) { el.textContent = Utils.fmtNum(Utils.round(to, dec), '', dec); return; }
      const from = shown.has(key) ? shown.get(key) : (prev.has(key) ? prev.get(key) : 0);
      prev.set(key, to);
      const fmt = v => Utils.fmtNum(Utils.round(v, dec), '', dec);
      if (from === to || Utils.reducedMotion()) { el.textContent = fmt(to); return; }
      el.textContent = fmt(from);   // nessun fotogramma col valore finale prima del conteggio
      const t0 = performance.now(), dur = 700, run = {};
      runs.set(key, run);
      const ease = t => 1 - Math.pow(2, -10 * t);
      const step = now => {
        if (runs.get(key) !== run) return;   // un valore più nuovo ha preso il posto di questo
        const t = Math.min(1, (now - t0) / dur);
        const v = from + (to - from) * (t === 1 ? 1 : ease(t));
        shown.set(key, v);
        const target = el.isConnected ? el : document.querySelector(`[data-count][data-key="${key}"]`);
        if (target) target.textContent = fmt(v);
        if (t < 1) requestAnimationFrame(step); else { runs.delete(key); shown.delete(key); }
      };
      requestAnimationFrame(step);
    });
  }
  return { countUp };
})();

/* ==========================================================================

  let timer = null;

      const key = (first && (first.dataset.tab || first.dataset.chartRange || first.dataset.filter)) || seg.id || '';
      let ind = seg.querySelector(':scope > .seg-ind');

})();

/* ==========================================================================
   Snake — disegno vettoriale del serpente (corpo affusolato, selle, testa)
   ========================================================================== */
const Snake = (() => {
  /** Campiona una curva Catmull-Rom e la ridistribuisce in N punti equidistanti */
  function sample(pts, N) {
    const dense = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      for (let k = 0; k < 24; k++) {
        const t = k / 24, t2 = t * t, t3 = t2 * t;
        dense.push([
          .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
        ]);
      }
    }
    dense.push(pts[pts.length - 1]);
    const cum = [0];
    for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]));
    const total = cum[cum.length - 1];
    const out = [];
    let j = 0;
    for (let n = 0; n < N; n++) {
      const d = total * n / (N - 1);
      while (j < cum.length - 2 && cum[j + 1] < d) j++;
      const seg = cum[j + 1] - cum[j] || 1, t = (d - cum[j]) / seg;
      out.push({ x: dense[j][0] + (dense[j + 1][0] - dense[j][0]) * t, y: dense[j][1] + (dense[j + 1][1] - dense[j][1]) * t, s: n / (N - 1) });
    }
    out.forEach((p, i) => {
      const a = out[Math.max(i - 1, 0)], b = out[Math.min(i + 1, N - 1)];
      p.a = Math.atan2(b.y - a.y, b.x - a.x);

        if (i % 2 || p.s < .05 || p.s > .95) return;
        const w = width(p.s, B), off = (r() - .5) * w * .8;
        const x = p.x - Math.sin(p.a) * off, y = p.y + Math.cos(p.a) * off;
        pattern += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(.8 + r() * B * .07)}" fill="${look.speckles[Math.floor(r() * look.speckles.length)]}"/>`;
      });
    }

    // Lucentezza dorsale per dare volume
    const sheen = P.filter(p => p.s > .08 && p.s < .93).map(p => { const w = width(p.s, B) * .24; return `${f(p.x - Math.sin(p.a) * -w)},${f(p.y + Math.cos(p.a) * -w)}`; }).join(' ');

    // Testa orientata lungo l'ultima tangente
    const h = P[P.length - 1], W = B * .9;
    const head = `<g class="snake-head" transform="translate(${f(h.x)} ${f(h.y)}) rotate(${f(deg(h.a))})">
        <path class="${animated ? 'tongue' : ''}" d="M${f(W * 1.42)},0 L${f(W * 1.95)},0 M${f(W * 1.95)},0 L${f(W * 2.15)},-${f(W * .14)} M${f(W * 1.95)},0 L${f(W * 2.15)},${f(W * .14)}" stroke="#e2364a" stroke-width="1.5" stroke-linecap="round" fill="none" ${animated ? '' : 'style="display:none"'}/>
        <path d="M${f(-W * .25)},${f(-W * .5)} C${f(W * .45)},${f(-W * .64)} ${f(W * 1.15)},${f(-W * .52)} ${f(W * 1.45)},${f(-W * .12)} C${f(W * 1.52)},0 ${f(W * 1.52)},0 ${f(W * 1.45)},${f(W * .12)} C${f(W * 1.15)},${f(W * .52)} ${f(W * .45)},${f(W * .64)} ${f(-W * .25)},${f(W * .5)} Z" fill="${look.base}"/>
        ${look.pattern === 'none' || look.pattern === 'speckle' ? '' : `<path d="M${f(W * .05)},${f(-W * .3)} L${f(W * .85)},0 L${f(W * .05)},${f(W * .3)} L${f(W * .3)},0 Z" fill="${look.saddle}" stroke="${look.border}" stroke-width="${f(bw * .6)}" stroke-linejoin="round"/>`}
        <circle cx="${f(W * .98)}" cy="${f(-W * .27)}" r="${f(W * .13)}" fill="${look.eye}" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>
        <circle cx="${f(W * 1.01)}" cy="${f(-W * .3)}" r="${f(W * .04)}" fill="#fff" opacity=".85"/>
        <circle cx="${f(W * .98)}" cy="${f(W * .27)}" r="${f(W * .13)}" fill="${look.eye}" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>
        <circle cx="${f(W * 1.33)}" cy="${f(-W * .07)}" r="${f(W * .03)}" fill="rgba(0,0,0,.5)"/><circle cx="${f(W * 1.33)}" cy="${f(W * .07)}" r="${f(W * .03)}" fill="rgba(0,0,0,.5)"/>
      </g>`;

    return `<g class="snake-body${animated ? ' anim' : ''}">
        <path d="${outline}" transform="translate(0 ${f(B * .28)})" fill="rgba(0,0,0,.35)" filter="url(#${uid}-blur)"/>
        <defs><clipPath id="${uid}-clip"><path d="${outline}"/></clipPath><filter id="${uid}-blur" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="${f(B * .22)}"/></filter></defs>
        <path d="${outline}" fill="${look.base}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
        <g clip-path="url(#${uid}-clip)">${pattern}
          <polyline points="${sheen}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="${f(B * .16)}" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        ${head}
      </g>`;
  }

  /** Anteprima compatta (impostazioni, scheda) */
  const preview = (look, uid = 'pv') => `<svg viewBox="0 0 300 70" class="snake-preview" role="img" aria-label="Anteprima ${Utils.esc(look.label)}">
      ${svg(look, [[12, 42], [58, 30], [110, 46], [162, 28], [214, 44], [250, 34]], { B: 16, uid, animated: false })}</svg>`;

  return { svg, preview };
})();

/* ==========================================================================
   Terrarium — terrario interattivo con hotspot ambientali e serpente
   ========================================================================== */
const Terrarium = (() => {
  const VB = { w: 800, h: 440 };
  const HOT = {
    tempFredda: { x: 118, y: 150, icon: 'snow' },
    tempCalda: { x: 682, y: 170, icon: 'flame' },
    umidita: { x: 262, y: 322, icon: 'drop' }
  };
  /** Fase del giorno secondo l'orario delle luci impostato */
  function phase() {
    const p = Store.get().profile;
    const toMin = t => { const n = Utils.normTime(t); return n ? +n.slice(0, 2) * 60 + +n.slice(3) : null; };
    const on = toMin(p.luceOn), off = toMin(p.luceOff);
    if (on === null || off === null || on === off) return 'day';
    const d = Utils.now(), m = d.getHours() * 60 + d.getMinutes();
    const isOn = on < off ? (m >= on && m < off) : (m >= on || m < off);
    if (!isOn) return 'night';
    if (Math.abs(m - on) < 45) return 'dawn';
    if (Math.abs(off - m) < 45) return 'dusk';
    return 'day';
  }
  const PHASE_LABEL = { day: 'Luce accesa', dawn: 'Alba', dusk: 'Tramonto', night: 'Notte · luce spenta' };
  function tick() {
    const w = document.getElementById('terraWrap');
    if (w && !(typeof Views !== 'undefined' && Views.ttOffset)) { const ph = phase(); if (w.dataset.phase !== ph) { w.dataset.phase = ph; const l = document.getElementById('terraPhase'); if (l) l.innerHTML = phaseBadge(ph); } }
  }
  const phaseBadge = ph => `${I(ph === 'night' ? 'moon' : 'sun')} ${PHASE_LABEL[ph]}`;
  setInterval(tick, 60000);

          <rect x="10" y="10" width="780" height="420" fill="url(#tCool)"/>
          <rect x="10" y="10" width="780" height="420" fill="url(#tHeat)" class="heat-glow"/>
          <text x="34" y="44" class="t-zone">ZONA FREDDA</text>
          <text x="766" y="44" class="t-zone" text-anchor="end" dx="-118">ZONA CALDA</text>
          <!-- Piante sullo sfondo -->
          <g opacity=".9">
            <path d="M70 360 C60 290 40 250 20 220 C55 245 78 290 84 350 Z" fill="#4f9d5d"/>
            <path d="M88 360 C92 280 110 230 140 200 C120 250 108 300 100 360 Z" fill="#9be15d" opacity=".75"/>

          <!-- Substrato -->

          <path d="M10 352 C120 340 220 360 330 350 C450 340 560 362 680 348 C730 343 770 350 790 346 L790 430 L10 430 Z" fill="url(#tGrain)"/>
          <!-- Nascondiglio (zona fredda) -->
          <g>

            <ellipse cx="113" cy="368" rx="34" ry="22" fill="#0b0c0f"/>
            <path d="M60 330 C90 318 140 318 168 332" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>

          <g>
            <ellipse cx="262" cy="384" rx="66" ry="20" fill="#1f242d" stroke="rgba(255,255,255,.12)"/>
            <ellipse cx="262" cy="${f2(378 + 5 * (1 - wl))}" rx="${f2(56 * (.75 + .25 * wl))}" ry="${f2(13 * (.75 + .25 * wl))}" fill="${murky ? '#6f8d5e' : 'url(#tWater)'}" class="water"/>
            ${murky ? '' : '<ellipse cx="244" cy="375" rx="16" ry="3" fill="#fff" opacity=".35" class="water-shine"/>'}
          </g>
          <!-- Piccola pianta in primo piano (zona calda) -->
          <path d="M740 380 C736 340 720 318 700 306 C722 312 742 336 750 380 Z" fill="#4f9d5d" opacity=".95"/>
          <path d="M762 380 C764 350 776 330 792 322 L792 340 C782 350 772 362 770 380 Z" fill="#9be15d" opacity=".7"/>
          <g fill="#4f9d5d"><ellipse cx="760" cy="96" rx="44" ry="13" transform="rotate(-32 760 96)"/><ellipse cx="786" cy="140" rx="34" ry="11" transform="rotate(18 786 140)"/></g>

  /** Popover dettagliato per un hotspot */
  function openPop(key) {
    const wrap = document.getElementById('terraWrap'), pop = document.getElementById('terraPop');
    if (!wrap || !pop) return;
    if (openKey === key && !pop.classList.contains('hidden')) { closePop(); return; }
    openKey = key;
    const now = Logic.envNow(), cur = now[key], env = cur ? { datetime: cur.dt } : null;
    const r = Logic.range(key), v = cur ? cur.v : null, ev = Logic.evalParam(key, v);
    const night = now.tempNotte, nightEv = night ? Logic.evalParam('tempNotte', night.v) : null;
    const water = Logic.waterState();
    const span = Math.max(1, r.hi - r.lo), dMin = Math.min(r.lo - span * .75, v ?? r.lo), dMax = Math.max(r.hi + span * .75, v ?? r.hi);
    const pos = x => Utils.clamp((x - dMin) / (dMax - dMin) * 100, 0, 100);
    pop.innerHTML = `
      <div class="row-between" style="margin-bottom:8px"><b>${I(HOT[key].icon)} ${r.label}</b><button class="btn btn-ghost btn-sm btn-icon" data-pop-close aria-label="Chiudi">${I('x')}</button></div>
      ${env ? `<div class="row" style="gap:10px;margin-bottom:10px"><span class="pop-val c-${ev.status}">${Utils.fmtNum(v, r.unit)}</span><span class="badge b-${ev.status}">${ev.label}</span></div>
        <div class="gauge-track" style="height:8px"><div class="gauge-band" style="left:${pos(r.lo)}%;width:${pos(r.hi) - pos(r.lo)}%"></div><div class="gauge-pos" style="--x:${v === null ? 50 : Utils.round(pos(v), 2)}"><div class="gauge-marker" style="color:${colorOf(ev.status)};width:14px;height:14px"></div></div></div>
        <p class="faint small" style="margin-top:10px">${r.brum ? 'Invernale' : 'Ottimale'} <b class="muted">${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit}</b> · lettura ${Utils.relTime(env.datetime)}<br>${Utils.fmtDateTime(env.datetime)}</p>
        ${key === 'tempFredda' && night ? `<p class="faint small" style="margin-top:6px">${I('moon')} Minima notturna <b class="c-${nightEv.status}">${Utils.fmtNum(night.v, '°C')}</b> · ${Utils.relTime(night.dt)}</p>` : ''}`
        : `<p class="muted small">Nessuna lettura registrata. Range ottimale ${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit}.</p>`}
      ${key === 'umidita' ? `<p class="faint small" style="margin-top:6px">💧 Acqua cambiata ${water.last ? `<b class="c-${water.status}">${Utils.relDays(water.days)}</b>` : '<b>mai</b>'} · ogni ${water.target} giorni</p>` : ''}
      <div class="row" style="margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" data-add="env">${I('plus')} Nuova lettura</button>
        ${key === 'umidita' ? `<button class="btn btn-sm" data-water>${I('check')} Acqua cambiata</button>` : ''}
      </div>`;
    pop.classList.remove('hidden');
    // Posizionamento accanto all'hotspot, entro i bordi del contenitore
    const W = wrap.clientWidth, H = wrap.clientHeight;
    if (W < 520) {
      // Su schermi stretti il pannello compare sotto il terrario, senza coprirlo
      Object.assign(pop.style, { position: 'relative', left: 'auto', top: 'auto', right: 'auto', bottom: 'auto', width: 'auto', marginTop: '10px' });
    } else {
      Object.assign(pop.style, { position: '', right: 'auto', bottom: 'auto', width: '', marginTop: '' });
      const hx = HOT[key].x / VB.w * W, hy = HOT[key].y / VB.h * H;
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = hx - pw / 2, top = hy + 30;
      if (top + ph > H - 6) top = hy - ph - 30;
      pop.style.left = `${Utils.clamp(left, 8, W - pw - 8)}px`;
      pop.style.top = `${Utils.clamp(top, 8, Math.max(8, H - ph - 8))}px`;
    }
    document.querySelectorAll('[data-hs]').forEach(h => h.classList.toggle('active', h.dataset.hs === key));
  }
  function closePop() {
    openKey = null;
    const pop = document.getElementById('terraPop');
    if (pop) pop.classList.add('hidden');
    document.querySelectorAll('[data-hs]').forEach(h => h.classList.remove('active'));
  }
  return { html, openPop, closePop, phase, tick, isOpen: () => openKey !== null };
})();

    const body = `
