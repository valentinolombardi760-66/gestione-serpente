      ['Peso', e => Utils.fmtNum(e.pesoPreda, 'g'), 'nowrap'],
      ['Rapporto', e => { const r = Utils.num(e.rapporto); return r === null ? '—' : `<span class="c-${Logic.ratioStatus(r)}">${Utils.fmtNum(r, '%')}</span>`; }, 'nowrap'],
      ['Esito', e => badge(e.esito, STATUS.esito[e.esito] || 'neutral')],
      ['Note', e => Utils.esc(e.note), 'cell-notes']] },
    growth: { filter: null, cols: [
      ['Data', e => `${Utils.fmtDate(e.data)}<span class="sub">${Utils.relDays(Utils.daysSince(e.data))}</span>`],
      ['Peso', e => Utils.fmtNum(e.peso, 'g'), 'nowrap'], ['Lunghezza', e => Utils.fmtNum(e.lunghezza, 'cm'), 'nowrap'],
      ['Note', e => Utils.esc(e.note), 'cell-notes']] },
    shed: { filter: { field: 'esito', options: Schema.OPTIONS.esitoMuta }, cols: [
      ['Fase opaca', e => `${Utils.fmtDate(e.dataInizio)}<span class="sub">${Utils.relDays(Utils.daysSince(e.dataInizio))}</span>`],
      ['Completata', e => e.dataFine ? Utils.fmtDate(e.dataFine) : '—', 'nowrap'],
      ['Durata', e => { const d = e.dataFine ? Utils.daysBetween(e.dataInizio, e.dataFine) : Utils.daysSince(e.dataInizio); return d === null || d < 0 ? '—' : Utils.plural(d, 'giorno', 'giorni') + (e.dataFine ? '' : ' finora'); }, 'nowrap'],
      ['Esito', e => badge(e.esito, STATUS.muta[e.esito] || 'neutral')],
      ['Note', e => Utils.esc(e.note), 'cell-notes']] },
    maintenance: { filter: { field: 'tipo', options: Schema.OPTIONS.manutenzione }, cols: [

      ['Intervento', e => Utils.esc(e.tipo)], ['Note', e => Utils.esc(e.note), 'cell-notes']] },
    handling: { filter: { field: 'comportamento', options: Schema.OPTIONS.comportamento }, cols: [
      ['Data', e => `${Utils.fmtDate(e.data)}<span class="sub">${Utils.relDays(Utils.daysSince(e.data))}</span>`],
      ['Durata', e => Utils.fmtNum(e.durata, 'min'), 'nowrap'],

  /** HTML del contenitore: toolbar (ricerca + filtri) e righe */
  function block(type) {
    const st = ui[type] || (ui[type] = { q: '', f: '' });
    const cfg = COLS[type];
    return `<div class="toolbar">
        <div class="search"><input class="input" type="search" placeholder="Cerca nelle note e nei valori…" value="${Utils.esc(st.q)}" data-search="${type}" aria-label="Cerca"></div>
        ${cfg.filter ? `<div class="chips">${['', ...cfg.filter.options].map(o => `<button class="chip chip-sm${st.f === o ? ' on' : ''}" data-filter="${type}" data-value="${Utils.esc(o)}">${o ? Utils.esc(o) : 'Tutti'}</button>`).join('')}</div>` : ''}
      </div>
      <div data-rows="${type}">${rows(type)}</div>`;
  }

  function rows(type) {
    const st = ui[type] || (ui[type] = { q: '', f: '' });
    const cfg = COLS[type], def = Schema.LOGS[type];
    const all = Store.get().logs[type];
    if (!all.length) {
      return `<div class="empty"><div class="empty-ico">${def.icon}</div><b>Ancora nessuna voce</b><p>Il registro "${def.label.toLowerCase()}" è vuoto. Aggiungi la prima registrazione per vedere statistiche e storico.</p><button class="btn btn-primary btn-sm" data-add="${type}">＋ Registra ${def.label.toLowerCase()}</button></div>`;
    }
    const q = st.q.trim().toLowerCase();
    const list = all.filter(e => {
      if (st.f && cfg.filter && e[cfg.filter.field] !== st.f) return false;
      if (!q) return true;
      return Object.entries(e).some(([k, v]) => k !== 'id' && v !== null && v !== '' && String(v).toLowerCase().includes(q))
        || Utils.fmtDate(e[def.dateKey]).toLowerCase().includes(q);
    });
    if (!list.length) {
      return `<div class="empty"><div class="empty-ico">🔍</div><b>Nessun risultato</b><p>Nessuna voce corrisponde a ricerca e filtri attivi.</p><button class="btn btn-sm" data-reset-filters="${type}">Azzera filtri</button></div>`;
    }
    return `<div class="rtable-wrap"><div class="rtable-scroll"><table class="rtable">
        <thead><tr>${cfg.cols.map(c => `<th>${c[0]}</th>`).join('')}<th><span class="sr-only">Azioni</span></th></tr></thead>
        <tbody>${list.map(e => `<tr>${cfg.cols.map((c, i) => {
          const html = c[1](e);
          const cls = [i === 0 ? 'cell-primary' : '', c[2] || '', c[2] === 'cell-notes' && !e.note ? 'is-empty' : ''].filter(Boolean).join(' ');
          return `<td data-label="${c[0]}"${cls ? ` class="${cls}"` : ''}>${html || (c[2] === 'cell-notes' ? '<span class="faint">—</span>' : '')}</td>`;
        }).join('')}
          <td class="cell-actions"><button class="btn btn-ghost btn-sm btn-icon" data-edit="${type}" data-id="${Utils.esc(e.id)}" aria-label="Modifica" title="Modifica">✎</button><button class="btn btn-ghost btn-sm btn-icon" data-del="${type}" data-id="${Utils.esc(e.id)}" aria-label="Elimina" title="Elimina">🗑</button></td></tr>`).join('')}</tbody>
      </table></div></div>
      <div class="list-foot"><span>${list.length === all.length ? Utils.plural(all.length, 'voce', 'voci') : `${list.length} di ${all.length} voci`}</span><span class="desktop-only">Doppio clic su una riga per modificarla</span></div>`;
  }

  function refresh(type) { const host = document.querySelector(`[data-rows="${type}"]`); if (host) host.innerHTML = rows(type); }

  document.addEventListener('input', e => {
    const s = e.target.closest('[data-search]');
    if (s) { (ui[s.dataset.search] || (ui[s.dataset.search] = { q: '', f: '' })).q = s.value; refresh(s.dataset.search); }
  });
  document.addEventListener('click', e => {
    const f = e.target.closest('[data-filter]');
    if (f) {
      const t = f.dataset.filter; ui[t].f = f.dataset.value;
      f.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === f));
      refresh(t);
    }
    const r = e.target.closest('[data-reset-filters]');
    if (r) { const t = r.dataset.resetFilters; ui[t] = { q: '', f: '' }; Router.render(); }
  });
  document.addEventListener('dblclick', e => {
    const tr = e.target.closest('.rtable tbody tr');
    const b = tr && tr.querySelector('[data-edit]');
    if (b) Forms.open(b.dataset.edit, { id: b.dataset.id });
  });

  return { block, refresh, badge, STATUS };
})();

/* ==========================================================================
   Actions — azioni condivise (elimina con annulla, cambio acqua rapido, backup)
   ========================================================================== */
const Actions = (() => {
  function remove(type, id) {
    const removed = Store.remove(type, id);
    if (!removed) return;
    Toast.show(`${Schema.LOGS[type].label} eliminat${Schema.LOGS[type].g === 'm' ? 'o' : 'a'}`, 'info', { duration: 6000, action: { label: 'Annulla', run: () => Store.restore(type, removed) } });
  }
  function quickWater() {
    const e = Store.add('maintenance', { data: Utils.todayISO(), tipo: 'Cambio acqua', note: '' });
    if (e) Toast.show('Cambio acqua registrato per oggi', 'ok', { action: { label: 'Annulla', run: () => Store.remove('maintenance', e.id) } });
  }
  function runAlertAction(a) {
    if (!a) return;
    if (a.kind === 'form') Forms.open(a.type, { presets: a.presets || {} });
    else if (a.kind === 'edit') Forms.open(a.type, { id: a.id, presets: a.presets || {} });
    else if (a.kind === 'water') quickWater();
    else if (a.kind === 'nav') Router.go(a.to);
  }
  /** Foglio "Registra" con tutti i tipi */
  function openAddSheet() {
    const body = `<div class="add-grid">${Schema.LOG_TYPES.map(t => { const d = Schema.LOGS[t]; return `<button class="add-tile" data-add="${t}"><span class="t-ico">${d.icon}</span><b>${d.label}</b><small>${d.desc}</small></button>`; }).join('')}</div>
      <p class="faint small" style="margin-top:14px">Suggerimento: su computer premi <kbd>N</kbd> per aprire questo pannello.</p>`;
    Overlay.open({ title: 'Cosa vuoi registrare?', body });
  }
  function exportBackup() {
    try {
      const json = Store.exportJSON();
      const name = (Store.get().profile.nome || 'serpente').toLowerCase().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'serpente';
      const fileName = `snakecheck-${name}-${Utils.todayISO()}.json`;
      if (window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') {
        const ok = window.AndroidBridge.saveFile(fileName, json);
        Toast.show(ok ? `Backup salvato in Download: ${fileName}` : 'Esportazione non riuscita', ok ? 'ok' : 'bad');
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      Toast.show('Backup esportato', 'ok');
    } catch (err) { console.warn(err); Toast.show('Esportazione non riuscita', 'bad'); }
  }
  async function importBackup(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { Toast.show('File troppo grande (max 5 MB)', 'bad'); return; }
    try {
      let raw;
      try { raw = JSON.parse(await file.text()); } catch (e) { throw new Error('il file non è un JSON valido'); }
      const parsed = Store.validateImport(raw);
      const count = Schema.LOG_TYPES.reduce((a, t) => a + parsed.logs[t].length, 0);
      const ok = await Overlay.confirm({ title: 'Importa backup', message: `Il file contiene il profilo <b>${Utils.esc(parsed.profile.nome || 'senza nome')}</b> e ${Utils.plural(count, 'voce', 'voci')}. I dati attuali verranno <b>sostituiti</b>.`, confirmLabel: 'Importa' });
      if (!ok) return;
      Store.replace(parsed);
      Toast.show(`Backup importato: ${Utils.plural(count, 'voce', 'voci')}`, 'ok');
    } catch (err) { Toast.show(`Importazione fallita: ${err.message}`, 'bad', { duration: 6000 }); }
  }
  async function loadDemo() {
    if (!Store.isEmpty()) {
      const ok = await Overlay.confirm({ title: 'Carica dati demo', message: 'I dati attuali verranno <b>sostituiti</b> con il set dimostrativo. Esporta prima un backup se vuoi conservarli.', confirmLabel: 'Carica demo', danger: true });
      if (!ok) return;
    }
    Store.replace(Demo.build());
    Toast.show('Dati demo caricati', 'ok');
    Router.go('dashboard');
  }
  async function clearAll() {
    const a = await Overlay.confirm({ title: 'Svuota tutti i dati', message: 'Stai per eliminare <b>profilo e tutti i registri</b> salvati in questo browser. L\'operazione non è reversibile.', confirmLabel: 'Continua', danger: true });
    if (!a) return;
    const b = await Overlay.confirm({ title: 'Conferma definitiva', message: 'Ultimo passaggio: dopo non sarà possibile recuperare i dati.', confirmLabel: 'Elimina tutto', danger: true, requireText: 'ELIMINA' });
    if (!b) return;
    Store.reset();
    Toast.show('Tutti i dati sono stati eliminati', 'ok');
  }
  return { remove, quickWater, runAlertAction, openAddSheet, exportBackup, importBackup, loadDemo, clearAll };
})();

/* ==========================================================================
   Anim — count-up dei numeri KPI
   ========================================================================== */
const Anim = (() => {
  const prev = new Map();
  function countUp(root) {
    root.querySelectorAll('[data-count]').forEach(el => {
      const to = Utils.num(el.dataset.count);
      if (to === null) return;
      const key = el.dataset.key || '';
      const dec = +el.dataset.dec || 0;
      const from = prev.has(key) ? prev.get(key) : 0;
      prev.set(key, to);
      const fmt = v => Utils.fmtNum(Utils.round(v, dec), '', dec);
      if (from === to || Utils.reducedMotion()) { el.textContent = fmt(to); return; }
      const t0 = performance.now(), dur = 900;
      const ease = t => 1 - Math.pow(2, -10 * t);
      const step = now => {
        const t = Math.min(1, (now - t0) / dur);
        el.textContent = fmt(from + (to - from) * (t === 1 ? 1 : ease(t)));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
  return { countUp };
})();

/* ==========================================================================
   Morph — dizionario e resolver dei morph del serpente del grano
   Riconosce i morph principali, le combinazioni e le parole chiave libere.

const Morph = (() => {
  const COLORS = {
    classic: { name: 'Classic / Normale', base: '#e07a2e', saddle: '#b8231c', border: '#16110e', eye: '#2b1d14', desc: 'Fondo arancio e selle rosso mattone bordate di nero: il fenotipo selvatico.' },

    anery: { name: 'Anerythristic (Anery)', base: '#a7aaad', saddle: '#3f4449', border: '#121416', eye: '#1b1d20', desc: 'Senza pigmenti rossi: grigi e neri, spesso con toni gialli sul collo.' },
    snow: { name: 'Snow', base: '#f5eee8', saddle: '#f3cfc1', border: '#ffffff', eye: '#d9545f', desc: 'Amel + Anery: bianco con selle rosa e giallo pallido, occhi rossi.' },
    ghost: { name: 'Ghost', base: '#c9b9be', saddle: '#8f7f86', border: '#6c5e65', eye: '#3a2f34', desc: 'Hypo + Anery: grigi lavanda e pastello a basso contrasto.' },
    charcoal: { name: 'Charcoal', base: '#7c7f84', saddle: '#45484d', border: '#2c2e31', eye: '#1a1b1d', desc: 'Grigio antracite uniforme, contrasto ridotto e niente gialli.' },
    blizzard: { name: 'Blizzard', base: '#f8f6f2', saddle: '#eee8e1', border: '#f8f6f2', eye: '#d9535f', pattern: 'none', desc: 'Amel + Charcoal: quasi completamente bianco, pattern appena accennato.' },
    okeetee: { name: 'Okeetee', base: '#f2862a', saddle: '#c2241a', border: '#000000', eye: '#2b1d14', borderW: 3.4, desc: 'Arancio intenso, selle rosse e bordi neri spessi e netti.' },
    reverseOkeetee: { name: 'Reverse Okeetee', base: '#f8a96a', saddle: '#e0372a', border: '#ffffff', eye: '#d6424f', borderW: 3.4, desc: 'Amel di linea Okeetee: selle rosse con spessi bordi bianchi.' },
    butter: { name: 'Butter', base: '#f6e29a', saddle: '#f2c14e', border: '#fffaea', eye: '#d6424f', desc: 'Amel + Caramel: giallo burro con selle dorate e occhi rossi.' },
    caramel: { name: 'Caramel', base: '#dcb26a', saddle: '#a8702a', border: '#5c3d17', eye: '#2b1d14', desc: 'Toni caramello e ambra al posto del rosso.' },
    palmetto: { name: 'Palmetto', base: '#fbf8f3', saddle: '#e6553d', border: '#2a1f1a', eye: '#2b1d14', pattern: 'speckle', speckles: ['#e6553d', '#f29a3a', '#2a1f1a', '#c23a2a'], desc: 'Bianco con macchioline colorate sparse: un pattern rarissimo.' },
    lavender: { name: 'Lavender', base: '#d8c3cf', saddle: '#9c7189', border: '#7d5b6d', eye: '#7a2f3f', desc: 'Toni lilla e malva, occhi rubino scuro.' },
    hypo: { name: 'Hypomelanistic (Hypo)', base: '#f0a067', saddle: '#d14a33', border: '#7a4a35', eye: '#4a2a1d', desc: 'Melanina ridotta: colori caldi con bordi marroni morbidi.' },
    bloodred: { name: 'Bloodred', base: '#c8331f', saddle: '#9e1c12', border: '#7d1a10', eye: '#2b1d14', desc: 'Rosso intenso e uniforme, pattern che sfuma con l\'età.' }
  };
  const PATTERNS = {
    saddles: { name: '', desc: '' },
    motley: { name: 'Motley', desc: 'Selle allungate e collegate tra loro.' },
    striped: { name: 'Striped', desc: 'Strisce dorsali continue al posto delle selle.' },
    speckle: { name: '', desc: '' },
    none: { name: '', desc: '' }
  };
  // Regole: prima le combinazioni e i nomi più specifici
  const RULES = [
    [s => /reverse\s*-?\s*okeetee|r\.?\s*okeetee/.test(s), 'reverseOkeetee'],
    [s => /blizzard/.test(s) || (/\bamel|albin/.test(s) && /charcoal/.test(s)), 'blizzard'],
    [s => /palmetto/.test(s), 'palmetto'],
    [s => /snow|neve/.test(s) || (/\bamel|albin/.test(s) && /anery|anerit/.test(s)), 'snow'],
    [s => /ghost|fantasma/.test(s) || (/hypo/.test(s) && /anery|anerit/.test(s)), 'ghost'],
    [s => /butter|burro/.test(s) || (/\bamel|albin/.test(s) && /caramel/.test(s)), 'butter'],
    [s => /charcoal|carbone/.test(s), 'charcoal'],
    [s => /caramel/.test(s), 'caramel'],
    [s => /lavender|lavanda/.test(s), 'lavender'],
    [s => /okeetee/.test(s), 'okeetee'],
    [s => /blood\s*red|bloodred|sangue/.test(s), 'bloodred'],
    [s => /\bamel|albin/.test(s), 'amel'],
    [s => /anery|anerit|anerythr/.test(s), 'anery'],
    [s => /hypo/.test(s), 'hypo'],
    [s => /classic|normal|wild|selvatic|carolina/.test(s), 'classic']
  ];

  /** Ritorna l'aspetto visivo per una stringa morph libera */
  function resolve(input) {
    const raw = typeof input === 'string' ? input.trim() : '';
    const s = raw.toLowerCase();
    const rule = RULES.find(([test]) => test(s));
    const key = rule ? rule[1] : 'classic';
    const c = COLORS[key];
    let pattern = c.pattern || 'saddles';
    if (pattern === 'saddles') {
      if (/motley/.test(s)) pattern = 'motley';
      else if (/strip|striat|strisc/.test(s)) pattern = 'striped';
    }
    const p = PATTERNS[pattern];
    const custom = !!raw && !rule;
    return {
      ...c, key, pattern, custom,
      label: raw ? (custom ? raw : [c.name, p.name].filter(Boolean).join(' · ')) : 'Classic / Normale',
      desc: custom ? `Morph personalizzato: mostrato con i colori del fenotipo classico.` : [c.desc, p.desc].filter(Boolean).join(' ')
    };
  }
  const names = () => [...Object.values(COLORS).map(c => c.name.split(' (')[0].split(' / ')[0]), 'Motley', 'Striped', 'Snow Motley', 'Amel Striped', 'Anery Motley'];
  return { resolve, names, COLORS };
})();

/* ==========================================================================
   Snake — disegno vettoriale del serpente (corpo affusolato, selle, testa)
   ========================================================================== */
const Snake = (() => {
  /** Campiona una curva Catmull-Rom e la ridistribuisce in N punti equidistanti */
  function sample(pts, N) {
    const dense = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      for (let k = 0; k < 24; k++) {
        const t = k / 24, t2 = t * t, t3 = t2 * t;
        dense.push([
          .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
        ]);
      }
    }
    dense.push(pts[pts.length - 1]);
    const cum = [0];
    for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]));
    const total = cum[cum.length - 1];
    const out = [];
    let j = 0;
    for (let n = 0; n < N; n++) {
      const d = total * n / (N - 1);
      while (j < cum.length - 2 && cum[j + 1] < d) j++;
      const seg = cum[j + 1] - cum[j] || 1, t = (d - cum[j]) / seg;
      out.push({ x: dense[j][0] + (dense[j + 1][0] - dense[j][0]) * t, y: dense[j][1] + (dense[j + 1][1] - dense[j][1]) * t, s: n / (N - 1) });
    }
    out.forEach((p, i) => {
      const a = out[Math.max(i - 1, 0)], b = out[Math.min(i + 1, N - 1)];
      p.a = Math.atan2(b.y - a.y, b.x - a.x);
    });
    return { P: out, total };
  }
  /** Larghezza del corpo: coda affusolata, collo leggermente più stretto */
  const width = (s, B) => {
    let w = B * Math.min(1, .1 + .9 * Math.pow(Math.min(1, s / .42), .75));
    if (s > .94) w *= .86;
    return w;
  };
  const f = n => n.toFixed(1);
  const deg = a => a * 180 / Math.PI;
  /** Generatore pseudo-casuale riproducibile */
  const rng = seed => () => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };

  /**
   * Restituisce il markup SVG di un serpente.
   * look: risultato di Morph.resolve; pts: punti guida coda→testa; opts: { B, uid, animated }
   */
  function svg(look, pts, { B = 22, uid = 'sn', animated = true } = {}) {
    const { P, total } = sample(pts, 160);
    const L = [], R = [];
    P.forEach(p => {
      const w = width(p.s, B) / 2, nx = -Math.sin(p.a), ny = Math.cos(p.a);
      L.push(`${f(p.x + nx * w)},${f(p.y + ny * w)}`);
      R.push(`${f(p.x - nx * w)},${f(p.y - ny * w)}`);
    });
    const outline = `M${L.join(' L')} L${R.reverse().join(' L')} Z`;
    const at = s => P[Math.min(P.length - 1, Math.max(0, Math.round(s * (P.length - 1))))];
    const bw = look.borderW || 2.2;
    let pattern = '';

    if (look.pattern === 'saddles' || look.pattern === 'motley') {
      const motley = look.pattern === 'motley';
      const step = B * (motley ? 1.05 : 1.2);
      for (let d = total * .1; d < total * .93; d += step) {
        const p = at(d / total), w = width(p.s, B);
        const rx = motley ? B * .62 : B * .3, ry = w * (motley ? .3 : .44);
        const tr = `rotate(${f(deg(p.a))} ${f(p.x)} ${f(p.y)})`;
        pattern += `<ellipse cx="${f(p.x)}" cy="${f(p.y)}" rx="${f(rx + bw)}" ry="${f(ry + bw)}" fill="${look.border}" transform="${tr}"/>`
          + `<ellipse cx="${f(p.x)}" cy="${f(p.y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${look.saddle}" transform="${tr}"/>`;
        if (!motley) {
          const q = at((d + step / 2) / total), wq = width(q.s, B);
          if (q.s < .93) [-1, 1].forEach(side => {
            const ox = q.x - Math.sin(q.a) * wq * .36 * side, oy = q.y + Math.cos(q.a) * wq * .36 * side;
            pattern += `<ellipse cx="${f(ox)}" cy="${f(oy)}" rx="${f(B * .17)}" ry="${f(wq * .1)}" fill="${look.saddle}" stroke="${look.border}" stroke-width="${f(bw * .5)}" opacity=".85" transform="rotate(${f(deg(q.a))} ${f(ox)} ${f(oy)})"/>`;
          });
        }
      }
    } else if (look.pattern === 'striped') {
      const line = off => P.filter(p => p.s > .06 && p.s < .95).map(p => { const w = width(p.s, B) * off; return `${f(p.x - Math.sin(p.a) * w)},${f(p.y + Math.cos(p.a) * w)}`; }).join(' ');
      pattern = `<polyline points="${line(0)}" fill="none" stroke="${look.border}" stroke-width="${f(B * .34)}" stroke-linecap="round" stroke-linejoin="round"/>`
        + `<polyline points="${line(0)}" fill="none" stroke="${look.saddle}" stroke-width="${f(B * .22)}" stroke-linecap="round" stroke-linejoin="round"/>`
        + `<polyline points="${line(.36)}" fill="none" stroke="${look.saddle}" stroke-width="${f(B * .07)}" stroke-linecap="round" opacity=".8"/>`
        + `<polyline points="${line(-.36)}" fill="none" stroke="${look.saddle}" stroke-width="${f(B * .07)}" stroke-linecap="round" opacity=".8"/>`;
    } else if (look.pattern === 'speckle') {
      const r = rng(7);
      P.forEach((p, i) => {
        if (i % 2 || p.s < .05 || p.s > .95) return;
        const w = width(p.s, B), off = (r() - .5) * w * .8;
        const x = p.x - Math.sin(p.a) * off, y = p.y + Math.cos(p.a) * off;
        pattern += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(.8 + r() * B * .07)}" fill="${look.speckles[Math.floor(r() * look.speckles.length)]}"/>`;
      });
    }

    // Lucentezza dorsale per dare volume
    const sheen = P.filter(p => p.s > .08 && p.s < .93).map(p => { const w = width(p.s, B) * .24; return `${f(p.x - Math.sin(p.a) * -w)},${f(p.y + Math.cos(p.a) * -w)}`; }).join(' ');

    // Testa orientata lungo l'ultima tangente
    const h = P[P.length - 1], W = B * .9;
    const head = `<g class="snake-head" transform="translate(${f(h.x)} ${f(h.y)}) rotate(${f(deg(h.a))})">
        <path class="${animated ? 'tongue' : ''}" d="M${f(W * 1.42)},0 L${f(W * 1.95)},0 M${f(W * 1.95)},0 L${f(W * 2.15)},-${f(W * .14)} M${f(W * 1.95)},0 L${f(W * 2.15)},${f(W * .14)}" stroke="#e2364a" stroke-width="1.5" stroke-linecap="round" fill="none" ${animated ? '' : 'style="display:none"'}/>
        <path d="M${f(-W * .25)},${f(-W * .5)} C${f(W * .45)},${f(-W * .64)} ${f(W * 1.15)},${f(-W * .52)} ${f(W * 1.45)},${f(-W * .12)} C${f(W * 1.52)},0 ${f(W * 1.52)},0 ${f(W * 1.45)},${f(W * .12)} C${f(W * 1.15)},${f(W * .52)} ${f(W * .45)},${f(W * .64)} ${f(-W * .25)},${f(W * .5)} Z" fill="${look.base}"/>
        ${look.pattern === 'none' || look.pattern === 'speckle' ? '' : `<path d="M${f(W * .05)},${f(-W * .3)} L${f(W * .85)},0 L${f(W * .05)},${f(W * .3)} L${f(W * .3)},0 Z" fill="${look.saddle}" stroke="${look.border}" stroke-width="${f(bw * .6)}" stroke-linejoin="round"/>`}
        <circle cx="${f(W * .98)}" cy="${f(-W * .27)}" r="${f(W * .13)}" fill="${look.eye}" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>
        <circle cx="${f(W * 1.01)}" cy="${f(-W * .3)}" r="${f(W * .04)}" fill="#fff" opacity=".85"/>
        <circle cx="${f(W * .98)}" cy="${f(W * .27)}" r="${f(W * .13)}" fill="${look.eye}" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>
        <circle cx="${f(W * 1.33)}" cy="${f(-W * .07)}" r="${f(W * .03)}" fill="rgba(0,0,0,.5)"/><circle cx="${f(W * 1.33)}" cy="${f(W * .07)}" r="${f(W * .03)}" fill="rgba(0,0,0,.5)"/>
      </g>`;

    return `<g class="snake-body${animated ? ' anim' : ''}">
        <path d="${outline}" transform="translate(0 ${f(B * .28)})" fill="rgba(0,0,0,.35)" filter="url(#${uid}-blur)"/>
        <defs><clipPath id="${uid}-clip"><path d="${outline}"/></clipPath><filter id="${uid}-blur" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="${f(B * .22)}"/></filter></defs>
        <path d="${outline}" fill="${look.base}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
        <g clip-path="url(#${uid}-clip)">${pattern}
          <polyline points="${sheen}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="${f(B * .16)}" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        ${head}
      </g>`;
  }

  /** Anteprima compatta (impostazioni, scheda) */
  const preview = (look, uid = 'pv') => `<svg viewBox="0 0 300 70" class="snake-preview" role="img" aria-label="Anteprima ${Utils.esc(look.label)}">
      ${svg(look, [[12, 42], [58, 30], [110, 46], [162, 28], [214, 44], [250, 34]], { B: 16, uid, animated: false })}</svg>`;

  return { svg, preview };
})();

          <linearGradient id="tSub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5636"/><stop offset="1" stop-color="#3b2716"/></linearGradient>
          <pattern id="tGrain" width="14" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#a07850" opacity=".55"/><circle cx="10" cy="7" r=".9" fill="#2a1a0e" opacity=".6"/><rect x="6" y="1" width="3" height="1" fill="#c49a6c" opacity=".35" transform="rotate(25 7 1)"/></pattern>

          <text x="34" y="44" class="t-zone">ZONA FREDDA</text>

          <!-- Piante sullo sfondo -->
          <g opacity=".9">

            <ellipse cx="690" cy="54" rx="34" ry="7" fill="#fed7aa" class="bulb"/>

          <path d="M28 318 C140 230 250 272 360 230 C450 196 520 190 600 214 C680 238 730 210 792 168" fill="none" stroke="url(#tBranch)" stroke-width="15" stroke-linecap="round"/>
          <path d="M28 314 C140 226 250 268 360 226 C450 192 520 186 600 210 C680 234 730 206 792 164" fill="none" stroke="#a87d52" stroke-width="3" stroke-linecap="round" opacity=".5"/>

          <path d="M10 352 C120 340 220 360 330 350 C450 340 560 362 680 348 C730 343 770 350 790 346 L790 430 L10 430 Z" fill="url(#tSub)"/>
          <path d="M10 352 C120 340 220 360 330 350 C450 340 560 362 680 348 C730 343 770 350 790 346 L790 430 L10 430 Z" fill="url(#tGrain)"/>
          <!-- Nascondiglio (zona fredda) -->
          <g>
            <path d="M34 372 C40 300 176 296 192 372 Z" fill="#4b4f57" stroke="rgba(255,255,255,.08)"/>

      ${st.profile.sorgenteCalore ? `<span class="badge b-neutral">🔥 ${Utils.esc(st.profile.sorgenteCalore)}</span>` : ''}

  }
  const f2 = n => (Math.round(n * 100) / 100).toString();

  /** Popover dettagliato per un hotspot */
  function openPop(key) {
    const wrap = document.getElementById('terraWrap'), pop = document.getElementById('terraPop');
    if (!wrap || !pop) return;
    if (openKey === key && !pop.classList.contains('hidden')) { closePop(); return; }
    openKey = key;
    const env = Store.get().logs.env[0] || null;
    const r = Logic.range(key), v = env ? Utils.num(env[key]) : null, ev = Logic.evalParam(key, v);
    const water = Logic.waterState();
    const span = Math.max(1, r.hi - r.lo), dMin = Math.min(r.lo - span * .75, v ?? r.lo), dMax = Math.max(r.hi + span * .75, v ?? r.hi);
    const pos = x => Utils.clamp((x - dMin) / (dMax - dMin) * 100, 0, 100);
    pop.innerHTML = `
      <div class="row-between" style="margin-bottom:8px"><b>${HOT[key].icon} ${r.label}</b><button class="btn btn-ghost btn-sm btn-icon" data-pop-close aria-label="Chiudi">✕</button></div>
      ${env ? `<div class="row" style="gap:10px;margin-bottom:10px"><span class="pop-val c-${ev.status}">${Utils.fmtNum(v, r.unit)}</span><span class="badge b-${ev.status}">${ev.label}</span></div>
        <div class="gauge-track" style="height:8px"><div class="gauge-band" style="left:${pos(r.lo)}%;width:${pos(r.hi) - pos(r.lo)}%"></div><div class="gauge-marker" style="left:${v === null ? 50 : pos(v)}%;color:${colorOf(ev.status)};width:14px;height:14px"></div></div>
        <p class="faint small" style="margin-top:10px">Ottimale <b class="muted">${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit}</b> · lettura ${Utils.relTime(env.datetime)}<br>${Utils.fmtDateTime(env.datetime)}</p>`
        : `<p class="muted small">Nessuna lettura registrata. Range ottimale ${Utils.fmtNum(r.lo)}–${Utils.fmtNum(r.hi)} ${r.unit}.</p>`}
      ${key === 'umidita' ? `<p class="faint small" style="margin-top:6px">💧 Acqua cambiata ${water.last ? `<b class="c-${water.status}">${Utils.relDays(water.days)}</b>` : '<b>mai</b>'} · ogni ${water.target} giorni</p>` : ''}
      <div class="row" style="margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" data-add="env">＋ Nuova lettura</button>
        ${key === 'umidita' ? '<button class="btn btn-sm" data-water>✓ Acqua cambiata</button>' : ''}
      </div>`;
    pop.classList.remove('hidden');
    // Posizionamento accanto all'hotspot, entro i bordi del contenitore
    const W = wrap.clientWidth, H = wrap.clientHeight;
    if (W < 520) {
      // Su schermi stretti il pannello compare sotto il terrario, senza coprirlo
      Object.assign(pop.style, { position: 'relative', left: 'auto', top: 'auto', right: 'auto', bottom: 'auto', width: 'auto', marginTop: '10px' });
    } else {
      Object.assign(pop.style, { position: '', right: 'auto', bottom: 'auto', width: '', marginTop: '' });
      const hx = HOT[key].x / VB.w * W, hy = HOT[key].y / VB.h * H;
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = hx - pw / 2, top = hy + 30;
      if (top + ph > H - 6) top = hy - ph - 30;
      pop.style.left = `${Utils.clamp(left, 8, W - pw - 8)}px`;
      pop.style.top = `${Utils.clamp(top, 8, Math.max(8, H - ph - 8))}px`;
    }
    document.querySelectorAll('[data-hotspot]').forEach(h => h.classList.toggle('active', h.dataset.hotspot === key));
  }
  function closePop() {
    openKey = null;
    const pop = document.getElementById('terraPop');
    if (pop) pop.classList.add('hidden');
    document.querySelectorAll('[data-hotspot]').forEach(h => h.classList.remove('active'));
  }
  return { html, openPop, closePop, isOpen: () => openKey !== null };
})();

/* ==========================================================================
   Inspector — scheda del serpente aperta dal terrario

const Inspector = (() => {
  function open() {
    const st = Store.get(), p = st.profile;

    const lastH = st.logs.handling[0] || null;
    const al = Logic.alerts().filter(a => a.level !== 'info');
    const nBad = al.filter(a => a.level === 'bad').length;
    const w = Logic.currentWeight(), len = Logic.currentLength(), age = Utils.age(p.dataNascita);
    const row = (icon, title, value, status) => `<div class="insp-row"><span class="dot ${status}"></span><span class="insp-ico">${icon}</span><span class="muted">${title}</span><b class="${status !== 'neutral' ? `c-${status}` : ''}">${value}</b></div>`;
    const feedTxt = feed.lastEaten
      ? `${Utils.cap(Utils.relDays(feed.days))} · ${feed.remaining > 0 ? `prossimo tra ${Utils.plural(feed.remaining, 'giorno', 'giorni')}` : feed.remaining === 0 ? 'previsto oggi' : `ritardo ${Utils.plural(-feed.remaining, 'giorno', 'giorni')}`}`
      : 'Nessun pasto consumato';
    const shedTxt = shed.last ? (shed.inShed ? `In muta da ${Utils.plural(shed.days, 'giorno', 'giorni')}` : `Ultima ${Utils.relDays(shed.days)} · ${shed.last.esito}`) : 'Nessuna muta registrata';
    const hTxt = lastH ? `${Utils.cap(Utils.relDays(Utils.daysSince(lastH.data)))} · ${lastH.comportamento}` : 'Nessuna sessione';
    const body = `
      <div class="insp-hero" style="--m-base:${look.base};--m-saddle:${look.saddle}">
        ${Snake.preview(look, 'insp')}
      </div>
      <div class="row" style="flex-wrap:wrap;margin:12px 0 4px"><span class="badge b-info">${Utils.esc(look.label)}</span>${look.custom ? '<span class="badge b-neutral">Personalizzato</span>' : ''}
        <span class="swatches"><i style="background:${look.base}"></i><i style="background:${look.saddle}"></i><i style="background:${look.border}"></i><i style="background:${look.eye}"></i></span></div>
      <p class="muted small">${Utils.esc(look.desc)}</p>
      <div class="stats" style="margin-top:14px">
        <div class="stat"><span>Età</span><b style="font-size:.95rem">${age ? Utils.esc(age) : '—'}</b></div>
        <div class="stat"><span>Peso</span><b>${Utils.fmtNum(w, 'g')}</b></div>
        <div class="stat"><span>Lunghezza</span><b>${Utils.fmtNum(len, 'cm')}</b></div>
        <div class="stat"><span>Terrario</span><b style="font-size:.95rem">${Utils.esc(p.terrarioDimensioni || '—')}</b></div>
      </div>
      <div class="insp-list">
        ${row('🐭', 'Alimentazione', feedTxt, shed.inShed && feed.remaining < 0 ? 'info' : feed.status)}
        ${row('🦎', 'Muta', shedTxt, shed.last ? (shed.inShed ? 'info' : shed.last.esito === 'Completa' ? 'ok' : 'warn') : 'neutral')}
        ${row('🤲', 'Ultimo handling', hTxt, lastH ? (Records.STATUS.comp[lastH.comportamento] || 'neutral') : 'neutral')}
        ${row('⚠️', 'Stato allerta', al.length ? `${al.length} ${al.length === 1 ? 'avviso' : 'avvisi'}${nBad ? ` (${nBad} critici)` : ''}` : 'Tutto nella norma', al.length ? (nBad ? 'bad' : 'warn') : 'ok')}
      </div>`;
    const footer = `<button class="btn" data-nav="impostazioni">✎ Modifica profilo</button><button class="btn" data-add="handling">🤲 Handling</button><button class="btn btn-primary" data-add="feeding">🐭 Registra pasto</button>`;
    Overlay.open({ title: `🐍 ${Utils.esc(p.nome || 'Il tuo serpente')}`, subtitle: `${p.sesso !== 'Non determinato' ? Utils.esc(p.sesso) + ' · ' : ''}<i>Pantherophis guttatus</i>`, body, footer });
  }
  return { open };
})();

/** Normalizza dati grezzi (localStorage o JSON importato) nello schema corrente. */
function normalizeState(rawData) { return Store.normalizeState(rawData); }

/* ==========================================================================
   Views — rendering delle schermate
   ========================================================================== */
const Views = (() => {
  const S = () => Store.get();
  const $ = sel => document.querySelector(sel);
  const tabs = { alimentazione: 'feeding', cura: 'shed' };
  const count = (v, key, dec = 0) => `<span class="num" data-count="${v}" data-key="${key}" data-dec="${dec}">${Utils.fmtNum(v, '', dec)}</span>`;

  /* ---------- Componenti condivisi ---------- */
  function gauges() {
    const env = S().logs.env[0];
    if (!env) return `<div class="empty"><div class="empty-ico">🌡️</div><b>Nessuna lettura</b><p>Registra temperature e umidità per vedere gli indicatori di soglia.</p><button class="btn btn-primary btn-sm" data-add="env">＋ Nuova lettura</button></div>`;
    return `<div class="gauges">${Object.keys(Logic.RANGES).map(k => {
      const r = Logic.range(k), v = Utils.num(env[k]), ev = Logic.evalParam(k, v);
      const span = Math.max(1, r.hi - r.lo);
      const dMin = Math.min(r.lo - span * .75, v ?? r.lo), dMax = Math.max(r.hi + span * .75, v ?? r.hi);
      const pos = x => Utils.clamp((x - dMin) / (dMax - dMin) * 100, 0, 100);
      const color = ev.status === 'ok' ? 'var(--ok)' : ev.status === 'warn' ? 'var(--warn)' : 'var(--bad)';
      return `<div class="gauge">
        <div class="gauge-head"><span class="gauge-name">${r.icon} ${r.label}</span>
          <span class="gauge-val"><span class="badge b-${ev.status}">${ev.label}</span><b class="c-${ev.status}">${Utils.fmtNum(v, r.unit)}</b></span></div>
        <div class="gauge-track" role="meter" aria-label="${r.label}" aria-valuemin="${dMin}" aria-valuemax="${dMax}" aria-valuenow="${v}">
          <div class="gauge-band" style="left:${pos(r.lo)}%;width:${pos(r.hi) - pos(r.lo)}%"></div>
          <div class="gauge-marker" style="left:${v === null ? 50 : pos(v)}%;color:${color}"></div>
        </div>
        <div class="gauge-scale"><span>${Utils.fmtNum(dMin)}</span><span style="left:${pos(r.lo)}%">${Utils.fmtNum(r.lo)}</span><span style="left:${pos(r.hi)}%">${Utils.fmtNum(r.hi)}</span><span>${Utils.fmtNum(dMax)}${r.unit}</span></div>
      </div>`;
    }).join('')}<p class="faint small">Ultima lettura: ${Utils.fmtDateTime(env.datetime)} · ${Utils.relTime(env.datetime)}</p></div>`;
  }

  function alertsHTML(list) {
    if (!list.some(a => a.level !== 'info')) {
      list = [{ level: 'ok', icon: '✅', title: 'Tutto nella norma', text: 'Parametri e routine rispettano i target impostati.' }, ...list];
    }
    return `<div class="alerts">${list.map((a, i) => `<div class="alert l-${a.level}">
        <span class="alert-ico">${a.icon}</span>
        <div><b>${Utils.esc(a.title)}</b><p>${Utils.esc(a.text)}</p></div>
        ${a.action ? `<button class="btn btn-sm" data-alert="${i}">${Utils.esc(a.action.label)}</button>` : '<span></span>'}
      </div>`).join('')}</div>`;
  }
  let lastAlerts = [];

  function timeline(limit = 12) {
    const items = [];
    const desc = {
      env: e => [`${Utils.fmtNum(e.tempCalda, '°C')} / ${Utils.fmtNum(e.tempFredda, '°C')} · UR ${Utils.fmtNum(e.umidita, '%')}`, (() => { const bad = Object.keys(Logic.RANGES).some(k => Logic.evalParam(k, e[k]).status === 'bad'); return Records.badge(bad ? 'Fuori soglia' : 'Ottimale', bad ? 'bad' : 'ok'); })()],
      feeding: e => [`${e.preda}${Utils.num(e.pesoPreda) !== null ? ' · ' + Utils.fmtNum(e.pesoPreda, 'g') : ''} · ${e.statoPreda}`, Records.badge(e.esito, Records.STATUS.esito[e.esito] || 'neutral')],
      growth: e => [[e.peso !== null ? Utils.fmtNum(e.peso, 'g') : '', e.lunghezza !== null ? Utils.fmtNum(e.lunghezza, 'cm') : ''].filter(Boolean).join(' · '), ''],
      shed: e => [e.dataFine ? `Completata il ${Utils.fmtDate(e.dataFine)}` : 'Fase opaca iniziata', Records.badge(e.esito, Records.STATUS.muta[e.esito] || 'neutral')],
      maintenance: e => [e.tipo, ''],
      handling: e => [`${Utils.fmtNum(e.durata, 'min')}`, Records.badge(e.comportamento, Records.STATUS.comp[e.comportamento] || 'neutral')]
    };
    Schema.LOG_TYPES.forEach(t => S().logs[t].slice(0, t === 'env' ? 3 : limit).forEach(e => items.push({ t, e, date: e[Schema.LOGS[t].dateKey] })));
    items.sort((a, b) => b.date.localeCompare(a.date));
    if (!items.length) return `<div class="empty"><div class="empty-ico">🗒️</div><b>Nessuna attività</b><p>Le registrazioni compariranno qui in ordine cronologico.</p><button class="btn btn-primary btn-sm" data-open-add>＋ Registra</button></div>`;
    return `<div class="timeline">${items.slice(0, limit).map(({ t, e, date }) => {
      const def = Schema.LOGS[t]; const [d, b] = desc[t](e);
      return `<div class="tl-item">
        <span class="tl-ico" style="box-shadow:inset 0 0 0 1px ${def.color}33">${def.icon}</span>
        <div class="tl-body"><div class="tl-title">${def.label} ${b}</div><div class="tl-desc">${Utils.esc(d)}${e.note ? ` · <span class="faint">${Utils.esc(e.note)}</span>` : ''}</div></div>
        <div class="tl-time"><b>${Utils.cap(Utils.relTime(date))}</b><time datetime="${Utils.esc(date)}">${Utils.fmtDateTime(date)}</time></div>
      </div>`;
    }).join('')}</div>`;
  }

  function kpi({ label, status, value, sub, bar = null, key }) {
    return `<div class="card kpi s-${status} card-hover">
      <div class="kpi-top"><span class="kpi-label">${label}</span><span class="dot ${status}"></span></div>
      <div class="kpi-value" data-kpi="${key}">${value}</div>
      <div class="kpi-sub">${sub}</div>
      ${bar !== null ? `<div class="kpi-bar"><i style="width:${Utils.clamp(bar.pct, 0, 100)}%;background:var(--${bar.color})"></i></div>` : ''}
    </div>`;
  }

  /* ---------- Dashboard ---------- */
  function dashboard() {
    const st = S(), p = st.profile;
    const feed = Logic.feedingState(), shed = Logic.shedState(), water = Logic.waterState();
    const al = Logic.alerts(); lastAlerts = al;
    const nBad = al.filter(a => a.level === 'bad').length, nWarn = al.filter(a => a.level === 'warn').length;
    const weight = Logic.currentWeight(), trend = Logic.weightTrend();
    const age = Utils.age(p.dataNascita);
    const sex = p.sesso === 'Maschio' ? '♂' : p.sesso === 'Femmina' ? '♀' : '';
    const statusPill = nBad + nWarn === 0
      ? `<span class="dot ok live"></span>Tutto nella norma`
      : `<span class="dot ${nBad ? 'bad' : 'warn'} live"></span>${nBad + nWarn} ${nBad + nWarn === 1 ? 'avviso attivo' : 'avvisi attivi'}`;

    const welcome = Store.isEmpty() ? `<div class="card welcome mt">
        <div><h2>👋 Benvenuto in SNAKEcheck</h2><p class="muted small" style="margin-top:4px">Configura il profilo del tuo serpente o esplora l'app con un set di dati dimostrativo.</p></div>
        <div class="row" style="flex-wrap:wrap"><button class="btn" data-nav="impostazioni">Configura profilo</button><button class="btn btn-primary" data-demo>Carica dati demo</button></div>
      </div>` : '';

    // KPI pasto
    let kFeed;
    if (feed.lastEaten) {
      const sub = feed.remaining > 0 ? `Prossimo tra <b>${Utils.plural(feed.remaining, 'giorno', 'giorni')}</b>` : feed.remaining === 0 ? '<b class="c-warn">Previsto oggi</b>' : `<b class="c-${shed.inShed ? 'info' : feed.status}">In ritardo di ${Utils.plural(-feed.remaining, 'giorno', 'giorni')}</b>${shed.inShed ? ' · in muta' : ''}`;
      kFeed = kpi({ key: 'feed', label: '🐭 Ultimo pasto', status: shed.inShed && feed.remaining < 0 ? 'info' : feed.status, value: `${count(feed.days, 'k-feed')}<small>${feed.days === 1 ? 'giorno fa' : 'giorni fa'}</small>`, sub: `${Utils.esc(feed.lastEaten.preda)} · ${Utils.fmtDateShort(feed.lastEaten.data)} · ${sub}`, bar: { pct: feed.days / feed.target * 100, color: feed.status === 'ok' ? 'ok' : feed.status === 'warn' ? 'warn' : 'bad' } });
    } else kFeed = kpi({ key: 'feed', label: '🐭 Ultimo pasto', status: 'neutral', value: '—', sub: feed.lastAny ? 'Nessun pasto consumato' : 'Nessun pasto registrato' });
    // KPI muta
    let kShed;
    if (shed.last) {
      kShed = shed.inShed
        ? kpi({ key: 'shed', label: '🦎 Muta', status: shed.days > 14 ? 'warn' : 'info', value: `${count(shed.days, 'k-shed')}<small>giorni in muta</small>`, sub: `Fase opaca dal ${Utils.fmtDateShort(shed.last.dataInizio)} · <button class="btn btn-sm" style="height:24px;margin-top:4px" data-edit="shed" data-id="${Utils.esc(shed.last.id)}" data-preset-complete>Segna completata</button>` })
        : kpi({ key: 'shed', label: '🦎 Ultima muta', status: shed.last.esito === 'Completa' ? 'ok' : 'warn', value: `${count(shed.days, 'k-shed')}<small>${shed.days === 1 ? 'giorno fa' : 'giorni fa'}</small>`, sub: `${Utils.esc(shed.last.esito)} · ${Utils.fmtDateShort(shed.last.dataFine)}` });
    } else kShed = kpi({ key: 'shed', label: '🦎 Muta', status: 'neutral', value: '—', sub: 'Nessuna muta registrata' });
    // KPI acqua
    const kWater = water.last
      ? kpi({ key: 'water', label: '💧 Cambio acqua', status: water.status, value: `${count(water.days, 'k-water')}<small>${water.days === 1 ? 'giorno fa' : 'giorni fa'}</small>`, sub: water.remaining > 0 ? `Prossimo tra <b>${Utils.plural(water.remaining, 'giorno', 'giorni')}</b>` : water.remaining === 0 ? '<b class="c-warn">Da fare oggi</b>' : `<b class="c-bad">In ritardo di ${Utils.plural(-water.remaining, 'giorno', 'giorni')}</b>`, bar: { pct: water.days / water.target * 100, color: water.status === 'ok' ? 'ok' : water.status === 'warn' ? 'warn' : 'bad' } })
      : kpi({ key: 'water', label: '💧 Cambio acqua', status: 'neutral', value: '—', sub: 'Nessun cambio registrato' });
    // KPI peso
    const kWeight = weight !== null
      ? kpi({ key: 'weight', label: '⚖️ Peso', status: trend && trend.diff < 0 ? 'warn' : 'ok', value: `${count(weight, 'k-weight', 1)}<small>g</small>`, sub: trend ? `<b class="c-${trend.diff >= 0 ? 'ok' : 'warn'}">${trend.diff >= 0 ? '+' : ''}${Utils.fmtNum(trend.diff, 'g')}</b> in ${trend.days} giorni · ≈ ${Utils.fmtNum(trend.perMonth, 'g')}/mese` : 'Aggiungi altre misurazioni per il trend' })
      : kpi({ key: 'weight', label: '⚖️ Peso', status: 'neutral', value: '—', sub: 'Nessuna misurazione' });

    const quick = [['feeding', '🐭', 'Pasto'], ['env', '🌡️', 'Clima'], ['water', '💧', 'Acqua'], ['growth', '⚖️', 'Peso'], ['shed', '🦎', 'Muta'], ['handling', '🤲', 'Handling']];

    Terrarium.closePop();
    $('#view-dashboard').innerHTML = `
      <div class="hero">
        <button class="hero-avatar" data-snake aria-label="Apri la scheda del serpente" style="cursor:pointer;background:radial-gradient(circle at 30% 25%, ${Morph.resolve(p.morph).base}, ${Morph.resolve(p.morph).saddle} 70%, var(--elev))">🐍</button>
        <div class="hero-main">
          <div class="hero-name"><h2>${p.nome ? Utils.esc(p.nome) : 'Il tuo serpente'} <span class="faint" style="font-weight:500">${sex}</span></h2>
            ${p.morph ? `<span class="badge b-info">${Utils.esc(p.morph)}</span>` : `<button class="badge b-neutral" style="cursor:pointer" data-nav="impostazioni">+ Aggiungi morph</button>`}</div>
          <div class="hero-meta">
            <span>🎂 <b>${age ? Utils.esc(age) : '—'}</b></span>
            <span>⚖️ <b>${weight !== null ? Utils.fmtNum(weight, 'g') : '—'}</b></span>
            <span>📏 <b>${Logic.currentLength() !== null ? Utils.fmtNum(Logic.currentLength(), 'cm') : '—'}</b></span>
            <span>🏠 <b>${Utils.esc(p.terrarioDimensioni || '—')}</b></span>
          </div>
        </div>
        <div class="hero-status"><button class="status-pill" data-scroll="alertsCard">${statusPill}</button></div>
      </div>
      ${welcome}
      <div class="grid g-main mt">
        <div class="card terra-card"><div class="card-head" style="margin-bottom:10px"><h2>Terrario</h2><span class="sub">${Utils.esc(Morph.resolve(p.morph).label)}</span></div>${Terrarium.html()}</div>
        <div class="card"><div class="card-head"><h2>Clima del terrario</h2><button class="btn btn-sm" data-add="env">＋ Lettura</button></div>${gauges()}</div>
      </div>
      <div class="quick mt">${quick.map(([t, i, l]) => `<button class="quick-btn" ${t === 'water' ? 'data-water' : `data-add="${t}"`}><span class="q-ico">${i}</span><span>${l}</span></button>`).join('')}</div>
      <div class="grid g-4 mt">${kFeed}${kShed}${kWater}${kWeight}</div>
      <div class="grid g-2 mt">
        <div class="card" id="alertsCard"><div class="card-head"><h2>Alert intelligenti</h2>${nBad ? `<span class="badge b-bad">${nBad} critici</span>` : nWarn ? `<span class="badge b-warn">${nWarn} avvisi</span>` : '<span class="badge b-ok">Nessun problema</span>'}</div>${alertsHTML(al)}</div>
        <div class="card"><div class="card-head"><h2>Attività recenti</h2><span class="sub">Da tutti i registri</span></div>${timeline(8)}</div>
      </div>`;
    lastAlerts = alertsWithOk(al);
  }
  const alertsWithOk = list => list.some(a => a.level !== 'info') ? list : [{ level: 'ok' }, ...list];

  /* ---------- Clima ---------- */
  function clima() {
    const env = [...S().logs.env].reverse();
    const data = Charts.filterByRange('env', env, 'datetime');
    const p = S().profile;
    $('#view-clima').innerHTML = `
      <div class="grid g-main">
        <div class="card"><div class="card-head"><h2>Andamento</h2>${Charts.rangeControl('env')}</div><div class="chart-box" id="chart-env"></div></div>
        <div class="card"><div class="card-head"><h2>Ultima lettura</h2><button class="btn btn-sm" data-add="env">＋ Lettura</button></div>${gauges()}</div>
      </div>
      <div class="card mt"><div class="card-head"><h2>Storico letture</h2><span class="sub">Calda ${Utils.fmtNum(p.tempCaldaMin)}–${Utils.fmtNum(p.tempCaldaMax)}°C · Fredda ${Utils.fmtNum(p.tempFreddaMin)}–${Utils.fmtNum(p.tempFreddaMax)}°C · UR ${Utils.fmtNum(p.umiditaMin)}–${Utils.fmtNum(p.umiditaMax)}%</span></div>${Records.block('env')}</div>`;
    Charts.line('env', $('#chart-env'), data.map(e => Utils.fmtAxis(e.datetime)), [
      { label: 'Zona calda', data: data.map(e => e.tempCalda), color: '#f87171', unit: '°C', fillAlpha: .18 },
      { label: 'Zona fredda', data: data.map(e => e.tempFredda), color: '#818cf8', unit: '°C', fillAlpha: .12 },
      { label: 'Umidità', data: data.map(e => e.umidita), color: '#22d3ee', axis: 'y1', unit: '%', fillAlpha: .1 }
    ], { yTitle: '°C', y1Title: '%', emptyMsg: 'Registra delle letture o allarga l\'intervallo.', addType: 'env' });
  }

  /* ---------- Alimentazione & crescita ---------- */
  function alimentazione() {
    const tab = tabs.alimentazione;
    const f = S().logs.feeding;
    const feed = Logic.feedingState();
    const eaten = f.filter(x => x.esito === 'Mangiato');
    const ratios = eaten.map(x => Utils.num(x.rapporto)).filter(x => x !== null);
    const avgR = ratios.length ? Utils.round(ratios.slice(0, 6).reduce((a, b) => a + b, 0) / Math.min(6, ratios.length), 1) : null;
    const trend = Logic.weightTrend();
    let body;
    if (tab === 'feeding') {
      body = `<div class="stats">
          <div class="stat"><span>Ultimo pasto</span><b>${feed.lastEaten ? Utils.cap(Utils.relDays(feed.days)) : '—'}</b><small>${feed.lastEaten ? Utils.esc(feed.lastEaten.preda) : 'nessuno'}</small></div>
          <div class="stat"><span>Prossimo</span><b class="c-${feed.status}">${feed.remaining === null ? '—' : feed.remaining > 0 ? `tra ${Utils.plural(feed.remaining, 'giorno', 'giorni')}` : feed.remaining === 0 ? 'Oggi' : `${-feed.remaining} gg di ritardo`}</b><small>target ogni ${feed.target} giorni</small></div>
          <div class="stat"><span>Pasti consumati</span><b>${f.length ? `${Math.round(eaten.length / f.length * 100)}%` : '—'}</b><small>${eaten.length} su ${f.length}</small></div>
          <div class="stat"><span>Rapporto medio</span><b class="c-${Logic.ratioStatus(avgR)}">${avgR === null ? '—' : Utils.fmtNum(avgR, '%')}</b><small>ultimi pasti · ideale 10–15%</small></div>
        </div>
        <div class="card mt"><div class="card-head"><h2>Storico pasti</h2><button class="btn btn-sm" data-add="feeding">＋ Pasto</button></div>${Records.block('feeding')}</div>`;
    } else {
      body = `<div class="stats">
          <div class="stat"><span>Peso attuale</span><b>${Utils.fmtNum(Logic.currentWeight(), 'g')}</b><small>${S().logs.growth[0] ? Utils.fmtDate(S().logs.growth[0].data) : 'dal profilo'}</small></div>
          <div class="stat"><span>Lunghezza</span><b>${Utils.fmtNum(Logic.currentLength(), 'cm')}</b><small>ultima misura</small></div>
          <div class="stat"><span>Crescita</span><b class="c-${trend && trend.diff < 0 ? 'warn' : 'ok'}">${trend ? `${trend.perMonth >= 0 ? '+' : ''}${Utils.fmtNum(trend.perMonth, 'g')}/mese` : '—'}</b><small>${trend ? `${trend.diff >= 0 ? '+' : ''}${Utils.fmtNum(trend.diff, 'g')} in ${trend.days} giorni` : 'servono 2 misure'}</small></div>
          <div class="stat"><span>Misurazioni</span><b>${S().logs.growth.length}</b><small>registrate</small></div>
        </div>
        <div class="card mt"><div class="card-head"><h2>Curva di crescita</h2>${Charts.rangeControl('growth')}</div><div class="chart-box" id="chart-growth"></div></div>
        <div class="card mt"><div class="card-head"><h2>Storico misurazioni</h2><button class="btn btn-sm" data-add="growth">＋ Misurazione</button></div>${Records.block('growth')}</div>`;
    }
    $('#view-alimentazione').innerHTML = `<div class="segmented tabs-bar" role="tablist">
        <button class="seg-btn${tab === 'feeding' ? ' active' : ''}" data-tab="alimentazione" data-value="feeding">🐭 Pasti</button>
        <button class="seg-btn${tab === 'growth' ? ' active' : ''}" data-tab="alimentazione" data-value="growth">⚖️ Crescita</button>
      </div>${body}`;
    if (tab === 'growth') {
      const g = Charts.filterByRange('growth', [...S().logs.growth].reverse(), 'data');
      Charts.line('growth', $('#chart-growth'), g.map(x => Utils.fmtAxis(x.data)), [
        { label: 'Peso', data: g.map(x => x.peso), color: '#fbbf24', unit: 'g', fillAlpha: .25 },
        { label: 'Lunghezza', data: g.map(x => x.lunghezza), color: '#4ade80', axis: 'y1', unit: 'cm', fillAlpha: .08 }
      ], { yTitle: 'g', y1Title: 'cm', emptyMsg: 'Registra peso e lunghezza per la curva di crescita.', addType: 'growth' });
    } else Charts.destroy('growth');
  }

  /* ---------- Cura ---------- */
  function cura() {
    const tab = tabs.cura, st = S();
    let summary = '';
    if (tab === 'shed') {
      const sh = st.logs.shed, s = Logic.shedState();
      const done = sh.filter(x => x.dataFine).sort((a, b) => a.dataFine.localeCompare(b.dataFine));
      const gaps = []; for (let i = 1; i < done.length; i++) gaps.push(Utils.daysBetween(done[i - 1].dataFine, done[i].dataFine));
      const avgGap = gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : null;
      const durs = done.map(x => Utils.daysBetween(x.dataInizio, x.dataFine)).filter(d => d !== null && d >= 0);
      const avgDur = durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : null;
      const next = avgGap && done.length ? Utils.toISODate(Utils.addDays(Utils.parse(done[done.length - 1].dataFine), avgGap)) : null;
      summary = `<div class="stats">
        <div class="stat"><span>Stato</span><b class="c-${s.inShed ? 'info' : 'ok'}">${s.last ? (s.inShed ? 'In muta' : 'Non in muta') : '—'}</b><small>${s.last ? (s.inShed ? `da ${Utils.plural(s.days, 'giorno', 'giorni')}` : `ultima ${Utils.relDays(s.days)}`) : 'nessuna muta'}</small></div>
        <div class="stat"><span>Intervallo medio</span><b>${avgGap ? `${avgGap} giorni` : '—'}</b><small>${next && !s.inShed ? `prossima ≈ ${Utils.fmtDateShort(next)}` : 'tra una muta e l\'altra'}</small></div>
        <div class="stat"><span>Durata media</span><b>${avgDur !== null ? `${avgDur} giorni` : '—'}</b><small>dalla fase opaca</small></div>
        <div class="stat"><span>Complete</span><b>${sh.length ? `${sh.filter(x => x.esito === 'Completa').length}/${sh.length}` : '—'}</b><small>mute in un pezzo</small></div>
      </div>`;
    } else if (tab === 'maintenance') {
      const m = st.logs.maintenance, w = Logic.waterState();
      summary = `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${Schema.OPTIONS.manutenzione.map(t => {
        const last = m.find(x => x.tipo === t); const d = last ? Utils.daysSince(last.data) : null;
        const s = t === 'Cambio acqua' ? w.status : last ? 'ok' : 'neutral';
        return `<div class="stat"><span>${t}</span><b class="row" style="gap:8px"><span class="dot ${s}"></span>${last ? Utils.cap(Utils.relDays(d)) : 'Mai'}</b><small>${last ? Utils.fmtDate(last.data) : '—'}</small>
          <button class="btn btn-sm" style="margin-top:8px" ${t === 'Cambio acqua' ? 'data-water' : `data-add="maintenance" data-preset-tipo="${Utils.esc(t)}"`}>${t === 'Cambio acqua' ? '✓ Fatto oggi' : '＋ Registra'}</button></div>`;
      }).join('')}</div>`;
    } else {
      const h = st.logs.handling;
      const counts = {}; h.forEach(x => { counts[x.comportamento] = (counts[x.comportamento] || 0) + 1; });
      const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
      const avg = h.length ? Math.round(h.reduce((a, b) => a + (Utils.num(b.durata) || 0), 0) / h.length) : null;
      summary = `<div class="stats">
        <div class="stat"><span>Sessioni</span><b>${h.length}</b><small>${h.filter(x => Utils.daysSince(x.data) <= 30).length} negli ultimi 30 giorni</small></div>
        <div class="stat"><span>Durata media</span><b>${avg !== null ? `${avg} min` : '—'}</b><small>per sessione</small></div>
        <div class="stat"><span>Ultima</span><b>${h[0] ? Utils.cap(Utils.relDays(Utils.daysSince(h[0].data))) : '—'}</b><small>${h[0] ? Utils.esc(h[0].comportamento) : 'nessuna sessione'}</small></div>
        <div class="stat"><span>Prevalente</span><b style="font-size:.95rem">${top ? Utils.esc(top[0]) : '—'}</b><small>${top ? `${Math.round(top[1] / h.length * 100)}% delle sessioni` : ''}</small></div>
      </div>`;
    }
    const def = Schema.LOGS[tab];
    $('#view-cura').innerHTML = `<div class="segmented tabs-bar" role="tablist">
        ${['shed', 'maintenance', 'handling'].map(t => `<button class="seg-btn${tab === t ? ' active' : ''}" data-tab="cura" data-value="${t}">${Schema.LOGS[t].icon} ${t === 'shed' ? 'Mute' : Schema.LOGS[t].label}</button>`).join('')}
      </div>
      ${summary}
      <div class="card mt"><div class="card-head"><h2>Storico ${tab === 'shed' ? 'mute' : def.label.toLowerCase()}</h2><button class="btn btn-sm" data-add="${tab}">＋ ${def.label}</button></div>${Records.block(tab)}</div>`;
  }

  /* ---------- Impostazioni ---------- */
  function impostazioni() {
    const p = S().profile, st = S();
    const total = Schema.LOG_TYPES.reduce((a, t) => a + st.logs[t].length, 0);
    let size = 0; try { size = (localStorage.getItem(Store.KEY) || '').length; } catch (e) { size = 0; }
    const f = (name, label, attrs = '', unit = '') => `<div class="field"><label class="field-label" for="s-${name}">${label}</label><div class="input-wrap"><input class="input${unit ? ' has-unit' : ''}" id="s-${name}" name="${name}" value="${Utils.esc(p[name] ?? '')}" ${attrs}>${unit ? `<span class="unit">${unit}</span>` : ''}</div></div>`;
    $('#view-impostazioni').innerHTML = `
      <div class="grid g-main">
        <form class="card" id="settingsForm" novalidate>
          <fieldset><legend>🐍 Profilo</legend><div class="form-grid">
            ${f('nome', 'Nome', 'maxlength="60" placeholder="Es. Pepe"')}
            <div class="field"><span class="field-label">Sesso</span><div class="chips">${Schema.OPTIONS.sesso.map(o => `<label class="chip"><input type="radio" name="sesso" value="${o}" ${p.sesso === o ? 'checked' : ''}>${o}</label>`).join('')}</div></div>
            <div class="full">${f('morph', 'Morph / fase', 'maxlength="80" list="morphList" autocomplete="off" placeholder="Es. Amel, Snow Motley, Okeetee"')}
              <datalist id="morphList">${Morph.names().map(n => `<option value="${Utils.esc(n)}">`).join('')}</datalist>
              <div class="morph-preview" id="morphPreview">${morphPreviewHTML(p.morph)}</div></div>
            ${f('dataNascita', 'Data di nascita', `type="date" max="${Utils.todayISO()}"`)}
            ${f('dataArrivo', 'Data di arrivo', `type="date" max="${Utils.todayISO()}"`)}
            ${f('pesoAttuale', 'Peso attuale', 'type="number" step="0.1" min="0" inputmode="decimal" placeholder="Aggiornato dalle misure"', 'g')}
            ${f('lunghezzaAttuale', 'Lunghezza attuale', 'type="number" step="0.1" min="0" inputmode="decimal"', 'cm')}
          </div></fieldset>
          <fieldset><legend>🏠 Terrario</legend><div class="form-grid">
            ${f('terrarioDimensioni', 'Dimensioni', 'maxlength="40" placeholder="60x40x40 cm"')}
            ${f('substrato', 'Substrato attuale', 'maxlength="80" placeholder="Es. truciolato di pioppo"')}
            <div class="full">${f('sorgenteCalore', 'Sorgente di calore', 'maxlength="100" placeholder="Es. tappetino con termostato"')}</div>
            ${f('intervalloPasti', 'Intervallo pasti target', 'type="number" min="1" max="60" step="1"', 'giorni')}
            ${f('intervalloAcqua', 'Intervallo cambio acqua', 'type="number" min="1" max="30" step="1"', 'giorni')}
          </div></fieldset>
          <fieldset style="margin-bottom:14px"><legend>🎯 Soglie ottimali</legend><div class="form-grid">
            ${f('tempCaldaMin', 'Zona calda min', 'type="number" step="0.1"', '°C')}${f('tempCaldaMax', 'Zona calda max', 'type="number" step="0.1"', '°C')}
            ${f('tempFreddaMin', 'Zona fredda min', 'type="number" step="0.1"', '°C')}${f('tempFreddaMax', 'Zona fredda max', 'type="number" step="0.1"', '°C')}
            ${f('umiditaMin', 'Umidità min', 'type="number" step="1" min="0" max="100"', '%')}${f('umiditaMax', 'Umidità max', 'type="number" step="1" min="0" max="100"', '%')}
          </div><p class="faint small" style="margin-top:10px">Valori consigliati: zona calda 28–32 °C, zona fredda 22–26 °C, umidità 40–60%.</p></fieldset>
          <div class="form-actions"><button type="button" class="btn btn-ghost" data-settings-reset>Annulla modifiche</button><button type="submit" class="btn btn-primary">Salva impostazioni</button></div>
        </form>
        <div class="stack">
          <div class="card"><div class="card-head"><h2>🗄️ Backup e dati</h2></div>
            <div class="settings-list">
              <div class="setting-row"><div><b>Esporta backup</b><p>Scarica un file JSON con la data</p></div><button class="btn btn-sm" data-export>Esporta</button></div>
              <div class="setting-row"><div><b>Importa backup</b><p>Sostituisce i dati con un file JSON</p></div><button class="btn btn-sm" data-import>Importa</button></div>
              <div class="setting-row"><div><b>Dati demo</b><p>Un giovane Amel di circa 8 mesi</p></div><button class="btn btn-sm" data-demo>Carica</button></div>
              <div class="setting-row"><div><b>Svuota tutti i dati</b><p>Con doppia conferma</p></div><button class="btn btn-sm btn-danger" data-clear>Svuota</button></div>
              <div class="setting-row hidden" id="installRow"><div><b>Installa l'app</b><p>Icona sulla schermata Home, uso offline</p></div><button class="btn btn-sm btn-primary" id="btnInstall">Installa</button></div>
            </div>
            <p class="faint small" style="margin-top:12px">${Utils.plural(total, 'voce', 'voci')} · ${(size / 1024).toFixed(1).replace('.', ',')} KB in questo browser${st.updatedAt ? ` · salvato ${new Date(st.updatedAt).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' })}` : ''}</p>
          </div>
          <div class="card"><div class="card-head"><h2>📌 Promemoria cura</h2></div>
            <ul class="muted small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
              <li>Preda non più larga della parte più ampia del corpo (circa 10–15% del peso).</li>
              <li>In fase opaca il rifiuto del cibo è normale.</li>
              <li>Niente handling per 48 ore dopo il pasto.</li>
              <li>Sorgente di calore sempre collegata a un termostato.</li>
            </ul></div>
        </div>
      </div>`;
    if (PWA.canInstall()) $('#installRow').classList.remove('hidden');
  }

  function morphPreviewHTML(value) {
    const look = Morph.resolve(value);
    return `${Snake.preview(look, 'set')}<div class="row" style="flex-wrap:wrap;margin-top:4px"><span class="badge b-info">${Utils.esc(look.label)}</span>${look.custom ? '<span class="badge b-neutral">Personalizzato</span>' : ''}</div><p>${Utils.esc(look.desc)}</p>`;
  }

  function saveSettings(form) {
    const patch = {};
    for (const k of Object.keys(Schema.DEFAULT_PROFILE)) {
      if (k === 'sesso') { const c = form.querySelector('input[name="sesso"]:checked'); patch.sesso = c ? c.value : 'Non determinato'; continue; }
      const el = form.elements[k]; if (!el) continue;
      patch[k] = Schema.NUMERIC_PROFILE.includes(k) ? Utils.num(el.value) : el.value.trim();
    }
    for (const [a, b, l] of [['tempCaldaMin', 'tempCaldaMax', 'zona calda'], ['tempFreddaMin', 'tempFreddaMax', 'zona fredda'], ['umiditaMin', 'umiditaMax', 'umidità']]) {
      if (patch[a] === null || patch[b] === null) { Toast.show(`Inserisci entrambi i limiti per ${l}`, 'warn'); return; }
      if (patch[a] >= patch[b]) { Toast.show(`Il minimo di ${l} deve essere inferiore al massimo`, 'warn'); return; }
    }
    if (patch.umiditaMin < 0 || patch.umiditaMax > 100) { Toast.show('L\'umidità deve essere tra 0 e 100%', 'warn'); return; }
    for (const k of ['intervalloPasti', 'intervalloAcqua']) {
      if (patch[k] === null || patch[k] < 1) { Toast.show('Gli intervalli target devono essere di almeno 1 giorno', 'warn'); return; }
      patch[k] = Math.round(patch[k]);
    }
    if (patch.dataNascita && !Utils.isValidDate(patch.dataNascita)) patch.dataNascita = '';
    if (patch.dataArrivo && !Utils.isValidDate(patch.dataArrivo)) patch.dataArrivo = '';
    if (patch.dataNascita && patch.dataArrivo && patch.dataArrivo < patch.dataNascita) { Toast.show('La data di arrivo non può precedere la nascita', 'warn'); return; }
    if (patch.pesoAttuale !== null && patch.pesoAttuale < 0) patch.pesoAttuale = null;
    if (patch.lunghezzaAttuale !== null && patch.lunghezzaAttuale < 0) patch.lunghezzaAttuale = null;
    Store.updateProfile(patch);
    Toast.show('Impostazioni salvate', 'ok');
  }

  return { dashboard, clima, alimentazione, cura, impostazioni, saveSettings, morphPreviewHTML, tabs, getAlert: i => lastAlerts[i] };
})();

/* ==========================================================================
   Router — navigazione senza ricaricare la pagina (hash)
   ========================================================================== */
const Router = (() => {
  const VIEWS = [
    { id: 'dashboard', label: 'Dashboard', short: 'Home', icon: '🏠', sub: () => new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }) },
    { id: 'clima', label: 'Terrario & Clima', short: 'Clima', icon: '🌡️', sub: () => 'Temperature, umidità e soglie', add: 'env' },
    { id: 'alimentazione', label: 'Alimentazione & Crescita', short: 'Pasti', icon: '🐭', sub: () => 'Pasti, rapporto preda e curva di crescita', add: () => Views.tabs.alimentazione },
    { id: 'cura', label: 'Mute & Cura', short: 'Cura', icon: '🦎', sub: () => 'Mute, manutenzione e handling', add: () => Views.tabs.cura },
    { id: 'impostazioni', label: 'Impostazioni', short: 'Altro', icon: '⚙️', sub: () => 'Profilo, terrario, soglie e backup' }
  ];
  let current = 'dashboard';

  function buildNav() {
    document.getElementById('sideNav').innerHTML = VIEWS.map((v, i) => `<button class="nav-item" data-nav="${v.id}"><span class="ico">${v.icon}</span>${v.label}${v.id === 'dashboard' ? '<span class="count hidden" id="navAlertCount"></span>' : `<span class="kbd">${i + 1}</span>`}</button>`).join('');
    const items = VIEWS.map(v => `<button class="bn-item" data-nav="${v.id}" aria-label="${v.label}"><span class="ico">${v.icon}</span>${v.short}</button>`);
    items.splice(2, 0, `<button class="bn-item bn-add" data-open-add aria-label="Registra"><span class="ico">＋</span></button>`);
    document.getElementById('bottomNav').innerHTML = items.join('');
  }

  function go(id, { replace = false } = {}) {
    if (!VIEWS.some(v => v.id === id)) id = 'dashboard';
    const changed = id !== current;
    current = id;
    document.querySelectorAll('.view').forEach(v => {
      const on = v.id === `view-${id}`;
      if (on && changed) { v.classList.remove('active'); void v.offsetWidth; }
      v.classList.toggle('active', on);
    });
    document.querySelectorAll('[data-nav]').forEach(b => { const on = b.dataset.nav === id; b.classList.toggle('active', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
    if (location.hash !== `#${id}`) history[replace ? 'replaceState' : 'pushState'](null, '', `#${id}`);
    render();
    if (changed) window.scrollTo({ top: 0 });
  }

  function render() {
    const v = VIEWS.find(x => x.id === current);
    document.getElementById('viewTitle').textContent = v.label;
    document.getElementById('viewSubtitle').textContent = Utils.cap(v.sub());
    const top = document.getElementById('topAction');
    const addType = typeof v.add === 'function' ? v.add() : v.add;
    if (addType) { top.removeAttribute('data-open-add'); top.dataset.add = addType; top.innerHTML = `＋ <span class="desktop-only">${Schema.LOGS[addType].label}</span>`; }
    else { delete top.dataset.add; top.setAttribute('data-open-add', ''); top.innerHTML = '＋ <span class="desktop-only">Registra</span>'; }
    try {
      Views[current]();
      Anim.countUp(document.getElementById(`view-${current}`));
    } catch (err) {
      console.error('Errore di visualizzazione', err);
      document.getElementById(`view-${current}`).innerHTML = `<div class="empty"><div class="empty-ico">⚠️</div><b>Qualcosa è andato storto</b><p>Questa schermata non può essere mostrata. I tuoi dati sono al sicuro: prova a ricaricare la pagina.</p><button class="btn btn-sm" onclick="location.reload()">Ricarica</button></div>`;
    }
    // Contatore alert nella sidebar e info profilo
    const al = Logic.alerts().filter(a => a.level !== 'info');
    const c = document.getElementById('navAlertCount');
    if (c) { c.textContent = al.length; c.classList.toggle('hidden', !al.length); c.className = `count${al.length ? '' : ' hidden'} ${al.some(a => a.level === 'bad') ? 'b-bad' : 'b-warn'}`; }
    const p = Store.get().profile;
    document.getElementById('sideSnake').textContent = p.nome ? `🐍 ${p.nome}${Utils.age(p.dataNascita) ? ' · ' + Utils.age(p.dataNascita) : ''}` : 'Nessun profilo configurato';
  }

  return { buildNav, go, render, VIEWS, get current() { return current; } };
})();

/* ==========================================================================
   Demo — dati realistici di un giovane serpente del grano
   ========================================================================== */
const Demo = (() => {
  const rng = seed => () => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };
  function build() {
    const r = rng(42);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const D = n => Utils.toISODate(Utils.addDays(today, -n));
    const r1 = v => Math.round(v * 10) / 10;
    const id = Utils.uid;
    const pts = [[180, 9.5, 31], [150, 14, 35], [120, 20.5, 39], [90, 27, 43], [60, 35.5, 47], [30, 46, 51], [3, 57.5, 55]];
    const growth = pts.map(([d, w, l], i) => ({ id: id(), data: D(d), peso: w, lunghezza: l, note: i === 0 ? 'Peso all\'arrivo' : i === pts.length - 1 ? 'Ottimo stato di forma' : '' }));
    const weightOn = d => {
      for (let i = pts.length - 1; i >= 0; i--) if (pts[i][0] >= d) { const a = pts[i], b = pts[i + 1]; if (!b) return a[1]; return a[1] + (b[1] - a[1]) * (a[0] - d) / (a[0] - b[0]); }
      return pts[pts.length - 1][1];
    };
    const shedDefs = [[140, 131, 'Completa', 'Muta in un unico pezzo'], [88, 80, 'Incompleta / a pezzi', 'Residui sulla coda, risolto con camera umida'], [33, 24, 'Completa', 'Perfetta, occhi tornati limpidi']];
    const shed = shedDefs.map(([a, b, e, n]) => ({ id: id(), dataInizio: D(a), dataFine: D(b), esito: e, note: n }));
    const inShed = d => shedDefs.some(([a, b]) => d <= a && d >= b);
    const feeding = [];
    for (let d = 173; d >= 5; d -= 7) {
      const w = weightOn(d);
      const preda = w < 15 ? 'Pinky' : w < 35 ? 'Fuzzy' : 'Hopper';
      const peso = r1((preda === 'Pinky' ? 1.2 : preda === 'Fuzzy' ? 2.4 : 5.2) + r() * (preda === 'Hopper' ? 1 : .5));
      let esito = 'Mangiato', note = '';
      if (inShed(d)) { esito = 'Rifiutato'; note = 'In fase opaca, rifiuto normale'; }
      else if (r() < .08) { esito = 'Rifiutato'; note = 'Poco interessato, riprovo tra qualche giorno'; }
      else if (r() < .3) note = 'Ha colpito subito';
      feeding.push({ id: id(), data: D(d), preda, pesoPreda: peso, statoPreda: 'Decongelato', esito, note, rapporto: Logic.ratio(peso, w) });
    }
    const env = [];
    for (let d = 40; d >= 0; d--) {
      for (const [h, m] of [[9, 0], [20, 30]]) {
        if (d === 0 && h === 20) continue;
        const dt = Utils.addDays(today, -d); dt.setHours(h, m);
        let um = Math.round(46 + r() * 10 + (d >= 24 && d <= 33 ? 6 : 0)), note = '';
        if (d === 6 && h === 20) { um = 67; note = 'Dopo nebulizzazione abbondante'; }
        env.push({ id: id(), datetime: Utils.toLocalDT(dt), tempCalda: r1(29 + r() * 2.4 + (h === 20 ? .4 : 0)), tempFredda: r1(23 + r() * 2), umidita: um, note });
      }
    }
    const maintenance = [];
    for (let d = 44; d >= 2; d -= 3) maintenance.push({ id: id(), data: D(d), tipo: 'Cambio acqua', note: '' });
    for (let d = 40; d >= 1; d -= 6) maintenance.push({ id: id(), data: D(d), tipo: 'Spot cleaning', note: 'Rimosse feci' });
    maintenance.push({ id: id(), data: D(62), tipo: 'Pulizia profonda', note: 'Terrario disinfettato con clorexidina' });
    maintenance.push({ id: id(), data: D(62), tipo: 'Cambio substrato', note: 'Nuovo aspen' });
    maintenance.push({ id: id(), data: D(15), tipo: 'Controllo riscaldamento/luci', note: 'Termostato verificato con sonda' });
    const handling = [];
    const beh = Schema.OPTIONS.comportamento;
    for (let d = 60; d >= 3; d -= 4) {
      if (feeding.some(f => { const fd = Utils.daysSince(f.data) - d; return fd >= 0 && fd < 2; })) continue;
      const old = d > 40;
      handling.push({ id: id(), data: D(d), durata: Math.round(old ? 3 + r() * 4 : 8 + r() * 8), comportamento: old ? beh[r() < .5 ? 1 : 2] : beh[r() < .8 ? 0 : 1], note: old ? 'Ancora in ambientamento' : '' });
    }
    return {
      version: 2,
      profile: { nome: 'Pepe', sesso: 'Maschio', morph: 'Amel (Amelanistic)', dataNascita: D(235), dataArrivo: D(181), pesoAttuale: 57.5, lunghezzaAttuale: 55, terrarioDimensioni: '60x40x40 cm', substrato: 'Truciolato di pioppo (aspen)', sorgenteCalore: 'Tappetino riscaldante con termostato', intervalloPasti: 7, intervalloAcqua: 3, tempCaldaMin: 28, tempCaldaMax: 32, tempFreddaMin: 22, tempFreddaMax: 26, umiditaMin: 40, umiditaMax: 60 },
      logs: { env, feeding, growth, shed, maintenance, handling }
    };
  }
  return { build };
})();

/* ==========================================================================
   PWA — service worker e installazione
   ========================================================================== */
const PWA = (() => {
  let deferred = null;
  function init() {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker non registrato', err)));
    }
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; const row = document.getElementById('installRow'); if (row) row.classList.remove('hidden'); });
    window.addEventListener('appinstalled', () => { deferred = null; Toast.show('SNAKEcheck installata sulla schermata Home', 'ok'); });
  }
  async function install() {
    if (!deferred) { Toast.show('Usa il menu del browser → "Installa app"', 'info'); return; }
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    const row = document.getElementById('installRow'); if (row) row.classList.add('hidden');
  }
  return { init, install, canInstall: () => !!deferred };
})();

/* ==========================================================================
   App — eventi globali e avvio
   ========================================================================== */
const App = (() => {
  function bind() {
    document.addEventListener('click', e => {
      const t = e.target;
      const nav = t.closest('[data-nav]'); if (nav) { Overlay.close(true); Router.go(nav.dataset.nav); return; }
      const hs = t.closest('[data-hotspot]'); if (hs) { Terrarium.openPop(hs.dataset.hotspot); return; }
      if (t.closest('[data-snake]')) { Terrarium.closePop(); Inspector.open(); return; }
      if (t.closest('[data-pop-close]')) { Terrarium.closePop(); return; }
      if (Terrarium.isOpen() && !t.closest('#terraPop')) Terrarium.closePop();
      if (t.closest('[data-open-add]')) { Actions.openAddSheet(); return; }
      const add = t.closest('[data-add]');
      if (add) {
        const presets = add.dataset.presetTipo ? { tipo: add.dataset.presetTipo } : {};
        Overlay.close(true);
        Forms.open(add.dataset.add, { presets });
        return;
      }
      const edit = t.closest('[data-edit]');
      if (edit) { Forms.open(edit.dataset.edit, { id: edit.dataset.id, presets: edit.hasAttribute('data-preset-complete') ? { esito: 'Completa', dataFine: Utils.todayISO() } : {} }); return; }
      const del = t.closest('[data-del]'); if (del) { Actions.remove(del.dataset.del, del.dataset.id); return; }
      if (t.closest('[data-water]')) { Actions.quickWater(); return; }
      const al = t.closest('[data-alert]'); if (al) { Actions.runAlertAction((Views.getAlert(+al.dataset.alert) || {}).action); return; }
      const tab = t.closest('[data-tab]'); if (tab) { Views.tabs[tab.dataset.tab] = tab.dataset.value; Router.render(); return; }
      const rg = t.closest('[data-chart-range]'); if (rg) { Charts.ranges[rg.dataset.chartRange] = +rg.dataset.value; Router.render(); return; }
      const sc = t.closest('[data-scroll]'); if (sc) { const el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({ behavior: Utils.reducedMotion() ? 'auto' : 'smooth', block: 'start' }); return; }
      if (t.closest('[data-export]')) { Actions.exportBackup(); return; }
      if (t.closest('[data-import]')) { document.getElementById('importFile').click(); return; }
      if (t.closest('[data-demo]')) { Actions.loadDemo(); return; }
      if (t.closest('[data-clear]')) { Actions.clearAll(); return; }
      if (t.closest('#btnInstall')) { PWA.install(); return; }
      if (t.closest('[data-settings-reset]')) { Router.render(); Toast.show('Modifiche annullate', 'info'); }
    });
    document.addEventListener('input', e => { if (e.target.id === 's-morph') document.getElementById('morphPreview').innerHTML = Views.morphPreviewHTML(e.target.value); });
    // Tastiera sugli elementi SVG interattivi del terrario
    document.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-hotspot], [data-snake]')) { e.preventDefault(); e.target.closest('[data-hotspot], [data-snake]').dispatchEvent(new MouseEvent('click', { bubbles: true })); }
      if (e.key === 'Escape' && Terrarium.isOpen()) Terrarium.closePop();
    });
    document.addEventListener('submit', e => { if (e.target.id === 'settingsForm') { e.preventDefault(); Views.saveSettings(e.target); } });
    document.getElementById('importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; Actions.importBackup(f); });

    // Scorciatoie da tastiera (desktop)
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey || Overlay.isOpen()) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); Actions.openAddSheet(); }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= Router.VIEWS.length) Router.go(Router.VIEWS[n - 1].id);
    });

    window.addEventListener('popstate', () => Router.go(location.hash.slice(1), { replace: true }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Router.render(); });
    Store.subscribe(() => Router.render());
  }

  function init() {
    Store.load();
    Router.buildNav();
    bind();
    PWA.init();
    Router.go(location.hash.slice(1) || 'dashboard', { replace: true });
  }
  return { init };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
