        ${tile('mouse', 'Taglia della preda', y.ok ? `${Utils.esc(y.cur)} → ${Utils.esc(y.next)}` : '—', y.ok ? (y.already ? 'già adesso, secondo il peso attuale' : `dal ${Utils.fmtDate(y.date)} circa`) : Utils.esc(y.text), y.ok)}
        ${tile('box', 'Scorte del congelatore', k.ok ? (k.out ? `${Utils.esc(k.preda)} finiti` : `Fino al ${Utils.fmtDateShort(k.date)}`) : '—', k.ok ? (k.out ? 'compra le prede prima del prossimo pasto' : `${Utils.plural(k.left, 'preda rimasta', 'prede rimaste')} (${Utils.esc(k.preda)})`) : Utils.esc(k.text), k.ok)}
      </div></div>`;
  }

  /* ---------- Agenda ---------- */
  let agendaItems = new Map();
  function agenda() {
    const days = Logic.agenda(14), t = Utils.todayISO();
    agendaItems = new Map();
    const head = d => { const n = Utils.daysBetween(t, d); return `${n === 0 ? 'Oggi' : n === 1 ? 'Domani' : Utils.cap(Utils.weekday(d))} <span>${Utils.fmtDateShort(d)}</span>`; };
    const item = (x, d) => {
      agendaItems.set(x.id, x);
      const canDo = x.action && !x.done && d === t;
      return `<div class="ag-item${x.done ? ' done' : ''}${x.faint ? ' faint' : ''}${x.forecast ? ' fc' : ''} l-${x.level || 'none'}${Store.isRecent(x.id) ? ' is-new' : ''}" data-key="ag-${Utils.esc(x.id)}" data-ag="${Utils.esc(x.id)}"${x.movable ? ' draggable="true" data-movable' : ''}${canDo ? ' data-swipe' : ''}>
        <span class="ag-ico">${I(x.done ? 'check' : x.icon)}</span>
        <div class="ag-txt"><b>${Utils.esc(x.title)}</b>${x.late || x.sub ? `<small>${x.late ? `<span class="c-warn">in ritardo di ${Utils.plural(x.late, 'giorno', 'giorni')}</span>${x.sub ? ' · ' : ''}` : ''}${Utils.esc(x.sub || '')}</small>` : ''}</div>
        <div class="ag-act">${x.movable ? `<button class="btn btn-sm btn-ghost" data-ag-move aria-label="Sposta il pasto">${I('calendar')}<span class="hide-xs">Sposta</span></button>` : ''}${canDo ? `<button class="btn btn-sm" data-ag-do="${Utils.esc(x.id)}">${I('check')} Fatto</button>` : ''}</div>
      </div>`;
    };
    const total = days.reduce((a, d) => a + d.items.filter(x => !x.done).length, 0);
    view('#view-agenda').html = `
      ${forecastCard()}
      <div class="row-between mt ag-top"><h2>Prossimi 14 giorni <span class="faint" style="font-weight:500">· ${Utils.plural(total, 'cosa da fare', 'cose da fare')}</span></h2>
        <button class="btn btn-sm" data-round>${I('route')} Giro di controllo</button></div>
      <p class="faint small ag-hint"><span class="desktop-only">Trascina il pasto su un altro giorno per spostarlo.</span><span class="mobile-only">Scorri a destra una voce di oggi per segnarla fatta.</span></p>
      <div class="ag-days">${days.map((d, i) => `<section class="ag-day${i === 0 ? ' today' : ''}${i > 0 && d.items.length === 0 ? ' empty-day' : ''}" data-key="day-${d.date}" data-day="${d.date}">
          <h3 class="ag-head">${head(d.date)}</h3>
          <div class="ag-list">${d.items.length ? d.items.map(x => item(x, d.date)).join('') : '<p class="faint small ag-empty">Niente in programma</p>'}</div>
        </section>`).join('')}</div>`;
  }

  /* ---------- Macchina del tempo del terrario ---------- */
  let ttOffset = 0;
  /** Stato dei registri com'era alla fine del giorno indicato */
  function stateAt(day) {
    const st = S(), end = `${day}T23:59`;
    const logs = {};
    for (const t of Schema.LOG_TYPES) {
      const k = Schema.LOGS[t].dateKey;
      logs[t] = st.logs[t].filter(e => (e[k] || '') <= (k === 'datetime' ? end : day));
    }
    logs.shed = logs.shed.map(s => s.dataFine && s.dataFine > day ? { ...s, dataFine: '', esito: 'In corso' } : s);
    return { ...st, logs };
  }
  const ttRange = () => {
    const firsts = Schema.LOG_TYPES.map(t => { const a = S().logs[t]; return a.length ? (a[a.length - 1][Schema.LOGS[t].dateKey] || '').slice(0, 10) : null; }).filter(Boolean).sort();
    return firsts.length ? Utils.clamp(Utils.daysSince(firsts[0]), 0, 365) : 0;
  };
  const ttDay = () => Utils.toISODate(Utils.addDays(Utils.parse(Utils.todayISO()), -ttOffset));
  function terraHTML() {
    if (!ttOffset) return Terrarium.html();
    const day = ttDay();
    return Store.peek(stateAt(day), () => Utils.at(`${day}T13:00`, () => Terrarium.html()));
  }
  function ttLabel() {
    if (!ttOffset) return '<b>Oggi</b><span>Scorri per vedere com\'era il terrario nei giorni passati</span>';
    const day = ttDay();
    const ev = [];
    for (const t of Schema.LOG_TYPES) {
      const def = Schema.LOGS[t];
      S().logs[t].filter(e => (e[def.dateKey] || '').slice(0, 10) === day).forEach(e => ev.push(t === 'feeding' ? `Pasto ${e.esito === 'Mangiato' ? '' : '(' + e.esito.toLowerCase() + ') '}${e.preda}` : t === 'maintenance' ? e.tipo : t === 'shed' ? (e.dataInizio === day ? 'Inizio muta' : 'Muta') : def.label));
    }
    S().logs.shed.filter(s => s.dataFine === day).forEach(() => ev.push('Muta completata'));
    return `<b>${Utils.cap(Utils.weekday(day))} ${Utils.fmtDate(day)}</b><span>${ev.length ? Utils.esc([...new Set(ev)].slice(0, 4).join(' · ')) : 'nessuna registrazione quel giorno'}</span>`;
  }
  function ttBar() {
    const max = ttRange();
    if (max < 2) return '';
    return `<div class="tt-bar${ttOffset ? ' on' : ''}" id="ttBar">
      <span class="tt-ico">${I('rewind')}</span>
      <input type="range" class="tt-range" id="ttRange" min="${-max}" max="0" step="1" value="${-ttOffset}" aria-label="Giorno da mostrare nel terrario" aria-valuetext="${ttOffset ? Utils.fmtDate(ttDay()) : 'oggi'}">
      <div class="tt-label" id="ttLabel" aria-live="polite">${ttLabel()}</div>
      <button class="btn btn-sm btn-ghost${ttOffset ? '' : ' hidden'}" data-tt-now>Oggi</button>
    </div>`;
  }
  let ttFrame = 0;
  function setTimeTravel(offset) {
    ttOffset = Math.max(0, Math.round(offset));
    cancelAnimationFrame(ttFrame);
    ttFrame = requestAnimationFrame(() => {
      Terrarium.closePop();
      Dom.morph(document.getElementById('terraSlot'), terraHTML());
      const lab = document.getElementById('ttLabel'); if (lab) lab.innerHTML = ttLabel();
      const bar = document.getElementById('ttBar');
      if (bar) {
        bar.classList.toggle('on', !!ttOffset);
        bar.querySelector('[data-tt-now]').classList.toggle('hidden', !ttOffset);
        const r = bar.querySelector('#ttRange'); if (+r.value !== -ttOffset) r.value = -ttOffset;
        r.setAttribute('aria-valuetext', ttOffset ? Utils.fmtDate(ttDay()) : 'oggi');
      }
    });
  }

  function morphPreviewHTML(value) {
    const look = Morph.resolve(value);
    return `${Snake.preview(look, 'set')}<div class="row" style="flex-wrap:wrap;margin-top:4px"><span class="badge b-info">${Utils.esc(look.label)}</span>${look.custom ? '<span class="badge b-neutral">Personalizzato</span>' : ''}</div><p>${Utils.esc(look.desc)}</p>`;
  }

  function saveSettings(form) {
    const patch = {};
    for (const k of Object.keys(Schema.DEFAULT_PROFILE)) {
      if (k === 'sesso') { const c = form.querySelector('input[name="sesso"]:checked'); patch.sesso = c ? c.value : 'Non determinato'; continue; }
      const el = form.elements[k]; if (!el) continue;
      if (Schema.BOOL_PROFILE.includes(k)) { patch[k] = el.checked; continue; }
      if (Schema.DATE_PROFILE.includes(k)) {
        const v = el.value.trim(), iso = Utils.fromDMY(v);
        if (v && !iso) { Toast.show(`Data non valida: usa gg/mm/aaaa`, 'warn'); el.focus(); return; }
        patch[k] = iso; continue;
      }
      if (Schema.TIME_PROFILE.includes(k)) {
        const t = Utils.normTime(el.value);
        if (!t) { Toast.show('Orario della luce non valido: usa hh:mm', 'warn'); el.focus(); return; }
        patch[k] = t; continue;
      }
      patch[k] = Schema.NUMERIC_PROFILE.includes(k) ? Utils.num(el.value) : el.value.trim();
    }
    for (const [a, b, l] of [['tempCaldaMin', 'tempCaldaMax', 'zona calda'], ['tempFreddaMin', 'tempFreddaMax', 'zona fredda'], ['tempNotteMin', 'tempNotteMax', 'notte'], ['umiditaMin', 'umiditaMax', 'umidità'], ['brumTempMin', 'brumTempMax', 'brumazione']]) {
      if (patch[a] === null || patch[b] === null) { Toast.show(`Inserisci entrambi i limiti per ${l}`, 'warn'); return; }
      if (patch[a] >= patch[b]) { Toast.show(`Il minimo di ${l} deve essere inferiore al massimo`, 'warn'); return; }
    }
    if (patch.umiditaMin < 0 || patch.umiditaMax > 100) { Toast.show('L\'umidità deve essere tra 0 e 100%', 'warn'); return; }
    for (const k of ['intervalloPasti', 'intervalloAcqua', 'intervalloPulizia']) {
      if (patch[k] === null || patch[k] < 1) { Toast.show('Gli intervalli devono essere di almeno 1 giorno', 'warn'); return; }
      patch[k] = Math.round(patch[k]);
    }
    if (patch.scortaMin === null || patch.scortaMin < 0) patch.scortaMin = 4; else patch.scortaMin = Math.round(patch.scortaMin);
    const today = Utils.todayISO();
    if (patch.dataNascita > today || patch.dataArrivo > today) { Toast.show('Nascita e arrivo non possono essere nel futuro', 'warn'); return; }
    if (patch.dataNascita && patch.dataArrivo && patch.dataArrivo < patch.dataNascita) { Toast.show('La data di arrivo non può precedere la nascita', 'warn'); return; }
    if (patch.brumInizio && patch.brumFine && patch.brumFine < patch.brumInizio) { Toast.show('La fine della brumazione non può precedere l\'inizio', 'warn'); return; }
    if (!patch.brumInizio) patch.brumFine = '';
    if (patch.pesoAttuale !== null && patch.pesoAttuale < 0) patch.pesoAttuale = null;
    if (patch.lunghezzaAttuale !== null && patch.lunghezzaAttuale < 0) patch.lunghezzaAttuale = null;
    Store.updateProfile(patch);
    Toast.show('Impostazioni salvate', 'ok', { action: Actions.undoAction() });
  }

  /* ---------- Spese e scorte ---------- */
  function gestione() {
    const tab = tabs.gestione || 'scorte';
    const head = `<div class="segmented tabs-bar" role="tablist"><button class="seg-btn${tab === 'scorte' ? ' active' : ''}" data-tab="gestione" data-value="scorte">${I('box')} Scorte</button><button class="seg-btn${tab === 'spese' ? ' active' : ''}" data-tab="gestione" data-value="spese">${I('wallet')} Spese</button></div>`;
    let body;
    if (tab === 'scorte') {
      const st = Logic.stockState();
      const w = Logic.currentWeight();
      const sugg = st.suggested ? `<div class="banner b-info-soft">${I('zap')}<span>${w !== null ? `Con ${Utils.fmtNum(w, 'g')} la preda ideale (10–15% del peso) è un <b>${st.suggested.toLowerCase()}</b>.` : ''}${st.sizeUp ? ` Ora gli dai ${st.current.toLowerCase()}: al prossimo acquisto passa ai ${st.sizeUp.toLowerCase()}.` : st.current ? ' La taglia attuale va bene.' : ''}</span></div>` : '';
      const cards = st.items.length ? `<div class="grid stock-grid">${st.items.map(x => {
        const cur = x.preda === st.current, low = cur && x.left <= st.min;
        const pct = Math.min(100, Math.round(x.left / Math.max(st.min * 3, 1) * 100));
        return `<div class="card stock-card ${low ? 'low' : ''} ${cur ? 'cur' : ''}">
          <div class="row-between"><span class="kpi-label">${I('box')} ${Utils.esc(x.preda)}</span>${cur ? '<span class="badge b-info">in uso</span>' : ''}</div>
          <div class="stock-num"><b data-count="${x.left}" data-key="stock-${x.preda}">${x.left}</b><small>pz</small></div>
          <div class="kpi-bar"><i style="--p:${Utils.clamp(pct, 0, 100) / 100};background:${low ? 'var(--warn)' : 'var(--accent)'}"></i></div>
          <p class="muted small">${x.left ? `circa ${Utils.plural(x.days, 'giorno', 'giorni')} di pasti` : 'esaurite'} · ${x.used} usate su ${x.bought}</p>
          <div class="row mt-sm"><button class="btn btn-sm ${low ? 'btn-primary' : ''}" data-add="stock" data-preset-preda="${Utils.esc(x.preda)}">${I('plus')} Acquisto</button><span class="faint small">ultimo ${Utils.fmtDateShort(x.lastBuy.data)}</span></div>
        </div>`; }).join('')}</div>` : `<div class="empty"><div class="empty-ico">${I('box')}</div><b>Nessuna scorta registrata</b><p>Segna quanti topi hai nel congelatore: a ogni pasto il conteggio scende da solo e ti avviso quando stanno per finire.</p><button class="btn btn-primary btn-sm" data-add="stock">${I('plus')} Registra un acquisto</button></div>`;
      body = `${sugg}<div class="mt">${cards}</div>
        <div class="card mt"><div class="card-head"><h2>Acquisti e correzioni</h2><div class="row"><span class="faint small hide-xs">Avviso sotto ${st.min} pz</span><button class="btn btn-sm" data-add="stock">${I('plus')} Scorta</button></div></div>
          <p class="faint small" style="margin:-6px 0 12px">Ogni pasto registrato (mangiato, rifiutato o rigurgitato) consuma una preda della sua taglia. Per prede buttate usa una quantità negativa.</p>${Records.block('stock')}</div>`;
    } else {
      const ex = Logic.expenseSummary();
      const maxM = Math.max(1, ...ex.months.map(m => m.eur));
      const cats = Object.entries(ex.byCat).sort((a, b) => b[1] - a[1]);
      const maxC = Math.max(1, ...cats.map(c => c[1]));
      const MN = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
      body = `<div class="stats">
          <div class="stat"><span>Questo mese</span><b data-count="${ex.month}" data-dec="2" data-key="ex-m">${Utils.fmtNum(ex.month, '', 2)}</b><small>euro</small></div>
          <div class="stat"><span>Quest'anno</span><b data-count="${ex.year}" data-dec="2" data-key="ex-y">${Utils.fmtNum(ex.year, '', 2)}</b><small>euro</small></div>
          <div class="stat"><span>In media al mese</span><b>${Utils.fmtNum(ex.perMonth, '€', 2)}</b><small>da quando registri</small></div>
          <div class="stat"><span>Totale</span><b>${Utils.fmtNum(ex.total, '€', 2)}</b><small>${Utils.plural(ex.items.length, 'voce', 'voci')}</small></div>
        </div>
        <div class="grid g-2 mt">
          <div class="card"><div class="card-head"><h2>Ultimi 12 mesi</h2></div>
            <div class="bars">${ex.months.map((m, i) => `<div class="bar" style="--d:${i * 40}" title=""${Utils.fmtNum(m.eur, '€', 2)}"><i style="height:${Math.max(2, m.eur / maxM * 100)}%"></i><span>${MN[+m.k.slice(5) - 1]}</span></div>`).join('')}</div></div>
          <div class="card"><div class="card-head"><h2>Per categoria</h2><span class="sub">${Utils.todayISO().slice(0, 4)}</span></div>
            ${cats.length ? `<div class="cats">${cats.map(([c, v]) => `<div class="cat"><div class="row-between"><span>${Utils.esc(c)}</span><b>${Utils.fmtNum(Math.round(v * 100) / 100, '€', 2)}</b></div><div class="kpi-bar"><i style="--p:${maxC ? v / maxC : 0}"></i></div></div>`).join('')}</div>` : '<p class="faint small">Nessuna spesa quest\'anno.</p>'}</div>
        </div>
        <div class="card mt"><div class="card-head"><h2>Spese</h2><button class="btn btn-sm" data-add="expense">${I('plus')} Spesa</button></div>
          <p class="faint small" style="margin:-6px 0 12px">I totali includono anche il costo degli acquisti di prede e delle visite veterinarie.</p>${Records.block('expense')}</div>`;
    }
    view('#view-gestione').html = head + body;
  }

  /* ---------- La storia del serpente ---------- */
  function storia() {
    const p = S().profile, l = S().logs;
    const ev = Logic.lifeEvents();
    const since = p.dataArrivo ? Utils.daysSince(p.dataArrivo) : null;
    const g = [...l.growth].filter(x => x.peso !== null).sort((a, b) => a.data.localeCompare(b.data));
    const MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
    const groups = [];
    ev.forEach(e => { const k = e.date.slice(0, 7); let gr = groups[groups.length - 1]; if (!gr || gr.k !== k) { gr = { k, items: [] }; groups.push(gr); } gr.items.push(e); });
    const name = p.nome || 'il tuo serpente';
    $('#view-storia').innerHTML = `
      <div class="card story-hero">
        <div class="story-snake">${Snake.preview(Morph.resolve(p.morph), 'story')}</div>
        <div><span class="kpi-label">${I('book')} La storia di</span><h2 class="story-name">${Utils.esc(p.nome || 'Il tuo serpente')}</h2>
          <p class="muted">${[Utils.age(p.dataNascita) ? `${Utils.age(p.dataNascita)} di vita` : '', since !== null ? `${Utils.plural(since, 'giorno', 'giorni')} insieme` : '', p.morph].filter(Boolean).map(Utils.esc).join(' · ') || 'Completa il profilo per raccontare la sua storia.'}</p></div>
        <div class="story-stats">
          <div><b>${l.feeding.filter(f => f.esito === 'Mangiato').length}</b><span>pasti</span></div>
          <div><b>${l.shed.filter(s => s.esito !== 'In corso').length}</b><span>mute</span></div>
          <div><b>${g.length ? `${Utils.fmtNum(g[0].peso)}→${Utils.fmtNum(g[g.length - 1].peso, 'g')}` : '—'}</b><span>peso</span></div>
        </div>
        <div class="row story-act"><button class="btn btn-primary btn-sm" data-story-print>${I('printer')} Stampa o salva PDF</button><button class="btn btn-sm" data-photo-add>${I('camera')} Aggiungi foto</button></div>
      </div>
      ${groups.length ? `<div class="story">${groups.map(gr => `<section class="story-month" data-month="${gr.k}">
          <h3 class="story-mhead"><span>${Utils.cap(MONTHS[+gr.k.slice(5) - 1])} ${gr.k.slice(0, 4)}</span></h3>
          ${gr.items.map(e => `<div class="story-ev ${e.kind}"><span class="story-dot" style="--c:${e.color}">${I(e.icon)}</span><div><b>${Utils.esc(e.title)}</b>${e.text ? `<p>${Utils.esc(e.text)}</p>` : ''}<time>${Utils.fmtDate(e.date)}</time></div></div>`).join('')}
          <div class="story-photos" data-photos="${gr.k}"></div>
        </section>`).join('')}</div>` : `<div class="empty mt"><div class="empty-ico">${I('book')}</div><b>La storia è ancora da scrivere</b><p>Inserisci la data di nascita e di arrivo, registra pasti, pesate e mute: qui compariranno i momenti importanti di ${Utils.esc(name)}.</p><button class="btn btn-primary btn-sm" data-nav="impostazioni">${I('edit')} Completa il profilo</button></div>`}`;
    fillStoryPhotos();
  }
  async function fillStoryPhotos() {
    let list = [];
    try { list = await Photos.list(); } catch (e) { return; }
    const host = document.getElementById('view-storia');
    if (!host) return;
    const sections = [...host.querySelectorAll('[data-photos]')];
    list.forEach(ph => {
      const k = ph.date.slice(0, 7);
      let box = host.querySelector(`[data-photos="${k}"]`);
      if (!box) {
        // Mese senza eventi: si crea una sezione con le sole foto, nel punto giusto
        const MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
        const sec = document.createElement('section'); sec.className = 'story-month'; sec.dataset.month = k;
        sec.innerHTML = `<h3 class="story-mhead"><span>${Utils.cap(MONTHS[+k.slice(5) - 1])} ${k.slice(0, 4)}</span></h3><div class="story-photos" data-photos="${k}"></div>`;
        let story = host.querySelector('.story');
        if (!story) { const em = host.querySelector('.empty'); if (em) em.remove(); story = document.createElement('div'); story.className = 'story'; host.appendChild(story); }
        const after = [...story.querySelectorAll('.story-month')].find(s => s.dataset.month > k);
        story.insertBefore(sec, after || null);
        box = sec.querySelector('[data-photos]');
      }
      box.insertAdjacentHTML('beforeend', `<figure class="story-ph"><img src="${Photos.url(ph)}" alt="${Utils.esc(ph.tag)} del ${Utils.fmtDate(ph.date)}" loading="lazy"><figcaption>${Utils.fmtDateShort(ph.date)}${ph.note ? ' · ' + Utils.esc(ph.note) : ''}</figcaption></figure>`);
    });
    void sections;
  }

  return { agenda, forecastCard, setTimeTravel, get ttOffset() { return ttOffset; }, getAgendaItem: id => agendaItems.get(id), gestione, storia, dashboard, clima, alimentazione, cura, salute, impostazioni, saveSettings, morphPreviewHTML, fillPhotos, togglePhoto, photoSel, tabs, getAlert: i => lastAlerts[i], getTask: i => lastTasks[i] };
})();

/* ==========================================================================
   Round — giro di controllo: clima, acqua, pulizia, feci e peso in un pannello
   ========================================================================== */
const Round = (() => {
  const sw = (name, label, sub, on) => `<label class="rd-row"><span class="rd-txt"><b>${label}</b><small>${sub}</small></span>
      <span class="switch"><input type="checkbox" name="${name}" ${on ? 'checked' : ''}><span></span></span></label>`;

  function open() {
    const now = Logic.envNow(), w = Logic.waterState(), c = Logic.cleanState();
    const lastW = Logic.currentWeight();
    const val = k => now[k] ? now[k].v : '';
    const num = (name, label, unit, v, step = '0.1') => `<label class="field rd-num"><span class="field-label">${label}</span><div class="input-wrap"><input class="input" name="${name}" type="number" inputmode="decimal" step="${step}" value="${v}"><span class="unit">${unit}</span></div></label>`;
    const body = `<form id="roundForm" novalidate>
      <p class="faint small" style="margin-bottom:12px">Controlla e correggi i valori: viene salvato tutto insieme, con un solo "Annulla".</p>
      <div class="rd-sec">${sw('env', `${I('thermo')} Temperature e umidità`, now.latest ? `ultima lettura ${Utils.relTime(now.latest.datetime)}` : 'prima lettura', true)}
        <div class="rd-grid">${num('tempCalda', 'Zona calda', '°C', val('tempCalda'))}${num('tempFredda', 'Zona fredda', '°C', val('tempFredda'))}${num('umidita', 'Umidità', '%', val('umidita'), '1')}</div></div>
      <div class="rd-sec">${sw('water', `${I('drop')} Acqua cambiata`, w.days === 0 ? 'già registrata oggi' : w.last ? `ultimo cambio ${Utils.relDays(w.days)}` : 'mai registrata', w.days !== 0 && (w.remaining === null || w.remaining <= 0))}</div>
      <div class="rd-sec">${sw('clean', `${I('sparkles')} Pulizia veloce`, c.days === 0 ? 'già registrata oggi' : c.last ? `ultima ${Utils.relDays(c.days)}` : 'mai registrata', c.days !== 0 && (c.remaining === null || c.remaining <= 0))}</div>
      <div class="rd-sec">${sw('waste', `${I('waste')} Feci trovate`, 'tipo e aspetto', false)}
        <div class="rd-more" data-rd-more="waste">${chips('tipo', Schema.OPTIONS.tipoEvac, Schema.OPTIONS.tipoEvac[0])}${chips('aspetto', Schema.OPTIONS.aspetto, 'Normale')}</div></div>
      <div class="rd-sec">${sw('growth', `${I('scale')} Pesata`, lastW !== null ? `ultima ${Utils.fmtNum(lastW, 'g')}` : 'facoltativa', false)}
        <div class="rd-more" data-rd-more="growth"><div class="rd-grid">${num('peso', 'Peso', 'g', '', '0.1')}</div></div></div>
    </form>`;
    const footer = `<button class="btn btn-ghost" data-rd-cancel>Annulla</button><button class="btn btn-primary" data-rd-save>${I('check')} Salva il giro</button>`;
    const modal = Overlay.open({ title: `${I('route')} Giro di controllo`, subtitle: Utils.cap(new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })), body, footer });
    const form = modal.querySelector('#roundForm');
    const sync = () => form.querySelectorAll('[data-rd-more]').forEach(m => m.classList.toggle('open', form.elements[m.dataset.rdMore].checked));
    form.addEventListener('change', sync); sync();
    modal.querySelector('[data-rd-cancel]').addEventListener('click', () => Overlay.close());
    modal.querySelector('[data-rd-save]').addEventListener('click', e => save(form, e.currentTarget));
    form.addEventListener('submit', e => { e.preventDefault(); save(form); });
  }
  function save(form) {
    const f = form.elements, t = Utils.todayISO(), list = [];
    const n = name => Utils.num(f[name].value);
    if (f.env.checked) {
      const d = { datetime: Utils.nowLocal(), tempCalda: n('tempCalda'), tempFredda: n('tempFredda'), umidita: n('umidita'), note: 'Giro di controllo' };
      if ([d.tempCalda, d.tempFredda, d.umidita].some(v => v !== null)) list.push({ type: 'env', data: d });
    }
    if (f.water.checked) list.push({ type: 'maintenance', data: { data: t, tipo: 'Cambio acqua', note: '' } });
    if (f.clean.checked) list.push({ type: 'maintenance', data: { data: t, tipo: 'Spot cleaning', note: '' } });
    if (f.waste.checked) list.push({ type: 'waste', data: { data: t, tipo: (form.querySelector('[name="tipo"]:checked') || {}).value, aspetto: (form.querySelector('[name="aspetto"]:checked') || {}).value, note: '' } });
    if (f.growth.checked) {
      if (n('peso') === null) { Toast.show('Inserisci il peso o togli la pesata', 'warn'); f.peso.focus(); return; }
      list.push({ type: 'growth', data: { data: t, peso: n('peso'), lunghezza: null, note: '' } });
    }
    if (!list.length) { Toast.show('Niente da salvare: attiva almeno una voce', 'info'); return; }
    const saved = Store.addBatch(list);
    if (!saved.length) { Toast.show('Valori non validi: giro non salvato', 'bad'); return; }
    Overlay.close();
    Toast.show(`Giro salvato: ${Utils.plural(saved.length, 'voce', 'voci')}`, 'ok', { action: Actions.undoAction() });
  }
  return { open };
})();

/* ==========================================================================
   Cmd — comando rapido: una frase in italiano diventa una registrazione
   Es. "pasto hopper 6 g ieri", "30,5 gradi 55%", "acqua", "peso 58", "vai a clima"
   ========================================================================== */
const Cmd = (() => {
  const EXAMPLES = ['ha mangiato hopper 6 g', 'calda 31 fredda 24 umidità 55%', 'acqua', 'peso 58 g', 'feci normali', 'inizio muta', 'vai a agenda'];
  const WD = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
  const numRe = '(\\d+(?:[.,]\\d+)?)';
  const toNum = s => Utils.num(s);

  /** Data detta a parole: oggi, ieri, l'altro ieri, lunedì, 12/11 */
  function whenOf(t) {
    const today = Utils.parse(Utils.todayISO());
    let d = null;
    if (/l'?altro\s*ieri|altroieri/.test(t)) d = Utils.addDays(today, -2);
    else if (/\bieri\b/.test(t)) d = Utils.addDays(today, -1);
    else if (/\boggi\b|stamattina|stasera/.test(t)) d = today;
    const m = t.match(/\b(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?\b/);
    if (!d && m) {
      let y = m[3] ? +m[3] : today.getFullYear(); if (y < 100) y += 2000;
      const c = new Date(y, +m[2] - 1, +m[1]);
      if (c.getMonth() === +m[2] - 1) d = !m[3] && c > today ? new Date(y - 1, +m[2] - 1, +m[1]) : c;
    }
    if (!d) { const i = WD.findIndex(w => new RegExp('\\b' + w.replace('ì', '[iì]') + '\\b').test(t)); if (i >= 0) { d = new Date(today); while (d.getDay() !== i || d >= today) d = Utils.addDays(d, -1); } }
    return d ? Utils.toISODate(d) : Utils.todayISO();
  }
  const timeOf = t => { const m = t.match(/\b(?:alle\s+)?(\d{1,2})[:.](\d{2})\b/) || t.match(/\balle\s+(\d{1,2})\b/); return m && +m[1] < 24 ? `${Utils.pad(+m[1])}:${m[2] || '00'}` : null; };

  /** Interpreta il testo: { kind: 'add'|'update'|'nav'|'search'|'round', ... } oppure null */
  function parse(raw) {
    const t = ` ${String(raw || '').toLowerCase().replace(/\s+/g, ' ').trim()} `;
    if (t.trim().length < 2) return null;
    const date = whenOf(t);
    const views = Router.VIEWS;
    const nav = t.match(/^\s*(?:vai\s+(?:a|al|alla|alle|in)|apri)\s+(.+?)\s*$/);
    if (nav) { const v = views.find(x => [x.id, x.label, x.short, x.mobile].filter(Boolean).some(n => n.toLowerCase().includes(nav[1]) || nav[1].includes(n.toLowerCase().split(' ')[0]))); if (v) return { kind: 'nav', to: v.id, label: `Vai a ${v.label}` }; }
    const se = t.match(/^\s*cerca\s+(.+?)\s*$/); if (se) return { kind: 'search', q: se[1], label: `Cerca "${se[1]}"` };
    if (/\bgiro\b/.test(t)) return { kind: 'round', label: 'Apri il giro di controllo' };

    const grams = t.match(new RegExp(numRe + '\\s*(?:g|gr|grammi)\\b'));
    const cm = t.match(new RegExp(numRe + '\\s*(?:cm|centimetri)\\b'));
    // Pasto
    const preyWords = { pinky: 'Pinky', fuzzy: 'Fuzzy', hopper: 'Hopper', 'topo adulto': 'Topo adulto', adulto: 'Topo adulto' };
    const prey = Object.keys(preyWords).find(k => t.includes(k));
    if (/pasto|mangiat|mangia\b|rifiut|rigurgit|\btopo\b/.test(t) || prey) {
      const last = Logic.lastMealTemplate() || {};
      const esito = /rigurgit/.test(t) ? 'Rigurgitato' : /rifiut|non ha mangiato/.test(t) ? 'Rifiutato' : 'Mangiato';
      const data = { data: date, preda: prey ? preyWords[prey] : (last.preda || 'Altro'), pesoPreda: grams ? toNum(grams[1]) : (prey && prey !== (last.preda || '').toLowerCase() ? null : Utils.num(last.pesoPreda)), statoPreda: /\bviv[oa]\b/.test(t) ? 'Vivo' : (last.statoPreda || 'Decongelato'), esito, note: '' };
      data.rapporto = Logic.ratio(data.pesoPreda, Logic.weightAt(data.data));
      return { kind: 'add', type: 'feeding', data };
    }
    // Muta
    if (/muta|opac|occhi blu/.test(t)) {
      const open = Store.get().logs.shed.find(s => s.esito === 'In corso');
      if (/complet|finit|fatta|cambiat|conclus/.test(t) && open) return { kind: 'update', type: 'shed', id: open.id, data: { esito: /pezzi|incomplet/.test(t) ? 'Incompleta / a pezzi' : 'Completa', dataFine: date }, label: 'Muta completata' };
      if (/complet|finit|fatta|cambiat|conclus/.test(t)) return { kind: 'add', type: 'shed', data: { dataInizio: date, dataFine: date, esito: /pezzi|incomplet/.test(t) ? 'Incompleta / a pezzi' : 'Completa', occhi: '', note: '' } };
      return { kind: 'add', type: 'shed', data: { dataInizio: date, dataFine: '', esito: 'In corso', occhi: '', note: '' } };
    }
    // Feci e urati
    if (/feci|cacca|urat|evacu/.test(t)) {
      const tipo = /solo urat/.test(t) ? 'Solo urati' : /solo feci/.test(t) ? 'Solo feci' : 'Feci e urati';
      const aspetto = /molli|liquid|diarr/.test(t) ? 'Molli / liquide' : /sangue|muco/.test(t) ? 'Con sangue o muco' : /gialli|arancio/.test(t) ? 'Urati gialli o arancio' : /dur[ie]|granulos/.test(t) ? 'Urati duri o granulosi' : /odore|puzz/.test(t) ? 'Odore anomalo' : 'Normale';
      return { kind: 'add', type: 'waste', data: { data: date, tipo, aspetto, note: '' } };
    }
    // Manutenzione
    if (/pulizia profonda|pulito tutto/.test(t)) return { kind: 'add', type: 'maintenance', data: { data: date, tipo: 'Pulizia profonda', note: '' } };
    if (/substrato/.test(t)) return { kind: 'add', type: 'maintenance', data: { data: date, tipo: 'Cambio substrato', note: '' } };
    if (/\bacqua\b/.test(t) && !/umidit/.test(t)) return { kind: 'add', type: 'maintenance', data: { data: date, tipo: 'Cambio acqua', note: '' } };
    if (/pulit|pulizia|spot/.test(t)) return { kind: 'add', type: 'maintenance', data: { data: date, tipo: 'Spot cleaning', note: '' } };
    // Handling
    if (/handling|maneggiat|in mano|preso/.test(t)) {
      const mins = t.match(/(\d+)\s*(?:min|minuti)\b/);
      const comp = /soffi|difensiv|morso|morde/.test(t) ? 'Difensivo / Soffia' : /agitat|nervos/.test(t) ? 'Agitato' : /timid|nascost/.test(t) ? 'Timido / Nascosto' : 'Tranquillo / Curioso';
      return { kind: 'add', type: 'handling', data: { data: date, durata: mins ? +mins[1] : 10, comportamento: comp, note: '' } };
    }
    // Clima: temperature e umidità
    const kw = (re) => { const m = t.match(re); return m ? toNum(m[1]) : null; };
    let calda = kw(new RegExp('(?:calda|caldo|hot)\\s*:?\\s*' + numRe)), fredda = kw(new RegExp('(?:fredda|freddo|cold)\\s*:?\\s*' + numRe)), notte = kw(new RegExp('notte\\s*:?\\s*' + numRe));
    const hum = kw(new RegExp(numRe + '\\s*(?:%|percento)')) ?? kw(new RegExp('umidit[aà]\\s*:?\\s*' + numRe));
    if (calda === null && fredda === null) {
      const temps = [...t.matchAll(new RegExp(numRe + '\\s*(?:°\\s*c?|gradi)', 'g'))].map(m => toNum(m[1]));
      if (temps.length) { calda = Math.max(...temps); if (temps.length > 1) fredda = Math.min(...temps); }
    }
    if (calda !== null || fredda !== null || hum !== null || notte !== null) {
      const tm = timeOf(t);
      return { kind: 'add', type: 'env', data: { datetime: `${date}T${tm || (date === Utils.todayISO() ? Utils.nowLocal().slice(11, 16) : '12:00')}`, tempCalda: calda, tempFredda: fredda, umidita: hum, tempNotte: notte, note: '' } };
    }
    // Crescita
    if (/peso|pesa|pesato|lungh|misura/.test(t) || grams || cm) {
      const g = grams ? toNum(grams[1]) : kw(new RegExp('(?:peso|pesa|pesato)\\s*:?\\s*' + numRe));
      const l = cm ? toNum(cm[1]) : kw(new RegExp('(?:lungo|lunga|lunghezza)\\s*:?\\s*' + numRe));
      if (g !== null || l !== null) return { kind: 'add', type: 'growth', data: { data: date, peso: g, lunghezza: l, note: '' } };
    }
    return null;
  }

  /** Riepilogo leggibile dei campi che verranno salvati */
  function describe(r) {
    if (r.kind !== 'add' && r.kind !== 'update') return `<div class="cmd-prev nav"><span class="t-ico">${I(r.kind === 'nav' ? 'chevron' : r.kind === 'search' ? 'search' : 'route')}</span><b>${Utils.esc(r.label)}</b></div>`;
    const def = Schema.LOGS[r.type];
    const rows = def.fields.filter(f => r.data[f.name] !== undefined && r.data[f.name] !== null && r.data[f.name] !== '' && f.name !== 'note')
      .map(f => { const v = r.data[f.name]; const txt = f.type === 'date' ? Utils.fmtDate(v) : f.type === 'datetime-local' ? Utils.fmtDateTime(v) : f.type === 'number' ? Utils.fmtNum(v, f.unit || '') : String(v); return `<span><small>${Utils.esc(f.label)}</small><b>${Utils.esc(txt)}</b></span>`; });
    return `<div class="cmd-prev"><span class="t-ico" style="color:${def.color}">${I(def.icon)}</span><div><b>${r.kind === 'update' ? Utils.esc(r.label) : (def.g === 'm' ? 'Nuovo ' : 'Nuova ') + def.label.toLowerCase()}</b><div class="cmd-fields">${rows.join('')}</div></div></div>`;
  }

  let current = null;
  function open(text = '') {
    const body = `<div class="cmd">
      <div class="search cmd-input"><input class="input" id="cmdInput" type="text" autocomplete="off" enterkeyhint="done" placeholder="Es. ha mangiato hopper 6 g ieri" value="${Utils.esc(text)}" aria-label="Scrivi cosa hai fatto"></div>
      <div id="cmdOut" aria-live="polite"></div>
      <div class="cmd-ex"><span class="faint small">Prova:</span>${EXAMPLES.map(e => `<button class="chip chip-sm" data-cmd-ex="${Utils.esc(e)}">${Utils.esc(e)}</button>`).join('')}</div>
    </div>`;
    const footer = `<span class="faint small desktop-only" style="margin-right:auto"><kbd>Invio</kbd> salva · <kbd>Esc</kbd> chiude</span><button class="btn btn-ghost" data-cmd-form disabled>Modifica nel modulo</button><button class="btn btn-primary" data-cmd-go disabled>Salva</button>`;
    const modal = Overlay.open({ title: `${I('command')} Comando rapido`, subtitle: 'Scrivi cosa hai fatto, come lo diresti a voce', body, footer, size: 'cmd-modal' });
    const inp = modal.querySelector('#cmdInput'), out = modal.querySelector('#cmdOut');
    const go = modal.querySelector('[data-cmd-go]'), form = modal.querySelector('[data-cmd-form]');
    const update = () => {
      current = parse(inp.value);
      const has = !!current;
      go.disabled = !has; form.disabled = !(has && (current.kind === 'add' || current.kind === 'update'));
      go.textContent = !has ? 'Salva' : current.kind === 'add' || current.kind === 'update' ? 'Salva' : 'Vai';
      Dom.morph(out, has ? describe(current) : inp.value.trim().length > 2 ? '<p class="cmd-none faint small">Non ho capito: prova con una delle frasi qui sotto.</p>' : '');
    };
    inp.addEventListener('input', update);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) { e.preventDefault(); run(); } });
    modal.addEventListener('click', e => { const ex = e.target.closest('[data-cmd-ex]'); if (ex) { inp.value = ex.dataset.cmdEx; update(); inp.focus(); } });
    go.addEventListener('click', run);
    form.addEventListener('click', () => { const r = current; Overlay.close(true); if (r.kind === 'update') Forms.open(r.type, { id: r.id, presets: r.data }); else Forms.open(r.type, { presets: r.data }); });
    update();
    requestAnimationFrame(() => inp.focus({ preventScroll: true }));
  }
  function run() {
    const r = current;
    if (!r) return;
    if (r.kind === 'nav') { Overlay.close(); Router.go(r.to); return; }
    if (r.kind === 'search') { Overlay.close(true); Search.open(r.q); return; }
    if (r.kind === 'round') { Overlay.close(true); Round.open(); return; }
    const saved = r.kind === 'update' ? Store.update(r.type, r.id, r.data) : Store.add(r.type, r.data);
    if (!saved) { Toast.show('Valori non validi: controlla e riprova', 'bad'); return; }
    Overlay.close();
    const def = Schema.LOGS[r.type];
    Toast.show(r.kind === 'update' ? `${r.label}` : `${def.label} registrat${def.g === 'm' ? 'o' : 'a'}`, 'ok', { action: Actions.undoAction() });
  }
  return { open, parse };
})();

/* ==========================================================================
   Router — navigazione senza ricaricare la pagina (hash)
   ========================================================================== */
const Router = (() => {
  const VIEWS = [
    { id: 'dashboard', label: 'Dashboard', short: 'Home', icon: 'home', sub: () => new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }) },
    { id: 'agenda', label: 'Agenda', short: 'Agenda', icon: 'calendar', sub: () => 'Cosa fare nei prossimi 14 giorni, con le previsioni' },
    { id: 'clima', label: 'Terrario & Clima', short: 'Clima', mobile: 'Clima',  icon: 'thermo', sub: () => 'Temperature, umidità e soglie', add: 'env' },
    { id: 'alimentazione', label: 'Alimentazione & Crescita', short: 'Pasti', mobile: 'Pasti e crescita',  icon: 'mouse', sub: () => 'Pasti, rapporto preda e curva di crescita', add: () => Views.tabs.alimentazione },
    { id: 'cura', label: 'Mute & Cura', short: 'Cura', mobile: 'Mute e cura',  icon: 'shed', sub: () => 'Mute, manutenzione e handling', add: () => Views.tabs.cura },
    { id: 'salute', label: 'Salute', short: 'Salute', icon: 'vet', sub: () => 'Feci, sintomi, visite, farmaci e foto', add: () => Views.tabs.salute === 'foto' ? null : Views.tabs.salute },
    { id: 'gestione', label: 'Spese & Scorte', mobile: 'Spese e scorte', short: 'Spese', icon: 'wallet', sub: () => 'Congelatore, acquisti e costi', add: () => Views.tabs.gestione === 'spese' ? 'expense' : 'stock' },
    { id: 'storia', label: 'Storia', mobile: 'Storia', short: 'Storia', icon: 'book', sub: () => `I momenti importanti di ${Store.get().profile.nome || 'il tuo serpente'}` },
    { id: 'impostazioni', label: 'Impostazioni', short: 'Altro', top: 'Impostazioni', icon: 'gear', sub: () => 'Profilo, terrario, aspetto, backup e sincronizzazione' }
  ];
  const BOTTOM = ['dashboard', 'clima', 'alimentazione', 'cura', 'salute'];
  let current = 'dashboard';
  let lastSig = '';
  let booted = false;

  function buildNav() {
    document.getElementById('sideNav').innerHTML = VIEWS.map((v, i) => `<button class="nav-item" data-nav="${v.id}"><span class="ico">${I(v.icon)}</span><span class="nl">${v.label}</span><span class="ns">${v.top || v.short}</span>${v.id === 'dashboard' ? '<span class="count hidden" id="navAlertCount"></span>' : `<span class="kbd">${i + 1}</span>`}</button>`).join('');
    const items = BOTTOM.map(id => VIEWS.find(v => v.id === id)).map(v => `<button class="bn-item" data-nav="${v.id}" aria-label="${v.label}"><span class="ico">${I(v.icon)}</span>${v.short}</button>`);
    items.splice(2, 0, `<button class="bn-item bn-add" data-open-add aria-label="Registra"><span class="ico">${I('plus')}</span></button>`);
    document.getElementById('bottomNav').innerHTML = items.join('');
  }

  function go(id, { replace = false } = {}) {
    if (!VIEWS.some(v => v.id === id)) id = 'dashboard';
    const changed = id !== current || !booted;
    const back = VIEWS.findIndex(v => v.id === id) < VIEWS.findIndex(v => v.id === current);
    current = id;
    document.querySelectorAll('.view').forEach(v => {
      const on = v.id === `view-${id}`;
      v.classList.toggle('active', on);
      if (on && changed && booted) Motion.enterView(v, back);
    });
    document.querySelectorAll('[data-nav]').forEach(b => { const on = b.dataset.nav === id; b.classList.toggle('active', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
    if (location.hash !== `#${id}`) history[replace ? 'replaceState' : 'pushState'](null, '', `#${id}`);
    render(true);
    if (changed) { window.scrollTo({ top: 0 }); Motion.stagger(document.getElementById(`view-${id}`)); }
    booted = true;
    requestAnimationFrame(() => Motion.navIndicators());
  }

  const signature = () => [current, Store.rev, JSON.stringify(Views.tabs), JSON.stringify(Charts.ranges), Utils.todayISO(), Photos.rev].join('|');

  /** Ridisegna la vista corrente; salta il lavoro se nulla è cambiato */
  function render(force = false) {
    const sig = signature();
    if (!force && sig === lastSig) return;
    lastSig = sig;
    const v = VIEWS.find(x => x.id === current);
    document.getElementById('viewTitle').innerHTML = `<span class="desktop-only">${v.label}</span><span class="mobile-only">${v.mobile || v.label}</span>`;
    document.getElementById('viewSubtitle').textContent = Utils.cap(v.sub());
    const top = document.getElementById('topAction');
    const addType = typeof v.add === 'function' ? v.add() : v.add;
    if (addType && Schema.LOGS[addType]) { top.removeAttribute('data-open-add'); top.dataset.add = addType; top.innerHTML = `${I('plus')} <span class="desktop-only">${Schema.LOGS[addType].label}</span>`; }
    else if (current === 'salute') { top.removeAttribute('data-open-add'); delete top.dataset.add; top.setAttribute('data-photo-add', ''); top.innerHTML = `${I('plus')} <span class="desktop-only">Foto</span>`; }
    else { delete top.dataset.add; top.removeAttribute('data-photo-add'); top.setAttribute('data-open-add', ''); top.innerHTML = `${I('plus')} <span class="desktop-only">Registra</span>`; }
    if (current !== 'salute') top.removeAttribute('data-photo-add');
    const sy = window.scrollY;
    try {
      Views[current]();
      Anim.countUp(document.getElementById(`view-${current}`));
      Motion.segments(document.getElementById(`view-${current}`));
    } catch (err) {
      console.error('Errore di visualizzazione', err);
      document.getElementById(`view-${current}`).innerHTML = `<div class="empty"><div class="empty-ico">${I('alert')}</div><b>Qualcosa è andato storto</b><p>Questa schermata non può essere mostrata. I tuoi dati sono al sicuro: prova a ricaricare la pagina.</p><button class="btn btn-sm" onclick="location.reload()">Ricarica</button></div>`;
    }
    if (!force && Math.abs(window.scrollY - sy) > 2) window.scrollTo({ top: sy });
    const al = Logic.alerts().filter(a => a.level !== 'info');
    const c = document.getElementById('navAlertCount');
    if (c) { c.textContent = al.length; c.className = `count${al.length ? '' : ' hidden'} ${al.some(a => a.level === 'bad') ? 'b-bad' : 'b-warn'}`; }
    const p = Store.get().profile;
    document.getElementById('sideSnake').innerHTML = p.nome ? `${I('snake')} ${Utils.esc(p.nome)}${Utils.age(p.dataNascita) ? ' · ' + Utils.age(p.dataNascita) : ''}` : 'Nessun profilo configurato';
  }

  return { buildNav, go, render, VIEWS, get current() { return current; } };
})();

/* ==========================================================================
   Demo — dati realistici di un giovane serpente del grano
   ========================================================================== */
const Demo = (() => {
  const rng = seed => () => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };
  function build() {
    const r = rng(42);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const D = n => Utils.toISODate(Utils.addDays(today, -n));
    const r1 = v => Math.round(v * 10) / 10;
    const id = Utils.uid;
    const pts = [[180, 9.5, 31], [150, 14, 35], [120, 20.5, 39], [90, 27, 43], [60, 35.5, 47], [30, 46, 51], [3, 57.5, 55]];
    const growth = pts.map(([d, w, l], i) => ({ id: id(), data: D(d), peso: w, lunghezza: l, note: i === 0 ? 'Peso all\'arrivo' : i === pts.length - 1 ? 'Ottimo stato di forma' : '' }));
    const weightOn = d => {
      for (let i = pts.length - 1; i >= 0; i--) if (pts[i][0] >= d) { const a = pts[i], b = pts[i + 1]; if (!b) return a[1]; return a[1] + (b[1] - a[1]) * (a[0] - d) / (a[0] - b[0]); }
      return pts[pts.length - 1][1];
    };
    const shedDefs = [[140, 131, 'Completa', 'Muta in un unico pezzo'], [88, 80, 'Incompleta / a pezzi', 'Residui sulla coda, risolto con camera umida'], [33, 24, 'Completa', 'Perfetta, occhi tornati limpidi']];
    const shed = shedDefs.map(([a, b, e, n]) => ({ id: id(), dataInizio: D(a), dataFine: D(b), esito: e, note: n }));
    const inShed = d => shedDefs.some(([a, b]) => d <= a && d >= b);
    const feeding = [];
    for (let d = 173; d >= 5; d -= 7) {
      const w = weightOn(d);
      const preda = w < 15 ? 'Pinky' : w < 35 ? 'Fuzzy' : 'Hopper';
      const peso = r1((preda === 'Pinky' ? 1.2 : preda === 'Fuzzy' ? 2.4 : 5.2) + r() * (preda === 'Hopper' ? 1 : .5));
      let esito = 'Mangiato', note = '';
      if (inShed(d)) { esito = 'Rifiutato'; note = 'In fase opaca, rifiuto normale'; }
      else if (r() < .08) { esito = 'Rifiutato'; note = 'Poco interessato, riprovo tra qualche giorno'; }
      else if (r() < .3) note = 'Ha colpito subito';
      feeding.push({ id: id(), data: D(d), preda, pesoPreda: peso, statoPreda: 'Decongelato', esito, note, rapporto: Logic.ratio(peso, w) });
    }
    const env = [];
    for (let d = 40; d >= 0; d--) {
      for (const [h, m] of [[9, 0], [20, 30]]) {
        if (d === 0 && h === 20) continue;
        const dt = Utils.addDays(today, -d); dt.setHours(h, m);
        let um = Math.round(46 + r() * 10 + (d >= 24 && d <= 33 ? 6 : 0)), note = '';
        if (d === 6 && h === 20) { um = 67; note = 'Dopo nebulizzazione abbondante'; }
        env.push({ id: id(), datetime: Utils.toLocalDT(dt), tempCalda: r1(29 + r() * 2.4 + (h === 20 ? .4 : 0)), tempFredda: r1(23 + r() * 2), umidita: um, note });
      }
    }
    const maintenance = [];
    for (let d = 44; d >= 2; d -= 3) maintenance.push({ id: id(), data: D(d), tipo: 'Cambio acqua', note: '' });
    for (let d = 40; d >= 1; d -= 6) maintenance.push({ id: id(), data: D(d), tipo: 'Spot cleaning', note: 'Rimosse feci' });
    maintenance.push({ id: id(), data: D(62), tipo: 'Pulizia profonda', note: 'Terrario disinfettato con clorexidina' });
    maintenance.push({ id: id(), data: D(62), tipo: 'Cambio substrato', note: 'Nuovo aspen' });
    maintenance.push({ id: id(), data: D(15), tipo: 'Controllo riscaldamento/luci', note: 'Termostato verificato con sonda' });
    const handling = [];
    const beh = Schema.OPTIONS.comportamento;
    for (let d = 60; d >= 3; d -= 4) {
      if (feeding.some(f => { const fd = Utils.daysSince(f.data) - d; return fd >= 0 && fd < 2; })) continue;
      const old = d > 40;
      handling.push({ id: id(), data: D(d), durata: Math.round(old ? 3 + r() * 4 : 8 + r() * 8), comportamento: old ? beh[r() < .5 ? 1 : 2] : beh[r() < .8 ? 0 : 1], note: old ? 'Ancora in ambientamento' : '' });
    }
    // Notti un po' più fresche su metà delle letture serali
    env.forEach(e => { if (e.datetime.endsWith('20:30') && r() < .6) e.tempNotte = r1(21 + r() * 2.2); });
    shed.forEach((s, i) => { s.occhi = i === 1 ? 'Rimasti sugli occhi' : 'Staccati con la muta'; if (i === 1) s.note += ' · occhialino sinistro tolto con cotton fioc umido'; });
    const waste = [];
    for (let d = 170; d >= 4; d -= 8) waste.push({ id: id(), data: D(d), tipo: 'Feci e urati', aspetto: r() < .9 ? 'Normale' : 'Molli / liquide', note: '' });
    const symptom = [{ id: id(), data: D(86), area: 'Pelle / squame', gravita: 'Lieve', stato: 'Risolto', note: 'Residui di muta sulla coda, risolto con camera umida' }];
    const vet = [{ id: id(), data: D(170), motivo: 'Visita di controllo dopo l\'acquisto', veterinario: 'Ambulatorio esotici', costo: 45, esito: 'Buono stato generale, esame feci negativo', controllo: '', note: '' }];
    const med = [{ id: id(), farmaco: 'Pomata cicatrizzante', dose: 'Strato sottile sulla coda', ogniGiorni: 1, dataInizio: D(87), dataFine: D(81), note: 'Dopo la muta incompleta', dosi: [87, 86, 85, 84, 83, 82, 81].map(D) }];
    const stock = [
      { id: id(), data: D(178), preda: 'Pinky', quantita: 10, costo: 9, fornitore: 'Negozio di rettili', note: '' },
      { id: id(), data: D(120), preda: 'Fuzzy', quantita: 12, costo: 14.4, fornitore: 'Negozio di rettili', note: '' },
      { id: id(), data: D(60), preda: 'Hopper', quantita: 10, costo: 15, fornitore: 'Shop online', note: '' },
      { id: id(), data: D(20), preda: 'Hopper', quantita: 3, costo: 4.5, fornitore: 'Negozio di rettili', note: '' }
    ];
    const expense = [
      { id: id(), data: D(182), categoria: 'Attrezzatura', importo: 89, descrizione: 'Terrario 60x40x40', note: '' },
      { id: id(), data: D(182), categoria: 'Riscaldamento e luci', importo: 42.5, descrizione: 'Tappetino e termostato', note: '' },
      { id: id(), data: D(181), categoria: 'Substrato e arredo', importo: 24.9, descrizione: 'Aspen, tane e ramo', note: '' },
      { id: id(), data: D(62), categoria: 'Substrato e arredo', importo: 12.5, descrizione: 'Sacco di aspen 20 L', note: '' },
      { id: id(), data: D(15), categoria: 'Attrezzatura', importo: 18, descrizione: 'Termo-igrometro digitale', note: '' }
    ];
    return {
      version: 3,
      profile: { nome: 'Pepe', sesso: 'Maschio', morph: 'Amel (Amelanistic)', dataNascita: D(235), dataArrivo: D(181), pesoAttuale: 57.5, lunghezzaAttuale: 55, terrarioDimensioni: '60x40x40 cm', substrato: 'Truciolato di pioppo (aspen)', sorgenteCalore: 'Tappetino riscaldante con termostato', intervalloPasti: 7, intervalloAcqua: 3, tempCaldaMin: 28, tempCaldaMax: 32, tempFreddaMin: 22, tempFreddaMax: 26, umiditaMin: 40, umiditaMax: 60, intervalloAuto: true, intervalloPulizia: 7, tempNotteMin: 20, tempNotteMax: 24, luceOn: '08:00', luceOff: '20:00', brumInizio: '', brumFine: '', brumTempMin: 10, brumTempMax: 16 },
      logs: { env, feeding, growth, shed, maintenance, handling, waste, symptom, vet, med, stock, expense }
    };
  }
  return { build };
})();

/* ==========================================================================
   PWA — service worker e installazione
   ========================================================================== */
const PWA = (() => {
  let deferred = null, updateAsked = false;
  /** Nuova versione scaricata: si propone di aggiornare invece di cambiare l'app a metà uso */
  function watchUpdates(reg) {
    const offer = w => {
      if (!w || !navigator.serviceWorker.controller) return;   // prima installazione: niente da chiedere
      Toast.show('È disponibile una nuova versione di SNAKEcheck', 'info', { duration: 30000, action: { label: 'Aggiorna', run: () => { updateAsked = true; w.postMessage({ type: 'skip' }); } } });
    };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); });
    });
  }
  function init() {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(watchUpdates).catch(err => console.warn('Service worker non registrato', err)));
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (updateAsked && !reloading) { reloading = true; location.reload(); } });
    }
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; const row = document.getElementById('installRow'); if (row) row.classList.remove('hidden'); });
    window.addEventListener('appinstalled', () => { deferred = null; Toast.show('SNAKEcheck installata sulla schermata Home', 'ok'); });
  }
  async function install() {
    if (!deferred) { Toast.show('Usa il menu del browser → "Installa app"', 'info'); return; }
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    const row = document.getElementById('installRow'); if (row) row.classList.add('hidden');
  }
  return { init, install, canInstall: () => !!deferred };
})();

      const mvTo = t.closest('[data-move-to]'); if (mvTo) { Overlay.close(true); Actions.moveMeal(mvTo.dataset.moveTo); return; }
      if (t.closest('[data-tt-now]')) { Views.setTimeTravel(0); return; }
      if (t.closest('[data-photo-add]')) { Overlay.close(true); Photos.openAdd(); return; }
      const add = t.closest('[data-add]');
      if (add) {
        const presets = add.dataset.presetTipo ? { tipo: add.dataset.presetTipo } : add.dataset.presetPreda ? { preda: add.dataset.presetPreda } : {};
        Overlay.close(true);
        Forms.open(add.dataset.add, { presets });

      }
      const edit = t.closest('[data-edit]');

      const del = t.closest('[data-del]'); if (del) { Actions.remove(del.dataset.del, del.dataset.id); return; }
      if (t.closest('[data-water]')) { Motion.burst(t.closest('[data-water]')); Actions.quickWater(); return; }

      const ac = t.closest('[data-accent]'); if (ac) { Theme.set({ accent: ac.dataset.accent }); return; }
      if (t.closest('[data-sync-on]')) { Sync.connect((document.getElementById('syncClient') || {}).value); return; }
      if (t.closest('[data-sync-now]')) { Sync.now({ interactive: true }); return; }
      if (t.closest('[data-sync-off]')) { Sync.disconnect(); return; }
      if (t.closest('[data-story-print]')) { StoryPrint.open(); return; }
      if (t.closest('[data-menu]')) { openMenu(); return; }
      if (t.closest('[data-demo]')) { Actions.loadDemo(); return; }
      if (t.closest('[data-clear]')) { Actions.clearAll(); return; }
      if (t.closest('#btnInstall')) { PWA.install(); return; }
      if (t.closest('[data-settings-reset]')) { Router.render(true); Toast.show('Modifiche annullate', 'info'); }
    });
    document.addEventListener('input', e => { if (e.target.id === 'ttRange') { Views.setTimeTravel(-e.target.value); return; } if (e.target.id === 's-morph') document.getElementById('morphPreview').innerHTML = Views.morphPreviewHTML(e.target.value); });
    document.addEventListener('keydown', e => {
      const el = e.target.closest && e.target.closest('[data-snake], .tl-item[data-edit], [data-photo]');
      if ((e.key === 'Enter' || e.key === ' ') && el && !/^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
      if (e.key === 'Escape' && Terrarium.isOpen()) Terrarium.closePop();
    });
    document.addEventListener('submit', e => { if (e.target.id === 'settingsForm') { e.preventDefault(); Views.saveSettings(e.target); } });
    document.getElementById('importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; Actions.importBackup(f); });
    document.getElementById('csvFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) CSVImport.open(f); });

    // Scorciatoie da tastiera (desktop)
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (!Overlay.isOpen()) Cmd.open(); return; }
      if (e.ctrlKey || e.metaKey || e.altKey || Overlay.isOpen()) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); Actions.openAddSheet(); }
      if (e.key === '/') { e.preventDefault(); Search.open(); }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= Router.VIEWS.length) Router.go(Router.VIEWS[n - 1].id);
    });

    window.addEventListener('popstate', () => Router.go(location.hash.slice(1), { replace: true }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Router.render(); });
    Store.subscribe(() => Router.render());
  }

  /* ---------- Agenda: fatto, sposta, trascina, scorri ---------- */
  function agendaDo(id, el) {
    const x = Views.getAgendaItem(id);
    if (!x || !x.action) return;
    if (el) Motion.burst(el);
    const a = x.action;
    if (a.kind === 'meal') Actions.quickMeal('Mangiato');
    else if (a.kind === 'water') Actions.quickWater();
    else if (a.kind === 'clean') Actions.quickClean();
    else if (a.kind === 'dose') Actions.giveDose(a.id);
    else if (a.kind === 'form') { Overlay.close(true); Forms.open(a.type); }
  }
  function moveSheet() {
    const cur = Logic.feedingState().next, t = Utils.todayISO();
    const days = Array.from({ length: 14 }, (_, i) => Utils.toISODate(Utils.addDays(Utils.parse(t), i)));
    Overlay.open({ title: `${I('calendar')} Sposta il pasto`, subtitle: 'Vale solo per il prossimo pasto: poi l\'intervallo riparte normalmente', size: 'sm',
      body: `<div class="move-grid">${days.map((d, i) => `<button class="move-day${d === cur ? ' cur' : ''}" data-move-to="${d}"${d === cur ? ' aria-current="date"' : ''}><small>${i === 0 ? 'Oggi' : i === 1 ? 'Domani' : Utils.cap(Utils.weekday(d)).slice(0, 3)}</small><b>${Utils.parse(d).getDate()}</b></button>`).join('')}</div>` });
  }
  function bindAgenda() {
    // Trascina (mouse): il pasto si sposta su un altro giorno
    let dragId = null;
    document.addEventListener('dragstart', e => {
      const it = e.target.closest && e.target.closest('.ag-item[data-movable]');
      if (!it) return;
      dragId = it.dataset.ag;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
      requestAnimationFrame(() => it.classList.add('dragging'));
      document.getElementById('view-agenda').classList.add('is-dragging');
    });
    document.addEventListener('dragend', () => {
      dragId = null;
      document.querySelectorAll('.ag-item.dragging, .ag-day.drop-on').forEach(x => x.classList.remove('dragging', 'drop-on'));
      const v = document.getElementById('view-agenda'); if (v) v.classList.remove('is-dragging');
    });
    document.addEventListener('dragover', e => {
      if (!dragId) return;
      const day = e.target.closest && e.target.closest('.ag-day');
      document.querySelectorAll('.ag-day.drop-on').forEach(x => { if (x !== day) x.classList.remove('drop-on'); });
      if (!day) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      day.classList.add('drop-on');
    });
    document.addEventListener('drop', e => {
      const day = dragId && e.target.closest && e.target.closest('.ag-day');
      if (!day) return;
      e.preventDefault();
      Actions.moveMeal(day.dataset.day);
    });

    // Scorri a destra (tocco): segna fatta una voce di oggi
    let sw = null;
    const reset = (el, done) => {
      el.classList.remove('swiping');
      el.style.removeProperty('--dx');
      if (!done) el.animate && !Utils.reducedMotion() && el.animate([{ transform: `translateX(${sw.dx}px)` }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(0.22,1,0.36,1)' });
    };
    document.addEventListener('pointerdown', e => {
      const el = e.target.closest && e.target.closest('.ag-item[data-swipe]');
      if (!el || e.button > 0 || e.target.closest('button')) return;
      sw = { el, id: el.dataset.ag, x: e.clientX, y: e.clientY, dx: 0, on: false, pid: e.pointerId };
    });
    document.addEventListener('pointermove', e => {
      if (!sw || e.pointerId !== sw.pid) return;
      const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
      if (!sw.on) {
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
        if (dx < 10) return;
        sw.on = true; sw.el.classList.add('swiping');
        try { sw.el.setPointerCapture(e.pointerId); } catch (err) { /* nessuna cattura */ }
      }
      sw.dx = Math.max(0, Math.min(dx, sw.el.offsetWidth * .6));
      sw.el.style.setProperty('--dx', sw.dx + 'px');
      sw.el.classList.toggle('armed', sw.dx > 90);
    });
    const end = e => {
      if (!sw || e.pointerId !== sw.pid) return;
      const s = sw;
      if (s.on) {
        const ok = s.dx > 90 && e.type === 'pointerup';
        reset(s.el, ok);
        s.el.classList.remove('armed');
        if (ok) { if (navigator.vibrate) navigator.vibrate(12); agendaDo(s.id, s.el.querySelector('.ag-ico')); }
        const block = ev => { ev.stopPropagation(); ev.preventDefault(); };
        document.addEventListener('click', block, { capture: true, once: true });
        setTimeout(() => document.removeEventListener('click', block, { capture: true }), 50);
      }
      sw = null;
    };
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
  }

  /** Menu "Altro" del telefono: sezioni che non stanno nella barra in basso */
  function openMenu() {
    const item = (nav, icon, title, sub) => `<button class="menu-item" data-nav="${nav}"><span class="t-ico">${I(icon)}</span><span><b>${title}</b><small>${sub}</small></span>${I('chevron')}</button>`;
    Overlay.open({ title: 'Altro', body: `<div class="menu-list">
      ${item('agenda', 'calendar', 'Agenda', 'I prossimi 14 giorni e le previsioni')}
      ${item('gestione', 'wallet', 'Spese e scorte', 'Congelatore, acquisti e costi')}
      ${item('storia', 'book', 'Storia', 'I momenti importanti, da stampare')}
      ${item('impostazioni', 'gear', 'Impostazioni', 'Profilo, aspetto, backup e sincronizzazione')}
      <button class="menu-item" data-search-open><span class="t-ico">${I('search')}</span><span><b>Cerca</b><small>In tutti i registri</small></span>${I('chevron')}</button>
      <button class="menu-item" data-cmd><span class="t-ico">${I('command')}</span><span><b>Comando rapido</b><small>Scrivi cosa hai fatto, a parole</small></span>${I('chevron')}</button></div>` });
  }

  async function deletePhoto(id) {
    try {
      const rec = await Photos.remove(id);
      Views.photoSel.delete(id);
      Router.render(true);
      Toast.show('Foto eliminata', 'info', { action: rec ? { label: 'Annulla', run: async () => { await Photos.put(rec); Router.render(true); } } : null });
    } catch (err) { Toast.show(`Foto non eliminata: ${err.message}`, 'bad'); }
  }

  /** Collegamenti rapidi dall'icona dell'app (manifest shortcuts) */
  function shortcut() {
    const params = new URLSearchParams(location.search);
    const a = params.get('azione');
    if (!a) return;
    history.replaceState(null, '', location.pathname + location.hash);
    setTimeout(() => {
      if (a === 'pasto') Forms.open('feeding');
      else if (a === 'clima') Forms.open('env');
      else if (a === 'acqua') Actions.quickWater();
      else if (a === 'cerca') Search.open();
      else if (a === 'giro') Round.open();
      else if (a === 'scrivi') Cmd.open();
    }, 150);
  }

  function init() {
    Store.load();
    Icons.observe();
    document.querySelector('.brand-mark').innerHTML = I('snake');
    document.getElementById('topSearch').innerHTML = I('search');
    document.getElementById('topGear').innerHTML = `${I('more')}<span class="btn-label">Altro</span>`;
    document.getElementById('topSync').innerHTML = I('sync');
    Theme.init();
    Router.buildNav();
    Motion.init();
    bind();
    PWA.init();
    Router.go(location.hash.slice(1) || 'dashboard', { replace: true });
    Safety.requestPersist();
    Safety.weekly();
    Notify.start();
    Sync.init();
    Terrarium.tick();
    shortcut();
  }
  return { init };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
